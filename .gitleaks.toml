title = "Gitleaks Config"

[extend]
useDefault = true

[[rules]]
id = "seed-phrase"
description = "Detected a BIP39 mnemonic seed phrase."
regex = '''(?i)\b(?:seed|dev[_\s]?seed|mnemonic|pass[_\s]?phrase|recovery[_\s]?phrase)\s*[:=\s]\s*(?:[\x60'"]\s*)?((?:[a-zA-Z]{3,8}\s+){10,23}[a-zA-Z]{3,8})(?:\s*[\x60'"]|\s*[,;]|\b)'''
keywords = ["seed", "mnemonic", "pass", "recovery", "phrase"]

    [[rules.allowlists]]
    condition = "AND"
    description = "Ignore Clarinet's own public, deterministic devnet mnemonics (deployer, wallet_1..6) -- matched by exact phrase, not by path, so a real mnemonic added anywhere else in this file would still be caught."
    regexTarget = "match"
    regexes = [
        '''twice kind fence tip hidden tilt action fragile skin nothing glory cousin green tomorrow spring wrist shed math olympic multiply hip blue scout claw''',
        '''sell invite acquire kitten bamboo drastic jelly vivid peace spawn twice guilt pave pen trash pretty park cube fragile unaware remain midnight betray rebuild''',
        '''hold excess usual excess ring elephant install account glad dry fragile donkey gaze humble truck breeze nation gasp vacuum limb head keep delay hospital''',
        '''cycle puppy glare enroll cost improve round trend wrist mushroom scorpion tower claim oppose clever elephant dinosaur eight problem before frozen dune wagon high''',
        '''board list obtain sugar hour worth raven scout denial thunder horse logic fury scorpion fold genuine phrase wealth news aim below celery when cabin''',
        '''hurry aunt blame peanut heavy update captain human rice crime juice adult scale device promote vast project quiz unit note reform update climb purchase''',
        '''area desk dutch sign gold cricket dawn toward giggle vibrant indoor bench warfare wagon number tiny universe sand talk dilemma pottery bone trap buddy''',
    ]
    paths = [
        '''libs/coin-tester-modules/coin-tester-stacks/settings/Devnet\.toml''',
    ]

[[rules]]
id = "seed-array"
description = "Detected a BIP39 mnemonic seed phrase in array format."
regex = '''(?i)\b(?:seed|dev[_\s]?seed|mnemonic|pass[_\s]?phrase|recovery[_\s]?phrase)\s*[:=]\s*(\[\s*(?:["'][a-zA-Z]{3,8}["']\s*,?\s*){12,24}\])'''
keywords = ["seed", "mnemonic", "pass", "recovery", "phrase"]

[[rules]]
id = "generic-api-key"

    [[rules.allowlists]]
    condition = "AND"
    description = "Ignore public blockchain contract/token addresses by network prefix in tokenId."
    regexTarget = "match"
    regexes = [
        '''(?i)\"?tokenId\"?\s*[=:]\s*[\"']?(?:aleo|algorand|aptos|assethub_polkadot|base|bitcoin|bsc|cardano|celo|cosmos|dogecoin|elrond|ethereum|hedera|injective|internet_computer|kaspa|litecoin|near|optimism|osmo|polygon|ripple|solana|stellar|sui|tezos|ton|tron|vechain|zcash)''',
    ]
    paths = [
        '''e2e/.+/userdata/.+\.json''',
        '''e2e/desktop/tests/.+/.+\.spec\.ts''',
        '''libs/.+/.+\.test\.ts\.snap''',
    ]

    [[rules.allowlists]]
    condition = "AND"
    description = "Ignore Clarinet's own public, deterministic devnet private keys (Devnet.toml comments and the matching hex private keys in fixtures.ts) -- matched by exact value, not by path, so a real key added anywhere else in these files would still be caught."
    regexTarget = "match"
    regexes = [
        '''753b7cc01a1a2e86221266a154af739463fce51219d97e4f856cd7200c3bd2a601''',
        '''7287ba251d44a4d3fd9276c88ce34c5c52a038955511cccaf77e61068649c17801''',
        '''530d9f61984c888536871c6573073bdfc0058896dc1adfe9a6a10dfacadc209101''',
        '''d655b2523bcd65e34889725c73064feb17ceb796831c0e111ba1a552b0f31b3901''',
        '''f9d7206a47f14d2870c163ebab4bf3e70d18f5d14ce1031f3902fbbc894fe4c701''',
        '''3eccc5dac8056590432db6a35d52b9896876a3d5cbdea53b72400bc9c2099fe801''',
        '''7036b29cb5e235e5fd9b09ae3e8eec4404e44906814d5d01cbca968a60ed4bfb01''',
    ]
    paths = [
        '''libs/coin-tester-modules/coin-tester-stacks/settings/Devnet\.toml''',
        '''libs/coin-tester-modules/coin-tester-stacks/src/fixtures\.ts''',
    ]

    [[rules.allowlists]]
    condition = "AND"
    description = "Ignore the public Baanx OAuth client keys in the app build env and e2e test files. The build bakes a client key into the distributed binary, so it is public by construction -- matched by exact value, not by path alone, so a real secret added to these files would still be caught."
    regexTarget = "match"
    regexes = [
        '''dc16bbda-eb1b-487c-be60-1a90ca7c9dd6''',
        '''5d12926a-f70a-47e4-bc7e-a0955a114efc''',
    ]
    paths = [
        '''apps/ledger-live-desktop/\.env\..+''',
        '''apps/ledger-live-mobile/\.env\..+''',
        '''e2e/desktop/.+''',
        '''e2e/mobile/.+''',
    ]

[[rules]]
id = "datadog-access-token"

    [[rules.allowlists]]
    condition = "AND"
    description = "Ignore CocoaPods SPEC CHECKSUMS entries in the mobile Podfile.lock -- these are SHA-1 integrity hashes of pod specs (several Datadog* pods among them), not secrets; matched by the exact 'Name: <40 lowercase hex>' checksum-line shape (no '=' or quotes), so a real secret in any other shape in this file would still be caught."
    regexTarget = "match"
    regexes = [
        '''^[A-Za-z][A-Za-z0-9_-]*: [0-9a-f]{40}$''',
    ]
    paths = [
        '''apps/ledger-live-mobile/ios/Podfile\.lock''',
    ]

[[rules]]
id = "jwt"

    [[rules.allowlists]]
    description = "Ignore fake JWTs in mock files."
    paths = [
        '''libs/.+/mocks/.+/.+\.json''',
        '''apps/.+/__mocks__/.+/.+\.json''',
    ]

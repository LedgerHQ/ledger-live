apply plugin: "com.android.library"
apply plugin: "kotlin-android"
// Runs codegen for the Fabric component (GlowViewManagerDelegate, GlowViewManagerInterface).
apply plugin: "com.facebook.react"

def rootExtOrDefault(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "com.ledger.uiglow"
  compileSdkVersion rootExtOrDefault("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion rootExtOrDefault("minSdkVersion", 25)
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // The React Native Gradle plugin replaces it with the app's react-android version
  implementation "com.facebook.react:react-native:+"
}

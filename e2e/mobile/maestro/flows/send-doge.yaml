appId: com.ledger.live.debug
tags:
  - send
  - doge
# The recipient is derived on-device by the harness; fetch it (+ amount) over HTTP into output vars.
onFlowStart:
  - runScript: ../scripts/fetch-send-params.js
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/dismiss-analytics-prompt.yaml
- extendedWaitUntil:
    visible:
      id: "tab-selector-Accounts"
    timeout: 180000
# Open the Dogecoin 1 account. iOS taps the Accounts toggle + row by text; Android opens the
# deeplink + taps the row's id (RN doesn't forward the toggle/text taps to onPress on Android).
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "tab-selector-Accounts"
      - scrollUntilVisible:
          element:
            text: "Dogecoin 1"
          direction: DOWN
          centerElement: true
      - tapOn:
          text: "Dogecoin 1"
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: ledgerlive://account
      - extendedWaitUntil:
          visible:
            id: "accounts-list-title"
          timeout: 30000
      - scrollUntilVisible:
          element:
            id: "account-row-name-Dogecoin 1"
          direction: DOWN
          centerElement: true
      - tapOn:
          id: "account-row-name-Dogecoin 1"
- extendedWaitUntil:
    visible:
      id: "account-quick-action-button-send"
    timeout: 20000
- tapOn:
    id: "account-quick-action-button-send"
- runFlow:
    file: ../subflows/enter-recipient.yaml
    env:
      RECIPIENT: "${output.recipient}"
- runFlow:
    file: ../subflows/enter-amount.yaml
    env:
      AMOUNT: "${output.amount}"
- runFlow:
    file: ../subflows/choose-fee-and-continue.yaml
    env:
      FEE: "Slow"
- runFlow:
    file: ../subflows/await-ondevice-success.yaml
    env:
      SUCCESS_ID: "validate-success-screen"
- tapOn:
    id: "enabled-success-view-details-button"
- extendedWaitUntil:
    visible:
      id: "operationDetails-title"
    timeout: 30000
- takeScreenshot: artifacts/send-doge-operation-details

# E2E: add an Ethereum account (Maestro port of the Detox `addAccountETH.spec.ts`).
#
# This is the *test case*. It is intentionally tiny: it just composes reusable
# subflows in order (Maestro "Nested Flows"). Each subflow maps 1:1 to a step of
# the original Detox page-object sequence.
appId: com.ledger.live.debug
tags:
  - addAccount
  - eth
---
- runFlow: ../subflows/launch-seeded.yaml
# Decline the analytics consent modal if it pops (Android only; its backdrop would block taps).
- runFlow: ../subflows/dismiss-analytics-prompt.yaml
- runFlow: ../subflows/open-add-account.yaml
- runFlow: ../subflows/select-eth.yaml
- runFlow: ../subflows/verify-eth-account.yaml

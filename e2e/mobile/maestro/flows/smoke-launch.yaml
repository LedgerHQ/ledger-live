appId: com.ledger.live.debug
tags:
  - smoke
---
# Seed-only smoke (no Speculos): launch args reach the app, bridge seeds, onboarding is skipped,
# and modular-drawer navigation works. Stops before account discovery (which needs a device).
- runFlow: ../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: "add-account-cta"
    timeout: 180000
- runFlow: ../subflows/open-add-account.yaml
- tapOn:
    id: "modular-drawer-search-input"
- inputText: "ETH"
- assertVisible:
    id: "asset-item-ETH"

# Swap (ETH -> ETH-USDT), pure YAML. Drives the swap live-app WebView by TEXT (per the
# feat/qaa-1242 POC): the coin selector is text "Select Currency or Token" (index 0=From,
# 1=To); picking a currency drops into the NATIVE modular drawer (testIDs). Amount uses a
# percentage button (the custom keypad isn't Maestro-tappable). Device signing is handled
# by the harness (proactive verifyAmountsAndAcceptSwap).
appId: com.ledger.live.debug
tags:
  - swap
# Confirm the backend harness is up before driving the UI (fail fast if run-*.sh didn't start it).
onFlowStart:
  - runScript: ../scripts/assert-backend.js
---
- launchApp:
    clearState: true
    arguments:
      wsPort: "8099"
      mock: "0"
      IS_TEST: true
      # NB: the app's Speculos transport is gated on Config.DETOX (build-time, from .env.mock), not a
      # launch arg — this is passed for completeness but does not change Config.DETOX.
      DETOX: "1"
# Wait for the Wallet 4.0 home to finish loading. Gate on the bottom-nav Swap tab
# (the next tap target) — the classic UI's "topbar-settings" gear does not exist in w40
# (settings now lives behind the "topbar-mywallet" avatar).
- extendedWaitUntil:
    visible:
      id: "w40-tab-swap"
    timeout: 180000
# Decline the analytics consent modal if it pops — it appears WITH the home (Portfolio mount), so
# dismiss it here (after the home gate, before tapping) or its backdrop swallows the tab tap.
- runFlow: ../subflows/dismiss-analytics-prompt.yaml
# Open swap via the Wallet 4.0 bottom tab (avoids the iOS deeplink dialog).
- tapOn:
    id: "w40-tab-swap"
# Wait for the swap live-app form (the coin selector text). The live-app WebView tree is readable by
# Maestro on BOTH platforms (iOS WKWebView + Android WebView), so the currency/amount taps are driven
# here; only the clip-prone quote/execute taps are delegated to the harness (see below).
- extendedWaitUntil:
    visible:
      text: "Select Currency or Token"
    timeout: 90000
# The form's "Select Currency or Token" aria-label is present in the DOM before the app finishes
# loading (a spinner shows, the From side reads "Choose asset"). From auto-selects ETH only once the
# balance renders, so gate on "Balance" before the first WebView tap (don't race the volatile tree).
- extendedWaitUntil:
    visible:
      text: "Balance"
    timeout: 60000
- takeScreenshot: artifacts/swap-form-loaded
# --- Select the Receive (To) currency = USDT via the NATIVE modular drawer. index 1 = To (0 = From,
# already ETH). Tapping the To coin selector fires the wallet-api account.request, which opens the
# modular drawer (the real currency/account picker). Drive it: search -> asset -> network -> account.
- tapOn:
    text: "Select Currency or Token"
    index: 1
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "modular-drawer-search-input"
    timeout: 30000
- tapOn:
    id: "modular-drawer-search-input"
- inputText: "USD"
# The modular drawer AUTO-ADVANCES past any step that has a single option. Searching "USD" can narrow
# to just USDT (USDC etc. may not be in the list), so the drawer skips the asset step and jumps
# straight to "Select network". So the steps below are tolerant: settle the search, tap the USDT asset
# row ONLY if it is still shown, then drive the network + account steps (which appear whether or not
# the asset step auto-advanced). USDT has several networks, so the network step reliably shows.
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: "asset-item-USDT"
    commands:
      - tapOn:
          id: "asset-item-USDT"
          retryTapIfNoChange: true
# Network step: USDT exists on several chains -> pick Ethereum.
- extendedWaitUntil:
    visible:
      id: "network-item-ethereum"
    timeout: 30000
- tapOn:
    id: "network-item-ethereum"
    retryTapIfNoChange: true
# Account step: pick the seeded USDT account (closes the drawer). With a single account the drawer can
# auto-advance past this too, so tap it only if shown.
- runFlow:
    when:
      visible:
        id: "account-item"
    commands:
      - tapOn:
          id: "account-item"
          retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: artifacts/swap-usdt-selected
# --- Amount: select 25% of the balance (a quotable amount) via the keypad's percentage button.
- tapOn:
    text: "25%"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: artifacts/swap-amount-set
# --- View quotes -> pick provider -> execute. WHO drives this differs by platform:
#   - iOS: the HARNESS (main.ts `driveSwapExecute`) drives it over the bridge, because these
#     buttons' a11y-frame centres are clipped under the home indicator (a Maestro tap misses). The
#     webviewDriver's synthetic DOM click fires the live-app's React onClick on iOS WKWebView.
#   - Android: Maestro drives it directly. The WebView tree is fully readable/tappable here and the
#     buttons aren't clipped; the webviewDriver's synthetic click does NOT fire React onClick on
#     Android's WebView, so the harness skips it (Maestro must do real taps).
# Both pick the first non-KYC / non-app provider (an app-requiring provider e.g. 1inch makes the
# Exchange app exit(255) — only the Ethereum coin app is an Exchange dependency). Execute sends the
# swap to the device; the harness's proactive signer accepts it on the Speculos.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: "View quotes"
          timeout: 30000
      - tapOn:
          text: "View quotes"
      - extendedWaitUntil:
          visible:
            text: "[0-9]+ quotes? found"
          timeout: 90000
      # Pick the first visible non-app provider (cascade), then execute via its inline "Swap with X".
      - evalScript: ${output.picked = "no"}
      - runFlow:
          when:
            visible:
              text: "MoonPay Trade"
            true: ${output.picked == "no"}
          commands:
            - tapOn: { text: "MoonPay Trade" }
            - evalScript: ${output.picked = "MoonPay Trade"}
      - runFlow:
          when:
            visible:
              text: "NEAR Intents"
            true: ${output.picked == "no"}
          commands:
            - tapOn: { text: "NEAR Intents" }
            - evalScript: ${output.picked = "NEAR Intents"}
      - runFlow:
          when:
            visible:
              text: "Changelly"
            true: ${output.picked == "no"}
          commands:
            - tapOn: { text: "Changelly" }
            - evalScript: ${output.picked = "Changelly"}
      - runFlow:
          when:
            visible:
              text: "Exodus"
            true: ${output.picked == "no"}
          commands:
            - tapOn: { text: "Exodus" }
            - evalScript: ${output.picked = "Exodus"}
      - assertTrue: ${output.picked != "no"}
      - waitForAnimationToEnd:
          timeout: 4000
      - extendedWaitUntil:
          visible:
            text: "Swap with ${output.picked}"
          timeout: 20000
      - tapOn:
          text: "Swap with ${output.picked}"
- extendedWaitUntil:
    visible:
      id: "swap-success-title"
    timeout: 180000
- takeScreenshot: artifacts/swap-success

# E2E: Earn V2 inline add-account (Maestro port of the Detox
# specs/earn/earnInlineAddAccount.spec.ts -> runInlineAddAccountTest(Account.ETH_1)).
#
# Like add-account-eth.yaml, this test case just composes reusable subflows in order. The Earn
# dashboard is a remote WebView (the harness enables Wallet 4.0 + ptxEarnUi v2), but Maestro
# resolves its web `data-testid`s via the `id` selector on this setup, so the two webview
# touchpoints are targeted by testID (not locale-sensitive text): "ice-cold-start-earn-cta"
# (see earn-open-add-asset.yaml) and "amount-input-section-input" on the ETH deposit step (see
# earn-inline-add-account.yaml). The modular drawer + add-account steps are native and reuse the
# same proven subflows as add-account-eth.yaml.
appId: ${APP_ID}
tags:
  - earn
  - addAccount
  - eth
---
- runFlow: ../subflows/launch.yaml
# Earn V2 forces the Wallet 4.0 navigator, so the readiness signal is the W40 "Earn" bottom tab
# (not the classic add-account CTA that add-account-eth.yaml waits on).
- extendedWaitUntil:
    visible:
      id: "w40-tab-earn"
    timeout: 180000
- runFlow: ../subflows/dismiss-analytics-prompt.yaml
- runFlow: ../subflows/earn-open-add-asset.yaml
- runFlow:
    file: ../subflows/modular-drawer-pick.yaml
    env:
      SEARCH: "ETH"
      ASSET_ID: "asset-item-ETH"
      NETWORK_ID: "network-item-[Ee]thereum"
      NETWORK_REQUIRED: "false"
      PICK_ACCOUNT: "false"
- runFlow:
    file: ../subflows/earn-inline-add-account.yaml
    env:
      ACCOUNT_NAME: "Ethereum 1"

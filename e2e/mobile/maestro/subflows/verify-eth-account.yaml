# Wait for discovery, add the discovered account, close, then assert the
# Ethereum account page shows a balance — same assertion as the Detox spec.
# testIDs sourced from:
#   e2e/mobile/page/accounts/addAccount.drawer.ts
#     continueButtonId       = "enabled-add-accounts-continue-button"
#     closeAddAccountButtonId= "button-close-add-account"
#   e2e/mobile/page/wallet/portfolio.page.ts      (assetItem prefix "assetItem-")
#   e2e/mobile/page/accounts/assetAccounts.page.ts
#     titleId(name)          = "accounts-title-<name lowercased>"
#     assetBalance           = "asset-graph-balance"
appId: com.ledger.live.debug
---
# Speculos derives the ETH address; discovery can take a while -> generous timeout.
- extendedWaitUntil:
    visible:
      id: "enabled-add-accounts-continue-button"
    timeout: 240000
# The first discovered account is named "Ethereum 1".
- assertVisible: "Ethereum 1"
# Confirm the selected account(s).
- tapOn:
    id: "enabled-add-accounts-continue-button"
# Close the success screen.
- tapOn:
    id: "button-close-add-account"
# Open the Ethereum asset from the portfolio and assert a balance is displayed.
- tapOn:
    id: "assetItem-Ethereum"
- assertVisible:
    id: "accounts-title-ethereum"
- assertVisible:
    id: "asset-graph-balance"

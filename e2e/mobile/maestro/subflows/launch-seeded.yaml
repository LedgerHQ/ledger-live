# Launch the mock E2E build and point it at the local bridge (port 8099).
#
# The app reads these launch arguments via `react-native-launch-arguments`
# (LaunchArguments.value() in apps/ledger-live-mobile/e2e/bridge/client.ts).
# The standalone harness (maestro/harness/start-backend.ts) runs the bridge and
# seeds the "skip-onboarding" userdata + feature flags, so the app boots straight
# to an empty portfolio where the "Add account" CTA is visible.
appId: com.ledger.live.debug
---
- launchApp:
    clearState: true
    arguments:
      wsPort: "8099"   # must match MAESTRO_BRIDGE_PORT in the harness
      mock: "0"        # MOCK=0 -> real flows backed by Speculos (matches the Detox suite)
      IS_TEST: true
# Onboarding-skip seeding arrives over the websocket bridge after launch. In full
# mode the harness seeds only once Speculos has booted, so allow generous time.
- extendedWaitUntil:
    visible:
      id: "add-account-cta"
    timeout: 180000

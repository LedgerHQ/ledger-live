# Wallet 4.0 "Earn" bottom tab -> ice-cold-start earn CTA -> native modular asset drawer.
#
# The Earn dashboard is a remote WebView (ptxEarnUi v2). Maestro's `id` selector does NOT match
# web `data-testid`s — the dashboard's "ice-cold-start-earn-cta" / "footer-disclaimer" are web
# testIDs — so the CTA is tapped by its visible text, the same approach subflows/swap.yaml uses
# for the swap live-app. EARN_CTA_TEXT is supplied by run-earn.sh; the exact on-device label must
# be confirmed once and updated there. Tapping the CTA opens the NATIVE modular drawer, whose
# search input ("modular-drawer-search-input", from page/drawer/modular.drawer.ts) is a real
# testID we can wait on before handing off to modular-drawer-pick.yaml.
appId: ${APP_ID}
---
- tapOn:
    id: "w40-tab-earn"
- extendedWaitUntil:
    visible:
      text: "${EARN_CTA_TEXT}"
    timeout: 120000
- tapOn:
    text: "${EARN_CTA_TEXT}"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "modular-drawer-search-input"
    timeout: 30000

appId: com.ledger.live.debug
---
# Android races the seeded opt-out: the analytics modal can mount after the home and its backdrop
# swallows taps until answered. Poll and dismiss; answering records the choice so it won't reappear.
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          times: 12
          commands:
            - tapOn:
                text: "Refuse all"
                optional: true
            - tapOn:
                text: "Accept all"
                optional: true
            - tapOn:
                id: "accept-analytics-button"
                optional: true
            - waitForAnimationToEnd

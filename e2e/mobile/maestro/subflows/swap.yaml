appId: ${APP_ID}
---
- runScript: ../scripts/assert-backend.js
- runFlow: launch.yaml
- extendedWaitUntil:
    visible:
      id: "w40-tab-swap"
    timeout: 180000
- runFlow: dismiss-analytics-prompt.yaml
- tapOn:
    id: "w40-tab-swap"
# Swap live-app WebView. Both currency selectors expose the "Select Currency or Token" aria-label
# regardless of selection, so From = index 0 and To = index 1 are stable. Picking a currency drops
# into the native modular drawer.
- extendedWaitUntil:
    visible:
      text: "Select Currency or Token"
    timeout: 90000
- tapOn:
    text: "Select Currency or Token"
    index: 0
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "modular-drawer-search-input"
    timeout: 30000
- runFlow:
    file: modular-drawer-pick.yaml
    env:
      SEARCH: "${FROM_TICKER}"
      ASSET_ID: "asset-item-${FROM_TICKER}"
      NETWORK_ID: "network-item-${FROM_NETWORK}"
      NETWORK_REQUIRED: "${FROM_NETWORK_REQUIRED}"
      PICK_ACCOUNT: "true"
- tapOn:
    text: "Select Currency or Token"
    index: 1
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "modular-drawer-search-input"
    timeout: 30000
- runFlow:
    file: modular-drawer-pick.yaml
    env:
      SEARCH: "${TO_TICKER}"
      ASSET_ID: "asset-item-${TO_TICKER}"
      NETWORK_ID: "network-item-${TO_NETWORK}"
      NETWORK_REQUIRED: "${TO_NETWORK_REQUIRED}"
      PICK_ACCOUNT: "true"
- extendedWaitUntil:
    visible:
      text: "25%"
    timeout: 30000
- tapOn:
    text: "25%"
# Quotes/provider/execute: iOS is driven by the harness (webviewDriver); Android taps them directly.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: "View quotes"
          timeout: 30000
      - tapOn:
          text: "View quotes"
      - extendedWaitUntil:
          visible:
            text: "[0-9]+ quotes? found"
          timeout: 90000
      - evalScript: ${output.picked = "no"}
      - runFlow:
          when:
            visible:
              text: "MoonPay Trade"
            true: ${output.picked == "no"}
          commands:
            - tapOn: { text: "MoonPay Trade" }
            - evalScript: ${output.picked = "MoonPay Trade"}
      - runFlow:
          when:
            visible:
              text: "NEAR Intents"
            true: ${output.picked == "no"}
          commands:
            - tapOn: { text: "NEAR Intents" }
            - evalScript: ${output.picked = "NEAR Intents"}
      - runFlow:
          when:
            visible:
              text: "Changelly"
            true: ${output.picked == "no"}
          commands:
            - tapOn: { text: "Changelly" }
            - evalScript: ${output.picked = "Changelly"}
      - runFlow:
          when:
            visible:
              text: "Exodus"
            true: ${output.picked == "no"}
          commands:
            - tapOn: { text: "Exodus" }
            - evalScript: ${output.picked = "Exodus"}
      - assertTrue: ${output.picked != "no"}
      - extendedWaitUntil:
          visible:
            text: "Swap with ${output.picked}"
          timeout: 20000
      - tapOn:
          text: "Swap with ${output.picked}"
- extendedWaitUntil:
    visible:
      id: "swap-success-title"
    timeout: 240000
- takeScreenshot: artifacts/swap-${FROM_TICKER}-${TO_TICKER}-success

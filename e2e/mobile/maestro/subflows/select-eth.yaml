# Search for ETH in the modular drawer and select it (+ network step if asked).
# testIDs sourced from e2e/mobile/page/drawer/modular.drawer.ts:
#   searchBarId        = "modular-drawer-search-input"
#   assetItemByTicker  = /asset-item-<ticker>/i   -> for ETH: "asset-item-ETH"
#   networkItemIdMAD   = /network-item-<id>/i
appId: com.ledger.live.debug
---
- tapOn:
    id: "modular-drawer-search-input"
- inputText: "ETH"
- tapOn:
    id: "asset-item-ETH"
# Single-network assets (ETH mainnet) usually skip the network picker.
# Tap the Ethereum network only if the picker is actually shown.
- runFlow:
    when:
      visible:
        id: "network-item-[Ee]thereum"
    commands:
      - tapOn:
          id: "network-item-[Ee]thereum"

name: "Build the startup measurement's iOS app"
description: "Builds the checked-out ref's Release simulator app (JS bundled), prod-like unless told otherwise, and uploads it as startup-perf-ios-<side>"
# Runs after two checkouts: the ref to build at the workspace root, and this workflow's ci/ at
# .startup-perf, as the ref may predate it. Composites read no secrets or vars: the job passes them.
# No remote caches, as in the Android build.
inputs:
  side:
    description: "a, b or snapshot: the artifact's suffix"
    required: true
  prod-like:
    description: "Make the build prod-like and check it (prepare-build.mts, verify-build.mts); false for the snapshot's E2E build"
    required: true
  regression:
    description: "The regression build B re-adds (known-regression), or empty"
    required: false
    default: ""
  gh-token:
    description: "GITHUB_TOKEN, for setup-caches"
    required: true
  artifactory-url:
    description: "vars.ARTIFACTORY_URL"
    required: true
runs:
  using: composite
  steps:
    - name: Set up the caches
      uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
      with:
        skip-pod-cache: "true"
        use-mise: "true"
        gh-token: ${{ inputs.gh-token }}
        skip-nx-cache: "true"

    - name: JFrog npm auth
      uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
      with:
        registry: ${{ inputs.artifactory-url }}

    - name: Install dependencies
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        max_attempts: 2
        timeout_minutes: 20
        command: pnpm i --frozen-lockfile --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm
        new_command_on_retry: rm -rf ~/.cocoapods/ && pnpm clean && pnpm i --frozen-lockfile --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm

    - name: Build mobile dependencies
      shell: bash
      # Nx adds its run report to the job summary, with no setting to turn it off.
      run: GITHUB_STEP_SUMMARY=/dev/null pnpm build:llm:deps

    - name: Prepare the prod-like build
      if: ${{ inputs.prod-like == 'true' }}
      shell: bash
      env:
        STARTUP_PERF_REGRESSION: ${{ inputs.regression }}
      run: node "$GITHUB_ACTION_PATH/../../prepare-build.mts"

    - name: Build Release simulator app (JS bundled)
      shell: bash
      run: pnpm mobile e2e:build -c ios.sim.prerelease

    - name: Collect the app
      shell: bash
      env:
        PROD_LIKE: ${{ inputs.prod-like }}
      run: |
        set -euo pipefail
        ci_dir="$GITHUB_ACTION_PATH/../.."
        mkdir -p out
        APP=apps/ledger-live-mobile/ios/build/Build/Products/Release-iphonesimulator/ledgerlivemobile.app
        [[ "$PROD_LIKE" != true ]] || node "$ci_dir/verify-build.mts" ios "$APP"
        ditto -c -k --keepParent "$APP" out/app.zip
        git rev-parse HEAD > out/sha.txt
        bash "$ci_dir/toolchain.sh" record out/toolchain.txt
        ls -la out

    # A restore that failed partway may have published this name already.
    - name: Upload the app
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: startup-perf-ios-${{ inputs.side }}
        path: out/
        retention-days: 7
        overwrite: true

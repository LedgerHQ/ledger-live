name: "[Coin] - Daily Monitoring - Scheduled"
run-name: Daily Coin Monitoring
permissions:
  contents: read
on:
  schedule:
    - cron: "0 15 * * *" # every day at 3pm

jobs:
  run-monitoring:
    runs-on: ledger-wallet-4cpu-aws-public-cached
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup the toolchain
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@ci-test/deps-gha-sonar-github
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@ci-test/deps-gha-sonar-github
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}
      - uses: LedgerHQ/ledger-live/tools/actions/composites/monitor@ci-test/deps-gha-sonar-github
        id: monitoring
        timeout-minutes: 120
        with:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_DOMAIN: datadoghq.eu
          MONITOR_FILTER_ISOLATED: true
          SUBMIT_LOGS: true

  monitoring-fail:
    name: Failure report
    needs: run-monitoring
    if: failure() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Post to live-repo-health slack channel
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          method: chat.postMessage
          payload: |
            channel: "C05FKJ7DFAP"
            text: "[Monitoring] Coin modules"
            blocks: 
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "❌ *Coin modules monitoring failed*"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":github: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run>"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":datadog_logo: <https://app.datadoghq.eu/dashboard/5wd-rjr-fzh/coin-integration-general-dashboard|Monitoring dashboard>"
      - name: Post to coin-integration-private slack channel
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          method: chat.postMessage
          payload: |
            channel: "C06RTDKT324"
            text: "[Monitoring] Coin modules"
            blocks: 
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "❌ *Coin modules monitoring failed*"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":github: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run>"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":datadog_logo: <https://app.datadoghq.eu/dashboard/5wd-rjr-fzh/coin-integration-general-dashboard|Monitoring dashboard>"

  monitoring-success:
    name: Success report
    needs: run-monitoring
    if: success() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Post to live-repo-health slack channel
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          method: chat.postMessage
          payload: |
            channel: "C05FKJ7DFAP"
            text: "[Monitoring] Coin modules"
            blocks: 
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "✅️ *Coin modules monitoring success*"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":github: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run>"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":datadog_logo: <https://app.datadoghq.eu/dashboard/5wd-rjr-fzh/coin-integration-general-dashboard|Monitoring dashboard>"

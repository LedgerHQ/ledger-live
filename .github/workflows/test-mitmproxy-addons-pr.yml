name: "[E2E] - mitmproxy Addon Tests - PR"

on:
  pull_request:
    paths:
      - ".mise/tasks/mitmproxy/**"
      - ".github/workflows/test-mitmproxy-addons-pr.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mitmproxy-addon-tests:
    name: "mitmproxy Addon Tests"
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-22.04' || 'ledger-wallet-1cpu-aws-public-cached' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Same mitmproxy version as the `#MISE tools` line of the tasks that load these addons.
      - name: Install mitmproxy and pytest
        run: python -m pip install "mitmproxy==12.2.1" "pytest==9.1.1"

      - name: Run addon tests
        run: python -m pytest -p no:cacheprovider .mise/tasks/mitmproxy/firebase_capture_test.py

name: "[Mobile] - Startup perf on emulator/simulator - Manual (spike)"
run-name: >
  @Mobile startup perf • ${{ inputs.preset }} • ${{ inputs.platforms }} • ${{ github.ref_name }} • ${{ github.actor }}

# SPIKE for automating B2CQA-6555 (iOS) / B2CQA-6593 (Android), never merge.
# This file temporarily replaces the mobile E2E workflow on a test branch, so it can be dispatched
# from that branch (`gh workflow run test-mobile-e2e-reusable.yml --ref <branch>`). The PR, push and
# scheduled pipelines call the E2E workflow pinned to @develop, so they are not affected.
#
# Builds: detoxPreRelease (Android) / Release simulator (iOS) with .env.mock.prerelease, i.e. the
# E2E "production Firebase" builds, but with the JS bundled in the binary. Each launch is a plain
# `am start` / `simctl launch` with no test tool attached; Maestro then reads
# Settings > Debug > Performance > App startup time. See tools/scripts/startup-perf/run.mjs.
#
# Presets:
#   aa-noise          one build against itself: how noisy the setup is (run 1)
#   known-regression  LIVE-36190 present vs fixed (03d6f91 vs 74af11a): can it see a real regression? (run 2)
#   custom            any two refs, e.g. the Prod release tag vs the Pre-release branch (run 3)

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "What to compare"
        required: true
        type: choice
        options: [aa-noise, known-regression, custom]
        default: aa-noise
      ref_a:
        description: "Build A. aa-noise: the build measured against itself (blank = this branch). custom: the baseline, e.g. the Prod release tag"
        required: false
        type: string
      ref_b:
        description: "Build B, custom only: the candidate, e.g. the Pre-release branch"
        required: false
        type: string
      platforms:
        description: "Platforms"
        required: true
        type: choice
        options: ["Android & iOS", "Android Only", "iOS Only"]
        default: "Android & iOS"
      scenarios:
        description: "Scenarios"
        required: true
        type: choice
        options: ["no-accounts,accounts", "no-accounts", "accounts"]
        default: "no-accounts,accounts"
      pairs:
        description: "A/B pairs per scenario (even; half before and half after the device swap)"
        required: true
        type: string
        default: "20"
      settle_seconds:
        description: "Seconds to wait after each launch before reading the value (the startup ends within ~4 s)"
        required: true
        type: string
        default: "5"
      accounts_userdata:
        description: "Userdata files (e2e/mobile/userdata, comma-separated) merged for the accounts scenario"
        required: true
        type: string
        default: "1AccountBTC1AccountETHReadOnlyFalse,speculos-x-other-account"
      threshold_ms:
        description: "custom: B fails when it is slower than A by more than this"
        required: true
        type: string
        default: "100"
      read_all_events:
        description: "Read every startup event row (slower); by default the first screen and the last rows"
        required: false
        type: boolean
        default: false
      e2e_babel_plugin:
        description: "Bundle with DETOX=1 like the E2E builds (adds collapsable={false} to every view)"
        required: false
        type: boolean
        default: false
      pause_idle_emulator:
        description: "Android: pause the other emulator from each launch until its read, so it takes no CPU"
        required: false
        type: boolean
        default: true
      capture_network:
        description: "Android: capture DNS and HTTPS traffic on the runner and inside the emulators, and time it against each launch"
        required: false
        type: boolean
        default: true
      trace_launches:
        description: "Android: Perfetto-trace N measured launches per scenario (whole rounds over both phases, rounded up to a multiple of 4; left out of the verdict)"
        required: false
        type: string
        default: "0"
      emulator_cores:
        description: "Android: CPU cores per emulator (two share the 8-CPU runner, the idle one paused during each launch; the E2E AVD has 2)"
        required: false
        type: choice
        options: ["4", "3", "2"]
        default: "4"

permissions:
  contents: read

env:
  APP_ID: com.ledger.live
  # LIVE-36190: the regression was fixed by 74af11a (#21001); its parent still has it.
  KNOWN_REGRESSION_SHA: 03d6f9155b084a07e285e37617d16d7f4fab8b25
  KNOWN_FIX_SHA: 74af11a25844226efdc5570f47e40f98c51e462c
  MAESTRO_VERSION: 2.10.0
  MAESTRO_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
  RESULTS_DIR: startup-perf-results
  # The AVD itself (AVD_* and AVD_CACHE_KEY) comes from setup-android-avd@develop, like E2E.
  # Two emulators share the 8-CPU runner; each gets emulator_cores (E2E's AVD has 2). 4 by default:
  # the other emulator is paused during each launch, and 4 was faster with tighter A/A margins
  # than 3 or 2 (runs 39989878998, 39966762708, 39970514979).
  PERF_AVD_CORES: ${{ inputs.emulator_cores || '4' }}

jobs:
  plan:
    name: "Resolve builds"
    runs-on: ledger-wallet-1cpu-aws-public-cached
    outputs:
      sides: ${{ steps.plan.outputs.sides }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
      ref_a: ${{ steps.plan.outputs.ref_a }}
      ref_b: ${{ steps.plan.outputs.ref_b }}
      label_a: ${{ steps.plan.outputs.label_a }}
      label_b: ${{ steps.plan.outputs.label_b }}
    steps:
      - name: Resolve refs
        id: plan
        env:
          PRESET: ${{ inputs.preset }}
          REF_A: ${{ inputs.ref_a }}
          REF_B: ${{ inputs.ref_b }}
          PAIRS: ${{ inputs.pairs }}
          SETTLE: ${{ inputs.settle_seconds }}
          THRESHOLD: ${{ inputs.threshold_ms }}
          SCENARIOS: ${{ inputs.scenarios }}
          BRANCH_SHA: ${{ github.sha }}
          READ_ROWS: ${{ inputs.read_all_events && 'every event row read' || 'first screen and last event rows read' }}
        run: |
          set -euo pipefail
          if ! [[ "$PAIRS" =~ ^[0-9]+$ ]] || (( PAIRS < 2 || PAIRS % 2 )); then
            echo "::error::pairs must be an even number ≥ 2, got '$PAIRS'"; exit 1
          fi
          [[ "$SETTLE" =~ ^[0-9]+$ ]] || { echo "::error::settle_seconds must be a number"; exit 1; }
          [[ "$THRESHOLD" =~ ^[0-9]+$ ]] || { echo "::error::threshold_ms must be a number"; exit 1; }
          case "$PRESET" in
            aa-noise)
              A="${REF_A:-$BRANCH_SHA}"; B="$A"; SIDES='["a"]'
              LABEL_A="${REF_A:-$GITHUB_REF_NAME}"; LABEL_B="the same binary" ;;
            known-regression)
              A="$KNOWN_REGRESSION_SHA"; B="$KNOWN_FIX_SHA"; SIDES='["a","b"]'
              LABEL_A="LIVE-36190 present (${A:0:10})"; LABEL_B="LIVE-36190 fixed (${B:0:10})" ;;
            custom)
              if [[ -z "$REF_A" || -z "$REF_B" ]]; then
                echo "::error::custom needs both ref_a and ref_b"; exit 1
              fi
              A="$REF_A"; B="$REF_B"; SIDES='["a","b"]'; LABEL_A="$REF_A"; LABEL_B="$REF_B" ;;
          esac
          {
            echo "sides=$SIDES"
            echo "scenarios=[\"${SCENARIOS//,/\",\"}\"]"
            echo "ref_a=$A"
            echo "ref_b=$B"
            echo "label_a=$LABEL_A"
            echo "label_b=$LABEL_B"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Startup perf spike: $PRESET"
            echo ""
            echo "- A: \`$LABEL_A\` → \`$A\`"
            echo "- B: \`$LABEL_B\` → \`$B\`"
            echo "- $PAIRS pairs per scenario, value read ${SETTLE}s after each launch, ${READ_ROWS}"
            echo "- Android: one job (runner) per scenario, cellular network like E2E, $PERF_AVD_CORES cores per emulator"
          } >> "$GITHUB_STEP_SUMMARY"

  build-android:
    name: "Android build ${{ matrix.side }}"
    needs: [plan]
    if: ${{ inputs.platforms != 'iOS Only' }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        side: ${{ fromJSON(needs.plan.outputs.sides) }}
    # 8 CPU like the E2E Android build; move to the 16 CPU runner if the JS bundler runs out of memory.
    runs-on: ledger-wallet-8cpu-aws-public-cached
    timeout-minutes: 120
    env:
      REF: ${{ matrix.side == 'a' && needs.plan.outputs.ref_a || needs.plan.outputs.ref_b }}
      # Pods report the host CPU count; cap Gradle workers to the runner size.
      GRADLE_OPTS: -Dorg.gradle.workers.max=8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REF }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      # Older commits (e.g. the LIVE-36190 pair) don't install with the mise of setup-caches@develop:
      # - two unused plugins declared as "owner/repo" are read as local folders (their tools are commented out);
      # - the npm pin sometimes fails on a fresh runner ("requires configured install dependency node@…,
      #   but its selected version is not installed"). Develop dropped it; installs use pnpm.
      # Both are removed; the other tool versions stay the commit's own.
      - name: Adapt mise.toml of older commits
        run: |
          awk '/^\[/{section=$0} section=="[plugins]"{next} section=="[tools]" && /^npm *=/{next} {print}' mise.toml > "$RUNNER_TEMP/mise.toml"
          if ! cmp -s mise.toml "$RUNNER_TEMP/mise.toml"; then
            diff mise.toml "$RUNNER_TEMP/mise.toml" || true
            cp "$RUNNER_TEMP/mise.toml" mise.toml
          fi

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: setup-caches
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-pnpm-cache: "false"
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: setup JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools"

      - name: Install dependencies
        run: |
          pnpm i --frozen-lockfile --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm

      # The JS bundle imports the compiled output of the workspace libraries (live-common, native-ui…).
      - name: Build mobile dependencies
        run: pnpm build:llm:deps

      # Same build type and env file as the E2E "production Firebase" build, but without
      # SKIP_JS_BUNDLING, so Gradle bundles the JS into the APK like a store build.
      - name: Build detoxPreRelease APK (x86_64, JS bundled)
        env:
          E2E_ANDROID_ABI: x86_64
          DETOX: ${{ inputs.e2e_babel_plugin && '1' || '' }}
          CARD_BAANX_API_URL: ${{ secrets.CARD_BAANX_API_URL }}
          CARD_BAANX_CLIENT_KEY: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
          CARD_BAANX_HOSTED_UI: ${{ secrets.CARD_BAANX_HOSTED_UI }}
          CARD_OAUTH_REDIRECT_URI: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}
        run: pnpm mobile e2e:build -c android.emu.prerelease

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find apps/ledger-live-mobile/android/app/build/outputs/apk/detoxPreRelease -name "*x86_64*.apk" | head -1)
          [[ -n "$APK" ]] || { echo "::error::no x86_64 detoxPreRelease APK found"; exit 1; }
          cp "$APK" out/app.apk
          git rev-parse HEAD > out/sha.txt
          ls -la out

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: startup-perf-android-${{ matrix.side }}
          path: out/
          retention-days: 7

  build-ios:
    name: "iOS build ${{ matrix.side }}"
    needs: [plan]
    if: ${{ inputs.platforms != 'Android Only' }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        side: ${{ fromJSON(needs.plan.outputs.sides) }}
    runs-on: ["general-pool", macOS, ARM64]
    timeout-minutes: 150
    env:
      REF: ${{ matrix.side == 'a' && needs.plan.outputs.ref_a || needs.plan.outputs.ref_b }}
      NODE_OPTIONS: "--max-old-space-size=7168"
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REF }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      # Older commits (e.g. the LIVE-36190 pair) don't install with the mise of setup-caches@develop:
      # - two unused plugins declared as "owner/repo" are read as local folders (their tools are commented out);
      # - the npm pin sometimes fails on a fresh runner ("requires configured install dependency node@…,
      #   but its selected version is not installed"). Develop dropped it; installs use pnpm.
      # Both are removed; the other tool versions stay the commit's own.
      - name: Adapt mise.toml of older commits
        run: |
          awk '/^\[/{section=$0} section=="[plugins]"{next} section=="[tools]" && /^npm *=/{next} {print}' mise.toml > "$RUNNER_TEMP/mise.toml"
          if ! cmp -s mise.toml "$RUNNER_TEMP/mise.toml"; then
            diff mise.toml "$RUNNER_TEMP/mise.toml" || true
            cp "$RUNNER_TEMP/mise.toml" mise.toml
          fi

      - name: setup caches
        id: setup-caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          skip-pod-cache: "true"
          skip-pnpm-cache: "false"
          use-mise: "true"
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        name: install dependencies
        with:
          max_attempts: 2
          timeout_minutes: 20
          command: pnpm i --frozen-lockfile --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm
          new_command_on_retry: rm -rf ~/.cocoapods/ && pnpm clean && pnpm i --frozen-lockfile --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm

      # The JS bundle imports the compiled output of the workspace libraries (live-common, native-ui…).
      - name: Build mobile dependencies
        run: pnpm build:llm:deps

      # Release configuration for the simulator with .env.mock.prerelease (production Firebase),
      # with the JS bundled by Xcode.
      - name: Build Release simulator app (JS bundled)
        env:
          DETOX: ${{ inputs.e2e_babel_plugin && '1' || '' }}
          CARD_BAANX_API_URL: ${{ secrets.CARD_BAANX_API_URL }}
          CARD_BAANX_CLIENT_KEY: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
          CARD_BAANX_HOSTED_UI: ${{ secrets.CARD_BAANX_HOSTED_UI }}
          CARD_OAUTH_REDIRECT_URI: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}
        run: pnpm mobile e2e:build -c ios.sim.prerelease

      - name: Collect app
        run: |
          set -euo pipefail
          mkdir -p out
          APP=apps/ledger-live-mobile/ios/build/Build/Products/Release-iphonesimulator/ledgerlivemobile.app
          [[ -f "$APP/main.jsbundle" ]] || { echo "::error::$APP has no main.jsbundle"; exit 1; }
          ditto -c -k --keepParent "$APP" out/app.zip
          git rev-parse HEAD > out/sha.txt
          ls -la out

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: startup-perf-ios-${{ matrix.side }}
          path: out/
          retention-days: 7

  # One job per scenario, in parallel. Each job runs builds A and B on its own runner, so a
  # difference between runners never enters B − A; it only halves the wall time.
  measure-android:
    name: "Android startup (2 emulators, ${{ matrix.scenario }})"
    needs: [plan, build-android]
    if: ${{ inputs.platforms != 'iOS Only' }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    # Needs /dev/kvm: the documented runner for Android emulator jobs in this file, whose image
    # holds the toolchain and the E2E AVD.
    runs-on: ledger-wallet-8cpu-github-public-cached
    timeout-minutes: 300
    steps:
      # Same as the E2E shards: the image's disk can be slow on first read, so read the
      # preinstalled AVD in the background before "Duplicate the AVD" copies it.
      - name: Read the preinstalled AVD ahead (background)
        run: |
          [ -f "${HOME}/.android/avd-cache-key" ] || exit 0
          log="${RUNNER_TEMP}/avd-read-ahead.log"
          echo "started $(date -u +%T)" > "$log"
          nohup bash -c '
            start=$(date +%s)
            find "${HOME}/.android/avd" -type f -exec cat {} + > /dev/null
            echo "read $(du -sh "${HOME}/.android/avd" | cut -f1) in $(( $(date +%s) - start ))s, done $(date -u +%T)"
          ' >> "$log" 2>&1 &

      # AVD_* and AVD_CACHE_KEY from develop's avd.env: the emulator measured is E2E's, whatever
      # commit the builds come from.
      - name: Load AVD configuration
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-avd@develop
        with:
          config_only: "true"

      - name: Setup Android Environment
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-env@develop
        with:
          # adb, build-tools and the emulator are on the image.
          install_sdk: "false"

      # As in the E2E shards: use the image's AVD when its stamp matches the key, otherwise remove
      # it so the R2 copy isn't extracted on top of it.
      - name: Check for a preinstalled AVD
        id: preinstalled-avd
        run: |
          stamp="${HOME}/.android/avd-cache-key"
          if [ "$(cat "$stamp" 2>/dev/null)" = "${AVD_CACHE_KEY}" ]; then
            echo "Preinstalled AVD matches ${AVD_CACHE_KEY}"
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "$stamp" ]; then
            echo "::warning title=Runner image AVD is out of date::Image has $(cat "$stamp"), need ${AVD_CACHE_KEY}; using R2."
            rm -rf "${HOME}/.android/avd" "$stamp" \
              /usr/local/lib/android/sdk/emulator \
              "/usr/local/lib/android/sdk/system-images/android-${AVD_API}/${AVD_TARGET}/${AVD_ARCH}"
          fi
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Download android emulator
        if: steps.preinstalled-avd.outputs.found != 'true'
        timeout-minutes: 10
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@develop
        id: avd
        with:
          key: ${{ env.AVD_CACHE_KEY }}
          accessKey: "${{ secrets.R2_ACCESS_KEY_ID }}"
          secretKey: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          bucket: ledger-live-cache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          region: auto
          destination: /

      # No R2 credentials: the spike never writes E2E's AVD cache.
      - name: Create the AVD (not on the image nor in R2)
        if: steps.preinstalled-avd.outputs.found != 'true' && steps.avd.outputs.cache-hit != 'true'
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-avd@develop

      - name: Report the AVD in use
        env:
          AVD_SOURCE: ${{ steps.preinstalled-avd.outputs.found == 'true' && 'runner image' || steps.avd.outputs.cache-hit == 'true' && 'R2' || 'created in this job' }}
        run: |
          {
            echo "### Android emulator (${{ matrix.scenario }})"
            echo "- AVD from: $AVD_SOURCE"
            echo "- Key: \`${AVD_CACHE_KEY}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # staging.kstr is the keystore that secrets.ANDROID_KEYSTORE_PATH points to.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/scripts/
            /e2e/mobile/userdata/
            /apps/ledger-live-mobile/android/app/staging.kstr

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # One folder per build. A pattern matching a single artifact would unpack it straight into builds/.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: startup-perf-android-a
          path: builds/a

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ contains(needs.plan.outputs.sides, 'b') }}
        with:
          name: startup-perf-android-b
          path: builds/b

      # Signed with the same staging key as the E2E APKs.
      - name: Sign APKs
        env:
          KS_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT=/usr/local/lib/android/sdk/build-tools/34.0.0
          for dir in builds/a builds/b; do
            [[ -f "$dir/app.apk" ]] || continue
            "$BT/zipalign" -f -p 4 "$dir/app.apk" "$dir/aligned.apk"
            # shellcheck disable=SC2086
            "$BT/apksigner" sign --v4-signing-enabled false --ks "$KS_PATH" --ks-pass $KS_PASS --ks-key-alias staging --key-pass $KS_PASS --out "$dir/signed.apk" "$dir/aligned.apk"
            echo "$dir: $(cat "$dir/sha.txt")"
          done

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/maestro-cli"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          BIN=$(dirname "$(find "$RUNNER_TEMP/maestro-cli" -type f -name maestro -path "*/bin/*" | head -1)")
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/maestro" --version

      - name: Report the AVD read-ahead
        run: cat "${RUNNER_TEMP}/avd-read-ahead.log" 2>/dev/null || echo "No preinstalled AVD to read ahead."

      # Last before booting, so the read-ahead started at the top has had time to run.
      - name: Duplicate the AVD for the second emulator
        uses: LedgerHQ/ledger-live/tools/actions/composites/duplicate-avd@develop
        with:
          source_avd_name: ${{ env.AVD_NAME }}
          target_suffixes: "_2"
          avd_api: ${{ env.AVD_API }}

      - name: Boot two emulators
        run: |
          set -euo pipefail
          tools/scripts/cleanup-android-emulators.sh || true
          mkdir -p "$RESULTS_DIR/android"
          # Cold boot for every core count, so changing emulator_cores changes nothing else: the
          # cached snapshot was taken with 2 cores and cannot be loaded with 3 or 4.
          # shellcheck disable=SC2086
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" -port 5554 $AVD_OPTIONS -no-snapshot-load -no-snapshot-save -cores "$PERF_AVD_CORES" > "$RESULTS_DIR/android/emulator-1.log" 2>&1 &
          # shellcheck disable=SC2086
          nohup "$ANDROID_HOME/emulator/emulator" -avd "${AVD_NAME}_2" -port 5556 $AVD_OPTIONS -no-snapshot-load -no-snapshot-save -cores "$PERF_AVD_CORES" > "$RESULTS_DIR/android/emulator-2.log" 2>&1 &
          for serial in emulator-5554 emulator-5556; do
            timeout 900 adb -s "$serial" wait-for-device
            timeout 900 adb -s "$serial" shell 'while [ "$(getprop sys.boot_completed)" != 1 ]; do sleep 2; done'
            # The cached AVD was saved with animations off; a user's phone has them on.
            for key in window_animation_scale transition_animation_scale animator_duration_scale; do
              adb -s "$serial" shell settings put global "$key" 1
            done
            echo "$serial booted"
          done
          {
            echo "- Emulator CPUs (nproc): $(for serial in emulator-5554 emulator-5556; do printf '%s=%s ' "$serial" "$(adb -s "$serial" shell nproc | tr -d '\r')"; done)"
          } >> "$GITHUB_STEP_SUMMARY"
          # Cellular like the E2E emulators (tools/scripts/boot-android-emulators-ci.sh, which boots
          # three emulators and can't be reused here). The emulated Wi-Fi delayed every packet the
          # guest received by 0.2–0.5 s on the old runner, and on this one still holds large answers
          # for ~240–500 ms while the app is busy (runs 39941337433, 39966755704); cellular adds ~0 ms.
          for serial in emulator-5554 emulator-5556; do
            adb -s "$serial" shell svc wifi disable
            cellular=false
            for _ in $(seq 30); do
              dump=$(adb -s "$serial" shell dumpsys connectivity)
              net=$(sed -n 's/.*Active default network: \([0-9]*\).*/\1/p' <<<"$dump" | head -1)
              if [[ -n "$net" && "$(grep -F "NetworkAgentInfo{network{$net}" <<<"$dump")" == *"Transports: CELLULAR"* ]]; then
                echo "$serial is on cellular"; cellular=true; break
              fi
              sleep 2
            done
            [[ "$cellular" == true ]] || echo "::warning title=Emulator not on cellular::$serial is not on cellular after 60 s"
          done
          # Wait until post-boot work is done: 1-minute load average below 1 on both (max 15 min).
          deadline=$((SECONDS + 900))
          for serial in emulator-5554 emulator-5556; do
            while (( SECONDS < deadline )); do
              load=$(adb -s "$serial" shell cat /proc/loadavg | cut -d' ' -f1)
              awk -v l="$load" 'BEGIN { exit !(l < 1.0) }' && break
              echo "$serial load $load, waiting"
              sleep 15
            done
          done
          adb devices

      # The emulator's user-mode network turns every guest connection into a plain socket of the
      # emulator process, so a capture on the runner sees the network side of each app request.
      - name: Start network capture
        if: ${{ inputs.capture_network }}
        run: |
          set -euo pipefail
          command -v tcpdump > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq tcpdump; }
          # -Z: write the file as the runner user. -U: flush each packet, so stopping loses nothing.
          nohup sudo -n tcpdump -i any -n -s 2048 -U -Z "$(id -un)" -w "$RESULTS_DIR/android/network.pcap" \
            'tcp port 443 or port 53' > "$RESULTS_DIR/android/tcpdump.log" 2>&1 &
          sleep 3
          pgrep -x tcpdump > /dev/null || { cat "$RESULTS_DIR/android/tcpdump.log"; echo "::warning::tcpdump did not start: no network capture"; }

      - name: Measure
        env:
          SCENARIO: ${{ matrix.scenario }}
          PAIRS: ${{ inputs.pairs }}
          SETTLE: ${{ inputs.settle_seconds }}
          ACCOUNTS_USERDATA: ${{ inputs.accounts_userdata }}
          PAUSE_IDLE: ${{ inputs.pause_idle_emulator }}
          # The hosts of the two requests WaitForAppReady waits for, timed from the runner itself.
          NET_BASELINE: ${{ inputs.capture_network && 'https://firebaseremoteconfig.googleapis.com/,https://countervalues.live.ledger.com/v3/markets' || '' }}
          # The emulator's own capture of each launch; it only sees the cellular network, now always used.
          GUEST_CAPTURE: ${{ inputs.capture_network }}
          ALL_EVENTS: ${{ inputs.read_all_events && '--all-events' || '' }}
          TRACE_LAUNCHES: ${{ inputs.trace_launches || '0' }}
        run: |
          set -euo pipefail
          APP_A=builds/a/signed.apk
          APP_B=builds/b/signed.apk
          [[ -f "$APP_B" ]] || APP_B="$APP_A"
          # shellcheck disable=SC2086 # ALL_EVENTS is empty or one flag
          node tools/scripts/startup-perf/run.mjs $ALL_EVENTS \
            --platform android \
            --devices emulator-5554,emulator-5556 \
            --app-a "$APP_A" --app-b "$APP_B" --app-id "$APP_ID" \
            --scenarios "$SCENARIO" --pairs "$PAIRS" --settle-ms "$((SETTLE * 1000))" \
            --accounts-userdata "$ACCOUNTS_USERDATA" \
            --pause-idle "$PAUSE_IDLE" \
            --net-baseline "$NET_BASELINE" \
            --guest-capture "$GUEST_CAPTURE" \
            --trace-launches "$TRACE_LAUNCHES" \
            --out-dir "$RESULTS_DIR/android"

      - name: Analyse
        if: ${{ always() }}
        env:
          PRESET: ${{ inputs.preset }}
          THRESHOLD: ${{ inputs.threshold_ms }}
          LABEL_A: ${{ needs.plan.outputs.label_a }}
          LABEL_B: ${{ needs.plan.outputs.label_b }}
        run: |
          node tools/scripts/startup-perf/analyze.mjs \
            --samples "$RESULTS_DIR/android/samples.jsonl" \
            --preset "$PRESET" --threshold-ms "$THRESHOLD" \
            --label-a "$LABEL_A" --label-b "$LABEL_B" \
            --summary "$GITHUB_STEP_SUMMARY" --json "$RESULTS_DIR/android/summary.json"

      - name: Stop network capture and analyse it
        if: ${{ always() && inputs.capture_network }}
        run: |
          sudo -n pkill -INT -x tcpdump || true
          sleep 3
          PCAP="$RESULTS_DIR/android/network.pcap"
          [[ -s "$PCAP" ]] || { echo "No capture to analyse"; exit 0; }
          node tools/scripts/startup-perf/network.mjs \
            --pcap "$PCAP" --samples "$RESULTS_DIR/android/samples.jsonl" \
            --summary "$GITHUB_STEP_SUMMARY" --json "$RESULTS_DIR/android/network.json"
          gzip -1 "$PCAP"
          if [[ -d "$RESULTS_DIR/android/guest-network" ]]; then gzip -1 "$RESULTS_DIR/android/guest-network/"*.pcap || true; fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: startup-perf-results-android-${{ matrix.scenario }}
          path: ${{ env.RESULTS_DIR }}/android
          retention-days: 30

      - name: Stop emulators
        if: ${{ always() }}
        run: tools/scripts/cleanup-android-emulators.sh || true

  measure-ios:
    name: "iOS startup (2 simulators)"
    needs: [plan, build-ios]
    if: ${{ inputs.platforms != 'Android Only' }}
    # One iOS measurement at a time on the shared Mac pool; Android jobs each get their own VM,
    # so Android runs are not limited.
    concurrency:
      group: mobile-startup-perf-ios-${{ github.ref_name }}
      cancel-in-progress: false
    # Same pool as the iOS E2E tests.
    runs-on: ["qaa", macOS, ARM64, "performance-pool"]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/scripts
            e2e/mobile/userdata

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Maestro needs a JDK.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "zulu"
          java-version: "17"

      # One folder per build. A pattern matching a single artifact would unpack it straight into builds/.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: startup-perf-ios-a
          path: builds/a

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ contains(needs.plan.outputs.sides, 'b') }}
        with:
          name: startup-perf-ios-b
          path: builds/b

      - name: Unpack apps
        run: |
          set -euo pipefail
          for dir in builds/a builds/b; do
            [[ -f "$dir/app.zip" ]] || continue
            ditto -x -k "$dir/app.zip" "$dir"
            echo "$dir: $(cat "$dir/sha.txt")"
          done

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/maestro-cli"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          BIN=$(dirname "$(find "$RUNNER_TEMP/maestro-cli" -type f -name maestro -path "*/bin/*" | head -1)")
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/maestro" --version

      # Fresh simulators, so no state is left over from other jobs on this machine.
      - name: Create and boot two simulators
        run: |
          set -euo pipefail
          # Simulators left booted by earlier E2E jobs on this pool would compete for the CPU.
          xcrun simctl list devices booted
          xcrun simctl shutdown all || true
          RUNTIME=$(xcrun simctl list runtimes iOS -j | jq -r '[.runtimes[] | select(.isAvailable)] | last | .identifier')
          # Newest "iPhone N Pro" the runtime supports (list order differs between Xcode versions).
          TYPE=$(xcrun simctl list runtimes iOS -j | jq -r --arg rt "$RUNTIME" '.runtimes[] | select(.identifier==$rt) | [.supportedDeviceTypes[] | select(.name|test("^iPhone [0-9]+ Pro$"))] | max_by(.name|capture("(?<n>[0-9]+)").n|tonumber) | .identifier')
          [[ -n "$TYPE" && "$TYPE" != null ]] || { echo "::error::no iPhone Pro device type for $RUNTIME"; exit 1; }
          echo "Runtime $RUNTIME, device type $TYPE"
          SIM_1=$(xcrun simctl create "Startup Perf 1" "$TYPE" "$RUNTIME")
          SIM_2=$(xcrun simctl create "Startup Perf 2" "$TYPE" "$RUNTIME")
          for udid in "$SIM_1" "$SIM_2"; do
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
          done
          echo "SIM_1=$SIM_1" >> "$GITHUB_ENV"
          echo "SIM_2=$SIM_2" >> "$GITHUB_ENV"
          sleep 60

      - name: Measure
        env:
          SCENARIOS: ${{ inputs.scenarios }}
          PAIRS: ${{ inputs.pairs }}
          SETTLE: ${{ inputs.settle_seconds }}
          ACCOUNTS_USERDATA: ${{ inputs.accounts_userdata }}
          ALL_EVENTS: ${{ inputs.read_all_events && '--all-events' || '' }}
        run: |
          set -euo pipefail
          APP_A=builds/a/ledgerlivemobile.app
          APP_B=builds/b/ledgerlivemobile.app
          [[ -d "$APP_B" ]] || APP_B="$APP_A"
          # shellcheck disable=SC2086 # ALL_EVENTS is empty or one flag
          node tools/scripts/startup-perf/run.mjs $ALL_EVENTS \
            --platform ios \
            --devices "$SIM_1,$SIM_2" \
            --app-a "$APP_A" --app-b "$APP_B" --app-id "$APP_ID" \
            --scenarios "$SCENARIOS" --pairs "$PAIRS" --settle-ms "$((SETTLE * 1000))" \
            --accounts-userdata "$ACCOUNTS_USERDATA" \
            --out-dir "$RESULTS_DIR/ios"

      - name: Analyse
        if: ${{ always() }}
        env:
          PRESET: ${{ inputs.preset }}
          THRESHOLD: ${{ inputs.threshold_ms }}
          LABEL_A: ${{ needs.plan.outputs.label_a }}
          LABEL_B: ${{ needs.plan.outputs.label_b }}
        run: |
          node tools/scripts/startup-perf/analyze.mjs \
            --samples "$RESULTS_DIR/ios/samples.jsonl" \
            --preset "$PRESET" --threshold-ms "$THRESHOLD" \
            --label-a "$LABEL_A" --label-b "$LABEL_B" \
            --summary "$GITHUB_STEP_SUMMARY" --json "$RESULTS_DIR/ios/summary.json"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: startup-perf-results-ios
          path: ${{ env.RESULTS_DIR }}/ios
          retention-days: 30

      - name: Delete simulators
        if: ${{ always() }}
        run: |
          for udid in "${SIM_1:-}" "${SIM_2:-}"; do
            [[ -n "$udid" ]] || continue
            xcrun simctl shutdown "$udid" || true
            xcrun simctl delete "$udid" || true
          done

name: "[Mobile] - Mock Test - Called"

on:
  workflow_call:
    inputs:
      macos-specificity-runner-label:
        description: The specificity runner label to run the tests on (e.g. performance-pool, performance-pool or runner)
        required: false
        type: string
        default: "general-pool"
      disable-nx-cache:
        description: Skip Nx cache for nx-step runs
        required: false
        type: boolean
        default: false
      ref:
        description: Ref to checkout
        required: false
        type: string
      max-shards:
        description: Max number of shards to use for detox tests (both ios and android)
        required: false
        type: number
        default: 2
      skip-pod-checks:
        description: Whether to skip the pod lockfile checks
        required: false
        type: string
        default: "true"

    secrets:
      ALLURE_LEDGER_LIVE_PASSWORD:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEYSTORE_PATH:
        required: true
      AWS_ACCOUNT_ID_PROD:
        required: true
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH:
        required: true
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP:
        required: true
      AWS_CACHE_REGION:
        required: true
      AWS_CACHE_ROLE_NAME:
        required: true
      CARD_BAANX_API_URL:
        required: false
      CARD_BAANX_CLIENT_KEY:
        required: false
      CARD_BAANX_HOSTED_UI:
        required: false
      CARD_OAUTH_REDIRECT_URI:
        required: false
      GH_BOT_APP_ID:
        required: true
      GH_BOT_PRIVATE_KEY:
        required: true
      NX_KEY:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_ENDPOINT:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      S3_DIRECTCONNECT_ENDPOINT:
        required: true
      SEED_QAA_B2C:
        required: true
      SPECULINHO_URL:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: |
          If you run this manually, and want to run on a PR, the correct ref should be refs/pull/{PR_NUMBER}/merge to
          have the "normal" scenario involving checking out a merge commit between your branch and the base branch.
          If you want to run only on a branch or specific commit, you can use either the sha or the branch name instead (prefer the first verion for PRs).
        type: string
        required: false
      login:
        description: The GitHub username that triggered the workflow
        type: string
        required: false
      macos-specificity-runner-label:
        description: The specificity runner label to run the tests on (e.g. performance-pool, performance-pool or runner)
        required: false
        type: string
        default: "general-pool"
      production_firebase:
        description: "Target Firebase Production env"
        required: false
        type: boolean
        default: false
      max-shards:
        description: Max number of shards to use for detox tests (both ios and android)
        required: false
        type: number
        default: 2
      skip-pod-checks:
        description: Whether to skip the pod lockfile checks
        required: false
        type: string
        default: "true"

permissions:
  contents: read

env:
  cache-bucket: ll-nx-cache
  ANDROID_APK_PATH: apps/ledger-live-mobile/android/app/build/outputs/apk/detox/app-x86_64-detox.apk
  ANDROID_JSBUNDLE_PATH: apps/ledger-live-mobile/main.jsbundle
  IOS_JSBUNDLE_PATH: apps/ledger-live-mobile/ios/build/Build/Products/Release-iphonesimulator/ledgerlivemobile.app/main.jsbundle
  IOS_NATIVE_PATH: apps/ledger-live-mobile/ios/build/Build/Products/Release-iphonesimulator
  # Android AVD configuration (shared by determine-builds cache key + Detox Android job)
  AVD_API: 36
  AVD_ARCH: x86_64
  AVD_PROFILE: pixel_9_pro
  AVD_TARGET: google_apis
  AVD_NAME: "Android_Emulator"
  AVD_CORES: 2
  AVD_RAM_SIZE: 3072
  AVD_HEAP_SIZE: 1024
  AVD_OPTIONS: -no-window -gpu swiftshader_indirect -accel on -no-audio -no-boot-anim -camera-back none -camera-front none -no-metrics
  MOBILE_ARTIFACTS_ROOT: e2e/mobile/artifacts
  E2E_TEST_RESULTS_PREFIX_IOS: e2e-test-results-ios
  E2E_TEST_RESULTS_PREFIX_ANDROID: e2e-test-results-android

jobs:
  determine-builds:
    name: "Determine Builds"
    permissions:
      id-token: write
      contents: read
    runs-on: [ubuntu-22.04]
    outputs:
      ios_native_exists: ${{ steps.check-ios-native.outputs.cache-hit }}
      ios_js_exists: ${{ steps.check-ios-js.outputs.cache-hit }}
      android_native_exists: ${{ steps.check-android-native.outputs.cache-hit }}
      android_js_exists: ${{ steps.check-android-js.outputs.cache-hit }}
      ios_native_key: ${{ steps.cache-keys.outputs.ios_native_key }}
      ios_js_key: ${{ steps.cache-keys.outputs.ios_js_key }}
      android_native_key: ${{ steps.cache-keys.outputs.android_native_key }}
      android_js_key: ${{ steps.cache-keys.outputs.android_js_key }}
      android_timing_cache_key: ${{ steps.cache-keys.outputs.android_timing_cache_key }}
      ios_timing_cache_key: ${{ steps.cache-keys.outputs.ios_timing_cache_key }}
      pod_check_key: ${{ steps.cache-keys.outputs.pod_check_key }}
      matrix_ios: ${{ steps.generate-shards.outputs.matrix_ios }}
      matrix_android: ${{ steps.generate-shards.outputs.matrix_android }}
      avd_cache_key: ${{ steps.cache-keys.outputs.avd_cache_key }}
      avd_exists: ${{ steps.check-avd.outputs.cache-hit }}
      pod_lockfile_validated: ${{ steps.check-lockfile-status.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false
          sparse-checkout: |
            apps/ledger-live-mobile
            e2e/mobile
            e2e/tooling
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .pnpmfile.cjs
            tools
            .mise/tasks

      - name: Determine cache keys
        id: cache-keys
        env:
          REF_NAME: ${{ github.ref_name }}
          MAX_SHARDS: ${{ inputs.max-shards }}
          MACOS_RUNNER_LABEL: ${{ inputs.macos-specificity-runner-label }}
        run: |
          PREFIX=""
          if [ "$REF_NAME" = "develop" ]; then
            PREFIX="develop/"
          fi
          echo "ios_native_key=${PREFIX}longterm-${{ hashFiles('apps/ledger-live-mobile/ios', 'apps/ledger-live-mobile/package.json', 'pnpm-workspace.yaml', 'e2e/mobile/detox.config.js', 'e2e/mobile/scripts/syncAppVersion.js') }}-detox-native-ios-3" >> $GITHUB_OUTPUT
          echo "android_native_key=${PREFIX}longterm-${{ hashFiles('apps/ledger-live-mobile/android', 'apps/ledger-live-mobile/package.json', 'pnpm-workspace.yaml', 'e2e/mobile/detox.config.js', 'e2e/mobile/scripts/syncAppVersion.js') }}-detox-native-android-3" >> $GITHUB_OUTPUT
          HEAD_SHA=$(git rev-parse HEAD)
          echo "ios_js_key=${PREFIX}${HEAD_SHA}-detox-js-ios" >> $GITHUB_OUTPUT
          echo "android_js_key=${PREFIX}${HEAD_SHA}-detox-js-android" >> $GITHUB_OUTPUT
          echo "android_timing_cache_key=${PREFIX}android-mock-timing-${{ hashFiles('apps/ledger-live-mobile/e2e') }}-${MAX_SHARDS}shards" >> $GITHUB_OUTPUT
          echo "ios_timing_cache_key=${PREFIX}ios-mock-timing-${{ hashFiles('apps/ledger-live-mobile/e2e') }}-${MAX_SHARDS}shards-$MACOS_RUNNER_LABEL" >> $GITHUB_OUTPUT
          echo "pod_check_key=${{ hashFiles('apps/ledger-live-mobile/ios/Podfile.lock', 'apps/ledger-live-mobile/ios/Podfile', 'pnpm-lock.yaml') }}-pod-lockfile-validated" >> $GITHUB_OUTPUT
          echo "avd_cache_key=${{ runner.os }}-detox-avd-${{ env.AVD_NAME }}_5-${{ env.AVD_PROFILE }}-${{ env.AVD_TARGET }}-${{ env.AVD_API }}-${{ env.AVD_ARCH }}-${{ env.AVD_CORES }}-${{ env.AVD_RAM_SIZE }}-${{ env.AVD_HEAP_SIZE }}-r2-v9" >> $GITHUB_OUTPUT

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@ci/skip-mise-action-self-hosted
        id: setup-caches
        with:
          use-mise: true
          skip-pnpm-cache: "true"
          skip-pod-cache: "true"
          skip-nx-cache: "true"

          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Generate shards matrix and test files
        id: generate-shards
        uses: LedgerHQ/ledger-live/tools/actions/composites/generate-shards-matrix@ci/skip-mise-action-self-hosted
        with:
          test_directory: apps/ledger-live-mobile/e2e
          event_name: ${{ github.event_name }}
          ref: ${{ inputs.ref || github.ref_name }}
          ios_timing_cache_key: ${{ steps.cache-keys.outputs.ios_timing_cache_key }}
          android_timing_cache_key: ${{ steps.cache-keys.outputs.android_timing_cache_key }}
          aws_access_key_id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ env.AWS_SESSION_TOKEN }}
          cache_bucket: ${{ env.cache-bucket }}
          aws_region: ${{ secrets.AWS_CACHE_REGION }}
          max_shards: ${{ inputs.max-shards }}

      - name: Check if Android AVD cache exists
        id: check-avd
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/exists@ci/skip-mise-action-self-hosted
        with:
          key: ${{ steps.cache-keys.outputs.avd_cache_key }}
          accessKey: ${{ secrets.R2_ACCESS_KEY_ID }}
          secretKey: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ledger-live-cache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          region: auto

      - name: Check if iOS Native Build exists already
        id: check-ios-native
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.ios_native_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if Android Native Build exists already
        id: check-android-native
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.android_native_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if iOS JS Build exists already
        id: check-ios-js
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.ios_js_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if Android JS Build exists already
        id: check-android-js
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.android_js_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if pod lockfile has been validated
        id: check-lockfile-status
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.pod_check_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

  setup-android-avd:
    name: "Setup Android AVD"
    needs: [determine-builds]
    if: ${{ needs.determine-builds.outputs.avd_exists != 'true' }}
    runs-on: [ledger-live-linux-e2e-8CPU-32RAM]
    steps:
      - name: Setup Android AVDs
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-avd@ci/skip-mise-action-self-hosted
        with:
          ref: ${{ inputs.ref || github.sha }}
          avd_api: ${{ env.AVD_API }}
          avd_arch: ${{ env.AVD_ARCH }}
          avd_profile: ${{ env.AVD_PROFILE }}
          avd_target: ${{ env.AVD_TARGET }}
          avd_name: ${{ env.AVD_NAME }}
          avd_cores: ${{ env.AVD_CORES }}
          avd_ram_size: ${{ env.AVD_RAM_SIZE }}
          avd_heap_size: ${{ env.AVD_HEAP_SIZE }}
          avd_options: ${{ env.AVD_OPTIONS }}
          cache_key: ${{ needs.determine-builds.outputs.avd_cache_key }}
          r2_access_key: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_endpoint: ${{ secrets.R2_ENDPOINT }}

  build-ios:
    name: "iOS Build"
    needs: [determine-builds]
    uses: LedgerHQ/ledger-live/.github/workflows/test-mobile-build-ios-reusable.yml@ci/skip-mise-action-self-hosted
    permissions:
      id-token: write
      contents: read
    with:
      ref: ${{ inputs.ref || github.sha }}
      macos-specificity-runner-label: ${{ inputs.macos-specificity-runner-label }}
      disable-nx-cache: ${{ inputs.disable-nx-cache || false }}
      build-ios-js: ${{ needs.determine-builds.outputs.ios_js_exists == 'false' }}
      build-ios-native: ${{ needs.determine-builds.outputs.ios_native_exists == 'false' }}
      ios-native-cache-key: ${{ needs.determine-builds.outputs.ios_native_key }}
      ios-js-cache-key: ${{ needs.determine-builds.outputs.ios_js_key }}
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      CARD_BAANX_API_URL: ${{ secrets.CARD_BAANX_API_URL }}
      CARD_BAANX_CLIENT_KEY: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
      CARD_BAANX_HOSTED_UI: ${{ secrets.CARD_BAANX_HOSTED_UI }}
      CARD_OAUTH_REDIRECT_URI: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}
      NX_KEY: ${{ secrets.NX_KEY }}
      S3_DIRECTCONNECT_ENDPOINT: ${{ secrets.S3_DIRECTCONNECT_ENDPOINT }}

  build-android:
    name: "Android Build"
    needs: [determine-builds]
    uses: LedgerHQ/ledger-live/.github/workflows/test-mobile-build-android-reusable.yml@ci/skip-mise-action-self-hosted
    permissions:
      id-token: write
      contents: read
    with:
      ref: ${{ inputs.ref || github.sha }}
      disable-nx-cache: ${{ inputs.disable-nx-cache || false }}
      build-android-js: ${{ needs.determine-builds.outputs.android_js_exists == 'false' }}
      build-android-native: ${{ needs.determine-builds.outputs.android_native_exists == 'false' }}
      android-native-cache-key: ${{ needs.determine-builds.outputs.android_native_key }}
      android-js-cache-key: ${{ needs.determine-builds.outputs.android_js_key }}
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      CARD_BAANX_API_URL: ${{ secrets.CARD_BAANX_API_URL }}
      CARD_BAANX_CLIENT_KEY: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
      CARD_BAANX_HOSTED_UI: ${{ secrets.CARD_BAANX_HOSTED_UI }}
      CARD_OAUTH_REDIRECT_URI: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}
      NX_KEY: ${{ secrets.NX_KEY }}

  detox-ui-e2e-android:
    name: "Android UI E2E Smoke Tests"
    permissions:
      id-token: write
      contents: read
    needs: [build-android, determine-builds, setup-android-avd]
    if: ${{ !cancelled() && needs.build-android.result == 'success' && needs.determine-builds.result == 'success' && (needs.setup-android-avd.result == 'success' || needs.setup-android-avd.result == 'skipped') }}
    runs-on: [ledger-live-linux-8CPU-32RAM]
    timeout-minutes: 80
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      SPECULOS_IMAGE_TAG: ghcr.io/ledgerhq/speculos:latest
      SPECULOS_FIRMWARE_VERSION: 2.7.1
      SPECULOS_DEVICE: nanoX
      USERDATA_CACHE_ENABLED: "true"
      E2E_GENERATED_USERDATA_DIR: ${{ format('{0}/e2e/userdata/generated', github.workspace) }}
    outputs:
      status: ${{ steps.detox.outcome }}
      artifact: ${{ steps.test-artifacts.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      - name: Setup Android Environment
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-env@ci/skip-mise-action-self-hosted

      - name: Install scrcpy
        timeout-minutes: 10
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/install-scrcpy@ci/skip-mise-action-self-hosted

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@ci/skip-mise-action-self-hosted
        id: setup-caches
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-pnpm-cache: "false"
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@ci/skip-mise-action-self-hosted
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Download Native Build
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@ci/skip-mise-action-self-hosted
        with:
          key: ${{ needs.determine-builds.outputs.android_native_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Download JS Bundle
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@ci/skip-mise-action-self-hosted
        with:
          key: ${{ needs.determine-builds.outputs.android_js_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Prepare APK
        run: |
          mkdir -p /tmp/apk/assets
          mkdir -p /home/runner/.android/
          mv ${{ env.ANDROID_JSBUNDLE_PATH }} /tmp/apk/assets/index.android.bundle
          mv ${{ env.ANDROID_APK_PATH }} /tmp/apk/tmp.apk
          (cd /tmp/apk/; zip -r tmp.apk assets/index.android.bundle)
          /usr/local/lib/android/sdk/build-tools/34.0.0/zipalign -p 4 /tmp/apk/tmp.apk ${{ env.ANDROID_APK_PATH }}
          /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign --ks ${{ secrets.ANDROID_KEYSTORE_PATH }} --ks-pass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} --ks-key-alias staging --key-pass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} ${{ env.ANDROID_APK_PATH }}

      - name: Install dependencies
        run: |
          pnpm i --frozen-lockfile --filter="live-mobile..." --filter="ledger-live" --filter="ledger-live-mobile-e2e-tests..." --filter="live-cli*..." --filter="@ledgerhq/dummy-*-app..." --unsafe-perm --ignore-scripts

      - name: Detox Post Install
        run: node apps/ledger-live-mobile/node_modules/detox/scripts/postinstall.js

      - name: Build e2e dependencies (CLI + libs)
        uses: LedgerHQ/ledger-live/tools/actions/composites/nx-step@ci/skip-mise-action-self-hosted
        with:
          command: pnpm exec nx run ledger-live-mobile-e2e-tests:build-e2e-deps
          disable_cache: ${{ inputs.disable-nx-cache || false }}

      - name: Download android emulator
        timeout-minutes: 5
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@ci/skip-mise-action-self-hosted
        id: detox-avd
        with:
          key: ${{ needs.determine-builds.outputs.avd_cache_key }}
          accessKey: "${{ secrets.R2_ACCESS_KEY_ID }}"
          secretKey: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          bucket: ledger-live-cache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          region: auto
          destination: /

      - name: Duplicate AVDs for parallel testing
        uses: LedgerHQ/ledger-live/tools/actions/composites/duplicate-avd@ci/skip-mise-action-self-hosted
        with:
          source_avd_name: ${{ env.AVD_NAME }}
          target_suffixes: "_2,_3"
          avd_api: ${{ env.AVD_API }}

      - name: Boot Android Emulators in Background
        run: |
          LOG_FILE="${{ env.MOBILE_ARTIFACTS_ROOT }}/emulator-boot.log"
          mkdir -p ${{ env.MOBILE_ARTIFACTS_ROOT }}
          export AVD_NAME="${{ env.AVD_NAME }}"
          export AVD_OPTIONS="${{ env.AVD_OPTIONS }}"
          nohup bash tools/scripts/boot-android-emulators-ci.sh > "$LOG_FILE" 2>&1 &
          echo "ℹ️ Android emulators boot started in background."
        shell: bash

      - name: Compute userdata cache key date
        if: ${{ env.USERDATA_CACHE_ENABLED == 'true' }}
        id: userdata-meta
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore pre-generated E2E userdata (app.json) from S3 cache
        if: ${{ env.USERDATA_CACHE_ENABLED == 'true' }}
        continue-on-error: true
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          path: e2e/userdata/generated
          key: develop/e2e-userdata-mobile-${{ steps.userdata-meta.outputs.date }}
          restore-keys: |
            develop/e2e-userdata-mobile-
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false

      - name: Set DISABLE_TRANSACTION_BROADCAST
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-e2e-env@ci/skip-mise-action-self-hosted
        with:
          enable_broadcast: false
          build_type: testing

      - name: Get smoke test files
        id: smoke-files
        run: |
          # shard-tests.mjs moved to e2e/mobile/; fall back to the old path so this @develop-pinned
          # reusable keeps working on release/hotfix checkouts. TODO(remove ~2026-08-15) with the old file.
          SHARD_TESTS=e2e/mobile/scripts/shard-tests.mjs
          [ -f "$SHARD_TESTS" ] || SHARD_TESTS=apps/ledger-live-mobile/scripts/shard-tests.mjs
          SMOKE_FILES=$(node "$SHARD_TESTS" "@smoke" "e2e/mobile")
          if [ -z "$SMOKE_FILES" ]; then
            echo "No smoke test files found — skipping smoke tests"
            echo "has_tests=false" >> $GITHUB_OUTPUT
          else
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "SHARD_TEST_FILES<<EOF" >> $GITHUB_ENV
            echo "$SMOKE_FILES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "Smoke test files: $SMOKE_FILES"
          fi

      - name: Run Android Tests - Smoke Tests
        if: steps.smoke-files.outputs.has_tests == 'true'
        id: detox
        run: |
          pnpm mobile e2e:ci -p android -t \
            --e2e \
            $SHARD_TEST_FILES \
            --outputFile=artifacts/e2e-test-results-android-smoke.json
        timeout-minutes: 45
        env:
          DETOX_INSTALL_TIMEOUT: 120000
          SEED: ${{ secrets.SEED_QAA_B2C }}
          SPECULINHO_URL: ${{ secrets.SPECULINHO_URL }}
          REMOTE_SPECULOS: "true"
          ADB: /usr/local/lib/android/sdk/platform-tools/adb # Needed for scrcpy
          INPUT_E2E: "true"
          INPUTS_TEST_FILTER: "@smoke"

      - name: Upload test artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ steps.smoke-files.outputs.has_tests == 'true' && (!cancelled() || steps.detox.outcome == 'cancelled') }}
        id: "test-artifacts"
        with:
          name: "android-ui-e2e-smoke-artifacts"
          path: ${{ env.MOBILE_ARTIFACTS_ROOT }}

  detox-ui-e2e-ios:
    name: "iOS UI E2E Smoke Tests"
    permissions:
      id-token: write
      contents: read
    needs: [build-ios, determine-builds]
    runs-on: ["${{ inputs.macos-specificity-runner-label }}", macOS, ARM64]
    timeout-minutes: 80
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      IOS_SIMULATOR_DEVICE: iPhone 15
      SPECULOS_IMAGE_TAG: ghcr.io/ledgerhq/speculos:latest
      SPECULOS_FIRMWARE_VERSION: 2.7.1
      SPECULOS_DEVICE: nanoX
      USERDATA_CACHE_ENABLED: "true"
      E2E_GENERATED_USERDATA_DIR: ${{ format('{0}/e2e/userdata/generated', github.workspace) }}
    outputs:
      status: ${{ steps.detox.outcome }}
      artifact: ${{ steps.test-artifacts.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      - name: setup caches
        id: setup-caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@ci/skip-mise-action-self-hosted
        with:
          skip-pod-cache: "true"
          skip-pnpm-cache: "true"
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@ci/skip-mise-action-self-hosted
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        name: install dependencies
        id: install-dependencies
        with:
          max_attempts: 2
          timeout_minutes: 15
          command: pnpm i --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --filter="ledger-live-mobile-e2e-tests..." --filter="live-cli*..." --frozen-lockfile --unsafe-perm --ignore-scripts
          new_command_on_retry: rm -rf ~/.cocoapods/ && pnpm clean && pnpm i --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --filter="ledger-live-mobile-e2e-tests..." --filter="live-cli*..." --frozen-lockfile --unsafe-perm --ignore-scripts

      # Warm simulators before Detox; worker_count matches the iOS Simulator … N names in detox.config.js.
      - name: Boot iOS Simulators in Background
        uses: LedgerHQ/ledger-live/tools/actions/composites/boot-ios-simulators-background@ci/skip-mise-action-self-hosted
        with:
          worker_count: 3
          artifacts_root: ${{ env.MOBILE_ARTIFACTS_ROOT }}

      - name: Detox Post Install
        run: node node_modules/detox/scripts/postinstall.js
        working-directory: apps/ledger-live-mobile

      - name: Download Native Build
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@ci/skip-mise-action-self-hosted
        with:
          endpoint: ${{ secrets.S3_DIRECTCONNECT_ENDPOINT }}
          key: ${{ needs.determine-builds.outputs.ios_native_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Download JS Build
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@ci/skip-mise-action-self-hosted
        with:
          endpoint: ${{ secrets.S3_DIRECTCONNECT_ENDPOINT }}
          key: ${{ needs.determine-builds.outputs.ios_js_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Copy JS build
        run: |
          cp apps/ledger-live-mobile/main.jsbundle ${{ env.IOS_JSBUNDLE_PATH }}
          cp apps/ledger-live-mobile/main.jsbundle ${{ env.IOS_NATIVE_PATH }}/main.jsbundle

      - name: Build e2e dependencies (CLI + libs)
        uses: LedgerHQ/ledger-live/tools/actions/composites/nx-step@ci/skip-mise-action-self-hosted
        with:
          command: pnpm exec nx run ledger-live-mobile-e2e-tests:build-e2e-deps
          disable_cache: ${{ inputs.disable-nx-cache || false }}

      - name: Compute userdata cache key date
        if: ${{ env.USERDATA_CACHE_ENABLED == 'true' }}
        id: userdata-meta
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore pre-generated E2E userdata (app.json) from S3 cache
        if: ${{ env.USERDATA_CACHE_ENABLED == 'true' }}
        continue-on-error: true
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          path: e2e/userdata/generated
          key: develop/e2e-userdata-mobile-${{ steps.userdata-meta.outputs.date }}
          restore-keys: |
            develop/e2e-userdata-mobile-
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false

      - name: Set DISABLE_TRANSACTION_BROADCAST
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-e2e-env@ci/skip-mise-action-self-hosted
        with:
          enable_broadcast: false
          build_type: testing

      - name: Get smoke test files
        id: smoke-files
        run: |
          # shard-tests.mjs moved to e2e/mobile/; fall back to the old path so this @develop-pinned
          # reusable keeps working on release/hotfix checkouts. TODO(remove ~2026-08-15) with the old file.
          SHARD_TESTS=e2e/mobile/scripts/shard-tests.mjs
          [ -f "$SHARD_TESTS" ] || SHARD_TESTS=apps/ledger-live-mobile/scripts/shard-tests.mjs
          SMOKE_FILES=$(node "$SHARD_TESTS" "@smoke" "e2e/mobile")
          if [ -z "$SMOKE_FILES" ]; then
            echo "No smoke test files found — skipping smoke tests"
            echo "has_tests=false" >> $GITHUB_OUTPUT
          else
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "SHARD_TEST_FILES<<EOF" >> $GITHUB_ENV
            echo "$SMOKE_FILES" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "Smoke test files: $SMOKE_FILES"
          fi

      - name: Run iOS Tests - Smoke Tests
        if: steps.smoke-files.outputs.has_tests == 'true'
        id: detox
        timeout-minutes: 45
        env:
          SEED: ${{ secrets.SEED_QAA_B2C }}
          SPECULINHO_URL: ${{ secrets.SPECULINHO_URL }}
          INPUT_E2E: "true"
          REMOTE_SPECULOS: "true"
          INPUTS_TEST_FILTER: "@smoke"
        run: |
          pnpm mobile e2e:ci -p ios -t \
            --e2e \
            $SHARD_TEST_FILES \
            --outputFile=artifacts/e2e-test-results-ios-smoke.json

      - name: Upload test artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ steps.smoke-files.outputs.has_tests == 'true' && (!cancelled() || steps.detox.outcome == 'cancelled') }}
        id: "test-artifacts"
        with:
          name: "ios-ui-e2e-smoke-artifacts"
          path: ${{ env.MOBILE_ARTIFACTS_ROOT }}

  allure-report-mobile-ui-e2e-smoke:
    name: "Allure Report - Mobile UI E2E Smoke (iOS + Android)"
    continue-on-error: true
    runs-on: [ledger-live-medium]
    needs: [detox-ui-e2e-ios, detox-ui-e2e-android]
    if: ${{ !cancelled() && (needs.detox-ui-e2e-ios.outputs.artifact || needs.detox-ui-e2e-android.outputs.artifact) }}
    outputs:
      report-url: ${{ steps.upload.outputs.report-url }}
    steps:
      - name: Download Allure results (iOS + Android)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: mobile-ui-e2e-smoke-artifacts
          pattern: "*-ui-e2e-smoke-artifacts"
          merge-multiple: true

      - name: Publish report on Allure Server
        id: upload
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report@ci/skip-mise-action-self-hosted
        with:
          platform: mobile-ui-e2e-smoke
          login: ${{ vars.ALLURE_USERNAME }}
          password: ${{ secrets.ALLURE_LEDGER_LIVE_PASSWORD }}
          path: mobile-ui-e2e-smoke-artifacts
          report_path_suffix: PR-checks

      - name: Write Allure report in summary
        if: ${{ steps.upload.outputs.report-url != '' }}
        run: echo "::notice title=Mobile UI E2E Smoke Allure report::${{ steps.upload.outputs.report-url }}"

  test-pod-lockfile:
    name: "Test Pod Lockfile"
    permissions:
      id-token: write
      contents: read
    runs-on: [macOS, ARM64]
    needs: [determine-builds]
    if: needs.determine-builds.outputs.ios_native_exists == 'true' && inputs.skip-pod-checks != 'true' && needs.determine-builds.outputs.pod_lockfile_validated != 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false
          fetch-depth: 1

      - name: setup caches
        id: setup-caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@ci/skip-mise-action-self-hosted
        with:
          skip-pod-cache: "true"
          skip-pnpm-cache: "true"
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@ci/skip-mise-action-self-hosted
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        run: |
          pnpm i --frozen-lockfile --filter="live-mobile..." --unsafe-perm --ignore-scripts

      - name: Test Pod Lockfile
        run: |
          pnpm mobile postinstall

      - name: Cache pod lockfile validation
        run: |
          echo "pod-lockfile-validated=true" > pod-lockfile-cache.txt

      - name: Write cache
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/upload@ci/skip-mise-action-self-hosted
        with:
          path: pod-lockfile-cache.txt
          key: ${{ needs.determine-builds.outputs.pod_check_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ll-nx-cache
          region: ${{ secrets.AWS_CACHE_REGION }}

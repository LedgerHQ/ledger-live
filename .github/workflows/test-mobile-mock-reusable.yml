name: "[Mobile] - Mock Test - Called"

on:
  workflow_call:
    inputs:
      macos-specificity-runner-label:
        description: The specificity runner label to run the tests on (e.g. performance-pool, performance-pool or runner)
        required: false
        type: string
        default: "general-pool"
      disable-nx-cache:
        description: Skip Nx cache for nx-step runs
        required: false
        type: boolean
        default: false
      ref:
        description: Ref to checkout
        required: false
        type: string
      skip-bundle-size-reporting:
        description: Whether to skip the bundle size reporting
        required: false
        type: boolean
        default: false
      max-shards:
        description: Max number of shards to use for detox tests (both ios and android)
        required: false
        type: number
        default: 2
      skip-pod-checks:
        description: Whether to skip the pod lockfile checks
        required: false
        type: string
        default: "true"

  workflow_dispatch:
    inputs:
      ref:
        description: |
          If you run this manually, and want to run on a PR, the correct ref should be refs/pull/{PR_NUMBER}/merge to
          have the "normal" scenario involving checking out a merge commit between your branch and the base branch.
          If you want to run only on a branch or specific commit, you can use either the sha or the branch name instead (prefer the first verion for PRs).
        type: string
        required: false
      login:
        description: The GitHub username that triggered the workflow
        type: string
        required: false
      macos-specificity-runner-label:
        description: The specificity runner label to run the tests on (e.g. performance-pool, performance-pool or runner)
        required: false
        type: string
        default: "general-pool"
      production_firebase:
        description: "Target Firebase Production env"
        required: false
        type: boolean
        default: false
      max-shards:
        description: Max number of shards to use for detox tests (both ios and android)
        required: false
        type: number
        default: 2
      skip-pod-checks:
        description: Whether to skip the pod lockfile checks
        required: false
        type: string
        default: "true"

permissions:
  id-token: write
  contents: read

env:
  SHOULD_UPLOAD: ${{ (github.event_name == 'push' && contains(fromJson('["develop", "main"]'), github.ref_name)) }}
  cache-bucket: ll-nx-cache
  ANDROID_APK_PATH: apps/ledger-live-mobile/android/app/build/outputs/apk/detox/app-x86_64-detox.apk
  ANDROID_JSBUNDLE_PATH: apps/ledger-live-mobile/main.jsbundle
  ANDROID_TESTBINARY_PATH: apps/ledger-live-mobile/android/app/build/outputs/apk/androidTest/detox/app-detox-androidTest.apk
  IOS_JSBUNDLE_PATH: apps/ledger-live-mobile/ios/build/Build/Products/Release-iphonesimulator/ledgerlivemobile.app/main.jsbundle
  IOS_NATIVE_PATH: apps/ledger-live-mobile/ios/build/Build/Products/Release-iphonesimulator
  # Android AVD configuration (shared by determine-builds cache key + Detox Android job)
  AVD_API: 36
  AVD_ARCH: x86_64
  AVD_PROFILE: pixel_9_pro
  AVD_TARGET: google_apis
  AVD_NAME: "Android_Emulator"
  AVD_CORES: 4
  AVD_RAM_SIZE: 5120
  AVD_HEAP_SIZE: 1024
  AVD_OPTIONS: -no-window -gpu swiftshader_indirect -accel on -no-audio -no-boot-anim -camera-back none -camera-front none -no-metrics
  MOBILE_ARTIFACTS_ROOT: apps/ledger-live-mobile/artifacts
  E2E_TEST_RESULTS_PREFIX_IOS: e2e-test-results-ios
  E2E_TEST_RESULTS_PREFIX_ANDROID: e2e-test-results-android

jobs:
  determine-builds:
    name: "Determine Builds"
    runs-on: [ubuntu-22.04]
    outputs:
      ios_native_exists: ${{ steps.check-ios-native.outputs.cache-hit }}
      ios_js_exists: ${{ steps.check-ios-js.outputs.cache-hit }}
      android_native_exists: ${{ steps.check-android-native.outputs.cache-hit }}
      android_js_exists: ${{ steps.check-android-js.outputs.cache-hit }}
      ios_native_key: ${{ steps.cache-keys.outputs.ios_native_key }}
      ios_js_key: ${{ steps.cache-keys.outputs.ios_js_key }}
      android_native_key: ${{ steps.cache-keys.outputs.android_native_key }}
      android_js_key: ${{ steps.cache-keys.outputs.android_js_key }}
      android_timing_cache_key: ${{ steps.cache-keys.outputs.android_timing_cache_key }}
      ios_timing_cache_key: ${{ steps.cache-keys.outputs.ios_timing_cache_key }}
      pod_check_key: ${{ steps.cache-keys.outputs.pod_check_key }}
      matrix_ios: ${{ steps.generate-shards.outputs.matrix_ios }}
      matrix_android: ${{ steps.generate-shards.outputs.matrix_android }}
      avd_cache_key: ${{ steps.cache-keys.outputs.avd_cache_key }}
      avd_exists: ${{ steps.check-avd.outputs.cache-hit }}
      pod_lockfile_validated: ${{ steps.check-lockfile-status.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false
          sparse-checkout: |
            apps/ledger-live-mobile
            pnpm-lock.yaml
            .pnpmfile.cjs
            tools
            .mise/tasks

      - name: Determine cache keys
        id: cache-keys
        run: |
          PREFIX=""
          if [ "${{ github.ref_name }}" = "develop" ]; then
            PREFIX="develop/"
          fi
          echo "ios_native_key=${PREFIX}longterm-${{ hashFiles('apps/ledger-live-mobile/ios') }}-detox-native-ios-3" >> $GITHUB_OUTPUT
          echo "android_native_key=${PREFIX}longterm-${{ hashFiles('apps/ledger-live-mobile/android') }}-detox-native-android-3" >> $GITHUB_OUTPUT
          echo "ios_js_key=${PREFIX}${{ inputs.ref || github.sha }}-detox-js-ios" >> $GITHUB_OUTPUT
          echo "android_js_key=${PREFIX}${{ inputs.ref || github.sha }}-detox-js-android" >> $GITHUB_OUTPUT
          echo "android_timing_cache_key=${PREFIX}android-mock-timing-${{ hashFiles('apps/ledger-live-mobile/e2e') }}-${{ inputs.max-shards }}shards-2" >> $GITHUB_OUTPUT
          echo "ios_timing_cache_key=${PREFIX}ios-mock-timing-${{ hashFiles('apps/ledger-live-mobile/e2e') }}-${{ inputs.max-shards }}shards-${{ inputs.macos-specificity-runner-label }}-2" >> $GITHUB_OUTPUT
          echo "pod_check_key=${{ hashFiles('apps/ledger-live-mobile/ios/Podfile.lock', 'apps/ledger-live-mobile/ios/Podfile', 'pnpm-lock.yaml') }}-pod-lockfile-validated" >> $GITHUB_OUTPUT
          echo "avd_cache_key=${{ runner.os }}-detox-avd-${{ env.AVD_NAME }}-${{ env.AVD_PROFILE }}-${{ env.AVD_TARGET }}-${{ env.AVD_API }}-${{ env.AVD_ARCH }}-${{ env.AVD_CORES }}-${{ env.AVD_RAM_SIZE }}-${{ env.AVD_HEAP_SIZE }}-r2-v8" >> $GITHUB_OUTPUT

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: setup-caches
        with:
          use-mise: true
          skip-pnpm-cache: "true"
          skip-pod-cache: "true"
          skip-nx-cache: "true"

          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Generate shards matrix and test files
        id: generate-shards
        uses: LedgerHQ/ledger-live/tools/actions/composites/generate-shards-matrix@develop
        with:
          test_directory: apps/ledger-live-mobile/e2e
          test_filter: ${{ inputs.test_filter || '' }}
          event_name: ${{ github.event_name }}
          ref: ${{ inputs.ref || github.ref_name }}
          ios_timing_cache_key: ${{ steps.cache-keys.outputs.ios_timing_cache_key }}
          aws_access_key_id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ env.AWS_SESSION_TOKEN }}
          cache_bucket: ${{ env.cache-bucket }}
          aws_region: ${{ secrets.AWS_CACHE_REGION }}
          max_shards: ${{ inputs.max-shards }}

      - name: Check if Android AVD cache exists
        id: check-avd
        if: ${{ steps.generate-shards.outputs.matrix_android != '[]' }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/exists@develop
        with:
          key: ${{ steps.cache-keys.outputs.avd_cache_key }}
          accessKey: ${{ secrets.R2_ACCESS_KEY_ID }}
          secretKey: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ledger-live-cache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          region: auto

      - name: Check if iOS Native Build exists already
        id: check-ios-native
        uses: tespkg/actions-cache/restore@v1.9.0
        with:
          key: ${{ steps.cache-keys.outputs.ios_native_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true


      - name: Check if iOS JS Build exists already
        id: check-ios-js
        uses: tespkg/actions-cache/restore@v1.9.0
        with:
          key: ${{ steps.cache-keys.outputs.ios_js_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if pod lockfile has been validated
        id: check-lockfile-status
        uses: tespkg/actions-cache/restore@v1.9.0
        with:
          key: ${{ steps.cache-keys.outputs.pod_check_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

  build-ios:
    name: "iOS Build"
    needs: [determine-builds]
    uses: LedgerHQ/ledger-live/.github/workflows/test-mobile-build-ios-reusable.yml@develop
    with:
      ref: ${{ inputs.ref || github.sha }}
      macos-specificity-runner-label: ${{ inputs.macos-specificity-runner-label }}
      disable-nx-cache: ${{ inputs.disable-nx-cache || false }}
      build-ios-js: ${{ needs.determine-builds.outputs.ios_js_exists == 'false' }}
      build-ios-native: ${{ needs.determine-builds.outputs.ios_native_exists == 'false' }}
      ios-native-cache-key: ${{ needs.determine-builds.outputs.ios_native_key }}
      ios-js-cache-key: ${{ needs.determine-builds.outputs.ios_js_key }}
    secrets: inherit

  detox-tests-ios:
    name: "iOS Build / iOS Detox (${{ matrix.shard }}, ${{ matrix.total }})"
    needs: [build-ios, determine-builds]
    runs-on: [pierre_da_couto]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.determine-builds.outputs.matrix_ios) }}
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      SEED: ${{ vars.SEED_QAA_B2C }}
      JEST_MAX_WORKERS: 3
    outputs:
      status: ${{ steps.detox.outcome }}
      artifact: ${{ steps.test-artifacts.outputs.artifact-id }}
    steps:
      - run: /usr/sbin/sysctl -n hw.ncpu
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      - name: setup caches
        id: setup-caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          skip-pod-cache: "true"
          skip-pnpm-cache: "true"
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Set shard test files from pre-computed matrix
        run: |
          echo "SHARD_TEST_FILES<<EOF" >> $GITHUB_ENV
          echo "${{ matrix.files }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "Using pre-computed shard ${{ matrix.shard }}/${{ matrix.total }} with $(echo '${{ matrix.files }}' | wc -w) test files"

      - uses: nick-fields/retry@v3
        name: install dependencies
        id: install-dependencies
        with:
          max_attempts: 2
          timeout_minutes: 15
          command: pnpm i --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm --ignore-scripts
          new_command_on_retry: rm -rf ~/.cocoapods/ && pnpm clean && pnpm i --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm

      # Warm simulators before Detox; worker_count matches JEST_MAX_WORKERS (and iOS Simulator … N names in detox.config.js).
      - name: Boot iOS Simulators in Background
        uses: LedgerHQ/ledger-live/tools/actions/composites/boot-ios-simulators-background@develop
        with:
          worker_count: ${{ env.JEST_MAX_WORKERS }}
          artifacts_root: ${{ env.MOBILE_ARTIFACTS_ROOT }}

      - name: Detox Post Install
        run: node apps/ledger-live-mobile/node_modules/detox/scripts/postinstall.js

      - name: Download Native Build
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@develop
        with:
          endpoint: ${{ secrets.S3_DIRECTCONNECT_ENDPOINT }}
          key: ${{ needs.determine-builds.outputs.ios_native_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Download JS Build
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@develop
        with:
          endpoint: ${{ secrets.S3_DIRECTCONNECT_ENDPOINT }}
          key: ${{ needs.determine-builds.outputs.ios_js_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Copy JS build
        run: |
          cp apps/ledger-live-mobile/main.jsbundle ${{ env.IOS_JSBUNDLE_PATH }} 
          cp apps/ledger-live-mobile/main.jsbundle ${{ env.IOS_NATIVE_PATH }}/main.jsbundle

      - name: Test iOS app
        id: detox
        timeout-minutes: 75
        uses: LedgerHQ/ledger-live/tools/actions/composites/nx-step@develop
        with:
          command: pnpm exec nx run live-mobile:e2e:ci -- $SHARD_TEST_FILES --platform=ios --test --outputFile=artifacts/${{ env.E2E_TEST_RESULTS_PREFIX_IOS }}-${{ matrix.shard }}.json
          disable_cache: true

      - name: Upload test artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() || steps.detox.outcome == 'cancelled' }}
        id: "test-artifacts"
        with:
          name: ios-test-artifacts-${{ matrix.shard }}
          path: ${{ env.MOBILE_ARTIFACTS_ROOT }}

      - name: Setup iOS Shard timing artifacts
        if: (!cancelled() || steps.detox.outcome == 'cancelled')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          path: ${{ env.MOBILE_ARTIFACTS_ROOT }}/${{ env.E2E_TEST_RESULTS_PREFIX_IOS }}-${{ matrix.shard }}.json
          name: ${{ env.E2E_TEST_RESULTS_PREFIX_IOS }}-${{ matrix.shard }}

      - name: Record Flake
        if: ${{ steps.detox.outcome == 'success' && hashFiles('apps/ledger-live-mobile/artifacts/ios.**') != '' }}
        run: |
          echo "Flake detected for iOS tests"

  merge-ios-timings:
    name: Merge iOS Timing Files
    needs: [determine-builds, detox-tests-ios]
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && (needs.detox-tests-ios.result == 'success' || needs.detox-tests-ios.result == 'failure')  && inputs.max-shards > 1 }}
    steps:
      - uses: LedgerHQ/ledger-live/tools/actions/composites/merge-e2e-detox-timings@develop
        with:
          artifacts_dir: ${{ env.MOBILE_ARTIFACTS_ROOT }}
          key: ${{ needs.determine-builds.outputs.ios_timing_cache_key }}
          aws_access_key_id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ env.AWS_SESSION_TOKEN }}
          aws_region: ${{ secrets.AWS_CACHE_REGION }}
          cache_bucket: ${{ env.cache-bucket }}
          github_ref: ${{ github.ref }}
          github_run_id: ${{ github.run_id }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          test_results_prefix: ${{ env.E2E_TEST_RESULTS_PREFIX_IOS }}

  test-pod-lockfile:
    name: "Test Pod Lockfile"
    runs-on: [macOS, ARM64]
    needs: [determine-builds]
    if: needs.determine-builds.outputs.ios_native_exists == 'true' && inputs.skip-pod-checks != 'true' && needs.determine-builds.outputs.pod_lockfile_validated != 'true'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false
          fetch-depth: 1

      - name: setup caches
        id: setup-caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          skip-pod-cache: "true"
          skip-pnpm-cache: "true"
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          pnpm i --filter="live-mobile..." --unsafe-perm --ignore-scripts

      - name: Test Pod Lockfile
        run: |
          pnpm mobile postinstall

      - name: Cache pod lockfile validation
        run: |
          echo "pod-lockfile-validated=true" > pod-lockfile-cache.txt

      - name: Write cache
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/upload@develop
        with:
          path: pod-lockfile-cache.txt
          key: ${{ needs.determine-builds.outputs.pod_check_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ll-nx-cache
          region: ${{ secrets.AWS_CACHE_REGION }}

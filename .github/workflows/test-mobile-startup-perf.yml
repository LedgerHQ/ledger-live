name: "[Mobile] - Startup Performance - Manual"
run-name: >
  @Mobile startup perf • ${{ inputs.preset }} • ${{ inputs.platforms }} • ${{ github.ref_name }} • ${{ github.actor }}

# B2CQA-6555 (iOS) and B2CQA-6593 (Android). See e2e/tooling/startup-perf/README.md.

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "What to compare"
        required: true
        type: choice
        options: [prod-vs-release, custom, aa-noise, known-regression]
        default: prod-vs-release
      ref_a:
        description: "Build A, a branch or tag of this repository. Blank: the latest live-mobile@X.Y.Z tag (prod-vs-release) or this branch (aa-noise)"
        required: false
        type: string
      ref_b:
        description: "Build B, a branch or tag of this repository. Blank: the release branch (prod-vs-release)"
        required: false
        type: string
      platforms:
        description: "Platforms"
        required: true
        type: choice
        options: ["Android & iOS", "Android Only", "iOS Only"]
        default: "Android & iOS"
      scenarios:
        description: "Scenarios"
        required: true
        type: choice
        options: ["no-accounts,accounts", "no-accounts", "accounts"]
        default: "no-accounts,accounts"
      pairs:
        description: "A/B pairs per scenario: even, at least 6 (half before and half after the device swap)"
        required: true
        type: string
        default: "20"
      accounts_userdata:
        description: "Userdata files (e2e/mobile/userdata, comma-separated) merged for the accounts scenario; settings come from the first"
        required: true
        type: string
        default: "speculos-x-other-account,swap-history"
      threshold_ms:
        description: "prod-vs-release and custom: B fails when it is slower than A by more than this, on the Debug screen value (from the first JS import when A and B count from different points) or with the native start"
        required: true
        type: string
        default: "100"

permissions:
  contents: read

env:
  APP_ID: com.ledger.live
  # LIVE-36190: fixed by #21001, present in its parent.
  KNOWN_REGRESSION_SHA: 03d6f9155b084a07e285e37617d16d7f4fab8b25
  KNOWN_FIX_SHA: 74af11a25844226efdc5570f47e40f98c51e462c
  MAESTRO_VERSION: 2.10.0
  MAESTRO_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
  RESULTS_DIR: startup-perf-results
  PERF_AVD_CORES: "4"

jobs:
  plan:
    name: "Resolve builds"
    runs-on: ledger-wallet-1cpu-aws-public-cached
    outputs:
      sides: ${{ steps.plan.outputs.sides }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
      ref_a: ${{ steps.plan.outputs.ref_a }}
      ref_b: ${{ steps.plan.outputs.ref_b }}
      label_a: ${{ steps.plan.outputs.label_a }}
      label_b: ${{ steps.plan.outputs.label_b }}
    steps:
      - name: Resolve refs
        id: plan
        env:
          PRESET: ${{ inputs.preset }}
          REF_A: ${{ inputs.ref_a }}
          REF_B: ${{ inputs.ref_b }}
          PAIRS: ${{ inputs.pairs }}
          THRESHOLD: ${{ inputs.threshold_ms }}
          SCENARIOS: ${{ inputs.scenarios }}
          BRANCH_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          if ! [[ "$PAIRS" =~ ^[0-9]+$ ]] || (( PAIRS < 6 || PAIRS % 2 )); then
            echo "::error::pairs must be an even number ≥ 6, got '$PAIRS'"; exit 1
          fi
          [[ "$THRESHOLD" =~ ^[0-9]+$ ]] || { echo "::error::threshold_ms must be a number"; exit 1; }
          # No raw SHA: a fork's commit can be fetched here too and would run with this workflow's secrets.
          resolve() {
            local ref="$1" out sha
            out=$(git ls-remote "$REPO_URL" "refs/heads/$ref" "refs/tags/$ref" "refs/tags/$ref^{}")
            sha=$(awk -v t="refs/tags/$ref^{}" '$2 == t { print $1 }' <<< "$out")
            [[ -n "$sha" ]] || sha=$(awk -v h="refs/heads/$ref" -v t="refs/tags/$ref" '$2 == h || $2 == t { print $1; exit }' <<< "$out")
            [[ -n "$sha" ]] || { echo "::error::'$ref' is not a branch or tag of this repository (to measure a commit, push a branch or tag at it)" >&2; return 1; }
            echo "$sha"
          }
          case "$PRESET" in
            prod-vs-release)
              if [[ -z "$REF_A" ]]; then
                REF_A=$(git ls-remote --tags --refs "$REPO_URL" 'refs/tags/live-mobile@*' |
                  awk '{ sub("refs/tags/", "", $2); print $2 }' |
                  grep -E '^live-mobile@[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1) || true
                [[ -n "$REF_A" ]] || { echo "::error::no live-mobile@X.Y.Z tag found"; exit 1; }
              fi
              if [[ -z "$REF_B" ]]; then
                [[ -n "$(git ls-remote --heads "$REPO_URL" refs/heads/release)" ]] ||
                  { echo "::error::no release branch: no pre-release in progress (set ref_b, e.g. hotfix)"; exit 1; }
                REF_B=release
              fi
              A=$(resolve "$REF_A"); B=$(resolve "$REF_B"); SIDES='["a","b"]'
              LABEL_A="$REF_A"; LABEL_B="$REF_B"
              [[ "$A" != "$B" ]] || echo "::warning::$REF_A and $REF_B are the same commit" ;;
            custom)
              if [[ -z "$REF_A" || -z "$REF_B" ]]; then
                echo "::error::custom needs both ref_a and ref_b"; exit 1
              fi
              A=$(resolve "$REF_A"); B=$(resolve "$REF_B"); SIDES='["a","b"]'
              LABEL_A="$REF_A"; LABEL_B="$REF_B" ;;
            aa-noise)
              if [[ -n "$REF_A" ]]; then A=$(resolve "$REF_A"); else A="$BRANCH_SHA"; fi
              B="$A"; SIDES='["a"]'
              LABEL_A="${REF_A:-$GITHUB_REF_NAME}"; LABEL_B="the same binary" ;;
            known-regression)
              A="$KNOWN_REGRESSION_SHA"; B="$KNOWN_FIX_SHA"; SIDES='["a","b"]'
              LABEL_A="LIVE-36190 present"; LABEL_B="LIVE-36190 fixed" ;;
          esac
          LABEL_A="$LABEL_A (${A:0:10})"
          [[ "$SIDES" == '["a"]' ]] || LABEL_B="$LABEL_B (${B:0:10})"
          {
            echo "sides=$SIDES"
            echo "scenarios=[\"${SCENARIOS//,/\",\"}\"]"
            echo "ref_a=$A"
            echo "ref_b=$B"
            echo "label_a=$LABEL_A"
            echo "label_b=$LABEL_B"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Startup performance: $PRESET"
            echo ""
            echo "- A: \`$LABEL_A\` → \`$A\`"
            echo "- B: \`$LABEL_B\` → \`$B\`"
            echo "- $PAIRS pairs per scenario"
            echo "- Android: one job (runner) per scenario, two emulators with $PERF_AVD_CORES cores each, cellular network like E2E"
          } >> "$GITHUB_STEP_SUMMARY"

  build-android:
    name: "Android build ${{ matrix.side }}"
    needs: [plan]
    if: ${{ inputs.platforms != 'iOS Only' }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        side: ${{ fromJSON(needs.plan.outputs.sides) }}
    runs-on: ledger-wallet-8cpu-aws-public-cached
    timeout-minutes: 120
    env:
      REF: ${{ matrix.side == 'a' && needs.plan.outputs.ref_a || needs.plan.outputs.ref_b }}
      # Pods report the host CPU count; cap Gradle workers to the runner size.
      GRADLE_OPTS: -Dorg.gradle.workers.max=8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REF }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      # This workflow's scripts, which the commit being built may predate.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: .startup-perf
          # Only the scripts: this folder's package.json would clash in Nx with the ref's own copy.
          sparse-checkout: |
            /e2e/tooling/startup-perf/adapt-mise-toml.sh
            /e2e/tooling/startup-perf/prepare-build.sh
            /e2e/tooling/startup-perf/verify-build.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Adapt mise.toml of older commits
        run: bash .startup-perf/e2e/tooling/startup-perf/adapt-mise-toml.sh

      # No remote Nx, pnpm or Gradle cache: they would be written with develop's role for another ref.
      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-nx-cache: "true"

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: setup JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "zulu"
          java-version: "17"

      - name: setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools"

      - name: Install dependencies
        run: |
          pnpm i --frozen-lockfile --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm

      - name: Build mobile dependencies
        run: pnpm build:llm:deps

      - name: Prepare the prod-like build
        run: bash .startup-perf/e2e/tooling/startup-perf/prepare-build.sh

      - name: Build detoxPreRelease APK (x86_64, JS bundled)
        env:
          E2E_ANDROID_ABI: x86_64
          CARD_BAANX_API_URL: ${{ secrets.CARD_BAANX_API_URL }}
          CARD_BAANX_CLIENT_KEY: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
          CARD_BAANX_HOSTED_UI: ${{ secrets.CARD_BAANX_HOSTED_UI }}
          CARD_OAUTH_REDIRECT_URI: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}
        run: pnpm mobile e2e:build -c android.emu.prerelease

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find apps/ledger-live-mobile/android/app/build/outputs/apk/detoxPreRelease -name "*x86_64*.apk" | head -1)
          [[ -n "$APK" ]] || { echo "::error::no x86_64 detoxPreRelease APK found"; exit 1; }
          bash .startup-perf/e2e/tooling/startup-perf/verify-build.sh android "$APK"
          cp "$APK" out/app.apk
          git rev-parse HEAD > out/sha.txt
          ls -la out

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: startup-perf-android-${{ matrix.side }}
          path: out/
          retention-days: 7

  build-ios:
    name: "iOS build ${{ matrix.side }}"
    needs: [plan]
    if: ${{ inputs.platforms != 'Android Only' }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        side: ${{ fromJSON(needs.plan.outputs.sides) }}
    runs-on: ["general-pool", macOS, ARM64]
    timeout-minutes: 150
    env:
      REF: ${{ matrix.side == 'a' && needs.plan.outputs.ref_a || needs.plan.outputs.ref_b }}
      NODE_OPTIONS: "--max-old-space-size=7168"
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REF }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: .startup-perf
          # Only the scripts: this folder's package.json would clash in Nx with the ref's own copy.
          sparse-checkout: |
            /e2e/tooling/startup-perf/adapt-mise-toml.sh
            /e2e/tooling/startup-perf/prepare-build.sh
            /e2e/tooling/startup-perf/verify-build.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Adapt mise.toml of older commits
        run: bash .startup-perf/e2e/tooling/startup-perf/adapt-mise-toml.sh

      # No remote caches, as in the Android build.
      - name: setup caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          skip-pod-cache: "true"
          use-mise: "true"
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-nx-cache: "true"

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        name: install dependencies
        with:
          max_attempts: 2
          timeout_minutes: 20
          command: pnpm i --frozen-lockfile --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm
          new_command_on_retry: rm -rf ~/.cocoapods/ && pnpm clean && pnpm i --frozen-lockfile --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm

      - name: Build mobile dependencies
        run: pnpm build:llm:deps

      - name: Prepare the prod-like build
        run: bash .startup-perf/e2e/tooling/startup-perf/prepare-build.sh

      - name: Build Release simulator app (JS bundled)
        env:
          CARD_BAANX_API_URL: ${{ secrets.CARD_BAANX_API_URL }}
          CARD_BAANX_CLIENT_KEY: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
          CARD_BAANX_HOSTED_UI: ${{ secrets.CARD_BAANX_HOSTED_UI }}
          CARD_OAUTH_REDIRECT_URI: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}
        run: pnpm mobile e2e:build -c ios.sim.prerelease

      - name: Collect app
        run: |
          set -euo pipefail
          mkdir -p out
          APP=apps/ledger-live-mobile/ios/build/Build/Products/Release-iphonesimulator/ledgerlivemobile.app
          bash .startup-perf/e2e/tooling/startup-perf/verify-build.sh ios "$APP"
          ditto -c -k --keepParent "$APP" out/app.zip
          git rev-parse HEAD > out/sha.txt
          ls -la out

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: startup-perf-ios-${{ matrix.side }}
          path: out/
          retention-days: 7

  measure-android:
    name: "Android startup (2 emulators, ${{ matrix.scenario }})"
    needs: [plan, build-android]
    if: ${{ inputs.platforms != 'iOS Only' }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    runs-on: ledger-wallet-8cpu-github-public-cached
    timeout-minutes: 300
    steps:
      - name: Read the preinstalled AVD ahead (background)
        run: |
          [ -f "${HOME}/.android/avd-cache-key" ] || exit 0
          log="${RUNNER_TEMP}/avd-read-ahead.log"
          echo "started $(date -u +%T)" > "$log"
          nohup bash -c '
            start=$(date +%s)
            find "${HOME}/.android/avd" -type f -exec cat {} + > /dev/null
            echo "read $(du -sh "${HOME}/.android/avd" | cut -f1) in $(( $(date +%s) - start ))s, done $(date -u +%T)"
          ' >> "$log" 2>&1 &

      - name: Load AVD configuration
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-avd@develop
        with:
          config_only: "true"

      - name: Setup Android Environment
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-env@develop
        with:
          # adb, build-tools and the emulator are on the image.
          install_sdk: "false"

      - name: Check for a preinstalled AVD
        id: preinstalled-avd
        run: |
          stamp="${HOME}/.android/avd-cache-key"
          if [ "$(cat "$stamp" 2>/dev/null)" = "${AVD_CACHE_KEY}" ]; then
            echo "Preinstalled AVD matches ${AVD_CACHE_KEY}"
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "$stamp" ]; then
            echo "::warning title=Runner image AVD is out of date::Image has $(cat "$stamp"), need ${AVD_CACHE_KEY}; using R2."
            rm -rf "${HOME}/.android/avd" "$stamp" \
              /usr/local/lib/android/sdk/emulator \
              "/usr/local/lib/android/sdk/system-images/android-${AVD_API}/${AVD_TARGET}/${AVD_ARCH}"
          fi
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Download android emulator
        if: steps.preinstalled-avd.outputs.found != 'true'
        timeout-minutes: 10
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@develop
        id: avd
        with:
          key: ${{ env.AVD_CACHE_KEY }}
          accessKey: "${{ secrets.R2_ACCESS_KEY_ID }}"
          secretKey: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          bucket: ledger-live-cache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          region: auto
          destination: /

      # No R2 credentials: this workflow never writes E2E's AVD cache.
      - name: Create the AVD (not on the image nor in R2)
        if: steps.preinstalled-avd.outputs.found != 'true' && steps.avd.outputs.cache-hit != 'true'
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-avd@develop

      - name: Report the AVD in use
        env:
          AVD_SOURCE: ${{ steps.preinstalled-avd.outputs.found == 'true' && 'runner image' || steps.avd.outputs.cache-hit == 'true' && 'R2' || 'created in this job' }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          {
            echo "### Android emulator ($SCENARIO)"
            echo "- AVD from: $AVD_SOURCE"
            echo "- Key: \`${AVD_CACHE_KEY}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # staging.kstr is the keystore that secrets.ANDROID_KEYSTORE_PATH points to.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/scripts/
            /e2e/tooling/startup-perf/
            /e2e/mobile/userdata/
            /apps/ledger-live-mobile/android/app/staging.kstr

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: startup-perf-android-a
          path: builds/a

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ contains(needs.plan.outputs.sides, 'b') }}
        with:
          name: startup-perf-android-b
          path: builds/b

      - name: Sign APKs
        env:
          KS_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p "$RESULTS_DIR/android"
          for dir in builds/a builds/b; do
            [[ -f "$dir/app.apk" ]] || continue
            "$BT/zipalign" -f -p 4 "$dir/app.apk" "$dir/aligned.apk"
            # shellcheck disable=SC2086
            "$BT/apksigner" sign --v4-signing-enabled false --ks "$KS_PATH" --ks-pass $KS_PASS --ks-key-alias staging --key-pass $KS_PASS --out "$dir/signed.apk" "$dir/aligned.apk"
            echo "$dir: $(cat "$dir/sha.txt")" | tee -a "$RESULTS_DIR/android/builds.txt"
          done

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: bash e2e/tooling/startup-perf/install-maestro.sh

      - name: Report the AVD read-ahead
        run: cat "${RUNNER_TEMP}/avd-read-ahead.log" 2>/dev/null || echo "No preinstalled AVD to read ahead."

      - name: Duplicate the AVD for the second emulator
        uses: LedgerHQ/ledger-live/tools/actions/composites/duplicate-avd@develop
        with:
          source_avd_name: ${{ env.AVD_NAME }}
          target_suffixes: "_2"
          avd_api: ${{ env.AVD_API }}

      - name: Boot two emulators
        run: |
          set -euo pipefail
          tools/scripts/cleanup-android-emulators.sh || true
          mkdir -p "$RESULTS_DIR/android"
          # Cold boot: the cached snapshot was taken with 2 cores and cannot be loaded with 4.
          # shellcheck disable=SC2086
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" -port 5554 $AVD_OPTIONS -no-snapshot-load -no-snapshot-save -cores "$PERF_AVD_CORES" > "$RESULTS_DIR/android/emulator-1.log" 2>&1 &
          # shellcheck disable=SC2086
          nohup "$ANDROID_HOME/emulator/emulator" -avd "${AVD_NAME}_2" -port 5556 $AVD_OPTIONS -no-snapshot-load -no-snapshot-save -cores "$PERF_AVD_CORES" > "$RESULTS_DIR/android/emulator-2.log" 2>&1 &
          for serial in emulator-5554 emulator-5556; do
            timeout 900 adb -s "$serial" wait-for-device
            timeout 900 adb -s "$serial" shell 'while [ "$(getprop sys.boot_completed)" != 1 ]; do sleep 2; done'
            # The cached AVD was saved with animations off; a user's phone has them on.
            for key in window_animation_scale transition_animation_scale animator_duration_scale; do
              adb -s "$serial" shell settings put global "$key" 1
            done
            # Screen on and unlocked for the whole run, as Detox ensures for E2E.
            adb -s "$serial" shell input keyevent KEYCODE_WAKEUP
            adb -s "$serial" shell locksettings set-disabled true || true
            adb -s "$serial" shell wm dismiss-keyguard
            adb -s "$serial" shell settings put global stay_on_while_plugged_in 3
            adb -s "$serial" shell settings put system screen_off_timeout 2147483647
            echo "$serial booted, $(adb -s "$serial" shell nproc | tr -d '\r') CPUs"
          done
          # Cellular like the E2E emulators (tools/scripts/boot-android-emulators-ci.sh).
          for serial in emulator-5554 emulator-5556; do
            adb -s "$serial" shell svc wifi disable
            cellular=false
            for _ in $(seq 30); do
              dump=$(adb -s "$serial" shell dumpsys connectivity)
              net=$(sed -n 's/.*Active default network: \([0-9]*\).*/\1/p' <<<"$dump" | head -1)
              if [[ -n "$net" && "$(grep -F "NetworkAgentInfo{network{$net}" <<<"$dump")" == *"Transports: CELLULAR"* ]]; then
                echo "$serial is on cellular"; cellular=true; break
              fi
              sleep 2
            done
            [[ "$cellular" == true ]] || echo "::warning title=Emulator not on cellular::$serial is not on cellular after 60 s"
          done
          deadline=$((SECONDS + 900))
          for serial in emulator-5554 emulator-5556; do
            idle=false
            while (( SECONDS < deadline )); do
              load=$(adb -s "$serial" shell cat /proc/loadavg | cut -d' ' -f1)
              awk -v l="$load" 'BEGIN { exit !(l < 1.0) }' && { idle=true; break; }
              echo "$serial load $load, waiting"
              sleep 15
            done
            [[ "$idle" == true ]] || echo "::warning title=Emulator not idle::$serial load average still ${load:-unknown} after 15 min; measuring anyway"
          done
          adb devices

      - name: Measure
        env:
          SCENARIO: ${{ matrix.scenario }}
          PAIRS: ${{ inputs.pairs }}
          ACCOUNTS_USERDATA: ${{ inputs.accounts_userdata }}
        run: |
          set -euo pipefail
          APP_A=builds/a/signed.apk
          APP_B=builds/b/signed.apk
          [[ -f "$APP_B" ]] || APP_B="$APP_A"
          node e2e/tooling/startup-perf/run.mjs \
            --platform android \
            --devices emulator-5554,emulator-5556 \
            --app-a "$APP_A" --app-b "$APP_B" --app-id "$APP_ID" \
            --scenarios "$SCENARIO" --pairs "$PAIRS" \
            --accounts-userdata "$ACCOUNTS_USERDATA" \
            --out-dir "$RESULTS_DIR/android"

      - name: Analyse
        if: ${{ always() }}
        env:
          PRESET: ${{ inputs.preset }}
          THRESHOLD: ${{ inputs.threshold_ms }}
          LABEL_A: ${{ needs.plan.outputs.label_a }}
          LABEL_B: ${{ needs.plan.outputs.label_b }}
        run: |
          node e2e/tooling/startup-perf/analyze.mjs \
            --samples "$RESULTS_DIR/android/samples.jsonl" \
            --preset "$PRESET" --threshold-ms "$THRESHOLD" \
            --label-a "$LABEL_A" --label-b "$LABEL_B" \
            --summary "$GITHUB_STEP_SUMMARY" --json "$RESULTS_DIR/android/summary.json"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: startup-perf-results-android-${{ matrix.scenario }}
          path: ${{ env.RESULTS_DIR }}/android
          retention-days: 30

      - name: Stop emulators
        if: ${{ always() }}
        run: tools/scripts/cleanup-android-emulators.sh || true

  measure-ios:
    name: "iOS startup (2 simulators)"
    needs: [plan, build-ios]
    if: ${{ inputs.platforms != 'Android Only' }}
    # One iOS measurement at a time on the performance pool, so two never measure side by side;
    # queue: max keeps every waiting run instead of only the latest.
    concurrency:
      group: mobile-startup-perf-ios
      cancel-in-progress: false
      queue: max
    runs-on: ["qaa", macOS, ARM64, "performance-pool"]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            e2e/tooling/startup-perf
            e2e/mobile/userdata

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Maestro needs a JDK.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: startup-perf-ios-a
          path: builds/a

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ contains(needs.plan.outputs.sides, 'b') }}
        with:
          name: startup-perf-ios-b
          path: builds/b

      - name: Unpack apps
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR/ios"
          for dir in builds/a builds/b; do
            [[ -f "$dir/app.zip" ]] || continue
            ditto -x -k "$dir/app.zip" "$dir"
            echo "$dir: $(cat "$dir/sha.txt")" | tee -a "$RESULTS_DIR/ios/builds.txt"
          done

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: bash e2e/tooling/startup-perf/install-maestro.sh

      - name: Create and boot two simulators
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # simctl itself rather than xcrun, so the alarm kills it (macOS has no `timeout`).
          SIMCTL="$(xcrun -f simctl)"
          with_timeout() { perl -e 'alarm shift; exec @ARGV or die "exec failed: $!\n"' "$@"; }
          # A no-op on a fresh VM; on a reused one, a booted simulator would compete for the CPU.
          xcrun simctl shutdown all || true
          RUNTIME=$(xcrun simctl list runtimes iOS -j | jq -r '[.runtimes[] | select(.isAvailable)] | last | .identifier')
          # Newest "iPhone N Pro" of the runtime.
          TYPE=$(xcrun simctl list runtimes iOS -j | jq -r --arg rt "$RUNTIME" '.runtimes[] | select(.identifier==$rt) | [.supportedDeviceTypes[] | select(.name|test("^iPhone [0-9]+ Pro$"))] | max_by(.name|capture("(?<n>[0-9]+)").n|tonumber) | .identifier')
          [[ -n "$TYPE" && "$TYPE" != null ]] || { echo "::error::no iPhone Pro device type for $RUNTIME"; exit 1; }
          echo "Runtime $RUNTIME, device type $TYPE"
          # Each id is saved at once, so "Delete simulators" removes it even when booting fails.
          SIM_1=$(xcrun simctl create "Startup Perf 1" "$TYPE" "$RUNTIME")
          echo "SIM_1=$SIM_1" >> "$GITHUB_ENV"
          SIM_2=$(xcrun simctl create "Startup Perf 2" "$TYPE" "$RUNTIME")
          echo "SIM_2=$SIM_2" >> "$GITHUB_ENV"
          for udid in "$SIM_1" "$SIM_2"; do
            with_timeout 300 "$SIMCTL" boot "$udid"
            with_timeout 300 "$SIMCTL" bootstatus "$udid" -b
          done
          # A fixed margin for first-boot work after bootstatus, unlike Android's condition wait:
          # the host load printed around it is the data such a wait would need.
          /usr/sbin/sysctl -n vm.loadavg || true
          sleep 60
          /usr/sbin/sysctl -n vm.loadavg || true

      - name: Measure
        env:
          SCENARIOS: ${{ inputs.scenarios }}
          PAIRS: ${{ inputs.pairs }}
          ACCOUNTS_USERDATA: ${{ inputs.accounts_userdata }}
        run: |
          set -euo pipefail
          APP_A=builds/a/ledgerlivemobile.app
          APP_B=builds/b/ledgerlivemobile.app
          [[ -d "$APP_B" ]] || APP_B="$APP_A"
          node e2e/tooling/startup-perf/run.mjs \
            --platform ios \
            --devices "$SIM_1,$SIM_2" \
            --app-a "$APP_A" --app-b "$APP_B" --app-id "$APP_ID" \
            --scenarios "$SCENARIOS" --pairs "$PAIRS" \
            --accounts-userdata "$ACCOUNTS_USERDATA" \
            --out-dir "$RESULTS_DIR/ios"

      - name: Analyse
        if: ${{ always() }}
        env:
          PRESET: ${{ inputs.preset }}
          THRESHOLD: ${{ inputs.threshold_ms }}
          LABEL_A: ${{ needs.plan.outputs.label_a }}
          LABEL_B: ${{ needs.plan.outputs.label_b }}
        run: |
          node e2e/tooling/startup-perf/analyze.mjs \
            --samples "$RESULTS_DIR/ios/samples.jsonl" \
            --preset "$PRESET" --threshold-ms "$THRESHOLD" \
            --label-a "$LABEL_A" --label-b "$LABEL_B" \
            --summary "$GITHUB_STEP_SUMMARY" --json "$RESULTS_DIR/ios/summary.json"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: startup-perf-results-ios
          path: ${{ env.RESULTS_DIR }}/ios
          retention-days: 30

      - name: Delete simulators
        if: ${{ always() }}
        run: |
          for udid in "${SIM_1:-}" "${SIM_2:-}"; do
            [[ -n "$udid" ]] || continue
            xcrun simctl shutdown "$udid" || true
            xcrun simctl delete "$udid" || true
          done

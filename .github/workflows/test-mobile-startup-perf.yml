name: "[Mobile] - Startup Performance - Scheduled/Manual"
run-name: >
  @Mobile startup perf • ${{ github.event_name == 'schedule' && 'Nightly' || format('{0} • {1}', inputs.preset, inputs.platforms) }} • ${{ github.ref_name }} • ${{ github.actor }}

# B2CQA-6555 (iOS) and B2CQA-6593 (Android). See e2e/tooling/startup-perf/README.md.

on:
  schedule:
    # Weekdays, after the mobile E2E nightly: develop against production (ci/resolve-refs.mts).
    - cron: "17 3 * * 1-5"
  workflow_dispatch:
    inputs:
      preset:
        description: "What to compare"
        required: true
        type: choice
        options: [prod-vs-release, prod-vs-develop, custom, aa-noise, known-regression]
        default: prod-vs-release
      ref_a:
        description: "Build A, a branch or tag of this repository (live-mobile@4.26.0 or later). Blank: the latest live-mobile@X.Y.Z tag (prod-vs-release, prod-vs-develop) or this branch (aa-noise, known-regression)"
        required: false
        type: string
      ref_b:
        description: "Build B, a branch or tag of this repository. Blank: the release branch (prod-vs-release) or develop (prod-vs-develop)"
        required: false
        type: string
      platforms:
        description: "Platforms"
        required: true
        type: choice
        options: ["Android & iOS", "Android Only", "iOS Only"]
        default: "Android & iOS"
      scenarios:
        description: "Scenarios"
        required: true
        type: choice
        options: ["no-accounts,accounts", "no-accounts", "accounts"]
        default: "no-accounts,accounts"
      pairs:
        description: "A/B pairs per scenario: even, at least 6 (half before and half after the device swap)"
        required: true
        type: string
        default: "20"
      threshold_ms:
        description: "B fails (prod-vs-release, prod-vs-develop, custom) or counts as detected (known-regression) when it is slower than A by more than this, on the Debug screen value (from the first JS import when A and B count from different points) or with the native start"
        required: true
        type: string
        default: "100"
      read:
        description: "Where each launch's startup is read: the device log (log), also the Debug screen to check they match (both, slower), or the Debug screen only (screen)"
        required: true
        type: choice
        options: [log, both, screen]
        default: log
      slack_notif:
        description: "Post the result to Slack #live-repo-health"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP_ID: com.ledger.live
  MAESTRO_VERSION: 2.10.0
  MAESTRO_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
  RESULTS_DIR: startup-perf-results
  PERF_AVD_CORES: "4"

jobs:
  plan:
    name: "Resolve builds"
    if: ${{ github.event_name != 'schedule' || github.repository == 'LedgerHQ/ledger-live' }}
    runs-on: ledger-wallet-1cpu-aws-public-cached
    permissions:
      id-token: write
      contents: read
    outputs:
      sides: ${{ steps.plan.outputs.sides }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
      ref_a: ${{ steps.plan.outputs.ref_a }}
      ref_b: ${{ steps.plan.outputs.ref_b }}
      label_a: ${{ steps.plan.outputs.label_a }}
      label_b: ${{ steps.plan.outputs.label_b }}
      preset: ${{ steps.plan.outputs.preset }}
      platforms: ${{ steps.plan.outputs.platforms }}
      pairs: ${{ steps.plan.outputs.pairs }}
      threshold_ms: ${{ steps.plan.outputs.threshold_ms }}
      read: ${{ steps.plan.outputs.read }}
      snapshot_release: ${{ steps.plan.outputs.snapshot_release }}
      snapshot_ref: ${{ steps.plan.outputs.snapshot_ref }}
      snapshot_key: ${{ steps.snapshot-key.outputs.key }}
      sides_android: ${{ steps.snapshot.outputs.sides_android }}
      sides_ios: ${{ steps.snapshot.outputs.sides_ios }}
    steps:
      # This workflow's scripts, and what the accounts snapshot's cache key hashes.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /e2e/tooling/startup-perf/ci/
            /e2e/tooling/startup-perf/src/snapshot/
            /e2e/tooling/startup-perf/flows/add-accounts.yaml
            /libs/live-e2e-shared/src/cli/speculosSession.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Resolve refs
        id: plan
        env:
          PRESET: ${{ inputs.preset }}
          REF_A: ${{ inputs.ref_a }}
          REF_B: ${{ inputs.ref_b }}
          PLATFORMS: ${{ inputs.platforms }}
          PAIRS: ${{ inputs.pairs }}
          THRESHOLD: ${{ inputs.threshold_ms }}
          SCENARIOS: ${{ inputs.scenarios }}
          READ: ${{ inputs.read }}
          BRANCH_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: node e2e/tooling/startup-perf/ci/resolve-refs.mts

      # One snapshot per release and per version of the code that makes it.
      - name: Name the accounts snapshot
        id: snapshot-key
        if: ${{ steps.plan.outputs.snapshot_release != '' }}
        env:
          RELEASE: ${{ steps.plan.outputs.snapshot_release }}
          CODE_HASH: ${{ hashFiles('e2e/tooling/startup-perf/src/snapshot/**', '!e2e/tooling/startup-perf/src/snapshot/**/*.test.ts', 'e2e/tooling/startup-perf/flows/add-accounts.yaml', 'libs/live-e2e-shared/src/cli/speculosSession.ts') }}
        run: echo "key=develop/mobile-startup-perf-accounts-${RELEASE}-${CODE_HASH:0:16}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: ${{ steps.plan.outputs.snapshot_release != '' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/develop' && secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP || secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          aws-region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Restore the Android accounts snapshot
        id: restore-android
        if: ${{ steps.plan.outputs.snapshot_release != '' && steps.plan.outputs.platforms != 'iOS Only' }}
        continue-on-error: true
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          path: snapshot/android
          key: ${{ steps.snapshot-key.outputs.key }}-android
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ll-gha-s3-cache
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false

      - name: Restore the iOS accounts snapshot
        id: restore-ios
        if: ${{ steps.plan.outputs.snapshot_release != '' && steps.plan.outputs.platforms != 'Android Only' }}
        continue-on-error: true
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          path: snapshot/ios
          key: ${{ steps.snapshot-key.outputs.key }}-ios
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ll-gha-s3-cache
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false

      # A platform without the snapshot also builds the release's E2E build, as the side "snapshot".
      - name: Plan the accounts snapshot
        id: snapshot
        env:
          SIDES: ${{ steps.plan.outputs.sides }}
          RELEASE: ${{ steps.plan.outputs.snapshot_release }}
          PLATFORMS: ${{ steps.plan.outputs.platforms }}
          ANDROID_HIT: ${{ steps.restore-android.outputs.cache-hit }}
          IOS_HIT: ${{ steps.restore-ios.outputs.cache-hit }}
        run: |
          set -euo pipefail
          sides() {
            if [[ -n "$RELEASE" && "$1" != true ]]; then
              node -p 'JSON.stringify([...JSON.parse(process.env.SIDES), "snapshot"])'
            else
              echo "$SIDES"
            fi
          }
          origin() { [[ "$1" == true ]] && echo "from the cache" || echo "made in this run"; }
          {
            echo "sides_android=$(sides "$ANDROID_HIT")"
            echo "sides_ios=$(sides "$IOS_HIT")"
          } >> "$GITHUB_OUTPUT"
          [[ -n "$RELEASE" ]] || exit 0
          {
            [[ "$PLATFORMS" == "iOS Only" ]] || echo "- Android accounts snapshot of $RELEASE: $(origin "$ANDROID_HIT")"
            [[ "$PLATFORMS" == "Android Only" ]] || echo "- iOS accounts snapshot of $RELEASE: $(origin "$IOS_HIT")"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ steps.restore-android.outputs.cache-hit == 'true' }}
        with:
          name: startup-perf-snapshot-android
          path: snapshot/android/
          retention-days: 7

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ steps.restore-ios.outputs.cache-hit == 'true' }}
        with:
          name: startup-perf-snapshot-ios
          path: snapshot/ios/
          retention-days: 7

  build-android:
    name: "Android build ${{ matrix.side }}"
    needs: [plan]
    if: ${{ needs.plan.outputs.platforms != 'iOS Only' }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        side: ${{ fromJSON(needs.plan.outputs.sides_android) }}
    runs-on: ledger-wallet-8cpu-aws-public-cached
    timeout-minutes: 120
    env:
      REF: ${{ matrix.side == 'a' && needs.plan.outputs.ref_a || matrix.side == 'b' && needs.plan.outputs.ref_b || needs.plan.outputs.snapshot_ref }}
      # Pods report the host CPU count; cap Gradle workers to the runner size.
      GRADLE_OPTS: -Dorg.gradle.workers.max=8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REF }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      # This workflow's scripts, which the commit being built may predate.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: .startup-perf
          # Only ci/: the package.json beside it would clash in Nx with the ref's own copy.
          sparse-checkout: /e2e/tooling/startup-perf/ci/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # No remote Nx, pnpm or Gradle cache: they would be written with develop's role for another ref.
      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-nx-cache: "true"

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: JFrog Maven auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-maven-auth@develop
        with:
          url: ${{ vars.ARTIFACTORY_MAVEN_URL }}

      - name: setup JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "zulu"
          java-version: "17"

      - name: setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools"

      - name: Install dependencies
        run: |
          pnpm i --frozen-lockfile --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm

      - name: Build mobile dependencies
        # Nx adds its run report to the job summary, with no setting to turn it off.
        run: GITHUB_STEP_SUMMARY=/dev/null pnpm build:llm:deps

      - name: Prepare the prod-like build
        if: ${{ matrix.side != 'snapshot' }}
        env:
          STARTUP_PERF_REGRESSION: ${{ needs.plan.outputs.preset == 'known-regression' && matrix.side == 'b' && 'LIVE-36190' || '' }}
        run: node .startup-perf/e2e/tooling/startup-perf/ci/prepare-build.mts

      - name: Build detoxPreRelease APK (x86_64, JS bundled)
        env:
          E2E_ANDROID_ABI: x86_64
          CARD_BAANX_API_URL: ${{ secrets.CARD_BAANX_API_URL }}
          CARD_BAANX_CLIENT_KEY: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
          CARD_BAANX_HOSTED_UI: ${{ secrets.CARD_BAANX_HOSTED_UI }}
          CARD_OAUTH_REDIRECT_URI: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}
        run: pnpm mobile e2e:build -c android.emu.prerelease

      - name: Collect APK
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find apps/ledger-live-mobile/android/app/build/outputs/apk/detoxPreRelease -name "*x86_64*.apk" | head -1)
          [[ -n "$APK" ]] || { echo "::error::no x86_64 detoxPreRelease APK found"; exit 1; }
          [[ "$SIDE" == snapshot ]] || node .startup-perf/e2e/tooling/startup-perf/ci/verify-build.mts android "$APK"
          cp "$APK" out/app.apk
          git rev-parse HEAD > out/sha.txt
          ls -la out

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: startup-perf-android-${{ matrix.side }}
          path: out/
          retention-days: 7

  build-ios:
    name: "iOS build ${{ matrix.side }}"
    needs: [plan]
    if: ${{ needs.plan.outputs.platforms != 'Android Only' }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        side: ${{ fromJSON(needs.plan.outputs.sides_ios) }}
    runs-on: ["general-pool", macOS, ARM64]
    timeout-minutes: 150
    env:
      REF: ${{ matrix.side == 'a' && needs.plan.outputs.ref_a || matrix.side == 'b' && needs.plan.outputs.ref_b || needs.plan.outputs.snapshot_ref }}
      NODE_OPTIONS: "--max-old-space-size=7168"
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REF }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: .startup-perf
          # Only ci/: the package.json beside it would clash in Nx with the ref's own copy.
          sparse-checkout: /e2e/tooling/startup-perf/ci/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # No remote caches, as in the Android build.
      - name: setup caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          skip-pod-cache: "true"
          use-mise: "true"
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-nx-cache: "true"

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        name: install dependencies
        with:
          max_attempts: 2
          timeout_minutes: 20
          command: pnpm i --frozen-lockfile --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm
          new_command_on_retry: rm -rf ~/.cocoapods/ && pnpm clean && pnpm i --frozen-lockfile --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm

      - name: Build mobile dependencies
        # Nx adds its run report to the job summary, with no setting to turn it off.
        run: GITHUB_STEP_SUMMARY=/dev/null pnpm build:llm:deps

      - name: Prepare the prod-like build
        if: ${{ matrix.side != 'snapshot' }}
        env:
          STARTUP_PERF_REGRESSION: ${{ needs.plan.outputs.preset == 'known-regression' && matrix.side == 'b' && 'LIVE-36190' || '' }}
        run: node .startup-perf/e2e/tooling/startup-perf/ci/prepare-build.mts

      - name: Build Release simulator app (JS bundled)
        env:
          CARD_BAANX_API_URL: ${{ secrets.CARD_BAANX_API_URL }}
          CARD_BAANX_CLIENT_KEY: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
          CARD_BAANX_HOSTED_UI: ${{ secrets.CARD_BAANX_HOSTED_UI }}
          CARD_OAUTH_REDIRECT_URI: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}
        run: pnpm mobile e2e:build -c ios.sim.prerelease

      - name: Collect app
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -euo pipefail
          mkdir -p out
          APP=apps/ledger-live-mobile/ios/build/Build/Products/Release-iphonesimulator/ledgerlivemobile.app
          [[ "$SIDE" == snapshot ]] || node .startup-perf/e2e/tooling/startup-perf/ci/verify-build.mts ios "$APP"
          ditto -c -k --keepParent "$APP" out/app.zip
          git rev-parse HEAD > out/sha.txt
          ls -la out

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: startup-perf-ios-${{ matrix.side }}
          path: out/
          retention-days: 7

  snapshot-android:
    name: "Android accounts snapshot"
    needs: [plan, build-android]
    if: ${{ contains(fromJSON(needs.plan.outputs.sides_android), 'snapshot') }}
    permissions:
      id-token: write
      contents: read
    runs-on: ledger-wallet-8cpu-github-public-cached
    timeout-minutes: 120
    env:
      SNAPSHOT_DIR: snapshot/android
      SNAPSHOT_DEBUG_DIR: startup-perf-snapshot-debug/android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Load AVD configuration
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-avd@develop
        with:
          config_only: "true"

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Setup Android Environment
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-env@develop
        with:
          install_sdk: "false"

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        run: pnpm i --frozen-lockfile --filter="@ledgerhq/live-e2e-shared..." --filter="@ledgerhq/mobile-startup-perf" --unsafe-perm --ignore-scripts

      # Its typecheck builds the libraries `e2e-cli speculos` runs from.
      - name: Build the e2e shared lib's dependencies
        run: GITHUB_STEP_SUMMARY=/dev/null pnpm exec nx run @ledgerhq/live-e2e-shared:typecheck

      - name: Check for a preinstalled AVD
        id: preinstalled-avd
        run: |
          stamp="${HOME}/.android/avd-cache-key"
          if [ "$(cat "$stamp" 2>/dev/null)" = "${AVD_CACHE_KEY}" ]; then
            echo "Preinstalled AVD matches ${AVD_CACHE_KEY}"
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "$stamp" ]; then
            echo "::warning title=Runner image AVD is out of date::Image has $(cat "$stamp"), need ${AVD_CACHE_KEY}; using R2."
            rm -rf "${HOME}/.android/avd" "$stamp" \
              /usr/local/lib/android/sdk/emulator \
              "/usr/local/lib/android/sdk/system-images/android-${AVD_API}/${AVD_TARGET}/${AVD_ARCH}"
          fi
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Download android emulator
        if: steps.preinstalled-avd.outputs.found != 'true'
        timeout-minutes: 10
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@develop
        id: avd
        with:
          key: ${{ env.AVD_CACHE_KEY }}
          accessKey: "${{ secrets.R2_ACCESS_KEY_ID }}"
          secretKey: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          bucket: ledger-live-cache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          region: auto
          destination: /

      - name: Create the AVD (not on the image nor in R2)
        if: steps.preinstalled-avd.outputs.found != 'true' && steps.avd.outputs.cache-hit != 'true'
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-avd@develop

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: startup-perf-android-snapshot
          path: builds/snapshot

      - name: Sign the APK
        env:
          KS_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -f -p 4 builds/snapshot/app.apk builds/snapshot/aligned.apk
          # shellcheck disable=SC2086
          "$BT/apksigner" sign --v4-signing-enabled false --ks "$KS_PATH" --ks-pass $KS_PASS --ks-key-alias staging --key-pass $KS_PASS --out builds/snapshot/signed.apk builds/snapshot/aligned.apk

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: bash e2e/tooling/startup-perf/devices/install-maestro.sh

      - name: Boot the emulator
        run: bash e2e/tooling/startup-perf/devices/boot-emulators.sh "$SNAPSHOT_DEBUG_DIR" 1

      - name: Add the accounts through the UI
        env:
          SEED: ${{ secrets.SEED_QAA_B2C }}
          SPECULINHO_URL: ${{ secrets.SPECULINHO_URL }}
          REMOTE_SPECULOS: "true"
          SPECULOS_DEVICE: nanoX
          RELEASE: ${{ needs.plan.outputs.snapshot_release }}
        run: |
          node e2e/tooling/startup-perf/src/snapshot/run.ts \
            --platform android --device emulator-5554 \
            --app builds/snapshot/signed.apk --app-id "$APP_ID" --release "$RELEASE" \
            --out-dir "$SNAPSHOT_DIR" --debug-dir "$SNAPSHOT_DEBUG_DIR"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: startup-perf-snapshot-android
          path: ${{ env.SNAPSHOT_DIR }}/
          retention-days: 7

      # Credentials of their own: setup-caches' may have expired by now.
      - name: Configure AWS credentials
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          aws-region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Save the accounts snapshot
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: tespkg/actions-cache/save@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          path: ${{ env.SNAPSHOT_DIR }}
          key: ${{ needs.plan.outputs.snapshot_key }}-android
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ll-gha-s3-cache
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: startup-perf-snapshot-debug-android
          path: ${{ env.SNAPSHOT_DEBUG_DIR }}
          retention-days: 14
          include-hidden-files: true

  snapshot-ios:
    name: "iOS accounts snapshot"
    needs: [plan, build-ios]
    if: ${{ contains(fromJSON(needs.plan.outputs.sides_ios), 'snapshot') }}
    permissions:
      id-token: write
      contents: read
    # The performance pool's queue, so it never runs beside an iOS measurement.
    concurrency:
      group: mobile-startup-perf-ios
      cancel-in-progress: false
      queue: max
    runs-on: ["qaa", macOS, ARM64, "performance-pool"]
    timeout-minutes: 120
    env:
      SNAPSHOT_DIR: snapshot/ios
      SNAPSHOT_DEBUG_DIR: startup-perf-snapshot-debug/ios
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          skip-pod-cache: "true"
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        run: pnpm i --frozen-lockfile --filter="@ledgerhq/live-e2e-shared..." --filter="@ledgerhq/mobile-startup-perf" --unsafe-perm --ignore-scripts

      # Its typecheck builds the libraries `e2e-cli speculos` runs from.
      - name: Build the e2e shared lib's dependencies
        run: GITHUB_STEP_SUMMARY=/dev/null pnpm exec nx run @ledgerhq/live-e2e-shared:typecheck

      # Maestro needs a JDK.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: startup-perf-ios-snapshot
          path: builds/snapshot

      - name: Unpack the app
        run: ditto -x -k builds/snapshot/app.zip builds/snapshot

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: bash e2e/tooling/startup-perf/devices/install-maestro.sh

      - name: Create and boot a simulator
        timeout-minutes: 20
        run: bash e2e/tooling/startup-perf/devices/boot-simulators.sh 1

      - name: Add the accounts through the UI
        env:
          SEED: ${{ secrets.SEED_QAA_B2C }}
          SPECULINHO_URL: ${{ secrets.SPECULINHO_URL }}
          REMOTE_SPECULOS: "true"
          SPECULOS_DEVICE: nanoX
          RELEASE: ${{ needs.plan.outputs.snapshot_release }}
        run: |
          node e2e/tooling/startup-perf/src/snapshot/run.ts \
            --platform ios --device "$SIM_1" \
            --app builds/snapshot/ledgerlivemobile.app --app-id "$APP_ID" --release "$RELEASE" \
            --out-dir "$SNAPSHOT_DIR" --debug-dir "$SNAPSHOT_DEBUG_DIR"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: startup-perf-snapshot-ios
          path: ${{ env.SNAPSHOT_DIR }}/
          retention-days: 7

      # Credentials of their own: setup-caches' may have expired by now.
      - name: Configure AWS credentials
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          aws-region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Save the accounts snapshot
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: tespkg/actions-cache/save@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          path: ${{ env.SNAPSHOT_DIR }}
          key: ${{ needs.plan.outputs.snapshot_key }}-ios
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ll-gha-s3-cache
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: startup-perf-snapshot-debug-ios
          path: ${{ env.SNAPSHOT_DEBUG_DIR }}
          retention-days: 14
          include-hidden-files: true

  measure-android:
    name: "Android startup (2 emulators, ${{ matrix.scenario }})"
    needs: [plan, build-android, snapshot-android]
    if: ${{ !cancelled() && needs.plan.outputs.platforms != 'iOS Only' && needs.build-android.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.snapshot-android.result) }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    runs-on: ledger-wallet-8cpu-github-public-cached
    timeout-minutes: 300
    steps:
      - name: Read the preinstalled AVD ahead (background)
        run: |
          [ -f "${HOME}/.android/avd-cache-key" ] || exit 0
          log="${RUNNER_TEMP}/avd-read-ahead.log"
          echo "started $(date -u +%T)" > "$log"
          nohup bash -c '
            start=$(date +%s)
            find "${HOME}/.android/avd" -type f -exec cat {} + > /dev/null
            echo "read $(du -sh "${HOME}/.android/avd" | cut -f1) in $(( $(date +%s) - start ))s, done $(date -u +%T)"
          ' >> "$log" 2>&1 &

      - name: Load AVD configuration
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-avd@develop
        with:
          config_only: "true"

      - name: Setup Android Environment
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-env@develop
        with:
          # adb, build-tools and the emulator are on the image.
          install_sdk: "false"

      - name: Check for a preinstalled AVD
        id: preinstalled-avd
        run: |
          stamp="${HOME}/.android/avd-cache-key"
          if [ "$(cat "$stamp" 2>/dev/null)" = "${AVD_CACHE_KEY}" ]; then
            echo "Preinstalled AVD matches ${AVD_CACHE_KEY}"
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "$stamp" ]; then
            echo "::warning title=Runner image AVD is out of date::Image has $(cat "$stamp"), need ${AVD_CACHE_KEY}; using R2."
            rm -rf "${HOME}/.android/avd" "$stamp" \
              /usr/local/lib/android/sdk/emulator \
              "/usr/local/lib/android/sdk/system-images/android-${AVD_API}/${AVD_TARGET}/${AVD_ARCH}"
          fi
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Download android emulator
        if: steps.preinstalled-avd.outputs.found != 'true'
        timeout-minutes: 10
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@develop
        id: avd
        with:
          key: ${{ env.AVD_CACHE_KEY }}
          accessKey: "${{ secrets.R2_ACCESS_KEY_ID }}"
          secretKey: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          bucket: ledger-live-cache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          region: auto
          destination: /

      # No R2 credentials: this workflow never writes E2E's AVD cache.
      - name: Create the AVD (not on the image nor in R2)
        if: steps.preinstalled-avd.outputs.found != 'true' && steps.avd.outputs.cache-hit != 'true'
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-avd@develop

      - name: Report the AVD in use
        env:
          AVD_SOURCE: ${{ steps.preinstalled-avd.outputs.found == 'true' && 'runner image' || steps.avd.outputs.cache-hit == 'true' && 'R2' || 'created in this job' }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          {
            echo "### Android emulator ($SCENARIO)"
            echo "- AVD from: $AVD_SOURCE"
            echo "- Key: \`${AVD_CACHE_KEY}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # staging.kstr is the keystore that secrets.ANDROID_KEYSTORE_PATH points to.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/scripts/cleanup-android-emulators.sh
            /e2e/tooling/startup-perf/
            /e2e/mobile/userdata/
            /apps/ledger-live-mobile/android/app/staging.kstr

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: startup-perf-android-a
          path: builds/a

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ contains(needs.plan.outputs.sides, 'b') }}
        with:
          name: startup-perf-android-b
          path: builds/b

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ matrix.scenario == 'accounts' }}
        with:
          name: startup-perf-snapshot-android
          path: snapshot/android

      - name: Sign APKs
        env:
          KS_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p "$RESULTS_DIR/android"
          for dir in builds/a builds/b; do
            [[ -f "$dir/app.apk" ]] || continue
            "$BT/zipalign" -f -p 4 "$dir/app.apk" "$dir/aligned.apk"
            # shellcheck disable=SC2086
            "$BT/apksigner" sign --v4-signing-enabled false --ks "$KS_PATH" --ks-pass $KS_PASS --ks-key-alias staging --key-pass $KS_PASS --out "$dir/signed.apk" "$dir/aligned.apk"
            echo "$dir: $(cat "$dir/sha.txt")" | tee -a "$RESULTS_DIR/android/builds.txt"
          done

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: bash e2e/tooling/startup-perf/devices/install-maestro.sh

      - name: Report the AVD read-ahead
        run: cat "${RUNNER_TEMP}/avd-read-ahead.log" 2>/dev/null || echo "No preinstalled AVD to read ahead."

      - name: Duplicate the AVD for the second emulator
        uses: LedgerHQ/ledger-live/tools/actions/composites/duplicate-avd@develop
        with:
          source_avd_name: ${{ env.AVD_NAME }}
          target_suffixes: "_2"
          avd_api: ${{ env.AVD_API }}

      - name: Boot two emulators
        run: bash e2e/tooling/startup-perf/devices/boot-emulators.sh "$RESULTS_DIR/android"

      - name: Measure
        id: measure
        env:
          SCENARIO: ${{ matrix.scenario }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
          READ: ${{ needs.plan.outputs.read }}
        run: |
          set -euo pipefail
          APP_A=builds/a/signed.apk
          APP_B=builds/b/signed.apk
          [[ -f "$APP_B" ]] || APP_B="$APP_A"
          node e2e/tooling/startup-perf/src/measure/run.ts \
            --platform android \
            --devices emulator-5554,emulator-5556 \
            --app-a "$APP_A" --app-b "$APP_B" --app-id "$APP_ID" \
            --scenarios "$SCENARIO" --pairs "$PAIRS" --warmups 6 \
            --read "$READ" \
            --accounts-snapshot snapshot/android \
            --out-dir "$RESULTS_DIR/android"

      - name: Analyse
        if: ${{ always() }}
        env:
          PRESET: ${{ needs.plan.outputs.preset }}
          THRESHOLD: ${{ needs.plan.outputs.threshold_ms }}
          LABEL_A: ${{ needs.plan.outputs.label_a }}
          LABEL_B: ${{ needs.plan.outputs.label_b }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
          SCENARIOS: ${{ matrix.scenario }}
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
        run: |
          # For the Slack job: the scenarios this job measured, in order, and whether it finished.
          mkdir -p "$RESULTS_DIR/android"
          echo "android $SCENARIOS $MEASURE_OUTCOME" > "$RESULTS_DIR/android/measurement.txt"
          node e2e/tooling/startup-perf/src/analysis/analyze.ts \
            --samples "$RESULTS_DIR/android/samples.jsonl" \
            --preset "$PRESET" --threshold-ms "$THRESHOLD" \
            --label-a "$LABEL_A" --label-b "$LABEL_B" --pairs "$PAIRS" \
            --json "$RESULTS_DIR/android/summary.json" \
            --run-json "$RESULTS_DIR/android/run.json"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: startup-perf-results-android-${{ matrix.scenario }}
          path: ${{ env.RESULTS_DIR }}/android
          retention-days: 30

  measure-ios:
    name: "iOS startup (2 simulators)"
    needs: [plan, build-ios, snapshot-ios]
    if: ${{ !cancelled() && needs.plan.outputs.platforms != 'Android Only' && needs.build-ios.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.snapshot-ios.result) }}
    # One iOS measurement at a time on the performance pool, so two never measure side by side;
    # queue: max keeps every waiting run instead of only the latest.
    concurrency:
      group: mobile-startup-perf-ios
      cancel-in-progress: false
      queue: max
    runs-on: ["qaa", macOS, ARM64, "performance-pool"]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            e2e/tooling/startup-perf
            e2e/mobile/userdata

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Maestro needs a JDK.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: startup-perf-ios-a
          path: builds/a

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ contains(needs.plan.outputs.sides, 'b') }}
        with:
          name: startup-perf-ios-b
          path: builds/b

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ contains(fromJSON(needs.plan.outputs.scenarios), 'accounts') }}
        with:
          name: startup-perf-snapshot-ios
          path: snapshot/ios

      - name: Unpack apps
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR/ios"
          for dir in builds/a builds/b; do
            [[ -f "$dir/app.zip" ]] || continue
            ditto -x -k "$dir/app.zip" "$dir"
            echo "$dir: $(cat "$dir/sha.txt")" | tee -a "$RESULTS_DIR/ios/builds.txt"
          done

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: bash e2e/tooling/startup-perf/devices/install-maestro.sh

      - name: Create and boot two simulators
        # Two boots and bootstatus waits of up to 5 min each, then up to 10 min of idle wait.
        timeout-minutes: 35
        run: bash e2e/tooling/startup-perf/devices/boot-simulators.sh

      - name: Measure
        id: measure
        env:
          SCENARIOS: ${{ join(fromJSON(needs.plan.outputs.scenarios), ',') }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
          READ: ${{ needs.plan.outputs.read }}
        run: |
          set -euo pipefail
          APP_A=builds/a/ledgerlivemobile.app
          APP_B=builds/b/ledgerlivemobile.app
          [[ -d "$APP_B" ]] || APP_B="$APP_A"
          node e2e/tooling/startup-perf/src/measure/run.ts \
            --platform ios \
            --devices "$SIM_1,$SIM_2" \
            --app-a "$APP_A" --app-b "$APP_B" --app-id "$APP_ID" \
            --scenarios "$SCENARIOS" --pairs "$PAIRS" \
            --read "$READ" \
            --accounts-snapshot snapshot/ios \
            --out-dir "$RESULTS_DIR/ios"

      - name: Analyse
        if: ${{ always() }}
        env:
          PRESET: ${{ needs.plan.outputs.preset }}
          THRESHOLD: ${{ needs.plan.outputs.threshold_ms }}
          LABEL_A: ${{ needs.plan.outputs.label_a }}
          LABEL_B: ${{ needs.plan.outputs.label_b }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
          SCENARIOS: ${{ join(fromJSON(needs.plan.outputs.scenarios), ',') }}
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
        run: |
          # For the Slack job: the scenarios this job measured, in order, and whether it finished.
          mkdir -p "$RESULTS_DIR/ios"
          echo "ios $SCENARIOS $MEASURE_OUTCOME" > "$RESULTS_DIR/ios/measurement.txt"
          node e2e/tooling/startup-perf/src/analysis/analyze.ts \
            --samples "$RESULTS_DIR/ios/samples.jsonl" \
            --preset "$PRESET" --threshold-ms "$THRESHOLD" \
            --label-a "$LABEL_A" --label-b "$LABEL_B" --pairs "$PAIRS" \
            --json "$RESULTS_DIR/ios/summary.json" \
            --run-json "$RESULTS_DIR/ios/run.json"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: startup-perf-results-ios
          path: ${{ env.RESULTS_DIR }}/ios
          retention-days: 30

  report-on-slack:
    name: "Slack report"
    needs: [plan, build-android, build-ios, snapshot-android, snapshot-ios, measure-android, measure-ios]
    # As for the mobile E2E runs: every run posts to their results channel, passed or failed, and
    # the nightly or a dispatch with slack_notif to #live-repo-health too. A run cancelled by hand
    # posts nothing; a job that times out ends cancelled but still gets posted.
    if: ${{ !cancelled() && needs.plan.result != 'skipped' }}
    runs-on: ledger-wallet-1cpu-aws-public-cached
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: /e2e/tooling/startup-perf/ci/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # None when no measure job reached its analysis: the message then says why.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: startup-perf-results-*
          path: ${{ env.RESULTS_DIR }}

      - name: Write the message
        id: message
        env:
          SLACK_CHANNEL: CTMQ0S5SB
          SLACK_SECONDARY_CHANNEL: ${{ (github.event_name == 'schedule' || inputs.slack_notif) && 'C05FKJ7DFAP' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PRESET: ${{ needs.plan.outputs.preset }}
          THRESHOLD: ${{ needs.plan.outputs.threshold_ms }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
          LABEL_A: ${{ needs.plan.outputs.label_a }}
          LABEL_B: ${{ needs.plan.outputs.label_b }}
          SCENARIOS: ${{ needs.plan.outputs.scenarios }}
          PLAN: ${{ needs.plan.result }}
          ANDROID_BUILD: ${{ needs.build-android.result }}
          ANDROID_SNAPSHOT: ${{ needs.snapshot-android.result }}
          ANDROID_MEASURE: ${{ needs.measure-android.result }}
          IOS_BUILD: ${{ needs.build-ios.result }}
          IOS_SNAPSHOT: ${{ needs.snapshot-ios.result }}
          IOS_MEASURE: ${{ needs.measure-ios.result }}
        run: node e2e/tooling/startup-perf/ci/slack-report.mts

      # The mobile E2E runs' bot, which posts to both channels. A post Slack rejects fails the job.
      - name: Post to the mobile E2E results channel
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          errors: true
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          payload-file-path: ${{ github.workspace }}/slack-payload.json

      # Even when the first post failed.
      - name: Post to the live-repo-health channel
        if: ${{ !cancelled() && steps.message.outcome == 'success' && (github.event_name == 'schedule' || inputs.slack_notif) }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          errors: true
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          payload-file-path: ${{ github.workspace }}/slack-payload-secondary.json

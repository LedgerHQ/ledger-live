name: "[Mobile] - Startup Performance - Scheduled/Manual"
run-name: >
  @Mobile startup perf • ${{ github.event_name == 'schedule' && 'Nightly' || format('{0} • {1}', inputs.preset, inputs.platforms) }} • ${{ github.ref_name }} • ${{ github.actor }}

# B2CQA-6555 (iOS) and B2CQA-6593 (Android). See e2e/tooling/startup-perf/README.md.

on:
  schedule:
    # Weekdays, after the mobile E2E nightly: develop against production (ci/resolve-refs.mts).
    - cron: "17 3 * * 1-5"
  workflow_dispatch:
    inputs:
      preset:
        description: "What to compare"
        required: true
        type: choice
        options: [prod-vs-release, prod-vs-develop, custom, aa-noise, known-regression]
        default: prod-vs-release
      ref_a:
        description: "Build A, a branch or tag of this repository (live-mobile@4.29.0 or later). Blank: the latest live-mobile@X.Y.Z tag (prod-vs-release, prod-vs-develop) or this branch (aa-noise, known-regression)"
        required: false
        type: string
      ref_b:
        description: "Build B, a branch or tag of this repository. Blank: the release branch (prod-vs-release) or develop (prod-vs-develop). From develop, only develop, release, main, hotfix or a live-mobile@X.Y.Z tag: to measure another branch, run from it"
        required: false
        type: string
      platforms:
        description: "Platforms"
        required: true
        type: choice
        options: ["Android & iOS", "Android Only", "iOS Only"]
        default: "Android & iOS"
      scenarios:
        description: "Scenarios"
        required: true
        type: choice
        options: ["no-accounts,accounts", "no-accounts", "accounts"]
        default: "no-accounts,accounts"
      pairs:
        description: "A/B pairs per scenario: even, at least 6 (half before and half after the device swap)"
        required: true
        type: string
        default: "20"
      threshold_ms:
        description: "B fails (prod-vs-release, prod-vs-develop, custom) or counts as detected (known-regression) when it is slower than A by more than this, on the Debug screen value"
        required: true
        type: string
        default: "100"
      slack_notif:
        description: "Post the result to Slack #live-repo-health"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP_ID: com.ledger.live
  MAESTRO_VERSION: 2.10.0
  MAESTRO_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
  RESULTS_DIR: startup-perf-results
  PERF_AVD_CORES: "4"

# The jobs, in order: plan resolves A, B and what the run needs. restore-cache takes from S3 what it
# keeps (build A of a release tag, the release's accounts snapshot). build-<os> makes A and B,
# build-snapshot-<os> and snapshot-<os> the accounts snapshot, when the cache lacks them. measure-<os>
# times the launches, save-cache caches what the run made, and report-on-slack posts the result.
jobs:
  plan:
    name: "Resolve builds"
    if: ${{ github.event_name != 'schedule' || github.repository == 'LedgerHQ/ledger-live' }}
    runs-on: ledger-wallet-1cpu-aws-public-cached
    outputs:
      sides: ${{ steps.plan.outputs.sides }}
      builds: ${{ steps.plan.outputs.builds }}
      snapshot: ${{ steps.plan.outputs.snapshot }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
      ref_a: ${{ steps.plan.outputs.ref_a }}
      ref_b: ${{ steps.plan.outputs.ref_b }}
      label_a: ${{ steps.plan.outputs.label_a }}
      label_b: ${{ steps.plan.outputs.label_b }}
      cache_a: ${{ steps.plan.outputs.cache_a }}
      restore: ${{ steps.plan.outputs.restore }}
      save: ${{ steps.plan.outputs.save }}
      preset: ${{ steps.plan.outputs.preset }}
      platforms: ${{ steps.plan.outputs.platforms }}
      pairs: ${{ steps.plan.outputs.pairs }}
      threshold_ms: ${{ steps.plan.outputs.threshold_ms }}
      snapshot_release: ${{ steps.plan.outputs.snapshot_release }}
      snapshot_ref: ${{ steps.plan.outputs.snapshot_ref }}
    steps:
      # This workflow's scripts only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /e2e/tooling/startup-perf/ci/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Resolve refs
        id: plan
        env:
          PRESET: ${{ inputs.preset }}
          REF_A: ${{ inputs.ref_a }}
          REF_B: ${{ inputs.ref_b }}
          PLATFORMS: ${{ inputs.platforms }}
          PAIRS: ${{ inputs.pairs }}
          THRESHOLD: ${{ inputs.threshold_ms }}
          SCENARIOS: ${{ inputs.scenarios }}
          BRANCH_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          # Reads a release tag's commit, which a run from develop, release or main checks.
          GH_TOKEN: ${{ github.token }}
        run: node e2e/tooling/startup-perf/ci/resolve-refs.mts

  # Restores what the mobile E2E builds' S3 cache keeps for this run (develop/, which only runs
  # from develop write): build A of a release tag and the release's accounts snapshot, so the jobs
  # that make them skip them. The cache credentials never share a job with the code being built
  # (README.md, "The cache"). Outputs <platform>_builds, the entries each build matrix still builds
  # ([] when nothing is left), and <platform>_snapshot, whether the platform makes its snapshot; both
  # empty when this job did not run, and the jobs then fall back on the plan's.
  restore-cache:
    name: "Restore from the cache"
    needs: [plan]
    if: ${{ needs.plan.outputs.restore == 'true' }}
    # Best-effort: without its outputs, the build jobs build every side.
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    runs-on: ledger-wallet-1cpu-aws-public-cached
    # The build jobs wait for this one.
    timeout-minutes: 15
    outputs:
      android_builds: ${{ steps.sides.outputs.android_builds }}
      ios_builds: ${{ steps.sides.outputs.ios_builds }}
      android_save_a: ${{ steps.sides.outputs.android_save_a }}
      ios_save_a: ${{ steps.sides.outputs.ios_save_a }}
      android_snapshot: ${{ steps.sides.outputs.android_snapshot }}
      ios_snapshot: ${{ steps.sides.outputs.ios_snapshot }}
      android_a_key: ${{ steps.keys.outputs.android_a }}
      ios_a_key: ${{ steps.keys.outputs.ios_a }}
      android_snapshot_key: ${{ steps.snapshot-keys.outputs.android }}
      ios_snapshot_key: ${{ steps.snapshot-keys.outputs.ios }}
    env:
      SHA_A: ${{ needs.plan.outputs.ref_a }}
      SNAPSHOT_RELEASE: ${{ needs.plan.outputs.snapshot_release }}
    steps:
      # The files of the keys, this folder's restore action and sides.mts, and what the cache
      # profile's script reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /.github/workflows/test-mobile-startup-perf.yml
            /e2e/tooling/startup-perf/ci/
            /e2e/tooling/startup-perf/src/types.ts
            /e2e/tooling/startup-perf/src/snapshot/
            /e2e/tooling/startup-perf/src/measure/storage.ts
            /e2e/tooling/startup-perf/src/measure/inject.ts
            /e2e/tooling/startup-perf/src/measure/exec.ts
            /e2e/tooling/startup-perf/src/measure/maestro.ts
            /e2e/tooling/startup-perf/src/measure/types.ts
            /e2e/tooling/startup-perf/src/measure/platforms/
            /e2e/tooling/startup-perf/flows/add-accounts.yaml
            /e2e/mobile/userdata/skip-onboarding.json
            /libs/live-e2e-shared/src/cli/e2e-cli.ts
            /libs/live-e2e-shared/src/cli/speculosSession.ts
            /libs/live-e2e-shared/src/speculosAddress.ts
            /tools/nx/
            /nx.workspace.json
            /nx.s3.defaults.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # The E2E builds' cache: develop's role on develop, the branch role elsewhere. Without it,
      # what the cache keeps is made as before: no step of the cache fails the run.
      - name: Resolve the cache role
        id: profile
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/configure-nx-remote-cache-profile@develop
        with:
          develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        continue-on-error: true
        with:
          role-to-assume: ${{ steps.profile.outputs.role-arn }}
          aws-region: ${{ secrets.AWS_CACHE_REGION }}

      # develop/ in every run (see above), then what build A depends on besides its commit (the
      # harness, this workflow and its build composites), the week, so that A is rebuilt on the
      # week's runners as B is, and a version to bump by hand.
      - name: Build A's keys
        id: keys
        if: ${{ needs.plan.outputs.cache_a == 'true' }}
        env:
          PREFIX: develop/
          HARNESS: ${{ hashFiles('.github/workflows/test-mobile-startup-perf.yml', 'e2e/tooling/startup-perf/ci/actions/build-*/action.yml', 'e2e/tooling/startup-perf/ci/*-build.mts', 'e2e/tooling/startup-perf/ci/step.mts', 'e2e/tooling/startup-perf/ci/toolchain.sh') }}
        run: |
          week=$(date -u +%G-W%V)
          for platform in android ios; do
            echo "${platform}_a=${PREFIX}startup-perf-$platform-$SHA_A-$HARNESS-$week-1" >> "$GITHUB_OUTPUT"
          done

      # Only a whole build of commit A, with its platform's binary, replaces building it.
      - name: Restore Android build A
        id: android-a
        if: ${{ needs.plan.outputs.cache_a == 'true' && needs.plan.outputs.android == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./e2e/tooling/startup-perf/ci/actions/restore
        with:
          key: ${{ steps.keys.outputs.android_a }}
          path: startup-perf-cache/android-a
          check: '[[ "$(cat sha.txt)" == "$SHA_A" && -s app.apk ]]'
          artifact: startup-perf-android-a
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Restore iOS build A
        id: ios-a
        if: ${{ needs.plan.outputs.cache_a == 'true' && needs.plan.outputs.ios == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./e2e/tooling/startup-perf/ci/actions/restore
        with:
          key: ${{ steps.keys.outputs.ios_a }}
          path: startup-perf-cache/ios-a
          check: '[[ "$(cat sha.txt)" == "$SHA_A" && -s app.zip ]]'
          artifact: startup-perf-ios-a
          region: ${{ secrets.AWS_CACHE_REGION }}

      # One snapshot per release and per version of the code that makes it: every module
      # src/snapshot/run.ts imports, and the e2e-cli speculos command's own files. Not the E2E
      # suites' Speculos settings it reuses (libs/live-e2e-shared/src/speculos*.ts), which change
      # every few days and do not change the accounts the scan finds: bump the version by hand.
      - name: The snapshot's keys
        id: snapshot-keys
        if: ${{ needs.plan.outputs.snapshot == 'true' }}
        env:
          PREFIX: develop/
          CODE_HASH: ${{ hashFiles('e2e/tooling/startup-perf/src/types.ts', 'e2e/tooling/startup-perf/src/snapshot/**', 'e2e/tooling/startup-perf/src/measure/storage.ts', 'e2e/tooling/startup-perf/src/measure/inject.ts', 'e2e/tooling/startup-perf/src/measure/exec.ts', 'e2e/tooling/startup-perf/src/measure/maestro.ts', 'e2e/tooling/startup-perf/src/measure/types.ts', 'e2e/tooling/startup-perf/src/measure/platforms/**', 'e2e/tooling/startup-perf/ci/step.mts', '!e2e/tooling/startup-perf/src/**/*.test.ts', 'e2e/tooling/startup-perf/flows/add-accounts.yaml', 'e2e/mobile/userdata/skip-onboarding.json', 'libs/live-e2e-shared/src/cli/e2e-cli.ts', 'libs/live-e2e-shared/src/cli/speculosSession.ts', 'libs/live-e2e-shared/src/speculosAddress.ts') }}
        run: |
          for platform in android ios; do
            echo "$platform=${PREFIX}startup-perf-snapshot-$platform-$SNAPSHOT_RELEASE-${CODE_HASH:0:16}-1" >> "$GITHUB_OUTPUT"
          done

      # Only the snapshot of this release, with its storage, replaces making it.
      - name: Restore the Android snapshot
        id: android-snapshot
        if: ${{ needs.plan.outputs.snapshot == 'true' && needs.plan.outputs.android == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./e2e/tooling/startup-perf/ci/actions/restore
        with:
          key: ${{ steps.snapshot-keys.outputs.android }}
          path: snapshot/android
          check: >-
            node -e 'process.exit(JSON.parse(require("fs").readFileSync("snapshot.json")).release === process.env.SNAPSHOT_RELEASE ? 0 : 1)'
            && [[ -s ledger-live && -s ledger-live.crc ]]
          artifact: startup-perf-snapshot-android
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Restore the iOS snapshot
        id: ios-snapshot
        if: ${{ needs.plan.outputs.snapshot == 'true' && needs.plan.outputs.ios == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./e2e/tooling/startup-perf/ci/actions/restore
        with:
          key: ${{ steps.snapshot-keys.outputs.ios }}
          path: snapshot/ios
          check: >-
            node -e 'process.exit(JSON.parse(require("fs").readFileSync("snapshot.json")).release === process.env.SNAPSHOT_RELEASE ? 0 : 1)'
            && [[ -s ledger-live && -s ledger-live.crc ]]
          artifact: startup-perf-snapshot-ios
          region: ${{ secrets.AWS_CACHE_REGION }}

      # An entry counts as restored once its artifact is published; otherwise its job makes it.
      # Also after a step failed or timed out: without these outputs, the jobs would make a
      # restored entry again.
      - name: What is left to make
        id: sides
        if: ${{ always() }}
        env:
          BUILDS: ${{ needs.plan.outputs.builds }}
          SNAPSHOT: ${{ needs.plan.outputs.snapshot }}
          CACHE_A: ${{ needs.plan.outputs.cache_a }}
          RESTORED_A_ANDROID: ${{ steps.android-a.outputs.restored }}
          RESTORED_A_IOS: ${{ steps.ios-a.outputs.restored }}
          RESTORED_SNAPSHOT_ANDROID: ${{ steps.android-snapshot.outputs.restored }}
          RESTORED_SNAPSHOT_IOS: ${{ steps.ios-snapshot.outputs.restored }}
        run: node e2e/tooling/startup-perf/ci/sides.mts

  build-android:
    name: "Android build ${{ matrix.side }}"
    needs: [plan, restore-cache]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.android == 'true' &&
      needs.restore-cache.outputs.android_builds != '[]'
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.restore-cache.outputs.android_builds || needs.plan.outputs.builds) }}
    runs-on: ledger-wallet-8cpu-aws-public-cached
    timeout-minutes: 120
    env:
      # Pods report the host CPU count; cap Gradle workers to the runner size.
      GRADLE_OPTS: -Dorg.gradle.workers.max=8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      # This workflow's ci/, its build composite included: the commit being built may predate it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .startup-perf
          # Only ci/: the package.json beside it would clash in Nx with the ref's own copy.
          sparse-checkout: /e2e/tooling/startup-perf/ci/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Build the prod-like app
        uses: ./.startup-perf/e2e/tooling/startup-perf/ci/actions/build-android
        with:
          side: ${{ matrix.side }}
          prod-like: "true"
          regression: ${{ matrix.regression }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifactory-url: ${{ vars.ARTIFACTORY_URL }}
          artifactory-maven-url: ${{ vars.ARTIFACTORY_MAVEN_URL }}
          card-baanx-api-url: ${{ secrets.CARD_BAANX_API_URL }}
          card-baanx-client-key: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
          card-baanx-hosted-ui: ${{ secrets.CARD_BAANX_HOSTED_UI }}
          card-oauth-redirect-uri: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}

  # The release's E2E build, as built for E2E, for the accounts snapshot (README.md, "The accounts
  # snapshot"): only when the cache lacks the snapshot. Its own job, so a failed one cancels neither
  # A nor B.
  build-snapshot-android:
    name: "Android build snapshot"
    needs: [plan, restore-cache]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.android == 'true' &&
      (needs.restore-cache.outputs.android_snapshot || needs.plan.outputs.snapshot) == 'true'
    permissions:
      id-token: write
      contents: read
    runs-on: ledger-wallet-8cpu-aws-public-cached
    timeout-minutes: 120
    env:
      # Pods report the host CPU count; cap Gradle workers to the runner size.
      GRADLE_OPTS: -Dorg.gradle.workers.max=8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.snapshot_ref }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      # This workflow's ci/, its build composite included: the commit being built may predate it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .startup-perf
          # Only ci/: the package.json beside it would clash in Nx with the ref's own copy.
          sparse-checkout: /e2e/tooling/startup-perf/ci/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Build the release's E2E app
        uses: ./.startup-perf/e2e/tooling/startup-perf/ci/actions/build-android
        with:
          side: snapshot
          prod-like: "false"
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifactory-url: ${{ vars.ARTIFACTORY_URL }}
          artifactory-maven-url: ${{ vars.ARTIFACTORY_MAVEN_URL }}
          card-baanx-api-url: ${{ secrets.CARD_BAANX_API_URL }}
          card-baanx-client-key: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
          card-baanx-hosted-ui: ${{ secrets.CARD_BAANX_HOSTED_UI }}
          card-oauth-redirect-uri: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}

  build-ios:
    name: "iOS build ${{ matrix.side }}"
    needs: [plan, restore-cache]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.ios == 'true' &&
      needs.restore-cache.outputs.ios_builds != '[]'
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.restore-cache.outputs.ios_builds || needs.plan.outputs.builds) }}
    runs-on: ["general-pool", macOS, ARM64]
    timeout-minutes: 150
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      # This workflow's ci/, its build composite included: the commit being built may predate it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .startup-perf
          # Only ci/: the package.json beside it would clash in Nx with the ref's own copy.
          sparse-checkout: /e2e/tooling/startup-perf/ci/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Build the prod-like app
        uses: ./.startup-perf/e2e/tooling/startup-perf/ci/actions/build-ios
        with:
          side: ${{ matrix.side }}
          prod-like: "true"
          regression: ${{ matrix.regression }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifactory-url: ${{ vars.ARTIFACTORY_URL }}
          card-baanx-api-url: ${{ secrets.CARD_BAANX_API_URL }}
          card-baanx-client-key: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
          card-baanx-hosted-ui: ${{ secrets.CARD_BAANX_HOSTED_UI }}
          card-oauth-redirect-uri: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}

  # The release's E2E build, as built for E2E, for the accounts snapshot (README.md, "The accounts
  # snapshot"): only when the cache lacks the snapshot. Its own job, so a failed one cancels neither
  # A nor B.
  build-snapshot-ios:
    name: "iOS build snapshot"
    needs: [plan, restore-cache]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.ios == 'true' &&
      (needs.restore-cache.outputs.ios_snapshot || needs.plan.outputs.snapshot) == 'true'
    permissions:
      id-token: write
      contents: read
    runs-on: ["general-pool", macOS, ARM64]
    timeout-minutes: 150
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.snapshot_ref }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      # This workflow's ci/, its build composite included: the commit being built may predate it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .startup-perf
          # Only ci/: the package.json beside it would clash in Nx with the ref's own copy.
          sparse-checkout: /e2e/tooling/startup-perf/ci/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Build the release's E2E app
        uses: ./.startup-perf/e2e/tooling/startup-perf/ci/actions/build-ios
        with:
          side: snapshot
          prod-like: "false"
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          artifactory-url: ${{ vars.ARTIFACTORY_URL }}
          card-baanx-api-url: ${{ secrets.CARD_BAANX_API_URL }}
          card-baanx-client-key: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
          card-baanx-hosted-ui: ${{ secrets.CARD_BAANX_HOSTED_UI }}
          card-oauth-redirect-uri: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}

  # Caches what this run made and the cache lacked (see restore-cache): build A of a release tag and
  # the release's accounts snapshot. Only when B builds reviewed code (save, resolve-refs.mts): B's
  # build job could replace another job's artifact.
  save-cache:
    name: "Save to the cache"
    needs: [plan, restore-cache, build-android, build-ios, snapshot-android, snapshot-ios]
    # Best-effort: what is not cached is made again by the next run.
    continue-on-error: true
    if: >-
      !cancelled() && needs.plan.outputs.save == 'true' &&
      (needs.restore-cache.outputs.android_save_a == 'true' && needs.build-android.result == 'success' ||
      needs.restore-cache.outputs.ios_save_a == 'true' && needs.build-ios.result == 'success' ||
      needs.restore-cache.outputs.android_snapshot == 'true' && needs.snapshot-android.result == 'success' ||
      needs.restore-cache.outputs.ios_snapshot == 'true' && needs.snapshot-ios.result == 'success')
    permissions:
      id-token: write
      contents: read
    runs-on: ledger-wallet-1cpu-aws-public-cached
    timeout-minutes: 45
    steps:
      # This folder's save action, and what the cache profile's script reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /e2e/tooling/startup-perf/ci/actions/
            /tools/nx/
            /nx.workspace.json
            /nx.s3.defaults.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # The E2E builds' cache: develop's role on develop, the branch role elsewhere. Without it,
      # nothing is cached and the next run makes it again: no step of the cache fails the run.
      - name: Resolve the cache role
        id: profile
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/configure-nx-remote-cache-profile@develop
        with:
          develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        continue-on-error: true
        with:
          role-to-assume: ${{ steps.profile.outputs.role-arn }}
          aws-region: ${{ secrets.AWS_CACHE_REGION }}

      # Only develop's role writes develop/: on another run, the plan's save is false anyway.
      - name: Cache Android build A
        if: ${{ needs.restore-cache.outputs.android_save_a == 'true' && needs.build-android.result == 'success' && steps.profile.outputs.cache-profile == 'develop' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./e2e/tooling/startup-perf/ci/actions/save
        with:
          key: ${{ needs.restore-cache.outputs.android_a_key }}
          path: startup-perf-cache/android-a
          artifact: startup-perf-android-a
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Cache iOS build A
        if: ${{ needs.restore-cache.outputs.ios_save_a == 'true' && needs.build-ios.result == 'success' && steps.profile.outputs.cache-profile == 'develop' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./e2e/tooling/startup-perf/ci/actions/save
        with:
          key: ${{ needs.restore-cache.outputs.ios_a_key }}
          path: startup-perf-cache/ios-a
          artifact: startup-perf-ios-a
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Cache the Android snapshot
        if: ${{ needs.restore-cache.outputs.android_snapshot == 'true' && needs.snapshot-android.result == 'success' && steps.profile.outputs.cache-profile == 'develop' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./e2e/tooling/startup-perf/ci/actions/save
        with:
          key: ${{ needs.restore-cache.outputs.android_snapshot_key }}
          path: snapshot/android
          artifact: startup-perf-snapshot-android
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Cache the iOS snapshot
        if: ${{ needs.restore-cache.outputs.ios_snapshot == 'true' && needs.snapshot-ios.result == 'success' && steps.profile.outputs.cache-profile == 'develop' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./e2e/tooling/startup-perf/ci/actions/save
        with:
          key: ${{ needs.restore-cache.outputs.ios_snapshot_key }}
          path: snapshot/ios
          artifact: startup-perf-snapshot-ios
          region: ${{ secrets.AWS_CACHE_REGION }}

  snapshot-android:
    name: "Android accounts snapshot"
    needs: [plan, restore-cache, build-snapshot-android]
    # When the cache lacks the snapshot, once build-snapshot-android made the release's E2E build.
    if: ${{ !cancelled() && needs.build-snapshot-android.result == 'success' }}
    permissions:
      id-token: write
      contents: read
    runs-on: ledger-wallet-8cpu-github-public-cached
    timeout-minutes: 120
    env:
      SNAPSHOT_DIR: snapshot/android
      SNAPSHOT_DEBUG_DIR: startup-perf-snapshot-debug/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load AVD configuration
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-avd@develop
        with:
          config_only: "true"

      # No cache role: this job runs an app another job of the run uploaded.
      - name: Set up the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-nx-cache: "true"

      - name: Set up the Android environment
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-env@develop
        with:
          install_sdk: "false"

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        run: pnpm i --frozen-lockfile --filter="@ledgerhq/live-e2e-shared..." --filter="@ledgerhq/mobile-startup-perf" --unsafe-perm --ignore-scripts

      # Its typecheck builds the libraries `e2e-cli speculos` runs from.
      - name: Build the e2e shared lib's dependencies
        run: GITHUB_STEP_SUMMARY=/dev/null pnpm exec nx run @ledgerhq/live-e2e-shared:typecheck

      - name: Prepare the AVD
        timeout-minutes: 40
        uses: LedgerHQ/ledger-live/tools/actions/composites/prepare-android-avd@develop
        with:
          r2_access_key: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_endpoint: ${{ secrets.R2_ENDPOINT }}
          create_if_missing: "true"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: startup-perf-android-snapshot
          path: builds/snapshot

      - name: Sign the APK
        env:
          KS_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash e2e/tooling/startup-perf/devices/sign-apks.sh builds/snapshot

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: bash e2e/tooling/startup-perf/devices/install-maestro.sh

      - name: Boot the emulator
        run: bash e2e/tooling/startup-perf/devices/boot-emulators.sh "$SNAPSHOT_DEBUG_DIR" 1

      - name: Add the accounts through the UI
        env:
          SEED: ${{ secrets.SEED_QAA_B2C }}
          SPECULINHO_URL: ${{ secrets.SPECULINHO_URL }}
          REMOTE_SPECULOS: "true"
          SPECULOS_DEVICE: nanoX
          RELEASE: ${{ needs.plan.outputs.snapshot_release }}
        run: |
          node e2e/tooling/startup-perf/src/snapshot/run.ts \
            --platform android --device emulator-5554 \
            --app builds/snapshot/signed.apk --app-id "$APP_ID" --release "$RELEASE" \
            --out-dir "$SNAPSHOT_DIR" --debug-dir "$SNAPSHOT_DEBUG_DIR"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: startup-perf-snapshot-android
          path: ${{ env.SNAPSHOT_DIR }}/
          retention-days: 7
          overwrite: true

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: startup-perf-snapshot-debug-android
          path: ${{ env.SNAPSHOT_DEBUG_DIR }}
          retention-days: 14
          include-hidden-files: true
          overwrite: true

  snapshot-ios:
    name: "iOS accounts snapshot"
    needs: [plan, restore-cache, build-snapshot-ios]
    # When the cache lacks the snapshot, once build-snapshot-ios made the release's E2E build.
    if: ${{ !cancelled() && needs.build-snapshot-ios.result == 'success' }}
    permissions:
      id-token: write
      contents: read
    # The performance pool's queue, so it never runs beside an iOS measurement.
    concurrency:
      group: mobile-startup-perf-ios
      cancel-in-progress: false
      queue: max
    runs-on: ["qaa", macOS, ARM64, "performance-pool"]
    timeout-minutes: 120
    env:
      SNAPSHOT_DIR: snapshot/ios
      SNAPSHOT_DEBUG_DIR: startup-perf-snapshot-debug/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache role: this job runs an app another job of the run uploaded.
      - name: Set up the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          skip-pod-cache: "true"
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-nx-cache: "true"

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        run: pnpm i --frozen-lockfile --filter="@ledgerhq/live-e2e-shared..." --filter="@ledgerhq/mobile-startup-perf" --unsafe-perm --ignore-scripts

      # Its typecheck builds the libraries `e2e-cli speculos` runs from.
      - name: Build the e2e shared lib's dependencies
        run: GITHUB_STEP_SUMMARY=/dev/null pnpm exec nx run @ledgerhq/live-e2e-shared:typecheck

      # Maestro needs a JDK.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: startup-perf-ios-snapshot
          path: builds/snapshot

      - name: Unpack the app
        run: ditto -x -k builds/snapshot/app.zip builds/snapshot

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: bash e2e/tooling/startup-perf/devices/install-maestro.sh

      - name: Create and boot a simulator
        timeout-minutes: 20
        run: bash e2e/tooling/startup-perf/devices/boot-simulators.sh 1

      - name: Add the accounts through the UI
        env:
          SEED: ${{ secrets.SEED_QAA_B2C }}
          SPECULINHO_URL: ${{ secrets.SPECULINHO_URL }}
          REMOTE_SPECULOS: "true"
          SPECULOS_DEVICE: nanoX
          RELEASE: ${{ needs.plan.outputs.snapshot_release }}
        run: |
          node e2e/tooling/startup-perf/src/snapshot/run.ts \
            --platform ios --device "$SIM_1" \
            --app builds/snapshot/ledgerlivemobile.app --app-id "$APP_ID" --release "$RELEASE" \
            --out-dir "$SNAPSHOT_DIR" --debug-dir "$SNAPSHOT_DEBUG_DIR"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: startup-perf-snapshot-ios
          path: ${{ env.SNAPSHOT_DIR }}/
          retention-days: 7
          overwrite: true

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: startup-perf-snapshot-debug-ios
          path: ${{ env.SNAPSHOT_DEBUG_DIR }}
          retention-days: 14
          include-hidden-files: true
          overwrite: true

  measure-android:
    name: "Android startup (2 emulators, ${{ matrix.scenario }})"
    needs: [plan, restore-cache, build-android, build-snapshot-android, snapshot-android]
    # A and B built or restored (build-android then skipped), and the accounts snapshot made or
    # restored (its two jobs then skipped).
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.android == 'true' &&
      (needs.build-android.result == 'success' || needs.restore-cache.outputs.android_builds == '[]') &&
      contains(fromJSON('["success","skipped"]'), needs.build-snapshot-android.result) &&
      contains(fromJSON('["success","skipped"]'), needs.snapshot-android.result)
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    runs-on: ledger-wallet-8cpu-github-public-cached
    timeout-minutes: 300
    steps:
      - name: Read the preinstalled AVD ahead (background)
        run: |
          [ -f "${HOME}/.android/avd-cache-key" ] || exit 0
          log="${RUNNER_TEMP}/avd-read-ahead.log"
          echo "started $(date -u +%T)" > "$log"
          nohup bash -c '
            start=$(date +%s)
            find "${HOME}/.android/avd" -type f -exec cat {} + > /dev/null
            echo "read $(du -sh "${HOME}/.android/avd" | cut -f1) in $(( $(date +%s) - start ))s, done $(date -u +%T)"
          ' >> "$log" 2>&1 &

      - name: Load AVD configuration
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-avd@develop
        with:
          config_only: "true"

      - name: Set up the Android environment
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-env@develop
        with:
          # adb, build-tools and the emulator are on the image.
          install_sdk: "false"

      - name: Prepare the AVD
        id: avd
        timeout-minutes: 40
        uses: LedgerHQ/ledger-live/tools/actions/composites/prepare-android-avd@develop
        with:
          r2_access_key: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_endpoint: ${{ secrets.R2_ENDPOINT }}
          create_if_missing: "true"

      - name: Report the AVD in use
        env:
          AVD_SOURCE: ${{ steps.avd.outputs.source }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          {
            echo "### Android emulator ($SCENARIO)"
            echo "- AVD from: $AVD_SOURCE"
            echo "- Key: \`${AVD_CACHE_KEY}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # staging.kstr is the keystore that secrets.ANDROID_KEYSTORE_PATH points to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/scripts/cleanup-android-emulators.sh
            /e2e/tooling/startup-perf/
            /e2e/mobile/userdata/
            /apps/ledger-live-mobile/android/app/staging.kstr

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: startup-perf-android-a
          path: builds/a

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ contains(needs.plan.outputs.sides, 'b') }}
        with:
          name: startup-perf-android-b
          path: builds/b

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ matrix.scenario == 'accounts' }}
        with:
          name: startup-perf-snapshot-android
          path: snapshot/android

      - name: Sign APKs
        env:
          KS_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR/android"
          bash e2e/tooling/startup-perf/devices/sign-apks.sh builds/a builds/b | tee -a "$RESULTS_DIR/android/builds.txt"

      - name: Compare the build toolchains
        run: bash e2e/tooling/startup-perf/ci/toolchain.sh compare builds/a builds/b

      - name: Report the AVD read-ahead
        run: cat "${RUNNER_TEMP}/avd-read-ahead.log" 2>/dev/null || echo "No preinstalled AVD to read ahead."

      - name: Duplicate the AVD for the second emulator
        uses: LedgerHQ/ledger-live/tools/actions/composites/duplicate-avd@develop
        with:
          source_avd_name: ${{ env.AVD_NAME }}
          target_suffixes: "_2"
          avd_api: ${{ env.AVD_API }}

      - name: Boot two emulators
        run: bash e2e/tooling/startup-perf/devices/boot-emulators.sh "$RESULTS_DIR/android"

      - name: Measure
        id: measure
        env:
          SCENARIO: ${{ matrix.scenario }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
        run: |
          set -euo pipefail
          APP_A=builds/a/signed.apk
          APP_B=builds/b/signed.apk
          [[ -f "$APP_B" ]] || APP_B="$APP_A"
          node e2e/tooling/startup-perf/src/measure/run.ts \
            --platform android \
            --devices emulator-5554,emulator-5556 \
            --app-a "$APP_A" --app-b "$APP_B" --app-id "$APP_ID" \
            --scenarios "$SCENARIO" --pairs "$PAIRS" --warmups 6 \
            --accounts-snapshot snapshot/android \
            --out-dir "$RESULTS_DIR/android"

      - name: Analyse
        if: ${{ always() }}
        env:
          PRESET: ${{ needs.plan.outputs.preset }}
          THRESHOLD: ${{ needs.plan.outputs.threshold_ms }}
          LABEL_A: ${{ needs.plan.outputs.label_a }}
          LABEL_B: ${{ needs.plan.outputs.label_b }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
          SCENARIOS: ${{ matrix.scenario }}
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
        run: |
          # For the Slack job: the scenarios this job measured, in order, and whether it finished.
          mkdir -p "$RESULTS_DIR/android"
          echo "android $SCENARIOS $MEASURE_OUTCOME" > "$RESULTS_DIR/android/measurement.txt"
          node e2e/tooling/startup-perf/src/analysis/analyze.ts \
            --samples "$RESULTS_DIR/android/samples.jsonl" \
            --preset "$PRESET" --threshold-ms "$THRESHOLD" \
            --label-a "$LABEL_A" --label-b "$LABEL_B" --pairs "$PAIRS" \
            --json "$RESULTS_DIR/android/summary.json" \
            --run-json "$RESULTS_DIR/android/run.json"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: startup-perf-results-android-${{ matrix.scenario }}
          path: ${{ env.RESULTS_DIR }}/android
          retention-days: 30

  measure-ios:
    name: "iOS startup (2 simulators)"
    needs: [plan, restore-cache, build-ios, build-snapshot-ios, snapshot-ios]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.ios == 'true' &&
      (needs.build-ios.result == 'success' || needs.restore-cache.outputs.ios_builds == '[]') &&
      contains(fromJSON('["success","skipped"]'), needs.build-snapshot-ios.result) &&
      contains(fromJSON('["success","skipped"]'), needs.snapshot-ios.result)
    # One iOS measurement at a time on the performance pool, so two never measure side by side;
    # queue: max keeps every waiting run instead of only the latest.
    concurrency:
      group: mobile-startup-perf-ios
      cancel-in-progress: false
      queue: max
    runs-on: ["qaa", macOS, ARM64, "performance-pool"]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            e2e/tooling/startup-perf
            e2e/mobile/userdata

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: startup-perf-ios-a
          path: builds/a

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ contains(needs.plan.outputs.sides, 'b') }}
        with:
          name: startup-perf-ios-b
          path: builds/b

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ contains(fromJSON(needs.plan.outputs.scenarios), 'accounts') }}
        with:
          name: startup-perf-snapshot-ios
          path: snapshot/ios

      - name: Unpack apps
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR/ios"
          for dir in builds/a builds/b; do
            [[ -f "$dir/app.zip" ]] || continue
            ditto -x -k "$dir/app.zip" "$dir"
            echo "$dir: $(cat "$dir/sha.txt")" | tee -a "$RESULTS_DIR/ios/builds.txt"
          done

      - name: Compare the build toolchains
        run: bash e2e/tooling/startup-perf/ci/toolchain.sh compare builds/a builds/b

      - name: Create and boot two simulators
        # Two boots and bootstatus waits of up to 5 min each, then up to 10 min of idle wait.
        timeout-minutes: 35
        run: bash e2e/tooling/startup-perf/devices/boot-simulators.sh

      - name: Measure
        id: measure
        env:
          SCENARIOS: ${{ join(fromJSON(needs.plan.outputs.scenarios), ',') }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
        run: |
          set -euo pipefail
          APP_A=builds/a/ledgerlivemobile.app
          APP_B=builds/b/ledgerlivemobile.app
          [[ -d "$APP_B" ]] || APP_B="$APP_A"
          node e2e/tooling/startup-perf/src/measure/run.ts \
            --platform ios \
            --devices "$SIM_1,$SIM_2" \
            --app-a "$APP_A" --app-b "$APP_B" --app-id "$APP_ID" \
            --scenarios "$SCENARIOS" --pairs "$PAIRS" \
            --accounts-snapshot snapshot/ios \
            --out-dir "$RESULTS_DIR/ios"

      - name: Analyse
        if: ${{ always() }}
        env:
          PRESET: ${{ needs.plan.outputs.preset }}
          THRESHOLD: ${{ needs.plan.outputs.threshold_ms }}
          LABEL_A: ${{ needs.plan.outputs.label_a }}
          LABEL_B: ${{ needs.plan.outputs.label_b }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
          SCENARIOS: ${{ join(fromJSON(needs.plan.outputs.scenarios), ',') }}
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
        run: |
          # For the Slack job: the scenarios this job measured, in order, and whether it finished.
          mkdir -p "$RESULTS_DIR/ios"
          echo "ios $SCENARIOS $MEASURE_OUTCOME" > "$RESULTS_DIR/ios/measurement.txt"
          node e2e/tooling/startup-perf/src/analysis/analyze.ts \
            --samples "$RESULTS_DIR/ios/samples.jsonl" \
            --preset "$PRESET" --threshold-ms "$THRESHOLD" \
            --label-a "$LABEL_A" --label-b "$LABEL_B" --pairs "$PAIRS" \
            --json "$RESULTS_DIR/ios/summary.json" \
            --run-json "$RESULTS_DIR/ios/run.json"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: startup-perf-results-ios
          path: ${{ env.RESULTS_DIR }}/ios
          retention-days: 30

  report-on-slack:
    name: "Slack report"
    needs: [plan, restore-cache, build-android, build-ios, build-snapshot-android, build-snapshot-ios, snapshot-android, snapshot-ios, measure-android, measure-ios]
    # As for the mobile E2E runs: every run posts to their results channel, passed or failed, and
    # the nightly or a dispatch with slack_notif to #live-repo-health too. A run cancelled by hand
    # posts nothing; a job that times out ends cancelled but still gets posted.
    if: ${{ !cancelled() && needs.plan.result != 'skipped' }}
    runs-on: ledger-wallet-1cpu-aws-public-cached
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: /e2e/tooling/startup-perf/ci/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # None when no measure job reached its analysis: the message then says why.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: startup-perf-results-*
          path: ${{ env.RESULTS_DIR }}

      - name: Write the message
        id: message
        env:
          SLACK_CHANNEL: CTMQ0S5SB
          SLACK_SECONDARY_CHANNEL: ${{ (github.event_name == 'schedule' || inputs.slack_notif) && 'C05FKJ7DFAP' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PRESET: ${{ needs.plan.outputs.preset }}
          THRESHOLD: ${{ needs.plan.outputs.threshold_ms }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
          LABEL_A: ${{ needs.plan.outputs.label_a }}
          LABEL_B: ${{ needs.plan.outputs.label_b }}
          SCENARIOS: ${{ needs.plan.outputs.scenarios }}
          PLAN: ${{ needs.plan.result }}
          # Every entry restored counts as built; a failed or cancelled snapshot build as such a
          # snapshot, whose job it skips.
          ANDROID_BUILD: ${{ needs.restore-cache.outputs.android_builds == '[]' && 'success' || needs.build-android.result }}
          ANDROID_SNAPSHOT: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.build-snapshot-android.result) && needs.build-snapshot-android.result || needs.snapshot-android.result }}
          ANDROID_MEASURE: ${{ needs.measure-android.result }}
          IOS_BUILD: ${{ needs.restore-cache.outputs.ios_builds == '[]' && 'success' || needs.build-ios.result }}
          IOS_SNAPSHOT: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.build-snapshot-ios.result) && needs.build-snapshot-ios.result || needs.snapshot-ios.result }}
          IOS_MEASURE: ${{ needs.measure-ios.result }}
        run: node e2e/tooling/startup-perf/ci/slack-report.mts

      # The mobile E2E runs' bot, which posts to both channels. A post Slack rejects fails the job.
      - name: Post to the mobile E2E results channel
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          errors: true
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          payload-file-path: ${{ github.workspace }}/slack-payload.json

      # Even when the first post failed.
      - name: Post to the live-repo-health channel
        if: ${{ !cancelled() && steps.message.outcome == 'success' && (github.event_name == 'schedule' || inputs.slack_notif) }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          errors: true
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          payload-file-path: ${{ github.workspace }}/slack-payload-secondary.json

name: "[Mobile] - Startup Performance - Scheduled/Manual"
run-name: >
  @Mobile startup perf • ${{ github.event_name == 'schedule' && 'Nightly' || format('{0} • {1}', inputs.preset, inputs.platforms) }} • ${{ github.ref_name }} • ${{ github.actor }}

# B2CQA-6555 (iOS) and B2CQA-6593 (Android). See e2e/tooling/startup-perf/README.md.

on:
  schedule:
    # Weekdays, after the mobile E2E nightly: develop against production (ci/resolve-refs.mts).
    - cron: "17 3 * * 1-5"
  workflow_dispatch:
    inputs:
      preset:
        description: "What to compare"
        required: true
        type: choice
        options: [prod-vs-release, prod-vs-develop, custom, aa-noise, known-regression]
        default: prod-vs-release
      ref_a:
        description: "Build A, a branch or tag of this repository (live-mobile@4.26.0 or later). Blank: the latest live-mobile@X.Y.Z tag (prod-vs-release, prod-vs-develop) or this branch (aa-noise, known-regression)"
        required: false
        type: string
      ref_b:
        description: "Build B, a branch or tag of this repository. Blank: the release branch (prod-vs-release) or develop (prod-vs-develop)"
        required: false
        type: string
      platforms:
        description: "Platforms"
        required: true
        type: choice
        options: ["Android & iOS", "Android Only", "iOS Only"]
        default: "Android & iOS"
      scenarios:
        description: "Scenarios"
        required: true
        type: choice
        options: ["no-accounts,accounts", "no-accounts", "accounts"]
        default: "no-accounts,accounts"
      pairs:
        description: "A/B pairs per scenario: even, at least 6 (half before and half after the device swap)"
        required: true
        type: string
        default: "20"
      accounts_userdata:
        description: "Userdata files (e2e/mobile/userdata, comma-separated) merged for the accounts scenario; settings come from the first"
        required: true
        type: string
        default: "speculos-x-other-account,swap-history"
      threshold_ms:
        description: "B fails (prod-vs-release, prod-vs-develop, custom) or counts as detected (known-regression) when it is slower than A by more than this, on the Debug screen value (from the first JS import when A and B count from different points) or with the native start"
        required: true
        type: string
        default: "100"
      slack_notif:
        description: "Post the result to Slack #live-repo-health"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP_ID: com.ledger.live
  MAESTRO_VERSION: 2.10.0
  MAESTRO_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
  RESULTS_DIR: startup-perf-results
  PERF_AVD_CORES: "4"

jobs:
  plan:
    name: "Resolve builds"
    if: ${{ github.event_name != 'schedule' || github.repository == 'LedgerHQ/ledger-live' }}
    runs-on: ledger-wallet-1cpu-aws-public-cached
    outputs:
      sides: ${{ steps.plan.outputs.sides }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
      ref_a: ${{ steps.plan.outputs.ref_a }}
      ref_b: ${{ steps.plan.outputs.ref_b }}
      label_a: ${{ steps.plan.outputs.label_a }}
      label_b: ${{ steps.plan.outputs.label_b }}
      cache_a: ${{ steps.plan.outputs.cache_a }}
      preset: ${{ steps.plan.outputs.preset }}
      platforms: ${{ steps.plan.outputs.platforms }}
      pairs: ${{ steps.plan.outputs.pairs }}
      threshold_ms: ${{ steps.plan.outputs.threshold_ms }}
      accounts_userdata: ${{ steps.plan.outputs.accounts_userdata }}
    steps:
      # This workflow's scripts only.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: /e2e/tooling/startup-perf/ci/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Resolve refs
        id: plan
        env:
          PRESET: ${{ inputs.preset }}
          REF_A: ${{ inputs.ref_a }}
          REF_B: ${{ inputs.ref_b }}
          PLATFORMS: ${{ inputs.platforms }}
          PAIRS: ${{ inputs.pairs }}
          THRESHOLD: ${{ inputs.threshold_ms }}
          SCENARIOS: ${{ inputs.scenarios }}
          ACCOUNTS_USERDATA: ${{ inputs.accounts_userdata }}
          BRANCH_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: node e2e/tooling/startup-perf/ci/resolve-refs.mts

  # Build A of a release tag, from the cache of an earlier run, so the build jobs leave it out. The
  # cache is the mobile E2E builds' (S3, develop or branch role and key prefix). Restoring and saving
  # are jobs of their own: the cache's credentials never share a job with the code being built.
  restore-builds:
    name: "Restore cached build A"
    needs: [plan]
    if: ${{ needs.plan.outputs.cache_a == 'true' }}
    # Best-effort: without its outputs, the build jobs build every side.
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    runs-on: ledger-wallet-1cpu-aws-public-cached
    outputs:
      android_sides: ${{ steps.sides.outputs.android }}
      ios_sides: ${{ steps.sides.outputs.ios }}
      android_key: ${{ steps.keys.outputs.android }}
      ios_key: ${{ steps.keys.outputs.ios }}
    env:
      SHA_A: ${{ needs.plan.outputs.ref_a }}
    steps:
      # The files of the key, and what the cache profile's script reads.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /.github/workflows/test-mobile-startup-perf.yml
            /e2e/tooling/startup-perf/ci/
            /tools/nx/
            /nx.workspace.json
            /nx.s3.defaults.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # The E2E builds' cache: develop's role on develop, the branch role elsewhere. Without it,
      # build A is built as before: no step of the cache fails the run.
      - name: Resolve the cache role
        id: profile
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/configure-nx-remote-cache-profile@develop
        with:
          develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        continue-on-error: true
        with:
          role-to-assume: ${{ steps.profile.outputs.role-arn }}
          aws-region: ${{ secrets.AWS_CACHE_REGION }}

      # As the E2E builds' keys: develop's prefix on develop, then what the build depends on besides
      # commit A (the harness and this workflow), and a version to bump by hand.
      - name: Cache keys
        id: keys
        env:
          PREFIX: ${{ steps.profile.outputs.cache-profile == 'develop' && 'develop/' || '' }}
          HARNESS: ${{ hashFiles('.github/workflows/test-mobile-startup-perf.yml', 'e2e/tooling/startup-perf/ci/*-build.mts', 'e2e/tooling/startup-perf/ci/step.mts') }}
        run: |
          for platform in android ios; do
            echo "$platform=${PREFIX}startup-perf-$platform-$SHA_A-$HARNESS-1" >> "$GITHUB_OUTPUT"
          done

      - name: Look up Android build A
        id: android-exists
        if: ${{ needs.plan.outputs.platforms != 'iOS Only' }}
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/exists@develop
        with:
          key: ${{ steps.keys.outputs.android }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ll-nx-cache
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Download Android build A
        id: android-download
        if: ${{ steps.android-exists.outputs.cache-hit == 'true' }}
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@develop
        with:
          key: ${{ steps.keys.outputs.android }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ll-nx-cache
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Look up iOS build A
        id: ios-exists
        if: ${{ needs.plan.outputs.platforms != 'Android Only' }}
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/exists@develop
        with:
          key: ${{ steps.keys.outputs.ios }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ll-nx-cache
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Download iOS build A
        id: ios-download
        if: ${{ steps.ios-exists.outputs.cache-hit == 'true' }}
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@develop
        with:
          key: ${{ steps.keys.outputs.ios }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ll-nx-cache
          region: ${{ secrets.AWS_CACHE_REGION }}

      # Only a whole build of commit A replaces building it: a download that failed partway may have
      # left a matching sha.txt beside part of the app.
      - name: Check the restored builds
        id: restored
        env:
          DOWNLOADED_android: ${{ steps.android-download.outcome }}
          DOWNLOADED_ios: ${{ steps.ios-download.outcome }}
        run: |
          for platform in android ios; do
            dir="startup-perf-cache/$platform-a"
            downloaded="DOWNLOADED_$platform"
            if [[ "${!downloaded}" == success ]] && [[ "$(cat "$dir/sha.txt" 2>/dev/null)" == "$SHA_A" ]] && [[ -s "$dir/app.apk" || -s "$dir/app.zip" ]]; then
              echo "$platform=true" >> "$GITHUB_OUTPUT"
              echo "- $platform build A restored from the cache" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$platform=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Publish the restored Android build A
        id: android-upload
        if: ${{ steps.restored.outputs.android == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: startup-perf-android-a
          path: startup-perf-cache/android-a/
          retention-days: 7

      - name: Publish the restored iOS build A
        id: ios-upload
        if: ${{ steps.restored.outputs.ios == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: startup-perf-ios-a
          path: startup-perf-cache/ios-a/
          retention-days: 7

      # A side is restored once its artifact is published; otherwise its build job makes it.
      - name: Sides left to build
        id: sides
        env:
          SIDES: ${{ needs.plan.outputs.sides }}
          ANDROID: ${{ steps.restored.outputs.android == 'true' && steps.android-upload.outcome == 'success' }}
          IOS: ${{ steps.restored.outputs.ios == 'true' && steps.ios-upload.outcome == 'success' }}
        run: |
          left() {
            node -e 'const [sides, restored] = process.argv.slice(1);
              console.log(JSON.stringify(JSON.parse(sides).filter(s => restored !== "true" || s !== "a")));' "$SIDES" "$1"
          }
          echo "android=$(left "$ANDROID")" >> "$GITHUB_OUTPUT"
          echo "ios=$(left "$IOS")" >> "$GITHUB_OUTPUT"

  build-android:
    name: "Android build ${{ matrix.side }}"
    needs: [plan, restore-builds]
    # Every side when there is no restore job (A is not a release tag's) or it failed.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.platforms != 'iOS Only' && needs.restore-builds.outputs.android_sides != '[]' }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        side: ${{ fromJSON(needs.restore-builds.outputs.android_sides || needs.plan.outputs.sides) }}
    runs-on: ledger-wallet-8cpu-aws-public-cached
    timeout-minutes: 120
    env:
      REF: ${{ matrix.side == 'a' && needs.plan.outputs.ref_a || needs.plan.outputs.ref_b }}
      # Pods report the host CPU count; cap Gradle workers to the runner size.
      GRADLE_OPTS: -Dorg.gradle.workers.max=8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REF }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      # This workflow's scripts, which the commit being built may predate.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: .startup-perf
          # Only ci/: the package.json beside it would clash in Nx with the ref's own copy.
          sparse-checkout: /e2e/tooling/startup-perf/ci/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # No remote Nx, pnpm or Gradle cache: they would be written with develop's role for another ref.
      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-nx-cache: "true"

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: JFrog Maven auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-maven-auth@develop
        with:
          url: ${{ vars.ARTIFACTORY_MAVEN_URL }}

      - name: setup JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "zulu"
          java-version: "17"

      - name: setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools"

      - name: Install dependencies
        run: |
          pnpm i --frozen-lockfile --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm

      - name: Build mobile dependencies
        # Nx adds its run report to the job summary, with no setting to turn it off.
        run: GITHUB_STEP_SUMMARY=/dev/null pnpm build:llm:deps

      - name: Prepare the prod-like build
        env:
          STARTUP_PERF_REGRESSION: ${{ needs.plan.outputs.preset == 'known-regression' && matrix.side == 'b' && 'LIVE-36190' || '' }}
        run: node .startup-perf/e2e/tooling/startup-perf/ci/prepare-build.mts

      - name: Build detoxPreRelease APK (x86_64, JS bundled)
        env:
          E2E_ANDROID_ABI: x86_64
          CARD_BAANX_API_URL: ${{ secrets.CARD_BAANX_API_URL }}
          CARD_BAANX_CLIENT_KEY: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
          CARD_BAANX_HOSTED_UI: ${{ secrets.CARD_BAANX_HOSTED_UI }}
          CARD_OAUTH_REDIRECT_URI: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}
        run: pnpm mobile e2e:build -c android.emu.prerelease

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find apps/ledger-live-mobile/android/app/build/outputs/apk/detoxPreRelease -name "*x86_64*.apk" | head -1)
          [[ -n "$APK" ]] || { echo "::error::no x86_64 detoxPreRelease APK found"; exit 1; }
          node .startup-perf/e2e/tooling/startup-perf/ci/verify-build.mts android "$APK"
          cp "$APK" out/app.apk
          git rev-parse HEAD > out/sha.txt
          ls -la out

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: startup-perf-android-${{ matrix.side }}
          path: out/
          retention-days: 7

  build-ios:
    name: "iOS build ${{ matrix.side }}"
    needs: [plan, restore-builds]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.platforms != 'Android Only' && needs.restore-builds.outputs.ios_sides != '[]' }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        side: ${{ fromJSON(needs.restore-builds.outputs.ios_sides || needs.plan.outputs.sides) }}
    runs-on: ["general-pool", macOS, ARM64]
    timeout-minutes: 150
    env:
      REF: ${{ matrix.side == 'a' && needs.plan.outputs.ref_a || needs.plan.outputs.ref_b }}
      NODE_OPTIONS: "--max-old-space-size=7168"
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REF }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: .startup-perf
          # Only ci/: the package.json beside it would clash in Nx with the ref's own copy.
          sparse-checkout: /e2e/tooling/startup-perf/ci/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # No remote caches, as in the Android build.
      - name: setup caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          skip-pod-cache: "true"
          use-mise: "true"
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-nx-cache: "true"

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        name: install dependencies
        with:
          max_attempts: 2
          timeout_minutes: 20
          command: pnpm i --frozen-lockfile --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm
          new_command_on_retry: rm -rf ~/.cocoapods/ && pnpm clean && pnpm i --frozen-lockfile --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm

      - name: Build mobile dependencies
        # Nx adds its run report to the job summary, with no setting to turn it off.
        run: GITHUB_STEP_SUMMARY=/dev/null pnpm build:llm:deps

      - name: Prepare the prod-like build
        env:
          STARTUP_PERF_REGRESSION: ${{ needs.plan.outputs.preset == 'known-regression' && matrix.side == 'b' && 'LIVE-36190' || '' }}
        run: node .startup-perf/e2e/tooling/startup-perf/ci/prepare-build.mts

      - name: Build Release simulator app (JS bundled)
        env:
          CARD_BAANX_API_URL: ${{ secrets.CARD_BAANX_API_URL }}
          CARD_BAANX_CLIENT_KEY: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
          CARD_BAANX_HOSTED_UI: ${{ secrets.CARD_BAANX_HOSTED_UI }}
          CARD_OAUTH_REDIRECT_URI: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}
        run: pnpm mobile e2e:build -c ios.sim.prerelease

      - name: Collect app
        run: |
          set -euo pipefail
          mkdir -p out
          APP=apps/ledger-live-mobile/ios/build/Build/Products/Release-iphonesimulator/ledgerlivemobile.app
          node .startup-perf/e2e/tooling/startup-perf/ci/verify-build.mts ios "$APP"
          ditto -c -k --keepParent "$APP" out/app.zip
          git rev-parse HEAD > out/sha.txt
          ls -la out

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: startup-perf-ios-${{ matrix.side }}
          path: out/
          retention-days: 7

  # Build A of a release tag, for the next runs (see restore-builds), from this run's artifacts.
  save-builds:
    name: "Cache build A"
    needs: [plan, restore-builds, build-android, build-ios]
    # Best-effort: a build that is not cached is built again by the next run.
    continue-on-error: true
    if: ${{ !cancelled() && needs.restore-builds.result == 'success' && (contains(needs.restore-builds.outputs.android_sides, '"a"') && needs.build-android.result == 'success' || contains(needs.restore-builds.outputs.ios_sides, '"a"') && needs.build-ios.result == 'success') }}
    permissions:
      id-token: write
      contents: read
    runs-on: ledger-wallet-1cpu-aws-public-cached
    steps:
      # What the cache profile's script reads.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /tools/nx/
            /nx.workspace.json
            /nx.s3.defaults.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # The E2E builds' cache: develop's role on develop, the branch role elsewhere. Without it,
      # build A is built as before: no step of the cache fails the run.
      - name: Resolve the cache role
        id: profile
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/configure-nx-remote-cache-profile@develop
        with:
          develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        continue-on-error: true
        with:
          role-to-assume: ${{ steps.profile.outputs.role-arn }}
          aws-region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Download Android build A
        if: ${{ contains(needs.restore-builds.outputs.android_sides, '"a"') && needs.build-android.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: startup-perf-android-a
          path: startup-perf-cache/android-a

      - name: Cache Android build A
        if: ${{ contains(needs.restore-builds.outputs.android_sides, '"a"') && needs.build-android.result == 'success' }}
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/upload@develop
        with:
          key: ${{ needs.restore-builds.outputs.android_key }}
          path: startup-perf-cache/android-a
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ll-nx-cache
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Download iOS build A
        if: ${{ contains(needs.restore-builds.outputs.ios_sides, '"a"') && needs.build-ios.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: startup-perf-ios-a
          path: startup-perf-cache/ios-a

      - name: Cache iOS build A
        if: ${{ contains(needs.restore-builds.outputs.ios_sides, '"a"') && needs.build-ios.result == 'success' }}
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/upload@develop
        with:
          key: ${{ needs.restore-builds.outputs.ios_key }}
          path: startup-perf-cache/ios-a
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ll-nx-cache
          region: ${{ secrets.AWS_CACHE_REGION }}

  measure-android:
    name: "Android startup (2 emulators, ${{ matrix.scenario }})"
    needs: [plan, restore-builds, build-android]
    # With build A restored, build-android is skipped when it has no side left to build.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.platforms != 'iOS Only' && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped' && needs.restore-builds.outputs.android_sides == '[]') }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    runs-on: ledger-wallet-8cpu-github-public-cached
    timeout-minutes: 300
    steps:
      - name: Read the preinstalled AVD ahead (background)
        run: |
          [ -f "${HOME}/.android/avd-cache-key" ] || exit 0
          log="${RUNNER_TEMP}/avd-read-ahead.log"
          echo "started $(date -u +%T)" > "$log"
          nohup bash -c '
            start=$(date +%s)
            find "${HOME}/.android/avd" -type f -exec cat {} + > /dev/null
            echo "read $(du -sh "${HOME}/.android/avd" | cut -f1) in $(( $(date +%s) - start ))s, done $(date -u +%T)"
          ' >> "$log" 2>&1 &

      - name: Load AVD configuration
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-avd@develop
        with:
          config_only: "true"

      - name: Setup Android Environment
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-env@develop
        with:
          # adb, build-tools and the emulator are on the image.
          install_sdk: "false"

      - name: Check for a preinstalled AVD
        id: preinstalled-avd
        run: |
          stamp="${HOME}/.android/avd-cache-key"
          if [ "$(cat "$stamp" 2>/dev/null)" = "${AVD_CACHE_KEY}" ]; then
            echo "Preinstalled AVD matches ${AVD_CACHE_KEY}"
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "$stamp" ]; then
            echo "::warning title=Runner image AVD is out of date::Image has $(cat "$stamp"), need ${AVD_CACHE_KEY}; using R2."
            rm -rf "${HOME}/.android/avd" "$stamp" \
              /usr/local/lib/android/sdk/emulator \
              "/usr/local/lib/android/sdk/system-images/android-${AVD_API}/${AVD_TARGET}/${AVD_ARCH}"
          fi
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Download android emulator
        if: steps.preinstalled-avd.outputs.found != 'true'
        timeout-minutes: 10
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@develop
        id: avd
        with:
          key: ${{ env.AVD_CACHE_KEY }}
          accessKey: "${{ secrets.R2_ACCESS_KEY_ID }}"
          secretKey: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          bucket: ledger-live-cache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          region: auto
          destination: /

      # No R2 credentials: this workflow never writes E2E's AVD cache.
      - name: Create the AVD (not on the image nor in R2)
        if: steps.preinstalled-avd.outputs.found != 'true' && steps.avd.outputs.cache-hit != 'true'
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-avd@develop

      - name: Report the AVD in use
        env:
          AVD_SOURCE: ${{ steps.preinstalled-avd.outputs.found == 'true' && 'runner image' || steps.avd.outputs.cache-hit == 'true' && 'R2' || 'created in this job' }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          {
            echo "### Android emulator ($SCENARIO)"
            echo "- AVD from: $AVD_SOURCE"
            echo "- Key: \`${AVD_CACHE_KEY}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # staging.kstr is the keystore that secrets.ANDROID_KEYSTORE_PATH points to.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/scripts/cleanup-android-emulators.sh
            /e2e/tooling/startup-perf/
            /e2e/mobile/userdata/
            /apps/ledger-live-mobile/android/app/staging.kstr

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: startup-perf-android-a
          path: builds/a

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ contains(needs.plan.outputs.sides, 'b') }}
        with:
          name: startup-perf-android-b
          path: builds/b

      - name: Sign APKs
        env:
          KS_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p "$RESULTS_DIR/android"
          for dir in builds/a builds/b; do
            [[ -f "$dir/app.apk" ]] || continue
            "$BT/zipalign" -f -p 4 "$dir/app.apk" "$dir/aligned.apk"
            # shellcheck disable=SC2086
            "$BT/apksigner" sign --v4-signing-enabled false --ks "$KS_PATH" --ks-pass $KS_PASS --ks-key-alias staging --key-pass $KS_PASS --out "$dir/signed.apk" "$dir/aligned.apk"
            echo "$dir: $(cat "$dir/sha.txt")" | tee -a "$RESULTS_DIR/android/builds.txt"
          done

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: bash e2e/tooling/startup-perf/devices/install-maestro.sh

      - name: Report the AVD read-ahead
        run: cat "${RUNNER_TEMP}/avd-read-ahead.log" 2>/dev/null || echo "No preinstalled AVD to read ahead."

      - name: Duplicate the AVD for the second emulator
        uses: LedgerHQ/ledger-live/tools/actions/composites/duplicate-avd@develop
        with:
          source_avd_name: ${{ env.AVD_NAME }}
          target_suffixes: "_2"
          avd_api: ${{ env.AVD_API }}

      - name: Boot two emulators
        run: bash e2e/tooling/startup-perf/devices/boot-emulators.sh "$RESULTS_DIR/android"

      - name: Measure
        id: measure
        env:
          SCENARIO: ${{ matrix.scenario }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
          ACCOUNTS_USERDATA: ${{ needs.plan.outputs.accounts_userdata }}
        run: |
          set -euo pipefail
          APP_A=builds/a/signed.apk
          APP_B=builds/b/signed.apk
          [[ -f "$APP_B" ]] || APP_B="$APP_A"
          node e2e/tooling/startup-perf/src/measure/run.ts \
            --platform android \
            --devices emulator-5554,emulator-5556 \
            --app-a "$APP_A" --app-b "$APP_B" --app-id "$APP_ID" \
            --scenarios "$SCENARIO" --pairs "$PAIRS" \
            --accounts-userdata "$ACCOUNTS_USERDATA" \
            --out-dir "$RESULTS_DIR/android"

      - name: Analyse
        if: ${{ always() }}
        env:
          PRESET: ${{ needs.plan.outputs.preset }}
          THRESHOLD: ${{ needs.plan.outputs.threshold_ms }}
          LABEL_A: ${{ needs.plan.outputs.label_a }}
          LABEL_B: ${{ needs.plan.outputs.label_b }}
          SCENARIOS: ${{ matrix.scenario }}
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
        run: |
          # For the Slack job: the scenarios this job measured, in order, and whether it finished.
          mkdir -p "$RESULTS_DIR/android"
          echo "android $SCENARIOS $MEASURE_OUTCOME" > "$RESULTS_DIR/android/measurement.txt"
          node e2e/tooling/startup-perf/src/analysis/analyze.ts \
            --samples "$RESULTS_DIR/android/samples.jsonl" \
            --preset "$PRESET" --threshold-ms "$THRESHOLD" \
            --label-a "$LABEL_A" --label-b "$LABEL_B" \
            --json "$RESULTS_DIR/android/summary.json"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: startup-perf-results-android-${{ matrix.scenario }}
          path: ${{ env.RESULTS_DIR }}/android
          retention-days: 30

  measure-ios:
    name: "iOS startup (2 simulators)"
    needs: [plan, restore-builds, build-ios]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.platforms != 'Android Only' && (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped' && needs.restore-builds.outputs.ios_sides == '[]') }}
    # One iOS measurement at a time on the performance pool, so two never measure side by side;
    # queue: max keeps every waiting run instead of only the latest.
    concurrency:
      group: mobile-startup-perf-ios
      cancel-in-progress: false
      queue: max
    runs-on: ["qaa", macOS, ARM64, "performance-pool"]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            e2e/tooling/startup-perf
            e2e/mobile/userdata

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Maestro needs a JDK.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: startup-perf-ios-a
          path: builds/a

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ contains(needs.plan.outputs.sides, 'b') }}
        with:
          name: startup-perf-ios-b
          path: builds/b

      - name: Unpack apps
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR/ios"
          for dir in builds/a builds/b; do
            [[ -f "$dir/app.zip" ]] || continue
            ditto -x -k "$dir/app.zip" "$dir"
            echo "$dir: $(cat "$dir/sha.txt")" | tee -a "$RESULTS_DIR/ios/builds.txt"
          done

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: bash e2e/tooling/startup-perf/devices/install-maestro.sh

      - name: Create and boot two simulators
        # Two boots and bootstatus waits of up to 5 min each, then up to 10 min of idle wait.
        timeout-minutes: 35
        run: bash e2e/tooling/startup-perf/devices/boot-simulators.sh

      - name: Measure
        id: measure
        env:
          SCENARIOS: ${{ join(fromJSON(needs.plan.outputs.scenarios), ',') }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
          ACCOUNTS_USERDATA: ${{ needs.plan.outputs.accounts_userdata }}
        run: |
          set -euo pipefail
          APP_A=builds/a/ledgerlivemobile.app
          APP_B=builds/b/ledgerlivemobile.app
          [[ -d "$APP_B" ]] || APP_B="$APP_A"
          node e2e/tooling/startup-perf/src/measure/run.ts \
            --platform ios \
            --devices "$SIM_1,$SIM_2" \
            --app-a "$APP_A" --app-b "$APP_B" --app-id "$APP_ID" \
            --scenarios "$SCENARIOS" --pairs "$PAIRS" \
            --accounts-userdata "$ACCOUNTS_USERDATA" \
            --out-dir "$RESULTS_DIR/ios"

      - name: Analyse
        if: ${{ always() }}
        env:
          PRESET: ${{ needs.plan.outputs.preset }}
          THRESHOLD: ${{ needs.plan.outputs.threshold_ms }}
          LABEL_A: ${{ needs.plan.outputs.label_a }}
          LABEL_B: ${{ needs.plan.outputs.label_b }}
          SCENARIOS: ${{ join(fromJSON(needs.plan.outputs.scenarios), ',') }}
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
        run: |
          # For the Slack job: the scenarios this job measured, in order, and whether it finished.
          mkdir -p "$RESULTS_DIR/ios"
          echo "ios $SCENARIOS $MEASURE_OUTCOME" > "$RESULTS_DIR/ios/measurement.txt"
          node e2e/tooling/startup-perf/src/analysis/analyze.ts \
            --samples "$RESULTS_DIR/ios/samples.jsonl" \
            --preset "$PRESET" --threshold-ms "$THRESHOLD" \
            --label-a "$LABEL_A" --label-b "$LABEL_B" \
            --json "$RESULTS_DIR/ios/summary.json"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ always() }}
        with:
          name: startup-perf-results-ios
          path: ${{ env.RESULTS_DIR }}/ios
          retention-days: 30

  report-on-slack:
    name: "Slack report"
    needs: [plan, restore-builds, build-android, build-ios, measure-android, measure-ios]
    # As for the mobile E2E runs: every run posts to their results channel, passed or failed, and
    # the nightly or a dispatch with slack_notif to #live-repo-health too. A run cancelled by hand
    # posts nothing; a job that times out ends cancelled but still gets posted.
    if: ${{ !cancelled() && needs.plan.result != 'skipped' }}
    runs-on: ledger-wallet-1cpu-aws-public-cached
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: /e2e/tooling/startup-perf/ci/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # None when no measure job reached its analysis: the message then says why.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: startup-perf-results-*
          path: ${{ env.RESULTS_DIR }}

      - name: Write the message
        id: message
        env:
          SLACK_CHANNEL: CTMQ0S5SB
          SLACK_SECONDARY_CHANNEL: ${{ (github.event_name == 'schedule' || inputs.slack_notif) && 'C05FKJ7DFAP' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PRESET: ${{ needs.plan.outputs.preset }}
          THRESHOLD: ${{ needs.plan.outputs.threshold_ms }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
          LABEL_A: ${{ needs.plan.outputs.label_a }}
          LABEL_B: ${{ needs.plan.outputs.label_b }}
          SCENARIOS: ${{ needs.plan.outputs.scenarios }}
          PLAN: ${{ needs.plan.result }}
          # A build job with no side left to build, all restored, counts as built.
          ANDROID_BUILD: ${{ needs.build-android.result == 'skipped' && needs.restore-builds.outputs.android_sides == '[]' && 'success' || needs.build-android.result }}
          ANDROID_MEASURE: ${{ needs.measure-android.result }}
          IOS_BUILD: ${{ needs.build-ios.result == 'skipped' && needs.restore-builds.outputs.ios_sides == '[]' && 'success' || needs.build-ios.result }}
          IOS_MEASURE: ${{ needs.measure-ios.result }}
        run: node e2e/tooling/startup-perf/ci/slack-report.mts

      # The mobile E2E runs' bot, which posts to both channels. A post Slack rejects fails the job.
      - name: Post to the mobile E2E results channel
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          errors: true
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          payload-file-path: ${{ github.workspace }}/slack-payload.json

      # Even when the first post failed.
      - name: Post to the live-repo-health channel
        if: ${{ !cancelled() && steps.message.outcome == 'success' && (github.event_name == 'schedule' || inputs.slack_notif) }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          errors: true
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          payload-file-path: ${{ github.workspace }}/slack-payload-secondary.json

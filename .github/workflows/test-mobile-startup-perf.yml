name: "[Mobile] - Startup Performance - Scheduled/Manual"
run-name: "@Mobile startup perf • KVM probe • ${{ github.ref_name }} • ${{ github.actor }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: "KVM probe ${{ matrix.runner }}"
    strategy:
      fail-fast: false
      matrix:
        runner: [ledger-wallet-16cpu-aws-public-cached, ledger-wallet-8cpu-github-public-cached]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          ls -l /dev/kvm || echo "no /dev/kvm"
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo "/dev/kvm readable and writable"; fi
          echo "vmx/svm CPU flags: $(grep -c -w -E 'vmx|svm' /proc/cpuinfo || true)"
          ls /sys/module | grep -E '^kvm' || echo "no kvm modules"
          echo "nproc: $(nproc)"
          echo "cgroup cpu.max: $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unknown)"
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket|Hypervisor vendor|Virtualization)' || true
          free -g
          id

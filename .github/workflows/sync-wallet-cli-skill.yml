name: "[Wallet CLI] - Sync Skill - Push"

on:
  push:
    branches:
      - develop
    paths:
      - ".agents/skills/ledger-wallet-cli/**"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "ledger-live ref to sync from (defaults to triggering commit)"
        required: false
      target_base:
        description: "agent-skills base branch"
        required: false
        default: main
      sync_branch:
        description: "agent-skills branch updated by this workflow"
        required: false
        default: sync/wallet-cli-skill

concurrency:
  group: sync-wallet-cli-skill
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-wallet-cli-skill:
    name: Sync wallet-cli skill
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SKILL_DIR: .agents/skills/ledger-wallet-cli
      TARGET_REPOSITORY: LedgerHQ/agent-skills
      TARGET_BASE: ${{ inputs.target_base || 'main' }}
      SYNC_BRANCH: ${{ inputs.sync_branch || 'sync/wallet-cli-skill' }}
      TARGET_SKILL_DIR: skills/wallet-cli/wallet-cli-usage
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          repositories: |
            ledger-live
            agent-skills

      - name: Checkout ledger-live
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          token: ${{ steps.generate-token.outputs.token }}
          path: ledger-live

      - name: Checkout agent-skills
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_BASE }}
          token: ${{ steps.generate-token.outputs.token }}
          path: agent-skills

      - name: Export wallet-cli skill
        run: |
          set -euo pipefail

          source_skill_dir="$GITHUB_WORKSPACE/ledger-live/$SOURCE_SKILL_DIR"
          target_skill_dir="$GITHUB_WORKSPACE/agent-skills/$TARGET_SKILL_DIR"

          rm -rf "$target_skill_dir"
          mkdir -p "$target_skill_dir"

          cp -R "$source_skill_dir/references" "$target_skill_dir/references"

          sed -E \
            -e 's|^name: ledger-wallet-cli$|name: wallet-cli-usage|' \
            -e 's|Run from repo root: `pnpm --silent wallet-cli start <command> \[flags\]`|Install globally with a user-preferred package manager — `npm i -g @ledgerhq/wallet-cli`, `pnpm add -g @ledgerhq/wallet-cli`, `yarn global add @ledgerhq/wallet-cli`, or `bun add -g @ledgerhq/wallet-cli`. Run: `wallet-cli [flags]`.|' \
            -e 's|pnpm --silent wallet-cli start ?|wallet-cli |g' \
            "$source_skill_dir/SKILL.md" > "$target_skill_dir/SKILL.md"

          if grep -Fq "pnpm --silent wallet-cli start" "$target_skill_dir/SKILL.md"; then
            echo "Exported skill still contains monorepo-only wallet-cli commands."
            exit 1
          fi

          if grep -Fq "Run from repo root" "$target_skill_dir/SKILL.md"; then
            echo "Exported skill still contains monorepo-only run instructions."
            exit 1
          fi

          if ! grep -Fq "name: wallet-cli-usage" "$target_skill_dir/SKILL.md"; then
            echo "Exported skill frontmatter does not match the agent-skills skill name."
            exit 1
          fi

          if [ ! -f "$target_skill_dir/references/business-logic.md" ]; then
            echo "Exported skill is missing references/business-logic.md."
            exit 1
          fi

      # Commits are created through the GitHub API (not `git commit`) so that
      # GitHub signs them server-side — agent-skills' `main` ruleset requires
      # signed commits, which a local push from the bot token cannot satisfy.
      #
      # NOTE: $SYNC_BRANCH is fully managed by this workflow: it is reset to the
      # base branch tip and rewritten on every run. Do not commit to it
      # directly — manual commits will be lost.
      - name: Create signed commit
        id: commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const fs = require("fs");
            const path = require("path");
            const { execFileSync } = require("child_process");

            const repoDir = "agent-skills";
            const targetSkillDir = process.env.TARGET_SKILL_DIR;
            const targetRepository = process.env.TARGET_REPOSITORY;
            const [owner, repo] = targetRepository.split("/");
            const baseBranch = process.env.TARGET_BASE;
            const syncBranch = process.env.SYNC_BRANCH;

            const git = (args) =>
              execFileSync("git", args, { cwd: repoDir, maxBuffer: 64 * 1024 * 1024 });

            // Stage the exported skill so a single diff captures every addition,
            // modification, and deletion under the target directory.
            git(["add", "-A", "--", targetSkillDir]);

            const statusZ = git([
              "diff", "--cached", "--name-status", "-z", "--no-renames",
            ]).toString("utf8");
            const records = statusZ.split("\0").filter((entry) => entry.length > 0);

            const additions = [];
            const deletions = [];
            for (let i = 0; i < records.length; i += 2) {
              const status = records[i];
              const filePath = records[i + 1];
              if (status === "D") {
                deletions.push({ path: filePath });
              } else {
                const contents = fs.readFileSync(path.join(repoDir, filePath)).toString("base64");
                additions.push({ path: filePath, contents });
              }
            }

            if (additions.length === 0 && deletions.length === 0) {
              core.setOutput("changed", "false");
              core.info("No agent-skills changes to sync.");
              return;
            }

            const upsertBranchRef = async (branch, sha) => {
              const ref = `heads/${branch}`;
              try {
                await github.rest.git.getRef({ owner, repo, ref });
                await github.rest.git.updateRef({ owner, repo, ref, sha, force: true });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({ owner, repo, ref: `refs/${ref}`, sha });
              }
            };

            const baseSha = (
              await github.rest.repos.getBranch({ owner, repo, branch: baseBranch })
            ).data.commit.sha;

            // Build the signed commit on a throwaway branch, then move the sync
            // branch to it in a single update (old head -> new commit). Pointing
            // the sync branch itself at the base tip first would briefly make its
            // head an ancestor of the base, which auto-closes the open PR and
            // leaves the next step creating a duplicate.
            const buildBranch = `${syncBranch}-build`;
            await upsertBranchRef(buildBranch, baseSha);

            try {
              const { createCommitOnBranch } = await github.graphql(
                `mutation ($input: CreateCommitOnBranchInput!) {
                  createCommitOnBranch(input: $input) { commit { oid } }
                }`,
                {
                  input: {
                    branch: {
                      repositoryNameWithOwner: targetRepository,
                      branchName: buildBranch,
                    },
                    expectedHeadOid: baseSha,
                    message: { headline: "chore: sync wallet-cli skill" },
                    fileChanges: { additions, deletions },
                  },
                },
              );
              await upsertBranchRef(syncBranch, createCommitOnBranch.commit.oid);
            } finally {
              await github.rest.git
                .deleteRef({ owner, repo, ref: `heads/${buildBranch}` })
                .catch((error) =>
                  core.warning(`Could not delete build branch ${buildBranch}: ${error.message}`),
                );
            }

            core.setOutput("changed", "true");

      - name: Open or update pull request
        if: steps.commit.outputs.changed == 'true'
        working-directory: agent-skills
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail

          body=$(cat <<EOF
          Syncs the wallet-cli skill from LedgerHQ/ledger-live.

          Source commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )

          pr_number=$(gh pr list \
            --repo "$TARGET_REPOSITORY" \
            --head "$SYNC_BRANCH" \
            --base "$TARGET_BASE" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --repo "$TARGET_REPOSITORY" \
              --body "$body"
          else
            gh pr create \
              --repo "$TARGET_REPOSITORY" \
              --base "$TARGET_BASE" \
              --head "$SYNC_BRANCH" \
              --title "chore: sync wallet-cli skill" \
              --body "$body"
          fi

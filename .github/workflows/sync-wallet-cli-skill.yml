name: "[Wallet CLI] - Sync Plugin"

# Run by hand once a wallet-cli release is on npm, with the ref it was published
# from. The manifests carry that release's version, and agents pin a plugin by
# version, so a sync from develop would ship unreleased flags under the last
# released number and leave them on users' machines until the next bump.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "ledger-live ref the wallet-cli release was published from"
        required: true
      target_base:
        description: "agent-skills base branch"
        required: false
        default: main
      sync_branch:
        description: "agent-skills branch updated by this workflow"
        required: false
        default: sync/wallet-cli-skill

concurrency:
  group: sync-wallet-cli-skill
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-wallet-cli-skill:
    name: Sync wallet-cli plugin
    runs-on: ledger-wallet-4cpu-aws-public-docker
    timeout-minutes: 10
    env:
      TARGET_REPOSITORY: LedgerHQ/agent-skills
      TARGET_BASE: ${{ inputs.target_base || 'main' }}
      SYNC_BRANCH: ${{ inputs.sync_branch || 'sync/wallet-cli-skill' }}
      # Pathspecs staged here and passed as file_pattern, which ghcommit-action
      # splits on spaces and hands to `git status --`. The whole tree, so a new
      # manifest needs no edit here, minus the nested ledger-live checkout (it
      # would be staged as a gitlink) and the paths agent-skills maintains by
      # hand (skills/wallet-cli/README.md holds the wallet-cli legal notice), so a
      # stray export file can't overwrite them.
      SYNC_PATHSPEC: ". :(exclude)ledger-live :(exclude)README.md :(exclude).github :(exclude)skills/dmk :(exclude)skills/wallet-cli/README.md"
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          repositories: |
            ledger-live
            agent-skills
          permission-contents: write
          permission-pull-requests: write

      # agent-skills is checked out at the workspace root because
      # planetscale/ghcommit-action reads the working tree from $GITHUB_WORKSPACE.
      # It is checked out first so the ledger-live checkout below can nest under
      # it without being wiped by git clean.
      - name: Checkout agent-skills
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_BASE }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Checkout ledger-live
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          token: ${{ steps.generate-token.outputs.token }}
          path: ledger-live
          persist-credentials: false

      # The plugin export writes the manifests to the agent-skills root and the
      # skill to skills/wallet-cli-usage through the same transform as the copy
      # embedded in the binary — as a `sed` pipeline here it drifted. The scripts
      # assert their own output, so no bash checks are needed. Keep them
      # stdlib-only: the runner has node, but no pnpm install runs here.
      # The same skill also goes to skills/wallet-cli/wallet-cli-usage, where it
      # lived before the plugin, because developers.ledger.com links that path.
      - name: Export wallet-cli plugin
        run: |
          set -euo pipefail

          scripts="$GITHUB_WORKSPACE/ledger-live/apps/wallet-cli/scripts"
          node "$scripts/export-agent-plugin.mjs" "$GITHUB_WORKSPACE"
          # todo: two copies of one skill; drop this once developers.ledger.com links skills/wallet-cli-usage
          node "$scripts/export-standalone-skill.mjs" \
            "$GITHUB_WORKSPACE/ledger-live/.agents/skills/ledger-wallet-cli" \
            "$GITHUB_WORKSPACE/skills/wallet-cli/wallet-cli-usage"

      # ghcommit-action (below) creates the commit through GitHub's API so it is
      # signed server-side — agent-skills' `main` ruleset requires signed commits.
      # Stage the export first: the action skips untracked files, so new plugin
      # files must be in the index to be committed; the staged diff also drives
      # the no-op check that leaves any open sync PR untouched.
      - name: Stage exported plugin
        id: stage
        run: |
          set -euo pipefail

          read -r -a pathspec <<<"$SYNC_PATHSPEC"
          git add -A -- "${pathspec[@]}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No agent-skills changes to sync."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Reset the managed branch to the base tip so the single ghcommit-action
      # commit lands on top (branch = base + one commit), matching the release
      # workflows. NOTE: $SYNC_BRANCH is fully managed and rewritten on every
      # run — do not commit to it directly, manual commits will be lost.
      - name: Reset sync branch to base
        if: steps.stage.outputs.changed == 'true'
        run: |
          set -euo pipefail

          remote_sha=$(git ls-remote --heads origin "$SYNC_BRANCH" | awk '{print $1}')
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$SYNC_BRANCH:$remote_sha" origin "HEAD:refs/heads/$SYNC_BRANCH"
          else
            git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          fi

      - name: Create signed commit
        id: commit
        if: steps.stage.outputs.changed == 'true'
        uses: planetscale/ghcommit-action@c6125dee9e9c0daebc4adea9f68ead8293414174 # v0.2.9
        with:
          commit_message: "chore: sync wallet-cli plugin"
          repo: ${{ env.TARGET_REPOSITORY }}
          branch: ${{ env.SYNC_BRANCH }}
          file_pattern: ${{ env.SYNC_PATHSPEC }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Open or update pull request
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail

          # Set on edit too, so a PR opened under an older title follows.
          title="chore: sync wallet-cli plugin"
          source_sha=$(git -C ledger-live rev-parse HEAD)
          body=$(cat <<EOF
          Syncs the wallet-cli plugin from LedgerHQ/ledger-live.

          Source commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${source_sha}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )

          open_pr=$(gh pr list \
            --repo "$TARGET_REPOSITORY" \
            --head "$SYNC_BRANCH" \
            --base "$TARGET_BASE" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --repo "$TARGET_REPOSITORY" --title "$title" --body "$body"
            exit 0
          fi

          # Resetting the branch to base momentarily leaves it with no commits
          # ahead of base, which auto-closes an open sync PR. Reopen that PR
          # instead of opening a duplicate.
          closed_pr=$(gh pr list \
            --repo "$TARGET_REPOSITORY" \
            --head "$SYNC_BRANCH" \
            --base "$TARGET_BASE" \
            --state closed \
            --json number,state \
            --jq 'map(select(.state == "CLOSED")) | .[0].number // empty')

          if [ -n "$closed_pr" ]; then
            gh pr reopen "$closed_pr" --repo "$TARGET_REPOSITORY"
            gh pr edit "$closed_pr" --repo "$TARGET_REPOSITORY" --title "$title" --body "$body"
          else
            gh pr create \
              --repo "$TARGET_REPOSITORY" \
              --base "$TARGET_BASE" \
              --head "$SYNC_BRANCH" \
              --title "$title" \
              --body "$body"
          fi

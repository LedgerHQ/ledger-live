# Bundle analysis via Rsdoctor
# https://github.com/web-infra-dev/rsdoctor-action

name: "[Rsdoctor] - Bundle reports - Called"

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref to run (branch, tag, or SHA)"
        type: string
        required: false
    secrets:
      AWS_ACCOUNT_ID_PROD:
        required: true
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH:
        required: true
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP:
        required: true
      AWS_CACHE_REGION:
        required: true
      AWS_CACHE_ROLE_NAME:
        required: true
      NX_KEY:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to run (branch, tag, or SHA)"
        type: string
        required: false

permissions:
  contents: read

env:
  NODE_OPTIONS: "--max-old-space-size=8192"
  CI: "true"

jobs:
  rsdoctor:
    name: "Rsdoctor (Desktop + Mobile)"
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
      actions: read
    runs-on: ledger-wallet-8cpu-aws-public-cached
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 80
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: setup-caches
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      # Before the install so every package is fetched through JFrog, not public npm.
      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build desktop dependencies
        run: pnpm build:lld:deps

      - name: Build with Rsdoctor (Desktop)
        run: pnpm --filter ledger-live-desktop run doctor

      - name: Build mobile dependencies
        run: pnpm build:llm:deps

      - name: Build with Rsdoctor (Mobile)
        run: pnpm --filter live-mobile run doctor

      - name: Bundle Analysis (Desktop + Mobile)
        uses: web-infra-dev/rsdoctor-action@21f1a9449eedfb4a7ce0f39a0004b950e616d489 # v1.2.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          file_path: rsdoctor/*/rsdoctor-data.json
          target_branch: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}

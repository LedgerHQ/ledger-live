name: "[TMP] Determine Builds timing"

on:
  push:
    branches:
      - ci/determine-builds-1cpu-timing

permissions:
  contents: read

env:
  cache-bucket: ll-nx-cache
  ANDROID_APK_PATH: apps/ledger-live-mobile/android/app/build/outputs/apk/detox/app-x86_64-detox.apk
  ANDROID_JSBUNDLE_PATH: apps/ledger-live-mobile/main.jsbundle
  IOS_JSBUNDLE_PATH: apps/ledger-live-mobile/ios/build/Build/Products/Release-iphonesimulator/ledgerlivemobile.app/main.jsbundle
  IOS_NATIVE_PATH: apps/ledger-live-mobile/ios/build/Build/Products/Release-iphonesimulator
  # Android AVD configuration (shared by determine-builds cache key + Detox Android job)
  AVD_API: 36
  AVD_ARCH: x86_64
  AVD_PROFILE: pixel_9_pro
  AVD_TARGET: google_apis
  AVD_NAME: "Android_Emulator"
  AVD_CORES: 4
  AVD_RAM_SIZE: 5120
  AVD_HEAP_SIZE: 1024
  AVD_OPTIONS: -no-window -gpu swiftshader_indirect -accel on -no-audio -no-boot-anim -camera-back none -camera-front none -no-metrics
  E2E_TEST_RESULTS_PREFIX_IOS: e2e-test-results-ios
  E2E_TEST_RESULTS_PREFIX_ANDROID: e2e-test-results-android
jobs:
  determine-builds:
    name: "Determine Builds setup-caches (${{ matrix.runner }} #${{ matrix.attempt }})"
    permissions:
      id-token: write
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ledger-wallet-1cpu-aws-public, ubuntu-22.04]
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false
          sparse-checkout: |
            apps/ledger-live-mobile
            e2e/mobile
            e2e/tooling
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .pnpmfile.cjs
            tools
            .mise/tasks

      - name: Determine cache keys
        id: cache-keys
        env:
          REF_NAME: ${{ github.ref_name }}
          MAX_SHARDS: 2
          MACOS_RUNNER_LABEL: general-pool
        run: |
          PREFIX=""
          if [ "$REF_NAME" = "develop" ]; then
            PREFIX="develop/"
          fi
          echo "ios_native_key=${PREFIX}longterm-${{ hashFiles('apps/ledger-live-mobile/ios') }}-detox-native-ios-3" >> $GITHUB_OUTPUT
          echo "android_native_key=${PREFIX}longterm-${{ hashFiles('apps/ledger-live-mobile/android', 'apps/ledger-live-mobile/package.json', 'pnpm-workspace.yaml') }}-detox-native-android-3" >> $GITHUB_OUTPUT
          HEAD_SHA=$(git rev-parse HEAD)
          echo "ios_js_key=${PREFIX}${HEAD_SHA}-detox-js-ios" >> $GITHUB_OUTPUT
          echo "android_js_key=${PREFIX}${HEAD_SHA}-detox-js-android" >> $GITHUB_OUTPUT
          echo "android_timing_cache_key=${PREFIX}android-mock-timing-${{ hashFiles('apps/ledger-live-mobile/e2e') }}-${MAX_SHARDS}shards" >> $GITHUB_OUTPUT
          echo "ios_timing_cache_key=${PREFIX}ios-mock-timing-${{ hashFiles('apps/ledger-live-mobile/e2e') }}-${MAX_SHARDS}shards-$MACOS_RUNNER_LABEL" >> $GITHUB_OUTPUT
          echo "pod_check_key=${{ hashFiles('apps/ledger-live-mobile/ios/Podfile.lock', 'apps/ledger-live-mobile/ios/Podfile', 'pnpm-lock.yaml') }}-pod-lockfile-validated" >> $GITHUB_OUTPUT
          echo "KEYS ios_native=${{ hashFiles('apps/ledger-live-mobile/ios') }} android_native=${{ hashFiles('apps/ledger-live-mobile/android', 'apps/ledger-live-mobile/package.json', 'pnpm-workspace.yaml') }} pod=${{ hashFiles('apps/ledger-live-mobile/ios/Podfile.lock', 'apps/ledger-live-mobile/ios/Podfile', 'pnpm-lock.yaml') }} head=$HEAD_SHA"
          echo "avd_cache_key=${{ runner.os }}-detox-avd-${{ env.AVD_NAME }}-${{ env.AVD_PROFILE }}-${{ env.AVD_TARGET }}-${{ env.AVD_API }}-${{ env.AVD_ARCH }}-${{ env.AVD_CORES }}-${{ env.AVD_RAM_SIZE }}-${{ env.AVD_HEAP_SIZE }}-r2-v8" >> $GITHUB_OUTPUT

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@ci/determine-builds-1cpu-timing
        id: setup-caches
        with:
          use-mise: true
          skip-pnpm-cache: "true"
          skip-pod-cache: "true"
          skip-nx-cache: "true"

          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Verify mise environment
        run: |
          command -v node pnpm
          node --version
          echo "BIN_PATH=$BIN_PATH PROJECT_NAME=$PROJECT_NAME HK_MISE=$HK_MISE MISE_YES=$MISE_YES MISE_EXPERIMENTAL=$MISE_EXPERIMENTAL"
          echo "$PATH" | tr ':' '\n' | head -6

      - name: Generate shards matrix and test files
        id: generate-shards
        uses: LedgerHQ/ledger-live/tools/actions/composites/generate-shards-matrix@develop
        with:
          test_directory: apps/ledger-live-mobile/e2e
          event_name: ${{ github.event_name }}
          ref: ${{ github.ref_name }}
          ios_timing_cache_key: ${{ steps.cache-keys.outputs.ios_timing_cache_key }}
          android_timing_cache_key: ${{ steps.cache-keys.outputs.android_timing_cache_key }}
          aws_access_key_id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ env.AWS_SESSION_TOKEN }}
          cache_bucket: ${{ env.cache-bucket }}
          aws_region: ${{ secrets.AWS_CACHE_REGION }}
          max_shards: 2

      - name: Check if Android AVD cache exists
        id: check-avd
        if: ${{ steps.generate-shards.outputs.matrix_android != '[]' }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/exists@develop
        with:
          key: ${{ steps.cache-keys.outputs.avd_cache_key }}
          accessKey: ${{ secrets.R2_ACCESS_KEY_ID }}
          secretKey: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ledger-live-cache
          endpoint: ${{ secrets.R2_ENDPOINT }}
          region: auto

      - name: Check if iOS Native Build exists already
        id: check-ios-native
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.ios_native_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if Android Native Build exists already
        id: check-android-native
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.android_native_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if iOS JS Build exists already
        id: check-ios-js
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.ios_js_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if Android JS Build exists already
        id: check-android-js
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.android_js_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if pod lockfile has been validated
        id: check-lockfile-status
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.pod_check_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

  determine-builds-refined:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: "Determine Builds refined (#${{ matrix.attempt }})"
    permissions:
      id-token: write
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ledger-wallet-1cpu-aws-public]
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false
          sparse-checkout: |
            apps/ledger-live-mobile/ios
            apps/ledger-live-mobile/android

      - name: Determine cache keys
        id: cache-keys
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PREFIX=""
          if [ "$REF_NAME" = "develop" ]; then
            PREFIX="develop/"
          fi
          echo "ios_native_key=${PREFIX}longterm-${{ hashFiles('apps/ledger-live-mobile/ios') }}-detox-native-ios-3" >> $GITHUB_OUTPUT
          echo "android_native_key=${PREFIX}longterm-${{ hashFiles('apps/ledger-live-mobile/android', 'apps/ledger-live-mobile/package.json', 'pnpm-workspace.yaml') }}-detox-native-android-3" >> $GITHUB_OUTPUT
          HEAD_SHA=$(git rev-parse HEAD)
          echo "ios_js_key=${PREFIX}${HEAD_SHA}-detox-js-ios" >> $GITHUB_OUTPUT
          echo "android_js_key=${PREFIX}${HEAD_SHA}-detox-js-android" >> $GITHUB_OUTPUT
          echo "pod_check_key=${{ hashFiles('apps/ledger-live-mobile/ios/Podfile.lock', 'apps/ledger-live-mobile/ios/Podfile', 'pnpm-lock.yaml') }}-pod-lockfile-validated" >> $GITHUB_OUTPUT
          echo "KEYS ios_native=${{ hashFiles('apps/ledger-live-mobile/ios') }} android_native=${{ hashFiles('apps/ledger-live-mobile/android', 'apps/ledger-live-mobile/package.json', 'pnpm-workspace.yaml') }} pod=${{ hashFiles('apps/ledger-live-mobile/ios/Podfile.lock', 'apps/ledger-live-mobile/ios/Podfile', 'pnpm-lock.yaml') }} head=$HEAD_SHA"
          echo "FILES $(find . -type f -not -path "./.git/*" | wc -l)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/develop' && secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP || secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          aws-region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Check if iOS Native Build exists already
        id: check-ios-native
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.ios_native_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if Android Native Build exists already
        id: check-android-native
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.android_native_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if iOS JS Build exists already
        id: check-ios-js
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.ios_js_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if Android JS Build exists already
        id: check-android-js
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.android_js_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if pod lockfile has been validated
        id: check-lockfile-status
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          key: ${{ steps.cache-keys.outputs.pod_check_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

  probe-mise:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: "Probe mise (#${{ matrix.attempt }})"
    runs-on: ledger-wallet-1cpu-aws-public
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    steps:
      - name: Inspect pre-installed mise
        run: |
          echo "MISE_DATA_DIR=${MISE_DATA_DIR:-<unset>} XDG_DATA_HOME=${XDG_DATA_HOME:-<unset>} HOME=$HOME"
          echo "PATH=$PATH"
          command -v mise && mise --version || echo "mise not on PATH"
          for d in "${MISE_DATA_DIR:-$HOME/.local/share/mise}" /usr/local/bin /opt/mise; do echo "== $d"; ls -la "$d" 2>&1 | head -20; done
          ls -la "${MISE_DATA_DIR:-$HOME/.local/share/mise}/installs" 2>&1 | head -30
          du -sh "${MISE_DATA_DIR:-$HOME/.local/share/mise}" 2>&1
          env | grep -i mise || true

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .mise/tasks

      - name: mise-action without cache
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: "2026.9.1"
          install: true
          cache: false
          reshim: true
          experimental: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: After
        run: |
          mise ls
          command -v node pnpm && node --version && pnpm --version

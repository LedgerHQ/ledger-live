name: "[Coin] - Coin Tester - Scheduled and Manual"

on:
  schedule:
    - cron: "9 16 * * 1-5"

  pull_request:
    branches-ignore:
      - "smartling-content-updated**"
      - "smartling-translation-completed**"
  workflow_dispatch:
    inputs:
      chain:
        description: 'Coin family to test, separated with commas (,), or "all" to run all coins (default)'
        required: false
        default: "all"

permissions:
  contents: read

env:
  COIN_TESTER_CURRENCIES: "evm polkadot solana bitcoin tezos tron xrp stellar multiversx cosmos cardano casper vechain near stacks"

jobs:
  is-affected:
    runs-on: ubuntu-22.04
    outputs:
      is-affected: ${{ steps.detect.outputs.is-affected }}
      matrix: ${{ steps.detect.outputs.matrix }}
    permissions:
      pull-requests: read
    steps:
      - name: Run live-common-affected
        uses: LedgerHQ/ledger-live/tools/actions/composites/live-common-affected@develop
        id: affected

      - name: Build matrix from affected paths or manual input
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHAIN_INPUT: ${{ github.event.inputs.chain }}
          AFFECTED_PATHS: ${{ steps.affected.outputs.paths }}
        run: |
          CHAINS=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$CHAIN_INPUT" != "" ]]; then
            if [[ "$CHAIN_INPUT" == "all" ]]; then
              for coin in $COIN_TESTER_CURRENCIES; do
                CHAINS+=("$coin")
              done
            else
              IFS=',' read -ra CHAINS <<< "$CHAIN_INPUT"
            fi
          elif echo "$AFFECTED_PATHS" | grep -qE "(^|/| )coin-tester(/| |$)"; then
            echo "Detected base coin-tester → adding all coins"
            for coin in $COIN_TESTER_CURRENCIES; do
              CHAINS+=("$coin")
            done
          else
            # Otherwise, only add coins that appear individually
            for coin in $COIN_TESTER_CURRENCIES; do
              if echo "$AFFECTED_PATHS" | grep -qw "$coin"; then
                CHAINS+=("$coin")
              fi
            done
          fi
          # If it's a scheduled job and no chain is detected, run all chains by default
          if [ "$EVENT_NAME" == "schedule" ] && [ ${#CHAINS[@]} -eq 0 ]; then
            for coin in $COIN_TESTER_CURRENCIES; do
              CHAINS+=("$coin")
            done
            CHAIN_JSON=$(printf '%s\n' "${CHAINS[@]}" | jq -R . | jq -cs '{chain: .}')
            echo "matrix=${CHAIN_JSON}" >> "$GITHUB_OUTPUT"
            echo "is-affected=true" >> $GITHUB_OUTPUT
          elif [ ${#CHAINS[@]} -eq 0 ]; then
            echo "matrix={\"chain\":[]}" >> $GITHUB_OUTPUT
            echo "is-affected=false" >> $GITHUB_OUTPUT
          else
            CHAIN_JSON=$(printf '%s\n' "${CHAINS[@]}" | jq -R . | jq -cs '{chain: .}')
            echo "matrix=${CHAIN_JSON}" >> $GITHUB_OUTPUT
            echo "is-affected=true" >> $GITHUB_OUTPUT
          fi

      - name: Debug affected paths (for troubleshooting)
        env:
          AFFECTED_PATHS: ${{ steps.affected.outputs.paths }}
          IS_AFFECTED: ${{ steps.detect.outputs.is-affected }}
          MATRIX: ${{ steps.detect.outputs.matrix }}
        run: |
          echo "Affected paths: $AFFECTED_PATHS"
          echo "Is affected: $IS_AFFECTED"
          echo "Matrix: $MATRIX"

  coin-tester:
    name: Coin Tester - ${{ matrix.chain }}
    needs: is-affected
    if: ${{ needs.is-affected.outputs.is-affected == 'true' }}
    runs-on: public-ledgerhq-shared-small
    permissions:
      id-token: write
      contents: read
    continue-on-error: true

    strategy:
      matrix:
        chain: ${{ fromJson(needs.is-affected.outputs.matrix).chain }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Login to Ledger Artifactory
        id: jfrog-login
        timeout-minutes: 10
        uses: LedgerHQ/actions-security/actions/jfrog-login@actions/jfrog-login-1

      - name: Login to JFrog OCI Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: jfrog.ledgerlabs.net/bbs-oci-prod-green
          username: ${{ steps.jfrog-login.outputs.oidc-user }}
          password: ${{ steps.jfrog-login.outputs.oidc-token }}

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Setup environment
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-coin-tester-env@develop

      - name: Diagnose Docker networking (temporary)
        if: matrix.chain == 'stacks'
        shell: bash
        run: |
          echo "--- is this job's own process running inside a container? ---"
          ls -la /.dockerenv 2>&1 || echo "/.dockerenv absent"
          cat /proc/self/cgroup 2>&1 || echo "no /proc/self/cgroup"
          echo "--- network view from this job's process ---"
          hostname
          hostname -I 2>&1 || true
          uname -m 2>&1 || true
          echo "--- docker daemon info ---"
          docker info 2>&1 || true
          docker version 2>&1 || true
          # Background poller: bitcoin-node's container only exists transiently during the coin-
          # tester run, so capture its state (running? crash-looping? published ports? IP?) while
          # the test is still going, not after clarinet has already torn the network down on
          # failure. `docker logs` is the most direct signal -- bitcoind's own stdout/stderr, which
          # tells us if the process itself ever came up at all vs. a pure networking/reachability
          # problem once it's already listening.
          nohup bash -c '
            while true; do
              echo "=== $(date) ===";
              docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" 2>&1;
              echo "--- bitcoin-node inspect (network + ports, raw JSON) ---";
              docker inspect bitcoin-node.coin-tester-stacks.devnet --format "{{json .NetworkSettings}}" 2>&1;
              echo "--- bitcoin-node logs (own stdout/stderr) ---";
              docker logs --tail 30 bitcoin-node.coin-tester-stacks.devnet 2>&1;
              sleep 5;
            done
          ' > /tmp/network-diag.log 2>&1 &
          echo "started background network diagnostic poller (pid $!)"

      - name: Run Coin Tester
        uses: LedgerHQ/ledger-live/tools/actions/composites/run-coin-tester@develop
        env:
          # Temporary diagnostic: surfaces the clarinet/docker devnet boot output on CI for the
          # stacks coin-tester, which is otherwise silent (stdio: "ignore" unless DEBUG is set) --
          # investigating a "devnet never became ready" timeout on this runner. Remove once diagnosed.
          DEBUG: ${{ matrix.chain == 'stacks' && '1' || '' }}
        with:
          chain: ${{ matrix.chain }}

      - name: Show network diagnostics (temporary)
        if: always() && matrix.chain == 'stacks'
        shell: bash
        run: |
          echo "--- background poller log (may be empty if it didn't survive across steps) ---"
          cat /tmp/network-diag.log 2>&1 || echo "no diagnostic log captured"
          echo "--- direct, guaranteed-to-run fallback: bitcoin-node's own logs right now ---"
          docker logs bitcoin-node.coin-tester-stacks.devnet 2>&1 || echo "bitcoin-node container no longer exists (already torn down)"
          docker ps -a 2>&1 || true

name: "[Coin] - Coin Tester - Scheduled and Manual"

on:
  schedule:
    - cron: "9 16 * * 1-5"

  pull_request:
  workflow_dispatch:
    inputs:
      chain:
        description: 'Coin family to test, separated with commas (,), or "all" to run all coins (default)'
        required: false
        default: "all"

permissions:
  contents: read

env:
  COIN_TESTER_CURRENCIES: "evm polkadot solana bitcoin tezos tron xrp stellar multiversx cosmos cardano casper vechain near stacks kaspa zcash aleo"
  # The coin testers that run against coin-sandbox, and the coin-sandbox networks whose images each one pulls
  # from GHCR. Bitcoin runs Ledger's images (JFrog), pulled on `up`, so it has none to pull here
  COIN_SANDBOX_NETWORKS: '{"solana": ["solana"], "tron": ["tron"], "polkadot": ["polkadot"], "evm": ["ethereum", "polygon", "bsc", "optimism", "scroll", "base"], "bitcoin": []}'

jobs:
  is-affected:
    runs-on: ubuntu-22.04
    outputs:
      is-affected: ${{ steps.detect.outputs.is-affected }}
      matrix: ${{ steps.detect.outputs.matrix }}
    permissions:
      pull-requests: read
    steps:
      - name: Run live-common-affected
        uses: LedgerHQ/ledger-live/tools/actions/composites/live-common-affected@develop
        id: affected

      - name: Build matrix from affected paths or manual input
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHAIN_INPUT: ${{ github.event.inputs.chain }}
          AFFECTED_PATHS: ${{ steps.affected.outputs.paths }}
        run: |
          CHAINS=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$CHAIN_INPUT" != "" ]]; then
            if [[ "$CHAIN_INPUT" == "all" ]]; then
              for coin in $COIN_TESTER_CURRENCIES; do
                CHAINS+=("$coin")
              done
            else
              IFS=',' read -ra CHAINS <<< "$CHAIN_INPUT"
            fi
          elif echo "$AFFECTED_PATHS" | grep -qE "(^|/| )coin-tester(/| |$)"; then
            echo "Detected base coin-tester → adding all coins"
            for coin in $COIN_TESTER_CURRENCIES; do
              CHAINS+=("$coin")
            done
          else
            # Otherwise, only add coins that appear individually
            for coin in $COIN_TESTER_CURRENCIES; do
              if echo "$AFFECTED_PATHS" | grep -qw "$coin"; then
                CHAINS+=("$coin")
              fi
            done
          fi
          # If it's a scheduled job and no chain is detected, run all chains by default
          if [ "$EVENT_NAME" == "schedule" ] && [ ${#CHAINS[@]} -eq 0 ]; then
            for coin in $COIN_TESTER_CURRENCIES; do
              CHAINS+=("$coin")
            done
            CHAIN_JSON=$(printf '%s\n' "${CHAINS[@]}" | jq -R . | jq -cs '{chain: .}')
            echo "matrix=${CHAIN_JSON}" >> "$GITHUB_OUTPUT"
            echo "is-affected=true" >> $GITHUB_OUTPUT
          elif [ ${#CHAINS[@]} -eq 0 ]; then
            echo "matrix={\"chain\":[]}" >> $GITHUB_OUTPUT
            echo "is-affected=false" >> $GITHUB_OUTPUT
          else
            CHAIN_JSON=$(printf '%s\n' "${CHAINS[@]}" | jq -R . | jq -cs '{chain: .}')
            echo "matrix=${CHAIN_JSON}" >> $GITHUB_OUTPUT
            echo "is-affected=true" >> $GITHUB_OUTPUT
          fi

      - name: Debug affected paths (for troubleshooting)
        env:
          AFFECTED_PATHS: ${{ steps.affected.outputs.paths }}
          IS_AFFECTED: ${{ steps.detect.outputs.is-affected }}
          MATRIX: ${{ steps.detect.outputs.matrix }}
        run: |
          echo "Affected paths: $AFFECTED_PATHS"
          echo "Is affected: $IS_AFFECTED"
          echo "Matrix: $MATRIX"

  coin-tester:
    name: Coin Tester - ${{ matrix.chain }}
    needs: is-affected
    if: ${{ needs.is-affected.outputs.is-affected == 'true' }}
    runs-on: public-ledgerhq-shared-small
    permissions:
      id-token: write
      contents: read
      packages: read # pulls the coin-sandbox images from GHCR
    continue-on-error: true

    strategy:
      matrix:
        chain: ${{ fromJson(needs.is-affected.outputs.matrix).chain }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Login to Ledger Artifactory
        id: jfrog-login
        timeout-minutes: 10
        # Pinned to a commit SHA (not a branch or moving tag) to enable caching.
        uses: LedgerHQ/actions-security/actions/jfrog-login@c927e3b6f81f35f3f11f54ff8df47b410186e7a3

      - name: Login to JFrog OCI Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: jfrog.ledgerlabs.net/bbs-oci-prod-green
          username: ${{ steps.jfrog-login.outputs.oidc-user }}
          password: ${{ steps.jfrog-login.outputs.oidc-token }}

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Setup environment
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-coin-tester-env@develop

      # TODO: the deploy key below is NOT the final way to authenticate. It is a stopgap until the GitHub App behind
      # GH_BOT_* is installed on LedgerHQ/coin-sandbox. Then uncomment this step, use its token in the checkout
      # (`token:`) instead of `ssh-key:`, and delete the deploy key and the COIN_SANDBOX_DEPLOY_KEY secret.
      # - name: Generate a GitHub App token for coin-sandbox
      #   if: fromJSON(env.COIN_SANDBOX_NETWORKS)[matrix.chain] != null
      #   id: coin-sandbox-token
      #   uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      #   with:
      #     client-id: ${{ secrets.GH_BOT_CLIENT_ID }}
      #     private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
      #     repositories: coin-sandbox
      #     permission-contents: read

      - name: Checkout coin-sandbox
        if: fromJSON(env.COIN_SANDBOX_NETWORKS)[matrix.chain] != null
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: LedgerHQ/coin-sandbox
          ref: main
          ssh-key: ${{ secrets.COIN_SANDBOX_DEPLOY_KEY }} # TODO: temporary, see above
          # token: ${{ steps.coin-sandbox-token.outputs.token }}
          path: coin-sandbox
          persist-credentials: false

      - name: Setup Deno
        if: fromJSON(env.COIN_SANDBOX_NETWORKS)[matrix.chain] != null
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      - name: Login to GHCR
        if: fromJSON(env.COIN_SANDBOX_NETWORKS)[matrix.chain] != null
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the coin-sandbox images
        if: fromJSON(env.COIN_SANDBOX_NETWORKS)[matrix.chain] != null
        working-directory: coin-sandbox
        env:
          COIN_SANDBOX_REGISTRY: ghcr.io/ledgerhq/
          NETWORKS: ${{ join(fromJSON(env.COIN_SANDBOX_NETWORKS)[matrix.chain], ' ') }}
        run: |
          for network in $NETWORKS; do
            deno task pull "$network"
          done

      - name: Start coin-sandbox
        if: fromJSON(env.COIN_SANDBOX_NETWORKS)[matrix.chain] != null
        working-directory: coin-sandbox
        env:
          COIN_SANDBOX_REGISTRY: ghcr.io/ledgerhq/
        run: |
          deno task server &
          curl -sf --retry 8 --retry-connrefused http://localhost:8000/openapi.json

      # coin-tester-stacks builds a patched clarinet from source (~13 min) when its binary is missing.
      # The key hashes docker/clarinet/**, which holds the pinned commit, patches and toolchain.
      # Restore and save are split so a successful build is kept even when the tests fail.
      - name: Restore the patched clarinet binary
        id: clarinet-cache
        if: matrix.chain == 'stacks'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libs/coin-tester-modules/coin-tester-stacks/.clarinet-cache
          key: ${{ runner.os }}-${{ runner.arch }}-clarinet-${{ hashFiles('libs/coin-tester-modules/coin-tester-stacks/docker/clarinet/**') }}

      - name: Run Coin Tester
        uses: LedgerHQ/ledger-live/tools/actions/composites/run-coin-tester@develop
        with:
          chain: ${{ matrix.chain }}

      - name: Save the patched clarinet binary
        if: always() && matrix.chain == 'stacks' && steps.clarinet-cache.outputs.cache-hit != 'true' && hashFiles('libs/coin-tester-modules/coin-tester-stacks/.clarinet-cache/*/clarinet') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libs/coin-tester-modules/coin-tester-stacks/.clarinet-cache
          key: ${{ steps.clarinet-cache.outputs.cache-primary-key }}

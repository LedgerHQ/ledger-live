name: "[Module Boundaries] - Test - Called"

on:
  workflow_call:
    secrets:
      AWS_ACCOUNT_ID_PROD:
        required: true
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH:
        required: true
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP:
        required: true
      AWS_CACHE_REGION:
        required: true
      AWS_CACHE_ROLE_NAME:
        required: true
      NX_KEY:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: |
          If you run this manually, and want to run on a PR, the correct ref should be refs/pull/{PR_NUMBER}/merge to
          have the "normal" scenario involving checking out a merge commit between your branch and the base branch.
          If you want to run only on a branch or specific commit, you can use either the sha or the branch name instead (prefer the first version for PRs).
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  enforce-boundaries:
    name: Monorepo Checks
    runs-on: ledger-wallet-4cpu-aws-public-cached
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CI_OS: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: setup-caches
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Enforce module boundaries
        run: pnpm exec nx run enforce-boundaries:lint:boundaries

      - name: Test the module-boundary rules
        # run-many is a no-op when the target is absent: older branches (e.g. release) call this workflow from develop.
        run: pnpm exec nx run-many -t test -p enforce-boundaries

      - name: Test the module-boundary inputs against the workspace graph
        # run-many is a no-op when the target is absent: older branches (e.g. release) call this workflow from develop.
        run: pnpm exec nx run-many -t test:workspace -p enforce-boundaries

      - name: Test the package-structure rules
        run: pnpm exec nx run enforce-package-structure:test

      - name: Enforce package structure
        run: pnpm exec nx run-many -t lint:structure

      - name: Test the tool-config conformance check
        # run-many is a no-op when the project is absent: older branches (e.g. release) call this workflow from develop.
        run: pnpm exec nx run-many -t test -p enforce-tool-config

      - name: Check tool configs conform to the support/ presets
        run: pnpm exec nx run-many -t lint:tool-config

      - name: Test the i18n key check
        # run-many is a no-op when the project is absent: older branches (e.g. release) call this workflow from develop.
        run: pnpm exec nx run-many -t test -p enforce-i18n-keys

      - name: Check i18n keys exist in the Desktop and Mobile catalogs
        run: pnpm exec nx run-many -t lint:i18n-keys -p enforce-i18n-keys

      - name: Test the skills and docs check
        # Skipped on release/hotfix: this workflow runs from develop while checkout is an older branch without tools/skills-check/.
        if: hashFiles('tools/skills-check/check.mjs') != ''
        run: node --test "tools/skills-check/*.test.mjs"

      - name: Check skills and docs
        # Skipped on release/hotfix: this workflow runs from develop while checkout is an older branch without tools/skills-check/.
        if: hashFiles('tools/skills-check/check.mjs') != ''
        run: pnpm skills:check

      # The knip steps skip older branches (e.g. release), which call this workflow from develop without the monorepo knip configs.
      - name: Knip (packages without platform configs)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && hashFiles('support/knip/web.config.mjs') != '' }}
        run: pnpm exec knip -c support/knip/root.config.mjs
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Knip (packages with platform configs, web)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && hashFiles('support/knip/web.config.mjs') != '' }}
        run: pnpm exec knip -c support/knip/web.config.mjs --tsConfig tsconfig.web.json
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Knip (packages with platform configs, native)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && hashFiles('support/knip/web.config.mjs') != '' }}
        run: pnpm exec knip -c support/knip/native.config.mjs --tsConfig tsconfig.native.json
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

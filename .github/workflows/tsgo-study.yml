name: TypeScript v7 (tsgo) Compatibility Study

on:
  workflow_dispatch:
  push:
    branches:
      - feat/tsgo-migration-study

jobs:
  tsgo-typecheck:
    name: tsgo typecheck (TS v7 study)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install tsgo (TypeScript v7 nightly)
        run: pnpm add -w -D @typescript/native-preview@7.0.0-dev.20260521.1

      - name: Check tsgo version
        run: pnpm tsgo --version

      - name: Run tsgo typecheck (with timing)
        run: |
          echo "## tsgo typecheck performance study" >> $GITHUB_STEP_SUMMARY
          echo "Running tsgo --noEmit on the full monorepo..." >> $GITHUB_STEP_SUMMARY
          START=$(date +%s%N)
          pnpm tsgo --noEmit -p tsconfig.json 2>&1 | tee /tmp/tsgo-output.txt || true
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "⏱ tsgo duration: ${ELAPSED}ms" >> $GITHUB_STEP_SUMMARY
          cat /tmp/tsgo-output.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload tsgo output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsgo-study-output
          path: /tmp/tsgo-output.txt

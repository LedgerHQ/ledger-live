name: "[Packages] - Test - Called"

# Tests and codechecks the affected libs, features, shared, domain, devtools and support projects,
# on the shards nx-affected-reusable planned (tools/actions/composites/nx-test-plan). Replaces the
# per-scope lanes in the PR flow: most PRs run one job instead of up to seven.

on:
  workflow_call:
    inputs:
      matrix:
        description: "Matrix JSON from nx-affected-reusable `test_matrix`"
        type: string
        required: true
      ref:
        description: "Ref to check out. Defaults to github.sha."
        type: string
        required: false
      skip-nx-cache:
        description: "Run every task instead of replaying the Nx cache, to measure what a shard costs"
        type: boolean
        required: false
        default: false

    secrets:
      AWS_ACCOUNT_ID_PROD:
        required: true
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH:
        required: true
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP:
        required: true
      AWS_CACHE_REGION:
        required: true
      AWS_CACHE_ROLE_NAME:
        required: true
      NX_KEY:
        required: true
      # Without credentials the flake reporter degrades gracefully
      FLAKE_API_KEY_CI:
        required: false
      FLAKE_API_HOST:
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  test-packages:
    name: "Shard ${{ matrix.shard }}"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    timeout-minutes: 40
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
      FORCE_COLOR: 3
      CI_OS: ubuntu-22.04
      FLAKE_API_KEY: ${{ secrets.FLAKE_API_KEY_CI }}
      FLAKE_API_HOST: ${{ secrets.FLAKE_API_HOST }}
      PROJECTS: ${{ matrix.projects }}
      COVERAGE_PROJECTS: ${{ matrix.coverage }}
      TEST_PROJECTS: ${{ matrix.test }}
      EXPORT_RULES_PROJECTS: ${{ matrix.export_rules }}
      ROOTS: ${{ matrix.roots }}
    runs-on: ledger-wallet-8cpu-aws-public-cached
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: setup-caches
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-nx-cache: ${{ inputs.skip-nx-cache && 'true' || 'false' }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        shell: bash
        run: |
          filters=()
          IFS=',' read -ra names <<< "$PROJECTS"
          for name in "${names[@]}"; do filters+=("--filter=${name}..."); done
          pnpm i --frozen-lockfile "${filters[@]}"

      - name: Check export rules
        if: ${{ matrix.export_rules != '' }}
        shell: bash
        run: pnpm exec nx run-many -t check-export-rules --projects="$EXPORT_RULES_PROJECTS"

      # NX_PROFILE writes per-task timings, to calibrate the planner's weights.
      - name: Run coverage
        if: ${{ matrix.coverage != '' }}
        shell: bash
        env:
          NX_PROFILE: nx-profile/coverage.json
        run: |
          mkdir -p nx-profile
          pnpm exec nx run-many -t coverage --projects="$COVERAGE_PROJECTS" --parallel=6 -- --maxWorkers=2

      - name: Test libraries without coverage script
        if: ${{ matrix.test != '' }}
        shell: bash
        env:
          NX_PROFILE: nx-profile/test.json
        run: |
          mkdir -p nx-profile
          pnpm exec nx run-many -t test --projects="$TEST_PROJECTS" --parallel=6

      - name: Process coverage files
        if: ${{ !cancelled() && matrix.coverage != '' }}
        shell: bash
        run: |
          mkdir -p coverage-out
          touch coverage-out/lcov.info coverage-out/sonar-executionTests-report.xml
          for root in $ROOTS; do
            if [ -f "$root/coverage/lcov.info" ] && [ -f "$root/coverage/sonar-executionTests-report.xml" ]; then
              echo "Appending coverage files for $root"
              cat "$root/coverage/lcov.info" >> coverage-out/lcov.info
              cat "$root/coverage/sonar-executionTests-report.xml" >> coverage-out/sonar-executionTests-report.xml
            fi
          done

      - name: Codechecks
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/nx-codechecks@develop
        with:
          projects: ${{ matrix.projects }}
          parallel: "6"

      - name: (On Failure) Upload live-common snapshots and source
        if: ${{ failure() && contains(format(',{0},', matrix.projects), ',@ledgerhq/live-common,') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: live-common-src
          path: libs/ledger-live-common/src

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() && matrix.coverage != '' }}
        with:
          name: coverage-packages-${{ matrix.shard }}
          path: coverage-out

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: nx-profile-packages-${{ matrix.shard }}
          path: nx-profile
          if-no-files-found: ignore
          retention-days: 14

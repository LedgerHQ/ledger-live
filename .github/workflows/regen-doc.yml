name: "[Libraries] - Regenerate Documentation - Manual"
run-name: "@Libs • Regen Doc Files triggered by ${{ inputs.login }} ${{ inputs.ref && format('on branch {0}', inputs.ref) || format('on PR {0}', inputs.number) }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch to generate pods for.
        required: false
      number:
        description: The pull request number.
        required: false
      login:
        description: The GitHub username that triggered the workflow
        required: false
      commentId:
        description: comment id to update
        required: false

concurrency:
  # See: https://github.com/orgs/community/discussions/35341
  group: ${{ github.workflow }}-${{ github.event.inputs.ref || github.event.inputs.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  regen-doc:
    name: "Regenerate Documentation"
    runs-on: ubuntu-22.04
    steps:
      - name: generate token
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # 2.2.1
        with:
          app-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ inputs.ref != null }}
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.generate-token.outputs.token }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ !inputs.ref }}
        with:
          token: ${{ steps.generate-token.outputs.token }}
      - name: Checkout PR
        if: ${{ inputs.number != null }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ inputs.number }}
        run: gh pr checkout "$PR_NUMBER"
      - name: Setup git user
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-git-user@develop
      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: setup-caches
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}
      - name: Install dependencies
        run: pnpm i --filter="!./apps/**"
      - name: run doc
        run: pnpm exec nx run-many -t doc --projects=tag:scope:libs-ledgerjs
      - name: status
        id: check-status
        run: echo "status=$(git status --porcelain | wc -l)" >> $GITHUB_OUTPUT
      - name: commit and push changes
        if: steps.check-status.outputs.status != 0
        run: >
          git add ./apps/ledger-live-mobile/ios &&
          git commit -m 'chore(📙): regenerate documentation for ledgerjs' &&
          git restore . &&
          git pull --rebase &&
          git push
      - name: create summary (failure)
        if: failure() && inputs.number != null
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_LOGIN: ${{ inputs.login }}
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const fs = require("fs");
            const body = `#### ❌ Documentation regeneration failed

            @${process.env.INPUT_LOGIN}: you can check [the action logs](https://github.com/LedgerHQ/ledger-live/runs/${process.env.RUN_ID}) for more information.`;
            fs.writeFileSync("summary.txt", body, "utf8");
      - name: create summary (success)
        if: inputs.number != null && steps.check-status.outputs.status != 0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_LOGIN: ${{ inputs.login }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const fs = require("fs");
            const body = `#### 🚀 Documentation regenerated

            @${process.env.INPUT_LOGIN}: the documentation has been regenerated and a commit has been pushed to your branch.`;
            fs.writeFileSync("summary.txt", body, "utf8");
      - name: create summary (no change)
        if: inputs.number != null && steps.check-status.outputs.status == 0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_LOGIN: ${{ inputs.login }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const fs = require("fs");
            const body = `#### ✨ No changes detected

            @${process.env.INPUT_LOGIN}: the documentation is already up to date.`;
            fs.writeFileSync("summary.txt", body, "utf8");
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        name: upload summary
        with:
          name: summary.txt
          path: ${{ github.workspace }}/summary.txt

  report-start:
    name: Report start
    runs-on: ubuntu-22.04
    if: inputs.commentId != ''
    steps:
      - name: generate token
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # 2.2.1
        with:
          app-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
      - name: report start
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_NUMBER: ${{ inputs.number }}
          INPUT_LOGIN: ${{ inputs.login }}
          INPUT_COMMENT_ID: ${{ inputs.commentId }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          result-encoding: string
          retries: 3
          script: |
            const {repo: {owner, repo}} = context
            const body = `\
            @${process.env.INPUT_LOGIN}: triggered \`/regen-doc\`

            [Regenerating Documentation: workflow started](${process.env.SERVER_URL}/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID})
            `;

            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: Number(process.env.INPUT_COMMENT_ID),
              body,
            });

  report-end:
    name: Report end
    needs: [regen-doc, report-start]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - name: generate token
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # 2.2.1
        with:
          app-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        name: download summary
        with:
          name: summary.txt
      - name: report job status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_COMMENT_ID: ${{ inputs.commentId }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKSPACE: ${{ github.workspace }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          result-encoding: string
          retries: 3
          script: |
            const fs = require("fs");
            const {repo: {owner, repo}} = context;
            const summary = fs.readFileSync(`${process.env.WORKSPACE}/summary.txt`, "utf8");

            const body = `\
            ${summary}

            [Regenerating Documentation: workflow ended](${process.env.SERVER_URL}/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID})
            `;

            const output = {
              summary: body,
            };

            fs.writeFileSync("summary.json", JSON.stringify(output), "utf-8");

            if(process.env.INPUT_COMMENT_ID) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: Number(process.env.INPUT_COMMENT_ID),
                body
              });
            }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        name: upload summary
        with:
          name: summary.json
          path: ${{ github.workspace }}/summary.json

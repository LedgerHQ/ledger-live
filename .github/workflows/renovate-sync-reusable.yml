name: "[Renovate] - Sync Podfile.lock and changeset - Called"

on:
  workflow_call:
    secrets:
      GH_BOT_APP_ID:
        required: true
      GH_BOT_PRIVATE_KEY:
        required: true
    outputs:
      dirty:
        description: "true when the branch missed its Podfile.lock or changeset update and a fix commit was pushed"
        value: ${{ jobs.generate.outputs.changed }}

permissions:
  contents: read

jobs:
  changes:
    name: Check changed files
    # Always runs: a reusable workflow whose jobs are all skipped is skipped, and so is all the CI below it.
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.compare.outputs.base }}
      relevant: ${{ steps.compare.outputs.relevant }}
    steps:
      - id: compare
        if: >-
          startsWith(github.head_ref, 'renovate/') &&
          github.event.pull_request.user.login == 'renovate-operator[bot]' &&
          github.event.sender.login != 'live-github-bot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/compare.json"
          echo "base=$(jq -r .merge_base_commit.sha "$RUNNER_TEMP/compare.json")" >> "$GITHUB_OUTPUT"
          if jq -r '.files[].filename' "$RUNNER_TEMP/compare.json" | grep -qE '^(pnpm-lock\.yaml|\.changeset/renovate-.*\.md)$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs the updated dependencies' code, so it gets no write token.
  generate:
    name: Generate Podfile.lock and changeset
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ledger-wallet-2cpu-aws-public
    permissions:
      contents: read
      id-token: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Fetch the merge base
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: git fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$BASE"

      - uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - run: pnpm i --frozen-lockfile --filter="@ledgerhq/ledger-live" --filter="live-mobile..." --unsafe-perm --ignore-scripts

      - name: Drop the registry credential before running dependency code
        run: rm -f ~/.npmrc

      - name: Generate changeset
        if: github.head_ref != 'renovate/lock-file-maintenance'
        env:
          BASE: ${{ needs.changes.outputs.base }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tools/scripts/renovate-changeset.mjs "$BASE" "renovate-pr-$PR_NUMBER" "$PR_TITLE"

      # setup-ruby's prebuilt rubies need a writable /opt/hostedtoolcache, which these runners lack.
      - name: Set up Ruby
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise install ruby@3.3
          echo "$(mise where ruby@3.3)/bin" >> "$GITHUB_PATH"

      - name: Install gems
        working-directory: apps/ledger-live-mobile
        run: bundle install --jobs 4

      - name: Regenerate Podfile.lock
        working-directory: apps/ledger-live-mobile
        run: |
          # React Native's Podfile only reads `xcodebuild -version`; nothing gets compiled.
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\necho "Xcode 16.4"\necho "Build version 16F6"\n' > "$RUNNER_TEMP/bin/xcodebuild"
          chmod +x "$RUNNER_TEMP/bin/xcodebuild"
          PATH="$RUNNER_TEMP/bin:$PATH" bundle exec ruby scripts/pod-lockfile.rb

      - id: changes
        run: |
          status=$(git status --porcelain -- apps/ledger-live-mobile/ios/Podfile.lock .changeset/)
          echo "$status"
          [ -z "$status" ] || echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.changes.outputs.changed == 'true'
        with:
          name: renovate-fixup
          path: |
            apps/ledger-live-mobile/ios/Podfile.lock
            .changeset/renovate-*.md
          include-hidden-files: true
          retention-days: 1

  # Holds the write token and runs no code from the branch.
  push:
    name: Push Podfile.lock and changeset
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - id: token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # 2.2.1
        with:
          app-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            .changeset
            apps/ledger-live-mobile/ios

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: renovate-fixup
          path: ${{ runner.temp }}/fixup

      - name: Stage files
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Artifact and checkout are untrusted: copy only the expected files, no symlinks, no git hooks.
          for file in apps/ledger-live-mobile/ios/Podfile.lock ".changeset/renovate-pr-$PR_NUMBER.md"; do
            [ "$(realpath -m -- "$file")" = "$(pwd -P)/$file" ] || { echo "::error::$file goes through a symlink"; exit 1; }
            if [ -f "$RUNNER_TEMP/fixup/$file" ]; then cp --remove-destination "$RUNNER_TEMP/fixup/$file" "$file"; else rm -f "$file"; fi
          done
          git add -A -- apps/ledger-live-mobile/ios/Podfile.lock .changeset/
          if git diff --cached --quiet; then echo "::error::generate reported changes but nothing is staged"; exit 1; fi

      # Committed through the GraphQL API so GitHub signs it (the branch ruleset requires signed commits).
      # This push triggers a new run, whose concurrency group cancels this one.
      - name: Commit and push
        uses: planetscale/ghcommit-action@c6125dee9e9c0daebc4adea9f68ead8293414174 # v0.2.9
        with:
          commit_message: "chore(deps): sync Podfile.lock and changeset"
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref }}
          file_pattern: apps/ledger-live-mobile/ios/Podfile.lock .changeset
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

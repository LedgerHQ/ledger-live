name: "[All Platforms] - Build and Test - Scheduled"

on:
  schedule:
    # Hourly, 09:00-18:00 Paris on weekdays (08:00-17:00 once CET resumes - cron is UTC only).
    - cron: "0 7-16 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # LLD
  build-desktop:
    name: "Build Desktop"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/build-desktop-reusable.yml@ci/test-image
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      CARD_BAANX_API_URL: ${{ secrets.CARD_BAANX_API_URL }}
      CARD_BAANX_CLIENT_KEY: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
      CARD_BAANX_HOSTED_UI: ${{ secrets.CARD_BAANX_HOSTED_UI }}
      CARD_OAUTH_REDIRECT_URI: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}
      GH_BOT_CLIENT_ID: ${{ secrets.GH_BOT_CLIENT_ID }}
      GH_BOT_PRIVATE_KEY: ${{ secrets.GH_BOT_PRIVATE_KEY }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-desktop:
    name: "Desktop E2E & Mock Tests"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-desktop-reusable.yml@ci/test-image
    secrets:
      ALLURE_LEDGER_LIVE_PASSWORD: ${{ secrets.ALLURE_LEDGER_LIVE_PASSWORD }}
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      GH_BOT_CLIENT_ID: ${{ secrets.GH_BOT_CLIENT_ID }}
      GH_BOT_PRIVATE_KEY: ${{ secrets.GH_BOT_PRIVATE_KEY }}
      MITMPROXY_LOGS_KEY: ${{ secrets.MITMPROXY_LOGS_KEY }}
      NX_KEY: ${{ secrets.NX_KEY }}
      SEED_QAA_B2C: ${{ secrets.SEED_QAA_B2C }}
      SLACK_LIVE_CI_BOT_TOKEN: ${{ secrets.SLACK_LIVE_CI_BOT_TOKEN }}
      FLAKE_API_KEY_CI: ${{ secrets.FLAKE_API_KEY_CI }}
      FLAKE_API_HOST: ${{ secrets.FLAKE_API_HOST }}

  codecheck-desktop:
    name: "Desktop Lint & Unit Tests"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-desktop-codechecks-reusable.yml@ci/test-image
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}
      SLACK_LIVE_CI_BOT_TOKEN: ${{ secrets.SLACK_LIVE_CI_BOT_TOKEN }}

  test-mobile:
    name: "Test Mobile"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-mobile-reusable.yml@ci/test-image
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  build-test-mobile:
    name: "Build & Test Mobile"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-mobile-mock-reusable.yml@ci/test-image
    secrets:
      ALLURE_LEDGER_LIVE_PASSWORD: ${{ secrets.ALLURE_LEDGER_LIVE_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      CARD_BAANX_API_URL: ${{ secrets.CARD_BAANX_API_URL }}
      CARD_BAANX_CLIENT_KEY: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
      CARD_BAANX_HOSTED_UI: ${{ secrets.CARD_BAANX_HOSTED_UI }}
      CARD_OAUTH_REDIRECT_URI: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}
      GH_BOT_APP_ID: ${{ secrets.GH_BOT_APP_ID }}
      GH_BOT_CLIENT_ID: ${{ secrets.GH_BOT_CLIENT_ID }}
      GH_BOT_PRIVATE_KEY: ${{ secrets.GH_BOT_PRIVATE_KEY }}
      NX_KEY: ${{ secrets.NX_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      S3_DIRECTCONNECT_ENDPOINT: ${{ secrets.S3_DIRECTCONNECT_ENDPOINT }}
      SEED_QAA_B2C: ${{ secrets.SEED_QAA_B2C }}
      SPECULINHO_URL: ${{ secrets.SPECULINHO_URL }}
    with:
      macos-specificity-runner-label: "general-pool"
      skip-bundle-size-reporting: true
      max-shards: 2
      skip-pod-checks: "true"

  # Tests
  test-libraries:
    name: "Test Libraries"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-libs-reusable.yml@ci/test-image
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}
      FLAKE_API_KEY_CI: ${{ secrets.FLAKE_API_KEY_CI }}
      FLAKE_API_HOST: ${{ secrets.FLAKE_API_HOST }}

  test-features:
    name: "Test Features"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-features-reusable.yml@ci/test-image
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-shared:
    name: "Test Shared"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-shared-reusable.yml@ci/test-image
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-domain:
    name: "Test Domain"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-domain-reusable.yml@ci/test-image
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-devtools:
    name: "Test DevTools"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-devtools-reusable.yml@ci/test-image
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-support:
    name: "Test Support"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-support-reusable.yml@ci/test-image
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-design-system:
    name: "Test UI Libs"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-design-system-reusable.yml@ci/test-image
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-cli:
    name: "Test CLI"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-cli-reusable.yml@ci/test-image
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  build-wallet-cli:
    name: "Build Wallet CLI"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/build-wallet-cli-reusable.yml@ci/test-image
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-additional:
    name: "Test Additional"
    uses: LedgerHQ/ledger-live/.github/workflows/test-additional.yml@ci/test-image
    permissions:
      security-events: write
      contents: read

  test-mobile-e2e-lint:
    name: "Mobile E2E Lint & Typecheck"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-mobile-e2e-lint-reusable.yml@ci/test-image
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-desktop-e2e-lint:
    name: "Desktop E2E Lint & Typecheck"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-desktop-e2e-lint-reusable.yml@ci/test-image
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  report:
    name: "Report"
    needs:
      - build-desktop
      - test-desktop
      - codecheck-desktop
      - test-mobile
      - build-test-mobile
      - test-libraries
      - test-features
      - test-shared
      - test-domain
      - test-devtools
      - test-support
      - test-design-system
      - test-cli
      - build-wallet-cli
      - test-additional
      - test-mobile-e2e-lint
      - test-desktop-e2e-lint
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        name: prepare status
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require("fs");

            const lanes = {
              "build-desktop": "Build Desktop",
              "test-desktop": "Desktop E2E & Mock Tests",
              "codecheck-desktop": "Desktop Lint & Unit Tests",
              "test-mobile": "Test Mobile",
              "build-test-mobile": "Build & Test Mobile",
              "test-libraries": "Test Libraries",
              "test-features": "Test Features",
              "test-shared": "Test Shared",
              "test-domain": "Test Domain",
              "test-devtools": "Test DevTools",
              "test-support": "Test Support",
              "test-design-system": "Test UI Libs",
              "test-cli": "Test CLI",
              "build-wallet-cli": "Build Wallet CLI",
              "test-additional": "Test Additional",
              "test-mobile-e2e-lint": "Mobile E2E Lint & Typecheck",
              "test-desktop-e2e-lint": "Desktop E2E Lint & Typecheck",
            };

            const needs = JSON.parse(process.env.NEEDS_JSON || "{}");
            const refName = process.env.REF_NAME;
            const runUrl = `${process.env.SERVER_URL}/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}`;
            const sha = (process.env.SHA || "").slice(0, 7);

            const failed = Object.entries(lanes)
              .filter(([id]) => needs[id]?.result === "failure")
              .map(([, name]) => `❌ ${name}`);

            const slackPayload = {
              channel: "C05FKJ7DFAP",
              text: `[Alert] Repo health check failed on ${refName}`,
              blocks: [
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: `:warning: [Alert] Repo health check failed on ${refName}`,
                    emoji: true,
                  },
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: failed.join("\n"),
                  },
                },
                { type: "divider" },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: `\`${sha}\`\n<${runUrl}|Workflow run>`,
                  },
                },
              ],
            };

            fs.writeFileSync("payload-slack-content.json", JSON.stringify(slackPayload), "utf-8");

      - name: post to live-repo-health slack channel
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_LIVE_CI_BOT_TOKEN }}
          payload-file-path: ${{ github.workspace }}/payload-slack-content.json

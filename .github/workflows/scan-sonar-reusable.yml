name: "[All Platforms] - Scan Sonar - Called"

on:
  workflow_call:
    inputs:
      should_download_desktop_coverage:
        required: false
        default: "false"
        type: string
      should_download_mobile_coverage:
        required: false
        default: "false"
        type: string
      should_download_libs_coverage:
        required: false
        default: "false"
        type: string
      should_download_features_coverage:
        required: false
        default: "false"
        type: string
      should_download_shared_coverage:
        required: false
        default: "false"
        type: string
      should_download_domain_coverage:
        required: false
        default: "false"
        type: string
      should_download_devtools_coverage:
        required: false
        default: "false"
        type: string
      should_download_wallet_cli_coverage:
        required: false
        default: "false"
        type: string
      ref:
        description: Git ref to checkout
        required: false
        type: string

    secrets:
      SONAR_TOKEN:
        required: false
permissions:
  id-token: write
  contents: read

jobs:
  scan-sonar:
    name: "Sonar Cloud"
    runs-on: [ledger-live-4xlarge]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: fetch develop
        run: |
          git fetch origin develop

      - name: Download desktop unit test coverage
        if: ${{ inputs.should_download_desktop_coverage == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-desktop
          path: coverage-desktop

      - name: Download mobile unit test coverage
        if: ${{ inputs.should_download_mobile_coverage == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-mobile
          path: coverage-mobile

      - name: Download libs unit test coverage
        if: ${{ inputs.should_download_libs_coverage == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-libs
          path: coverage-libs

      - name: Download features unit test coverage
        if: ${{ inputs.should_download_features_coverage == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-features
          path: coverage-features

      - name: Download shared unit test coverage
        if: ${{ inputs.should_download_shared_coverage == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-shared
          path: coverage-shared

      - name: Download domain unit test coverage
        if: ${{ inputs.should_download_domain_coverage == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-domain
          path: coverage-domain

      - name: Download devtools unit test coverage
        if: ${{ inputs.should_download_devtools_coverage == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-devtools
          path: coverage-devtools

      - name: Download wallet-cli unit test coverage
        if: ${{ inputs.should_download_wallet_cli_coverage == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-wallet-cli
          path: coverage-wallet-cli

      - name: Merge coverage files
        run: |
          if [ -d ./coverage-desktop ]; then
            echo "Merging desktop coverage files"
            cat ./coverage-desktop/lcov.info >> ./lcov.info
            cat ./coverage-desktop/sonar-executionTests-report.xml >> ./sonar-executionTests-report.xml
          fi
          if [ -d ./coverage-mobile ]; then
            echo "Merging mobile coverage files"
            cat ./coverage-mobile/lcov.info >> ./lcov.info
            cat ./coverage-mobile/sonar-executionTests-report.xml >> ./sonar-executionTests-report.xml
          fi
          if [ -d ./coverage-libs ]; then
            echo "Merging libs coverage files"
            cat ./coverage-libs/lcov.info >> ./lcov.info
            cat ./coverage-libs/sonar-executionTests-report.xml >> ./sonar-executionTests-report.xml
          fi
          if [ -d ./coverage-features ]; then
            echo "Merging features coverage files"
            cat ./coverage-features/lcov.info >> ./lcov.info
            cat ./coverage-features/sonar-executionTests-report.xml >> ./sonar-executionTests-report.xml
          fi
          if [ -d ./coverage-shared ]; then
            echo "Merging shared coverage files"
            cat ./coverage-shared/lcov.info >> ./lcov.info
            cat ./coverage-shared/sonar-executionTests-report.xml >> ./sonar-executionTests-report.xml
          fi
          if [ -d ./coverage-domain ]; then
            echo "Merging domain coverage files"
            cat ./coverage-domain/lcov.info >> ./lcov.info
            cat ./coverage-domain/sonar-executionTests-report.xml >> ./sonar-executionTests-report.xml
          fi
          if [ -d ./coverage-devtools ]; then
            echo "Merging devtools coverage files"
            cat ./coverage-devtools/lcov.info >> ./lcov.info
            cat ./coverage-devtools/sonar-executionTests-report.xml >> ./sonar-executionTests-report.xml
          fi
          if [ -d ./coverage-wallet-cli ]; then
            echo "Merging wallet-cli coverage files"
            cat ./coverage-wallet-cli/lcov.info >> ./lcov.info
          fi
          if [ ! -f ./sonar-executionTests-report.xml ]; then
            echo "No report found, creating empty report to avoid sonar scan failing!"
            echo '<testExecutions version="1"></testExecutions>' > ./sonar-executionTests-report.xml
          fi

      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

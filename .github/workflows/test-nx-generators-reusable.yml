name: "[Nx Generators] - Test - Called"

on:
  workflow_call:
    secrets:
      AWS_ACCOUNT_ID_PROD:
        required: true
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH:
        required: true
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP:
        required: true
      AWS_CACHE_REGION:
        required: true
      AWS_CACHE_ROLE_NAME:
        required: true
      NX_KEY:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  test-nx-generators:
    name: "Nx Generators Test"
    runs-on: ledger-wallet-2cpu-aws-public-cached
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      FORCE_COLOR: 3
      CI_OS: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: setup-caches
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      # The universal-component spec typechecks its output over shared/ui-qr-code, so that package's
      # React and React Native types are installed too.
      - name: Install dependencies
        run: pnpm i --frozen-lockfile --filter="ledger-live" --filter="@ledgerhq/generators..." --filter="@shared/ui-qr-code..." --ignore-scripts

      - name: Run tests
        run: pnpm exec nx run @ledgerhq/generators:test

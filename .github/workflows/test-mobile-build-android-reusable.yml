name: "[Mobile] - Test Build Android - Called"

on:
  workflow_call:
    inputs:
      disable-nx-cache:
        description: Skip Nx cache for nx-step runs
        required: false
        type: boolean
        default: false
      ref:
        description: Ref to checkout
        required: false
        type: string
      build-android-native:
        description: Whether to build the iOS native app
        required: true
        type: boolean
        default: true
      build-android-js:
        description: Whether to build the iOS JS bundle
        required: true
        type: boolean
        default: true
      android-native-cache-key:
        description: The cache key to use for the iOS native build
        required: false
        type: string
        default: "detox-ios-native-cache"
      android-js-cache-key:
        description: The cache key to use for the iOS JS bundle
        required: false
        type: string
        default: "detox-ios-js-cache"
      production_firebase:
        description: Whether to build the Android app for production Firebase
        required: false
        type: boolean
        default: false
    outputs:
      js-bundle-size:
        description: The JS bundle size of the built app
        value: ${{ jobs.build-android-js.outputs.js-bundle-size }}

  workflow_dispatch:
    inputs:
      ref:
        description: |
          If you run this manually, and want to run on a PR, the correct ref should be refs/pull/{PR_NUMBER}/merge to
          have the "normal" scenario involving checking out a merge commit between your branch and the base branch.
          If you want to run only on a branch or specific commit, you can use either the sha or the branch name instead (prefer the first verion for PRs).
        type: string
        required: false
      build-android-native:
        description: Whether to build the Android native app
        required: true
        type: boolean
        default: true
      build-android-js:
        description: Whether to build the Android JS bundle
        required: true
        type: boolean
        default: true
      android-native-cache-key:
        description: The cache key to use for the Android native build
        required: false
        type: string
        default: "detox-ios-native-cache"
      android-js-cache-key:
        description: The cache key to use for the Android JS bundle
        required: false
        type: string
        default: "detox-ios-js-cache"
      production_firebase:
        description: Whether to build the Android app for production Firebase
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  SHOULD_UPLOAD: ${{ (github.event_name == 'push' && contains(fromJson('["develop", "main"]'), github.ref_name)) }}
  cache-bucket: ll-nx-cache
  ANDROID_APK_PATH: apps/ledger-live-mobile/android/app/build/outputs/apk/detox${{ inputs.production_firebase == true && 'PreRelease' || '' }}/app-x86_64-detox${{ inputs.production_firebase == true && 'PreRelease' || '' }}.apk
  ANDROID_JSBUNDLE_PATH: apps/ledger-live-mobile/main.jsbundle
  ANDROID_TESTBINARY_PATH: apps/ledger-live-mobile/android/app/build/outputs/apk/androidTest/detox${{ inputs.production_firebase == true && 'PreRelease' || '' }}/app-detox${{ inputs.production_firebase == true && 'PreRelease' || '' }}-androidTest.apk

jobs:

  build-android-js:
    name: "Android Build JS"
    runs-on: [ledger-wallet-8cpu-public]
    timeout-minutes: 20
    if: ${{ inputs.build-android-js == true }}
    outputs:
      js-bundle-size: ${{ steps.output-js-bundle-size.outputs.size }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        id: aws
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/${{ secrets.AWS_CACHE_ROLE_NAME }}
          aws-region: ${{ secrets.AWS_CACHE_REGION }}

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      - name: setup caches
        id: setup-caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-pod-cache: "true"
          skip-pnpm-cache: "false"
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - uses: nick-fields/retry@v3
        name: install dependencies
        id: install-dependencies
        with:
          max_attempts: 2
          timeout_minutes: 15
          command: pnpm i --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm
          new_command_on_retry: rm -rf ~/.cocoapods/ && pnpm clean && pnpm i --filter="live-mobile..." --filter="@ledgerhq/dummy-*-app..." --filter="ledger-live" --unsafe-perm

      - name: Build JS bundle and minify for size analysis
        uses: LedgerHQ/ledger-live/tools/actions/composites/nx-step@develop
        with:
          command: pnpm exec nx run live-mobile:e2e:ci -- -p android --bundle --bundle-size
          disable_cache: ${{ true }}

      - name: Output bundle size for analysis
        id: output-js-bundle-size
        run: |
          # Report the minified bundle size for comparison with other branches
          echo size=`ls -l apps/ledger-live-mobile/main.jsbundle.minified | cut -d " " -f5` >> $GITHUB_OUTPUT

      - name: Upload Detox JS Build
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/upload@develop
        with:
          path: ${{ github.workspace }}/${{ env.ANDROID_JSBUNDLE_PATH }}
          key: ${{ inputs.android-js-cache-key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN}}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}

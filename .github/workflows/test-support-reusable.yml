name: "[Support] - Test - Called"

on:
  workflow_call:
    inputs:
      skip-coverage:
        description: "Skip coverage and run codechecks only. Set at the merge gate, where no product code executes."
        type: boolean
        required: false
        default: false
      ref:
        description: "Ref to check out. Defaults to github.sha, or to the default branch when `repository` is set."
        type: string
        required: false
      repository:
        description: "Repository to check out, as owner/name. Defaults to the calling repository. Set it when calling this workflow from another repository."
        type: string
        required: false
        default: ""
      runs-on:
        description: "Runner label for the job."
        type: string
        required: false
        default: "ledger-wallet-4cpu-aws-public-cached"

    outputs:
      coverage_generated:
        value: ${{ jobs.test-support.outputs.coverage_generated }}

    secrets:
      AWS_ACCOUNT_ID_PROD:
        required: false
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH:
        required: false
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP:
        required: false
      AWS_CACHE_REGION:
        required: false
      AWS_CACHE_ROLE_NAME:
        required: false
      NX_KEY:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: |
          If you run this manually, and want to run on a PR, the correct ref should be refs/pull/{PR_NUMBER}/merge to
          have the "normal" scenario involving checking out a merge commit between your branch and the base branch.
          If you want to run only on a branch or specific commit, you can use either the sha or the branch name instead (prefer the first version for PRs).
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  test-support:
    name: "Support Test"
    uses: LedgerHQ/ledger-live/.github/workflows/test-scope-reusable.yml@develop
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}
    with:
      scope: support
      ref: ${{ inputs.ref || (inputs.repository == '' && github.sha || '') }}
      repository: ${{ inputs.repository || '' }}
      runs-on: ${{ inputs.runs-on || 'ledger-wallet-4cpu-aws-public-cached' }}
      skip-coverage: ${{ inputs.skip-coverage || false }}

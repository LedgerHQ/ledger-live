name: "[CI] - Auto Author Assign - PR"

# pull_request_target is required for fork PR write access (author assign).
# No PR code is checked out, so the elevated token cannot execute attacker-controlled code.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-22.04
    steps:
      - uses: toshimaru/auto-author-assign@2daaeb2988aef24bf37e636fe733f365c046aba0 # v1.6.2

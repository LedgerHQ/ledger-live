name: "[Mobile] - Build Native - Called"

on:
  workflow_call:
    secrets:
      AWS_ACCOUNT_ID_PROD:
        required: false
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH:
        required: false
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP:
        required: false
      AWS_CACHE_REGION:
        required: false
      AWS_CACHE_ROLE_NAME:
        required: false
      CARD_BAANX_API_URL:
        required: false
      CARD_BAANX_CLIENT_KEY:
        required: false
      CARD_BAANX_HOSTED_UI:
        required: false
      CARD_OAUTH_REDIRECT_URI:
        required: false
      NX_KEY:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: |
          If you run this manually, and want to run on a PR, the correct ref should be refs/pull/{PR_NUMBER}/merge to
          have the "normal" scenario involving checking out a merge commit between your branch and the base branch.
          If you want to run only on a branch or specific commit, you can use either the sha or the branch name instead (prefer the first verion for PRs).
        type: string
        required: false
      login:
        description: The GitHub username that triggered the workflow
        type: string
        required: false
      base_ref:
        description: The base branch to merge the head into when checking out the code
        type: string
        required: false

permissions:
  contents: read

jobs:
  build-mobile-app-android:
    name: "Android Build (${{ matrix.runner }})"
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ledger-wallet-4cpu-aws-public-cached, ledger-wallet-8cpu-aws-public-cached]
    runs-on: ${{ matrix.runner }}
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Start resource sampler (eval only)
        run: |
          cat > "$RUNNER_TEMP/sample.sh" <<'SH'
          #!/usr/bin/env bash
          CG=/sys/fs/cgroup
          while true; do
            cpu=$(awk '{printf "%s=%s ", $1, $2}' "$CG/cpu.stat" 2>/dev/null)
            mem=$(cat "$CG/memory.current" 2>/dev/null)
            anon=$(awk '$1=="anon"{print $2}' "$CG/memory.stat" 2>/dev/null)
            clang=$(pgrep -c -f 'clang\+\+|/clang ' 2>/dev/null)
            nodes=$(pgrep -c -x node 2>/dev/null)
            nthreads=$(ps -o nlwp= -C node 2>/dev/null | awk '{s+=$1} END{print s+0}')
            echo "$(date +%s) $cpu memory.current=$mem anon=$anon clang=$clang node=$nodes node_threads=$nthreads"
            sleep 5
          done
          SH
          chmod +x "$RUNNER_TEMP/sample.sh"
          nohup "$RUNNER_TEMP/sample.sh" > "$RUNNER_TEMP/resources.log" 2>&1 &
          echo "cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null) nproc=$(nproc)"
      - name: Setup git user
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-git-user@develop
      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: caches
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}
      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}
      - name: setup JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
      - name: setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools cmake;3.22.1"
      - name: Detect CPU quota
        run: |
          read -r quota period < /sys/fs/cgroup/cpu.max || true
          if [ -n "$quota" ] && [ "$quota" != "max" ]; then CPUS=$(( (quota + period - 1) / period )); else CPUS=$(nproc); fi
          echo "CI_CPUS=$CPUS" >> "$GITHUB_ENV"
          echo "CI_CPUS=$CPUS nproc=$(nproc)"
          echo "node os.availableParallelism=$(node -p 'require("os").availableParallelism()') os.cpus=$(node -p 'require("os").cpus().length')"
          java -XshowSettings:system -version 2>&1 | grep -iE 'cpu|memory limit|provider' || true
          java -XX:+PrintFlagsFinal -version 2>/dev/null | grep -E ' ActiveProcessorCount | MaxHeapSize ' || true
      - name: Cap ninja jobs to the CPU quota
        run: |
          wrapped=0
          for ninja in "$ANDROID_HOME"/cmake/*/bin/ninja; do
            [ -f "$ninja" ] || continue
            mv "$ninja" "$ninja.real"
            printf '%s\n' '#!/usr/bin/env bash' "exec \"\$(dirname \"\$0\")/ninja.real\" -j${CI_CPUS} \"\$@\"" > "$ninja"
            chmod +x "$ninja"
            echo "wrapped $ninja ($("$ninja.real" --version)) -> -j${CI_CPUS}"; cat "$ninja"
            wrapped=$((wrapped + 1))
          done
          [ "$wrapped" -gt 0 ] || { echo "::error::no ninja found under $ANDROID_HOME/cmake"; exit 1; }
      - name: install dependencies
        run: pnpm i --filter="live-mobile..." --filter="ledger-live" --frozen-lockfile --unsafe-perm
      - uses: LedgerHQ/ledger-live/tools/actions/get-package-infos@develop
        id: version
        with:
          path: ${{ github.workspace }}/apps/ledger-live-mobile
      - name: set beta name
        uses: LedgerHQ/ledger-live/tools/actions/change-product-name@develop
        with:
          path: ${{ github.workspace }}/apps/ledger-live-mobile
      - name: Get short SHA
        id: slug
        run: echo "sha8=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: make local version
        env:
          VERSION: ${{ steps.version.outputs.clean }}-sha.${{ steps.slug.outputs.sha8 }}
        run: cd apps/ledger-live-mobile && npm version $VERSION
      - name: build the app
        env:
          ANDROID_KEYSTORE_PASS: staging
          ANDROID_KEY_ALIAS: staging
          ANDROID_KEY_PASS: staging
          NODE_OPTIONS: "--max-old-space-size=7168"
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/apps/ledger-live-mobile/android/app/staging.kstr
          CARD_BAANX_API_URL: ${{ secrets.CARD_BAANX_API_URL }}
          CARD_BAANX_CLIENT_KEY: ${{ secrets.CARD_BAANX_CLIENT_KEY }}
          CARD_BAANX_HOSTED_UI: ${{ secrets.CARD_BAANX_HOSTED_UI }}
          CARD_OAUTH_REDIRECT_URI: ${{ secrets.CARD_OAUTH_REDIRECT_URI }}
        run: pnpm build-ci:llm:android
      - uses: LedgerHQ/ledger-live/tools/actions/get-package-infos@develop
        id: post-version
        with:
          path: ${{ github.workspace }}/apps/ledger-live-mobile
      - name: upload Android app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.post-version.outputs.version }}-release-${{ matrix.runner }}
          path: ${{ github.workspace }}/apps/ledger-live-mobile/android/app/build/outputs/apk/stagingRelease
      - name: Dump resource samples (eval only)
        if: always()
        run: |
          echo "memory.peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null)"
          ls -d "${ANDROID_HOME:-/nonexistent}"/cmake/* "${ANDROID_HOME:-/nonexistent}"/ndk/* 2>/dev/null || true
          for n in $(find "${ANDROID_HOME:-/nonexistent}/cmake" -name 'ninja*' -type f 2>/dev/null); do echo "$n"; head -c 200 "$n" | grep -a exec || "$n" --version; done
          grep -rhoE '"-j[0-9]+"|ninja[^"]*-j ?[0-9]+' apps/ledger-live-mobile/android 2>/dev/null --include='*.json' | sort | uniq -c | head || true
          echo "RESOURCE_SAMPLES_BEGIN"
          cat "$RUNNER_TEMP/resources.log"
          echo "RESOURCE_SAMPLES_END"

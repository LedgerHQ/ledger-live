name: "[Mobile] Maestro Swap E2E"

# Manual (workflow_dispatch) runner for the Maestro mobile E2E POC (e2e/maestro).
#
# It deliberately mirrors the Detox e2e workflow (test-mobile-e2e-reusable.yml) so it can
# REUSE the exact same prebuilt app artifacts (same S3 cache keys) and the same Speculos
# infrastructure, but it runs Maestro instead of Detox:
#   determine-builds (cache keys + existence)  ->  build-ios / build-android (skipped on cache hit)
#     ->  maestro-ios (self-hosted macOS, REMOTE Speculos / Speculinho)
#     ->  maestro-android (self-hosted Linux, LOCAL Docker Speculos)
#     ->  allure-report-* (publish to the same Allure server as Detox)
#
# Notes / known constraints:
# - iOS swap drives the swap WebView, which Maestro can only read on iOS <= 18.x (iOS 26 is
#   unsupported, see e2e/maestro/README.md). The macOS runner MUST expose an iOS <= 18 simulator
#   runtime or the iOS run will fail at the WebView step. A debug step prints the runtime + warns.
# - Android boots a single emulator with reactivecircus/android-emulator-runner (the repo's
#   setup-android-avd composite uses the same action under the hood). We do NOT reuse the Detox
#   AVD R2 cache / 3-emulator boot script: Maestro only needs one device.

on:
  workflow_dispatch:
    inputs:
      tests_type:
        description: "Which platforms to run"
        type: choice
        required: true
        default: "iOS & Android"
        options:
          - "iOS & Android"
          - "iOS Only"
          - "Android Only"
      spec:
        description: "Maestro spec to run (see e2e/maestro/specs/index.ts)"
        type: string
        required: true
        default: "swapEthUsdt"
      speculos_device:
        description: "Speculos device"
        type: choice
        required: true
        default: "nanoX"
        options:
          - nanoSP
          - nanoX
          - stax
          - flex
          - nanoGen5
      maestro_version:
        description: "Maestro CLI version to install (empty = latest). Pin to your known-good local version."
        type: string
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  cache-bucket: ll-nx-cache
  # Prebuilt artifact locations (non-production / detox builds), identical to the Detox e2e workflow.
  ANDROID_APK_PATH: apps/ledger-live-mobile/android/app/build/outputs/apk/detox/app-x86_64-detox.apk
  ANDROID_JSBUNDLE_PATH: apps/ledger-live-mobile/main.jsbundle
  IOS_JSBUNDLE_PATH: apps/ledger-live-mobile/ios/build/Build/Products/Release-iphonesimulator/ledgerlivemobile.app/main.jsbundle
  IOS_NATIVE_PATH: apps/ledger-live-mobile/ios/build/Build/Products/Release-iphonesimulator
  # Speculos image tags (mirrors test-mobile-e2e-reusable.yml).
  SPECULOS_IMAGE_TAG_ANDROID: ghcr.io/ledgerhq/speculos:${{ inputs.speculos_device == 'nanoS' && '1be65b91a8e0691866f880fd437ac05fce78af9d' || 'latest' }}
  SPECULOS_IMAGE_TAG_IOS: ghcr.io/ledgerhq/speculos:${{ inputs.speculos_device == 'nanoS' && 'speculos-38ccc68068db-coinapps-83978f0' || 'latest' }}
  COINAPPS: ${{ github.workspace }}/coin-apps
  SPECULOS_DEVICE: ${{ inputs.speculos_device || 'nanoX' }}
  IOS_SIMULATOR_DEVICE: iPhone 15

jobs:
  determine-builds:
    name: "Determine Builds"
    runs-on: ubuntu-24.04
    outputs:
      ios_native_key: ${{ steps.cache-keys.outputs.ios_native_key }}
      ios_js_key: ${{ steps.cache-keys.outputs.ios_js_key }}
      android_native_key: ${{ steps.cache-keys.outputs.android_native_key }}
      android_js_key: ${{ steps.cache-keys.outputs.android_js_key }}
      ios_native_exists: ${{ steps.check-ios-native.outputs.cache-hit }}
      ios_js_exists: ${{ steps.check-ios-js.outputs.cache-hit }}
      android_native_exists: ${{ steps.check-android-native.outputs.cache-hit }}
      android_js_exists: ${{ steps.check-android-js.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: setup-caches
        with:
          use-mise: true
          skip-pnpm-cache: "true"
          skip-pod-cache: "true"
          skip-nx-cache: "true"
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      # Same key formula as test-mobile-e2e-reusable.yml so we hit the exact builds Detox caches.
      - name: Determine cache keys
        id: cache-keys
        run: |
          PREFIX=""
          if [ "${{ github.ref_name }}" = "develop" ]; then
            PREFIX="develop/"
          fi
          echo "ios_native_key=${PREFIX}longterm-${{ hashFiles('apps/ledger-live-mobile/ios') }}-detox-native-ios-3" >> $GITHUB_OUTPUT
          echo "android_native_key=${PREFIX}longterm-${{ hashFiles('apps/ledger-live-mobile/android') }}-detox-native-android-3" >> $GITHUB_OUTPUT
          echo "ios_js_key=${PREFIX}${{ github.sha }}-detox-js-ios" >> $GITHUB_OUTPUT
          echo "android_js_key=${PREFIX}${{ github.sha }}-detox-js-android" >> $GITHUB_OUTPUT

      - name: Check if iOS Native Build exists already
        id: check-ios-native
        if: ${{ inputs.tests_type != 'Android Only' }}
        uses: tespkg/actions-cache/restore@v1.9.0
        with:
          path: apps/ledger-live-mobile/ios/build/Build/Products/Release-iphonesimulator
          key: ${{ steps.cache-keys.outputs.ios_native_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if iOS JS Build exists already
        id: check-ios-js
        if: ${{ inputs.tests_type != 'Android Only' }}
        uses: tespkg/actions-cache/restore@v1.9.0
        with:
          path: apps/ledger-live-mobile/main.jsbundle
          key: ${{ steps.cache-keys.outputs.ios_js_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if Android Native Build exists already
        id: check-android-native
        if: ${{ inputs.tests_type != 'iOS Only' }}
        uses: tespkg/actions-cache/restore@v1.9.0
        with:
          path: apps/ledger-live-mobile/android/app/build/outputs/apk/detox/app-x86_64-detox.apk
          key: ${{ steps.cache-keys.outputs.android_native_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

      - name: Check if Android JS Build exists already
        id: check-android-js
        if: ${{ inputs.tests_type != 'iOS Only' }}
        uses: tespkg/actions-cache/restore@v1.9.0
        with:
          path: apps/ledger-live-mobile/main.jsbundle
          key: ${{ steps.cache-keys.outputs.android_js_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false
          lookup-only: true

  build-ios:
    name: "iOS Build"
    needs: [determine-builds]
    if: ${{ inputs.tests_type != 'Android Only' }}
    uses: LedgerHQ/ledger-live/.github/workflows/test-mobile-build-ios-reusable.yml@develop
    with:
      ref: ${{ github.sha }}
      macos-specificity-runner-label: "general-pool"
      disable-nx-cache: false
      build-ios-js: ${{ needs.determine-builds.outputs.ios_js_exists != 'true' }}
      build-ios-native: ${{ needs.determine-builds.outputs.ios_native_exists != 'true' }}
      ios-native-cache-key: ${{ needs.determine-builds.outputs.ios_native_key }}
      ios-js-cache-key: ${{ needs.determine-builds.outputs.ios_js_key }}
      production_firebase: false
    secrets: inherit

  build-android:
    name: "Android Build"
    needs: [determine-builds]
    if: ${{ inputs.tests_type != 'iOS Only' }}
    uses: LedgerHQ/ledger-live/.github/workflows/test-mobile-build-android-reusable.yml@develop
    with:
      ref: ${{ github.sha }}
      disable-nx-cache: false
      build-android-js: ${{ needs.determine-builds.outputs.android_js_exists != 'true' }}
      build-android-native: ${{ needs.determine-builds.outputs.android_native_exists != 'true' }}
      android-native-cache-key: ${{ needs.determine-builds.outputs.android_native_key }}
      android-js-cache-key: ${{ needs.determine-builds.outputs.android_js_key }}
      production_firebase: false
    secrets: inherit

  maestro-ios:
    name: "iOS Maestro Swap E2E"
    needs: [determine-builds, build-ios]
    if: ${{ !cancelled() && inputs.tests_type != 'Android Only' && needs.build-ios.result == 'success' }}
    runs-on: ["qaa", macOS, ARM64, "performance-pool"]
    timeout-minutes: 75
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    outputs:
      result: ${{ steps.run-ios.outcome }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      - name: Setup the caches
        id: setup-caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-pod-cache: "true"
          skip-pnpm-cache: "true"
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      # Maestro is a JVM CLI; ensure a JDK is present on the macOS runner.
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: "17"

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 15
          command: pnpm i --filter="ledger-live-mobile-maestro-tests..." --filter="live-mobile..." --filter="ledger-live-mobile-e2e-tests" --filter="ledger-live" --filter="live-cli*..." --no-frozen-lockfile --unsafe-perm --ignore-scripts
          new_command_on_retry: pnpm clean && pnpm i --filter="ledger-live-mobile-maestro-tests..." --filter="live-mobile..." --filter="ledger-live-mobile-e2e-tests" --filter="ledger-live" --filter="live-cli*..." --no-frozen-lockfile --unsafe-perm --ignore-scripts

      # Builds @ledgerhq/live-cli AND its dependency graph (live-common, live-env, etc.),
      # which the Maestro specs import. Same step the Detox runner uses.
      - name: Build CLI
        uses: LedgerHQ/ledger-live/tools/actions/composites/nx-step@develop
        with:
          command: pnpm exec nx run @ledgerhq/live-cli:build
          disable_cache: false

      - name: Download Native Build
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@develop
        with:
          endpoint: ${{ secrets.S3_DIRECTCONNECT_ENDPOINT }}
          key: ${{ needs.determine-builds.outputs.ios_native_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Download JS Build
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@develop
        with:
          endpoint: ${{ secrets.S3_DIRECTCONNECT_ENDPOINT }}
          key: ${{ needs.determine-builds.outputs.ios_js_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Copy JS build into the .app
        run: |
          cp apps/ledger-live-mobile/main.jsbundle ${{ env.IOS_JSBUNDLE_PATH }}
          cp apps/ledger-live-mobile/main.jsbundle ${{ env.IOS_NATIVE_PATH }}/main.jsbundle

      - name: Boot iOS Simulator in Background
        uses: LedgerHQ/ledger-live/tools/actions/composites/boot-ios-simulators-background@develop
        with:
          worker_count: 1
          artifacts_root: ${{ github.workspace }}/e2e/maestro/artifacts

      - name: Install Maestro CLI
        env:
          MAESTRO_VERSION: ${{ inputs.maestro_version }}
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Maestro & simulator info
        run: |
          maestro --version
          xcrun simctl list devices booted
          IOS_VERSION=$(xcrun simctl list runtimes iOS -j | jq -r '[.runtimes[] | select(.isAvailable == true)] | last | .version // "unknown"' || echo "unknown")
          echo "Booted iOS runtime: $IOS_VERSION"

      - name: Set E2E env (swap API / broadcast)
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-e2e-env@develop
        with:
          enable_broadcast: false
          build_type: testing

      - name: Run Maestro swap E2E (iOS)
        id: run-ios
        env:
          SEED: ${{ secrets.SEED_QAA_B2C }}
          SPECULINHO_URL: ${{ secrets.SPECULINHO_URL }}
          REMOTE_SPECULOS: "true"
          SPECULOS_IMAGE_TAG: ${{ env.SPECULOS_IMAGE_TAG_IOS }}
        working-directory: e2e/maestro
        run: pnpm maestro:ios "${{ inputs.spec }}"

      - name: Upload iOS Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: maestro-allure-results-ios
          path: e2e/maestro/allure-results
          retention-days: 7

      - name: Upload iOS Maestro flow artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: maestro-flows-ios
          path: e2e/maestro/artifacts
          retention-days: 7

      # Maestro writes screenshots + the view hierarchy (what text it could actually see)
      # to ~/.maestro/tests on a failed assertion — the ground truth for "did the WebView render".
      - name: Collect Maestro debug output (iOS)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p maestro-debug
          cp -R "$HOME/.maestro/tests/." maestro-debug/ 2>/dev/null || echo "no Maestro debug output found"
      - name: Upload Maestro debug output (iOS)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: maestro-debug-ios
          path: maestro-debug
          retention-days: 7
          if-no-files-found: ignore

  maestro-android:
    name: "Android Maestro Swap E2E"
    needs: [determine-builds, build-android]
    if: ${{ !cancelled() && inputs.tests_type != 'iOS Only' && needs.build-android.result == 'success' }}
    runs-on: [ledger-live-linux-e2e-8CPU-32RAM]
    timeout-minutes: 75
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      ADB: /usr/local/lib/android/sdk/platform-tools/adb
    outputs:
      result: ${{ steps.run-android.outcome }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          repository: LedgerHQ/ledger-live
          persist-credentials: false

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: setup-caches
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-pnpm-cache: "false"
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Setup Android Environment
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-env@develop

      - name: Download Native Build
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@develop
        with:
          key: ${{ needs.determine-builds.outputs.android_native_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Download JS Bundle
        uses: LedgerHQ/ledger-live/tools/actions/composites/cache/download@develop
        with:
          key: ${{ needs.determine-builds.outputs.android_js_key }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      # The cached APK has no JS bundle and is unsigned; inject + zipalign + sign (mirrors Detox).
      - name: Prepare APK
        run: |
          mkdir -p /tmp/apk/assets
          mkdir -p /home/runner/.android/
          mv ${{ env.ANDROID_JSBUNDLE_PATH }} /tmp/apk/assets/index.android.bundle
          mv ${{ env.ANDROID_APK_PATH }} /tmp/apk/tmp.apk
          (cd /tmp/apk/; zip -r tmp.apk assets/index.android.bundle)
          /usr/local/lib/android/sdk/build-tools/34.0.0/zipalign -p 4 /tmp/apk/tmp.apk ${{ env.ANDROID_APK_PATH }}
          /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign --ks ${{ secrets.ANDROID_KEYSTORE_PATH }} --ks-pass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} --ks-key-alias staging --key-pass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} ${{ env.ANDROID_APK_PATH }}

      - name: Install dependencies
        run: pnpm i --filter="ledger-live-mobile-maestro-tests..." --filter="live-mobile..." --filter="ledger-live-mobile-e2e-tests" --filter="ledger-live" --filter="live-cli*..." --no-frozen-lockfile --unsafe-perm --ignore-scripts

      - name: Build CLI
        uses: LedgerHQ/ledger-live/tools/actions/composites/nx-step@develop
        with:
          command: pnpm exec nx run @ledgerhq/live-cli:build
          disable_cache: false

      # Checks out the private coin-apps repo into $COINAPPS (required by local Docker Speculos).
      - name: Setup Speculos image and Coin Apps
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-speculos_image@develop
        timeout-minutes: 20
        with:
          coinapps_path: ${{ env.COINAPPS }}
          bot_id: ${{ secrets.GH_BOT_APP_ID }}
          bot_key: ${{ secrets.GH_BOT_PRIVATE_KEY }}

      - name: Set E2E env (swap API / broadcast)
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-e2e-env@develop
        with:
          enable_broadcast: false
          build_type: testing

      - name: Install Maestro CLI
        env:
          MAESTRO_VERSION: ${{ inputs.maestro_version }}
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # Boots a single emulator and runs the Maestro spec inside it. The POC starts Speculos
      # (local Docker), the bridge, and `adb reverse` itself from within the test process.
      - name: Run Maestro swap E2E (Android)
        id: run-android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SEED: ${{ secrets.SEED_QAA_B2C }}
          SPECULOS_IMAGE_TAG: ${{ env.SPECULOS_IMAGE_TAG_ANDROID }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Runner is 8CPU/32RAM — give the emulator enough headroom to avoid the
          # "Pixel Launcher isn't responding" ANR seen under the swiftshader software GPU.
          cores: 4
          ram-size: 6144M
          heap-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -camera-back none -camera-front none -no-metrics
          # reactivecircus runs the script with /usr/bin/sh and executes each LINE in its
          # own shell, so `cd` would not persist across lines (and dash rejects `pipefail`).
          # Keep it a single chained command so the working directory holds for pnpm.
          script: cd e2e/maestro && maestro --version && pnpm maestro:android "${{ inputs.spec }}"

      - name: Upload Android Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: maestro-allure-results-android
          path: e2e/maestro/allure-results
          retention-days: 7

      - name: Upload Android Maestro flow artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: maestro-flows-android
          path: e2e/maestro/artifacts
          retention-days: 7

      # Maestro writes screenshots + the view hierarchy (what text it could actually see)
      # to ~/.maestro/tests on a failed assertion — the ground truth for "did the WebView render".
      - name: Collect Maestro debug output (Android)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p maestro-debug
          cp -R "$HOME/.maestro/tests/." maestro-debug/ 2>/dev/null || echo "no Maestro debug output found"
      - name: Upload Maestro debug output (Android)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: maestro-debug-android
          path: maestro-debug
          retention-days: 7
          if-no-files-found: ignore

  allure-report-ios:
    name: "Allure Report iOS"
    runs-on: [ledger-live-medium]
    needs: [maestro-ios]
    if: ${{ !cancelled() && needs.maestro-ios.result != 'skipped' }}
    outputs:
      report-url: ${{ steps.upload.outputs.report-url }}
    steps:
      - name: Download iOS Allure results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: maestro-allure-results-ios
          path: maestro-allure-ios
      - name: Publish iOS Allure report
        id: upload
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report@develop
        with:
          platform: maestro-ios
          login: ${{ vars.ALLURE_USERNAME }}
          password: ${{ secrets.ALLURE_LEDGER_LIVE_PASSWORD }}
          path: maestro-allure-ios
          report_path_suffix: maestro-ios

  allure-report-android:
    name: "Allure Report Android"
    runs-on: [ledger-live-medium]
    needs: [maestro-android]
    if: ${{ !cancelled() && needs.maestro-android.result != 'skipped' }}
    outputs:
      report-url: ${{ steps.upload.outputs.report-url }}
    steps:
      - name: Download Android Allure results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: maestro-allure-results-android
          path: maestro-allure-android
      - name: Publish Android Allure report
        id: upload
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report@develop
        with:
          platform: maestro-android
          login: ${{ vars.ALLURE_USERNAME }}
          password: ${{ secrets.ALLURE_LEDGER_LIVE_PASSWORD }}
          path: maestro-allure-android
          report_path_suffix: maestro-android

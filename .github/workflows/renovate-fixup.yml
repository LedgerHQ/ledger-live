name: "[CI] - Renovate Fixup - PR"
run-name: "@Renovate • Fixup ${{ github.head_ref }}"

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
    paths:
      - pnpm-lock.yaml
      - .changeset/renovate-*.md

concurrency:
  # The bot's own push must not cancel the run that made it.
  group: ${{ github.workflow }}-${{ github.event.sender.login == 'live-github-bot[bot]' && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the updated dependencies' code, so it gets no write token.
  generate:
    name: Generate Podfile.lock and changeset
    if: >-
      startsWith(github.head_ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.login != 'live-github-bot[bot]'
    runs-on: ledger-wallet-8cpu-aws-public
    permissions:
      contents: read
      id-token: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Fetch the merge base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha)
          git fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - run: pnpm i --frozen-lockfile --filter="@ledgerhq/ledger-live" --filter="live-mobile..." --unsafe-perm --ignore-scripts

      - name: Drop the registry credential before running dependency code
        run: rm -f ~/.npmrc

      - name: Generate changeset
        if: github.head_ref != 'renovate/lock-file-maintenance'
        env:
          BASE: ${{ steps.base.outputs.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tools/scripts/renovate-changeset.mjs "$BASE" "${HEAD_REF//\//-}" "$PR_TITLE"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/ledger-live-mobile

      - name: Regenerate Podfile.lock
        working-directory: apps/ledger-live-mobile
        run: |
          # React Native's Podfile only reads `xcodebuild -version`; nothing gets compiled.
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\necho "Xcode 16.4"\necho "Build version 16F6"\n' > "$RUNNER_TEMP/bin/xcodebuild"
          chmod +x "$RUNNER_TEMP/bin/xcodebuild"
          PATH="$RUNNER_TEMP/bin:$PATH" bundle exec ruby scripts/pod-lockfile.rb

      - id: changes
        run: |
          status=$(git status --porcelain -- apps/ledger-live-mobile/ios/Podfile.lock .changeset/)
          echo "$status"
          [ -z "$status" ] || echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.changes.outputs.changed == 'true'
        with:
          name: renovate-fixup
          path: |
            apps/ledger-live-mobile/ios/Podfile.lock
            .changeset/renovate-*.md
          include-hidden-files: true
          retention-days: 1

  # Holds the write token and runs no code from the branch.
  push:
    name: Push Podfile.lock and changeset
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - id: token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # 2.2.1
        with:
          app-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            .changeset
            apps/ledger-live-mobile/ios

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: renovate-fixup
          path: ${{ runner.temp }}/fixup

      - uses: LedgerHQ/ledger-live/tools/actions/composites/setup-git-user@develop

      - name: Commit and push
        env:
          HEAD_REF: ${{ github.head_ref }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # The artifact and the checkout are both untrusted: copy only the expected files, never
          # through a symlink, and run git without hooks.
          for file in apps/ledger-live-mobile/ios/Podfile.lock ".changeset/${HEAD_REF//\//-}.md"; do
            [ "$(realpath -m -- "$file")" = "$(pwd -P)/$file" ] || { echo "::error::$file goes through a symlink"; exit 1; }
            if [ -f "$RUNNER_TEMP/fixup/$file" ]; then cp --remove-destination "$RUNNER_TEMP/fixup/$file" "$file"; else rm -f "$file"; fi
          done
          git add -A -- apps/ledger-live-mobile/ios/Podfile.lock .changeset/
          git -c core.hooksPath=/dev/null commit -m "chore(deps): sync Podfile.lock and changeset"
          git -c core.hooksPath=/dev/null push "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$HEAD_REF"

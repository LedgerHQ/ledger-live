name: "[Common] - Integration - Scheduled"

on:
  schedule:
    - cron: 20 9 * * *

  workflow_dispatch:
    inputs:
      ref:
        description: "Which ref (branch or tag) to pull from ?"
        required: false
        default: develop
      filter:
        description: "passed to a jest test name filtering"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  integration-tests:
    name: "Integration Tests"
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
      FORCE_COLOR: 3
      CI_OS: ubuntu-22.04

    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-22.04' || 'ledger-wallet-4cpu-aws-public' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: setup-caches
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}
      - name: JFrog npm auth
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}
      - name: Install dependencies
        run: pnpm i --frozen-lockfile --filter="live-common..." --filter="ledger-live" --filter="@ledgerhq/ledger-wallet-framework"

      - name: Build
        run: pnpm exec nx run @ledgerhq/live-common:build
      - name: Test
        shell: bash
        env:
          FILTER: ${{ inputs.filter }}
          VERBOSE_FILE: logs.txt
        run: |
          pnpm common ci-test-integration $FILTER
          git diff --exit-code libs/ledger-live-common/src
      - name: Test Ledger Wallet framework
        shell: bash
        run: pnpm --filter @ledgerhq/ledger-wallet-framework test-integ
      - name: (On Failure) Upload live-common snapshots and source
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: live-common-src-ubuntu-22.04
          path: |
            libs/ledger-live-common/src
      - name: (On Failure) Upload logs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: logs.txt
          path: logs.txt

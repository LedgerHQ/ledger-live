name: "[CI] - Additional Tests - Called"

on:
  workflow_call:
    inputs:
      skip-ci-sast:
        description: "Skip workflow-file SAST. Set at the merge gate, which has no pull request to diff against."
        type: boolean
        required: false
        default: false

  workflow_dispatch:
    inputs:
      ref:
        description: |
          If you run this manually, and want to run on a PR, the correct ref should be refs/pull/{PR_NUMBER}/merge to
          have the "normal" scenario involving checking out a merge commit between your branch and the base branch.
          If you want to run only on a branch or specific commit, you can use either the sha or the branch name instead (prefer the first version for PRs).
        required: false

permissions:
  contents: read

jobs:
  changeset-validation:
    name: Changeset Validation
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install pnpm
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: setup-caches
        with:
          skip-nx-cache: "true"
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Changesets
        uses: LedgerHQ/ledger-live/tools/actions/composites/validate-changesets@develop

  changes:
    name: Detect Workflow File Changes
    if: ${{ !inputs.skip-ci-sast }}
    runs-on: ubuntu-24.04
    outputs:
      workflow-files: ${{ steps.filter.outputs.workflow-files }}
    steps:
      - id: filter
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (!context.payload.pull_request) {
              core.setOutput('workflow-files', 'false');
              core.info('Not a pull request — skipping diff');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            }).then(fs => fs.map(f => f.filename));

            const affected = files.some(f => /^(\.github\/|tools\/actions\/)/.test(f));
            core.setOutput('workflow-files', String(affected));
            core.info(affected ? 'Workflow files changed' : 'No workflow files changed');

  ci-sast:
    name: Test CI Scripts
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.workflow-files == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup mise
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          skip-nx-cache: "true"
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          min-severity: high
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run actionlint
        run: actionlint -color -shellcheck ''

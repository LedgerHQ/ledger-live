name: "[Release] - Start Release - Manual"

on:
  workflow_dispatch:

jobs:
  create-release:
    name: Create Release
    runs-on: ledger-wallet-4cpu-aws-public-docker
    permissions:
      contents: read
      id-token: write
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
      RELEASE_BRANCH: "release"
    steps:
      - name: generate token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          token: ${{ steps.generate-token.outputs.token }}
      - name: Setup git user
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-git-user@ci-test/deps-gha-sonar-github
      - name: create release branch
        run: |
          git checkout -b $RELEASE_BRANCH
      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@ci-test/deps-gha-sonar-github
        id: setup-caches
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-nx-cache: "true"
      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@ci-test/deps-gha-sonar-github
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}
      - name: Push branch
        run: git push -u origin $RELEASE_BRANCH
      - name: Move patch updates to minor
        # For more info about why we do this, see this doc:
        # https://ledgerhq.atlassian.net/wiki/spaces/WALLETCO/pages/4710989838/LL+Incident+Recovery+-+Hotfix+in+all+cases
        uses: LedgerHQ/ledger-live/tools/actions/composites/adjust-changeset-level@ci-test/deps-gha-sonar-github
        with:
          from_level: patch
          to_level: minor
      - name: Install dependencies
        run: pnpm install --frozen-lockfile -D --ignore-scripts
      - name: enter prerelease mode
        run: pnpm changeset pre enter next
      - name: Prune changelogs
        run: node tools/prune-changelogs/bin/prune-changelogs.mjs --keep=20
      - name: Add changed files
        run: |
          git add .
      - name: commit
        uses: planetscale/ghcommit-action@c6125dee9e9c0daebc4adea9f68ead8293414174 # v0.2.9
        with:
          commit_message: "chore(prerelease): :rocket: entering prerelease mode"
          repo: ${{ github.repository }}
          branch: ${{ env.RELEASE_BRANCH }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
      - name: Get date
        id: date
        run: |
          echo "date=$(date +%F)" >> $GITHUB_OUTPUT
      - name: create PR
        run: |
          gh pr create --title ":rocket: Release ${{ steps.date.outputs.date }}" -F .github/templates/release.md --base main --head $RELEASE_BRANCH
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

  create-release-fail:
    name: Create Release > Failure Reporting
    needs: create-release
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: post to a Slack channel
        id: slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          method: chat.postMessage
          payload: |
            channel: "C08JQKWS9KK"
            text: "[Alert] Create Release failed"
            blocks: 
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Create Release failed*"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run>"

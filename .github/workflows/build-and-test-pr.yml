name: "[All Platforms] - Build and Test - PR"
on:
  pull_request: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'develop' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre_job:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    name: "Skip Check"
    if: ${{!github.event.pull_request.head.repo.fork}}
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip == 'true' || steps.smartling_check.outputs.should_skip == 'true' }}
    env:
      IS_SMARTLING: ${{ startsWith(github.event.pull_request.head.ref, 'smartling-content-updated') == true || startsWith(github.event.pull_request.head.ref, 'smartling-translation-completed') == true}}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf # v5
        with:
          concurrent_skipping: "never"
          skip_after_successful_duplicate: "true"
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule"]'
      - id: smartling_check
        if: ${{ env.IS_SMARTLING == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "should_skip=true" >> $GITHUB_OUTPUT
          gh pr close "$PR_NUMBER" -R LedgerHQ/ledger-live --delete-branch

  determine-affected:
    name: "Affected"
    needs: pre_job
    if: ${{!github.event.pull_request.head.repo.fork && needs.pre_job.outputs.should_skip != 'true'}}
    uses: LedgerHQ/ledger-live/.github/workflows/nx-affected-reusable.yml@ci-runner-baseline
    with:
      head_branch: ${{ github.event.pull_request.head.ref }}
      base_branch: ${{ github.event.pull_request.base.ref }}
      skip_nx_cache: true

  # LLD
  build-desktop:
    name: "Build Desktop"
    permissions:
      id-token: write
      contents: read
    needs: [determine-affected]
    if: ${{contains(needs.determine-affected.outputs.paths, 'ledger-live-desktop') && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/build-desktop-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      GH_BOT_CLIENT_ID: ${{ secrets.GH_BOT_CLIENT_ID }}
      GH_BOT_PRIVATE_KEY: ${{ secrets.GH_BOT_PRIVATE_KEY }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-desktop:
    name: "Desktop E2E & Mock Tests"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{contains(needs.determine-affected.outputs.paths, 'ledger-live-desktop') && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-desktop-reusable.yml@ci-runner-baseline
    secrets:
      ALLURE_LEDGER_LIVE_PASSWORD: ${{ secrets.ALLURE_LEDGER_LIVE_PASSWORD }}
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      GH_BOT_CLIENT_ID: ${{ secrets.GH_BOT_CLIENT_ID }}
      GH_BOT_PRIVATE_KEY: ${{ secrets.GH_BOT_PRIVATE_KEY }}
      MITMPROXY_LOGS_KEY: ${{ secrets.MITMPROXY_LOGS_KEY }}
      NX_KEY: ${{ secrets.NX_KEY }}
      SEED_QAA_B2C: ${{ secrets.SEED_QAA_B2C }}
      SLACK_LIVE_CI_BOT_TOKEN: ${{ secrets.SLACK_LIVE_CI_BOT_TOKEN }}
      FLAKE_API_KEY_CI: ${{ secrets.FLAKE_API_KEY_CI }}
      FLAKE_API_HOST: ${{ secrets.FLAKE_API_HOST }}

  codecheck-desktop:
    name: "Desktop Lint & Unit Tests"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{contains(needs.determine-affected.outputs.paths, 'ledger-live-desktop') && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-desktop-codechecks-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}
      SLACK_LIVE_CI_BOT_TOKEN: ${{ secrets.SLACK_LIVE_CI_BOT_TOKEN }}

  test-mobile:
    name: "Codecheck Mobile"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{contains(needs.determine-affected.outputs.paths, 'ledger-live-mobile') && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-mobile-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  build-test-mobile:
    name: "Build & Test Mobile"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{contains(needs.determine-affected.outputs.paths, 'ledger-live-mobile') && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-mobile-mock-reusable.yml@ci-runner-baseline
    secrets:
      ALLURE_LEDGER_LIVE_PASSWORD: ${{ secrets.ALLURE_LEDGER_LIVE_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      GH_BOT_APP_ID: ${{ secrets.GH_BOT_APP_ID }}
      GH_BOT_CLIENT_ID: ${{ secrets.GH_BOT_CLIENT_ID }}
      GH_BOT_PRIVATE_KEY: ${{ secrets.GH_BOT_PRIVATE_KEY }}
      NX_KEY: ${{ secrets.NX_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      S3_DIRECTCONNECT_ENDPOINT: ${{ secrets.S3_DIRECTCONNECT_ENDPOINT }}
      SEED_QAA_B2C: ${{ secrets.SEED_QAA_B2C }}
      SPECULINHO_URL: ${{ secrets.SPECULINHO_URL }}
    with:
      macos-specificity-runner-label: "performance-pool"
      skip-pod-checks: "false"
      disable-nx-cache: true

  # Tests
  test-libraries:
    name: "Test Libraries"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{contains(needs.determine-affected.outputs.paths, 'libs') && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-libs-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}
      FLAKE_API_KEY_CI: ${{ secrets.FLAKE_API_KEY_CI }}
      FLAKE_API_HOST: ${{ secrets.FLAKE_API_HOST }}

  test-features:
    name: "Test Features"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{contains(needs.determine-affected.outputs.paths, 'features') && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-features-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-shared:
    name: "Test Shared"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{contains(needs.determine-affected.outputs.paths, 'shared') && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-shared-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-domain:
    name: "Test Domain"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{contains(needs.determine-affected.outputs.paths, 'domain') && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-domain-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-devtools:
    name: "Test DevTools"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{contains(needs.determine-affected.outputs.paths, 'devtools') && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-devtools-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-support:
    name: "Test Support"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{contains(needs.determine-affected.outputs.paths, 'support') && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-support-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  enforce-boundaries:
    name: "Enforce Module Boundaries"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{(contains(needs.determine-affected.outputs.paths, 'domain') || contains(needs.determine-affected.outputs.paths, 'shared') || contains(needs.determine-affected.outputs.paths, 'features')) && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-boundaries-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-design-system:
    name: "Test UI Libs"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{contains(needs.determine-affected.outputs.paths, 'libs/ui') && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-design-system-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  build-web-tools:
    name: "Build Web Tools"
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    needs: determine-affected
    if: ${{!github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/build-web-tools-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}
      VERCEL_LEDGER_WALLET_TEAM_ID: ${{ secrets.VERCEL_LEDGER_WALLET_TEAM_ID }}
      VERCEL_LEDGER_WALLET_TOKEN: ${{ secrets.VERCEL_LEDGER_WALLET_TOKEN }}
      VERCEL_PROJECT_WEBTOOLS: ${{ secrets.VERCEL_PROJECT_WEBTOOLS }}
    with:
      build-web-tools: ${{ contains(needs.determine-affected.outputs.paths, 'apps/web-tools') }}

  test-cli:
    name: "Test CLI"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{contains(needs.determine-affected.outputs.paths, 'apps/cli') && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-cli-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  build-wallet-cli:
    name: "Build Wallet CLI"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{contains(needs.determine-affected.outputs.paths, 'wallet-cli') && !github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/build-wallet-cli-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-additional:
    name: "Test Additional"
    if: ${{!github.event.pull_request.head.repo.fork}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-additional.yml@ci-runner-baseline
    permissions:
      security-events: write
      contents: read

  test-mobile-e2e-lint:
    name: "Mobile E2E Lint & Typecheck"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{!github.event.pull_request.head.repo.fork && (contains(needs.determine-affected.outputs.paths, 'e2e/mobile') || contains(needs.determine-affected.outputs.paths, 'apps/ledger-live-mobile'))}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-mobile-e2e-lint-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  test-desktop-e2e-lint:
    name: "Desktop E2E Lint & Typecheck"
    permissions:
      id-token: write
      contents: read
    needs: determine-affected
    if: ${{!github.event.pull_request.head.repo.fork && contains(needs.determine-affected.outputs.paths, 'e2e/desktop')}}
    uses: LedgerHQ/ledger-live/.github/workflows/test-desktop-e2e-lint-reusable.yml@ci-runner-baseline
    secrets:
      AWS_ACCOUNT_ID_PROD: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
      AWS_CACHE_REGION: ${{ secrets.AWS_CACHE_REGION }}
      AWS_CACHE_ROLE_NAME: ${{ secrets.AWS_CACHE_ROLE_NAME }}
      NX_KEY: ${{ secrets.NX_KEY }}

  notify-e2e-required:
    name: "Notify E2E Required"
    permissions:
      contents: read
      pull-requests: write
    needs: determine-affected
    if: ${{ always() && needs.determine-affected.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.draft == false && !github.event.pull_request.head.repo.fork }}
    uses: LedgerHQ/ledger-live/.github/workflows/notify-e2e-required-reusable.yml@ci-runner-baseline
    with:
      affected_paths: ${{ needs.determine-affected.outputs.paths }}

  scan-sonar:
    name: "Sonar Cloud"
    permissions:
      id-token: write
      contents: read
    needs:
      - codecheck-desktop
      - test-mobile
      - test-libraries
      - test-features
      - test-shared
      - test-domain
      - test-devtools
      - build-wallet-cli
      - determine-affected
    uses: LedgerHQ/ledger-live/.github/workflows/scan-sonar-reusable.yml@ci-runner-baseline
    if: ${{ always() && !cancelled() && !github.event.pull_request.head.repo.fork && (needs.codecheck-desktop.result == 'success' || needs.test-mobile.result == 'success' || needs.test-libraries.result == 'success' || needs.test-features.result == 'success' || needs.test-shared.result == 'success' || needs.test-domain.result == 'success' || needs.test-devtools.result == 'success' || needs.build-wallet-cli.result == 'success' || contains(needs.determine-affected.outputs.paths, 'e2e')) }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      should_download_desktop_coverage: ${{ needs.codecheck-desktop.outputs.coverage_generated }}
      should_download_mobile_coverage: ${{ needs.test-mobile.outputs.coverage_generated }}
      should_download_libs_coverage: ${{ needs.test-libraries.outputs.coverage_generated }}
      should_download_features_coverage: ${{ needs.test-features.outputs.coverage_generated }}
      should_download_shared_coverage: ${{ needs.test-shared.outputs.coverage_generated }}
      should_download_domain_coverage: ${{ needs.test-domain.outputs.coverage_generated }}
      should_download_devtools_coverage: ${{ needs.test-devtools.outputs.coverage_generated }}
      should_download_wallet_cli_coverage: ${{ needs.build-wallet-cli.outputs.coverage_generated }}

  # Final Check required
  ok:
    name: "OK"
    needs:
      - build-desktop
      - test-desktop
      - codecheck-desktop
      - test-mobile
      - build-test-mobile
      - test-libraries
      - test-features
      - test-shared
      - test-domain
      - test-devtools
      - test-support
      - test-design-system
      - build-web-tools
      - test-cli
      - build-wallet-cli
      - test-additional
      - test-mobile-e2e-lint
      - test-desktop-e2e-lint
      - determine-affected
    runs-on: ubuntu-22.04
    if: always() && !cancelled() && needs.determine-affected.result == 'success'
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

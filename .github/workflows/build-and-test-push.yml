name: "[All Platforms] - Build and Test - Push"
on:
  push:
    branches:
      - main
      - develop
      - release
      - hotfix

permissions:
  contents: read

jobs:
  # LLD
  build-desktop:
    name: "Build Desktop"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/build-desktop-reusable.yml@develop
    secrets: inherit

  test-desktop:
    name: "Desktop E2E & Mock Tests"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-desktop-reusable.yml@develop
    secrets: inherit

  codecheck-desktop:
    name: "Desktop Lint & Unit Tests"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-desktop-codechecks-reusable.yml@develop
    secrets: inherit

  test-mobile:
    name: "Test Mobile"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-mobile-reusable.yml@develop
    secrets: inherit

  build-test-mobile:
    name: "Build & Test Mobile"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-mobile-mock-reusable.yml@develop
    secrets: inherit
    with:
      macos-specificity-runner-label: "general-pool"
      skip-bundle-size-reporting: true
      max-shards: 2
      skip-pod-checks: "true"

  # Tests
  test-libraries:
    name: "Test Libraries"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-libs-reusable.yml@develop
    secrets: inherit

  test-features:
    name: "Test Features"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-features-reusable.yml@develop
    secrets: inherit

  test-shared:
    name: "Test Shared"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-shared-reusable.yml@develop
    secrets: inherit

  test-domain:
    name: "Test Domain"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-domain-reusable.yml@develop
    secrets: inherit

  test-devtools:
    name: "Test DevTools"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-devtools-reusable.yml@develop
    secrets: inherit

  test-support:
    name: "Test Support"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-support-reusable.yml@develop
    secrets: inherit

  test-design-system:
    name: "Test UI Libs"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-design-system-reusable.yml@develop
    secrets: inherit

  build-web-tools:
    name: "Build Web Tools"
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: LedgerHQ/ledger-live/.github/workflows/build-web-tools-reusable.yml@develop
    secrets: inherit
    with:
      vercel-production: ${{ github.ref_name == 'develop' && 'true' || 'false' }}

  test-cli:
    name: "Test CLI"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-cli-reusable.yml@develop
    secrets: inherit

  build-wallet-cli:
    name: "Build Wallet CLI"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/build-wallet-cli-reusable.yml@develop
    secrets: inherit

  test-additional:
    name: "Test Additional"
    uses: LedgerHQ/ledger-live/.github/workflows/test-additional.yml@develop
    secrets: inherit

  test-mobile-e2e-lint:
    name: "Mobile E2E Lint & Typecheck"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-mobile-e2e-lint-reusable.yml@develop
    secrets: inherit

  test-desktop-e2e-lint:
    name: "Desktop E2E Lint & Typecheck"
    permissions:
      id-token: write
      contents: read
    uses: LedgerHQ/ledger-live/.github/workflows/test-desktop-e2e-lint-reusable.yml@develop
    secrets: inherit

  # Final Check required
  ok:
    name: "OK"
    needs:
      - build-desktop
      - test-desktop
      - codecheck-desktop
      - test-mobile
      - build-test-mobile
      - test-libraries
      - test-features
      - test-shared
      - test-domain
      - test-devtools
      - test-support
      - test-design-system
      - build-web-tools
      - test-cli
      - build-wallet-cli
      - test-additional
      - test-mobile-e2e-lint
      - test-desktop-e2e-lint
    runs-on: ubuntu-22.04
    if: always() && !cancelled()
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

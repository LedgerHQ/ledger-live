name: "[CI] - Lint Commits - Manual"
run-name: "@PR • Lint Commits triggered by ${{ github.event_name == 'pull_request' && github.event.sender.login || inputs.login || 'unknown' }} ${{ format('on branch {0}', github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.ref || 'unknown') }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The commit/branch to lint
        required: true
      from:
        description: Lower end of the commit range to lint
        required: true
      login:
        description: The GitHub username that triggered the workflow
        required: false
  pull_request: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  lint-commits:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.ref }}
          fetch-depth: 0
      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: setup-caches
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}
      - name: Install dependencies
        run: pnpm i --filter="ledger-live"
      - name: Lint commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          INPUTS_FROM: ${{ inputs.from }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            FROM="origin/$BASE_REF"
          elif [ -n "$INPUTS_FROM" ]; then
            FROM="origin/$INPUTS_FROM"
          else
            FROM="HEAD^1"
          fi
          pnpm commitlint --from "$FROM" --verbose

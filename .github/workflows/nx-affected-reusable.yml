name: "[All Platforms] - Determine Affected (Nx) - Called"

on:
  workflow_call:
    inputs:
      base_branch:
        description: "Base branch"
        type: string
        required: true
      head_branch:
        description: "Head branch"
        type: string
        required: true
      mobile_e2e_plan:
        description: "Plan the mobile e2e builds when ledger-live-mobile is affected"
        type: boolean
        required: false
        default: false
      mobile_e2e_speculos_device:
        description: "speculos_device passed to test-mobile-e2e-reusable.yml"
        type: string
        required: false
        default: "nanoX"
      mobile_e2e_smoke_tests:
        description: "smoke_tests passed to test-mobile-e2e-reusable.yml"
        type: boolean
        required: false
        default: false
      mobile_e2e_max_shards:
        description: "max_shards passed to test-mobile-e2e-reusable.yml"
        type: number
        required: false
        default: 0
    secrets:
      AWS_ACCOUNT_ID_PROD:
        required: false
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH:
        required: false
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP:
        required: false
      AWS_CACHE_REGION:
        required: false
      AWS_CACHE_ROLE_NAME:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ENDPOINT:
        required: false
    outputs:
      packages:
        description: "Newline-separated list of affected packages"
        value: ${{ jobs.nx-affected.outputs.packages }}
      paths:
        description: "Newline-separated list of affected paths"
        value: ${{ jobs.nx-affected.outputs.paths }}
      path_prefixes:
        description: "JSON array of every leading segment run of the affected paths. Gate jobs with contains(fromJSON(...), '<path>'), which compares whole elements, not substrings"
        value: ${{ jobs.nx-affected.outputs.path_prefixes }}
      mobile_js_hash_ios:
        description: "Nx hash of live-mobile:e2e:bundle:ios, set when ledger-live-mobile is affected"
        value: ${{ jobs.nx-affected.outputs.mobile_js_hash_ios }}
      mobile_js_hash_android:
        description: "Nx hash of live-mobile:e2e:bundle:android, set when ledger-live-mobile is affected"
        value: ${{ jobs.nx-affected.outputs.mobile_js_hash_android }}
      mobile_native_fingerprint_ios:
        description: "Expo fingerprint of the live-mobile iOS native project, set when ledger-live-mobile is affected"
        value: ${{ jobs.nx-affected.outputs.mobile_native_fingerprint_ios }}
      mobile_native_fingerprint_android:
        description: "Expo fingerprint of the live-mobile Android native project, set when ledger-live-mobile is affected"
        value: ${{ jobs.nx-affected.outputs.mobile_native_fingerprint_android }}
      mobile_e2e_plan:
        description: "build_plan for test-mobile-e2e-reusable.yml"
        value: ${{ jobs.nx-affected.outputs.mobile_e2e_plan }}

permissions:
  contents: read

jobs:
  nx-affected:
    name: "Determine Affected (Nx)"
    runs-on: ledger-wallet-4cpu-aws-public-cached
    permissions:
      contents: read
      id-token: write # needed for the OIDC login to JFrog
    outputs:
      packages: ${{ steps.nx-affected.outputs.packages }}
      paths: ${{ steps.nx-affected.outputs.paths }}
      path_prefixes: ${{ steps.nx-affected.outputs.path_prefixes }}
      mobile_js_hash_ios: ${{ steps.mobile-e2e-hashes.outputs.js_bundle_hash_ios }}
      mobile_js_hash_android: ${{ steps.mobile-e2e-hashes.outputs.js_bundle_hash_android }}
      mobile_native_fingerprint_ios: ${{ steps.mobile-e2e-hashes.outputs.native_fingerprint_ios }}
      mobile_native_fingerprint_android: ${{ steps.mobile-e2e-hashes.outputs.native_fingerprint_android }}
      mobile_e2e_plan: ${{ steps.mobile-e2e-plan.outputs.plan }}
    steps:
      - name: Checkout head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # The base tip may have moved since the merge commit was built; diffing against it reverses those commits.
      - name: Use the merge commit's first parent as base
        id: merge-parent
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            echo "sha=$(git rev-parse HEAD^1)" | tee -a "$GITHUB_OUTPUT"
          fi

      # Node and pnpm come from mise.toml, so the versions this job runs cannot drift from the
      # ones the repo pins. This also writes nx.cache-config.json.
      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@ci-test/deps-gha-sonar-github
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      # Before the install so every package is fetched through JFrog, not public npm.
      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@ci-test/deps-gha-sonar-github
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Fetch base branch
        if: ${{ steps.merge-parent.outputs.sha == '' }}
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          git fetch --depth=1 origin -- "$BASE_BRANCH"

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: clean-refs
        env:
          HEAD_BRANCH_INPUT: ${{ inputs.head_branch }}
          BASE_BRANCH_INPUT: ${{ inputs.base_branch }}
        with:
          script: |
            const head_branch = process.env.HEAD_BRANCH_INPUT;
            const base_branch = process.env.BASE_BRANCH_INPUT;

            const newHeadBranch = head_branch.replace("refs/heads/", "");
            const newBaseBranch = base_branch.replace("refs/heads/", "");

            core.exportVariable("head_branch", newHeadBranch);
            core.exportVariable("base_branch", newBaseBranch);
            core.setOutput("base_ref", "origin/" + newBaseBranch);

      # Same filters as the mobile Build JS jobs: Nx resolves package versions through node_modules,
      # so the e2e:bundle hash computed below only matches theirs with the same install
      - name: Install dependencies for the root workspace and mobile
        run: pnpm i --frozen-lockfile --filter="live-mobile..." --filter="ledger-live" --ignore-scripts

      - name: Get affected packages and paths
        id: nx-affected
        uses: LedgerHQ/ledger-live/tools/actions/composites/nx-affected-packages@ci-test/deps-gha-sonar-github
        with:
          base: ${{ steps.merge-parent.outputs.sha || steps.clean-refs.outputs.base_ref }}
          head: HEAD

      - name: Compute mobile e2e hashes
        id: mobile-e2e-hashes
        if: ${{ contains(steps.nx-affected.outputs.paths, 'ledger-live-mobile') }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/mobile-e2e-hashes@ci-test/deps-gha-sonar-github

      # Replaces the e2e workflow's determine-builds job, which still runs if this fails.
      - name: Plan the mobile e2e builds and shards
        id: mobile-e2e-plan
        if: ${{ inputs.mobile_e2e_plan && contains(steps.nx-affected.outputs.paths, 'ledger-live-mobile') }}
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/mobile-e2e-plan@ci-test/deps-gha-sonar-github
        with:
          ref: ${{ github.ref_name }}
          event_name: workflow_call
          speculos_device: ${{ inputs.mobile_e2e_speculos_device }}
          smoke_tests: ${{ inputs.mobile_e2e_smoke_tests }}
          max_shards: ${{ inputs.mobile_e2e_max_shards }}
          js_bundle_hash_ios: ${{ steps.mobile-e2e-hashes.outputs.js_bundle_hash_ios }}
          js_bundle_hash_android: ${{ steps.mobile-e2e-hashes.outputs.js_bundle_hash_android }}
          native_fingerprint_ios: ${{ steps.mobile-e2e-hashes.outputs.native_fingerprint_ios }}
          native_fingerprint_android: ${{ steps.mobile-e2e-hashes.outputs.native_fingerprint_android }}
          cache_bucket: ll-nx-cache
          aws_region: ${{ secrets.AWS_CACHE_REGION }}
          r2_access_key: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Warn when the mobile e2e plan is missing
        if: ${{ steps.mobile-e2e-plan.outcome == 'failure' }}
        run: echo "::warning::Mobile e2e plan failed, the e2e workflow runs its own determine-builds job"

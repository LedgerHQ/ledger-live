name: "[All Platforms] - Determine Affected (Nx) - Called"

on:
  workflow_call:
    inputs:
      base_branch:
        description: "Base branch"
        type: string
        required: true
      head_branch:
        description: "Head branch"
        type: string
        required: true
      mobile_e2e_plan:
        description: "When ledger-live-mobile is affected, also plan the mobile e2e builds and shards (mobile-e2e-plan action), so test-mobile-e2e-reusable.yml can skip its determine-builds job. The settings below must match the ones the caller passes to that workflow."
        type: boolean
        required: false
        default: false
      mobile_e2e_speculos_device:
        description: "speculos_device passed to test-mobile-e2e-reusable.yml"
        type: string
        required: false
        default: "nanoX"
      mobile_e2e_smoke_tests:
        description: "smoke_tests passed to test-mobile-e2e-reusable.yml"
        type: boolean
        required: false
        default: false
      mobile_e2e_max_shards:
        description: "max_shards passed to test-mobile-e2e-reusable.yml"
        type: number
        required: false
        default: 0
      mobile_e2e_check_pod_lockfile:
        description: "check_pod_lockfile passed to test-mobile-e2e-reusable.yml"
        type: boolean
        required: false
        default: false
    secrets:
      AWS_ACCOUNT_ID_PROD:
        required: false
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH:
        required: false
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP:
        required: false
      AWS_CACHE_REGION:
        required: false
      AWS_CACHE_ROLE_NAME:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ENDPOINT:
        required: false
    outputs:
      packages:
        description: "Newline-separated list of affected packages"
        value: ${{ jobs.nx-affected.outputs.packages }}
      paths:
        description: "Newline-separated list of affected paths"
        value: ${{ jobs.nx-affected.outputs.paths }}
      mobile_js_hash_ios:
        description: "Nx hash of live-mobile:e2e:bundle:ios, set when ledger-live-mobile is affected"
        value: ${{ jobs.nx-affected.outputs.mobile_js_hash_ios }}
      mobile_js_hash_android:
        description: "Nx hash of live-mobile:e2e:bundle:android, set when ledger-live-mobile is affected"
        value: ${{ jobs.nx-affected.outputs.mobile_js_hash_android }}
      mobile_native_fingerprint_ios:
        description: "Expo fingerprint of the live-mobile iOS native project, set when ledger-live-mobile is affected"
        value: ${{ jobs.nx-affected.outputs.mobile_native_fingerprint_ios }}
      mobile_native_fingerprint_android:
        description: "Expo fingerprint of the live-mobile Android native project, set when ledger-live-mobile is affected"
        value: ${{ jobs.nx-affected.outputs.mobile_native_fingerprint_android }}
      mobile_e2e_plan:
        description: "Plan for test-mobile-e2e-reusable.yml (its build_plan input), set when mobile_e2e_plan is on and ledger-live-mobile is affected"
        value: ${{ jobs.nx-affected.outputs.mobile_e2e_plan }}

permissions:
  contents: read

jobs:
  nx-affected:
    name: "Determine Affected (Nx)"
    runs-on: ledger-wallet-4cpu-aws-public-cached
    permissions:
      contents: read
      id-token: write # needed for the OIDC login to JFrog
    outputs:
      packages: ${{ steps.nx-affected.outputs.packages }}
      paths: ${{ steps.nx-affected.outputs.paths }}
      mobile_js_hash_ios: ${{ steps.mobile-js-hash.outputs.ios }}
      mobile_js_hash_android: ${{ steps.mobile-js-hash.outputs.android }}
      mobile_native_fingerprint_ios: ${{ steps.mobile-native-fingerprint.outputs.ios }}
      mobile_native_fingerprint_android: ${{ steps.mobile-native-fingerprint.outputs.android }}
      mobile_e2e_plan: ${{ steps.mobile-e2e-plan.outputs.plan }}
    steps:
      - name: Checkout head branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Node and pnpm come from mise.toml, so the versions this job runs cannot drift from the
      # ones the repo pins. This also writes nx.cache-config.json.
      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      # Before the install so every package is fetched through JFrog, not public npm.
      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Fetch base branch
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          git fetch --depth=1 origin -- "$BASE_BRANCH"

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: clean-refs
        env:
          HEAD_BRANCH_INPUT: ${{ inputs.head_branch }}
          BASE_BRANCH_INPUT: ${{ inputs.base_branch }}
        with:
          script: |
            const head_branch = process.env.HEAD_BRANCH_INPUT;
            const base_branch = process.env.BASE_BRANCH_INPUT;

            const newHeadBranch = head_branch.replace("refs/heads/", "");
            const newBaseBranch = base_branch.replace("refs/heads/", "");

            core.exportVariable("head_branch", newHeadBranch);
            core.exportVariable("base_branch", newBaseBranch);
            core.setOutput("base_ref", "origin/" + newBaseBranch);

      # Same filters as the mobile Build JS jobs: Nx resolves package versions through node_modules,
      # so the e2e:bundle hash computed below only matches theirs with the same install
      - name: Install dependencies for the root workspace and mobile
        run: pnpm i --frozen-lockfile --filter="live-mobile..." --filter="ledger-live" --ignore-scripts

      - name: Get affected packages and paths
        id: nx-affected
        uses: LedgerHQ/ledger-live/tools/actions/composites/nx-affected-packages@develop
        with:
          base: ${{ steps.clean-refs.outputs.base_ref }}
          head: HEAD

      # Reuses the project graph the affected step just built, so the mobile e2e workflow can look the
      # JS bundles up in the Nx cache without its own install. Like the Build JS jobs, it sets no sharedEnv
      # variables, which are part of the e2e:bundle hash.
      - name: Compute mobile JS bundle Nx hashes
        id: mobile-js-hash
        if: ${{ contains(steps.nx-affected.outputs.paths, 'ledger-live-mobile') }}
        shell: bash
        run: node tools/nx/task-hash.mjs live-mobile e2e:bundle ios android | tee -a "$GITHUB_OUTPUT"

      # Reuses the install above, so the mobile e2e workflow can key the native builds on what they are built
      # from rather than on hashFiles. Guard until release and hotfix have the script. Without an output the
      # e2e workflow falls back to hashFiles, so a failure here must not fail the affected job.
      - name: Compute mobile native fingerprints
        id: mobile-native-fingerprint
        continue-on-error: true
        if: ${{ contains(steps.nx-affected.outputs.paths, 'ledger-live-mobile') && hashFiles('apps/ledger-live-mobile/scripts/native-fingerprint.mjs') != '' }}
        shell: bash
        run: node apps/ledger-live-mobile/scripts/native-fingerprint.mjs ios android | tee -a "$GITHUB_OUTPUT"

      - name: Warn when the mobile native fingerprints are missing
        if: ${{ steps.mobile-native-fingerprint.outcome == 'failure' }}
        run: echo "::warning::Mobile native fingerprint failed, the e2e native builds fall back to the hashFiles key"

      # The mobile e2e plan is what test-mobile-e2e-reusable.yml's determine-builds job would compute, done here
      # so the mobile builds start as soon as this job ends instead of after one more job. Without a plan the
      # e2e workflow runs determine-builds itself, so a failure here must not fail the affected job.
      - name: Resolve the cache profile for the mobile e2e plan
        id: mobile-e2e-cache-profile
        if: ${{ inputs.mobile_e2e_plan && contains(steps.nx-affected.outputs.paths, 'ledger-live-mobile') }}
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/configure-nx-remote-cache-profile@develop
        with:
          develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          legacy-account-id: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          legacy-role-name: ${{ secrets.AWS_CACHE_ROLE_NAME }}

      - name: Configure AWS credentials for the mobile e2e plan
        id: mobile-e2e-aws
        if: ${{ steps.mobile-e2e-cache-profile.outcome == 'success' }}
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ steps.mobile-e2e-cache-profile.outputs.role-arn }}
          aws-region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Plan the mobile e2e builds and shards
        id: mobile-e2e-plan
        if: ${{ steps.mobile-e2e-aws.outcome == 'success' }}
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/mobile-e2e-plan@study/determine-builds
        with:
          ref: ${{ github.ref_name }}
          event_name: workflow_call
          speculos_device: ${{ inputs.mobile_e2e_speculos_device }}
          smoke_tests: ${{ inputs.mobile_e2e_smoke_tests }}
          max_shards: ${{ inputs.mobile_e2e_max_shards }}
          check_pod_lockfile: ${{ inputs.mobile_e2e_check_pod_lockfile }}
          js_bundle_hash_ios: ${{ steps.mobile-js-hash.outputs.ios }}
          js_bundle_hash_android: ${{ steps.mobile-js-hash.outputs.android }}
          native_fingerprint_ios: ${{ steps.mobile-native-fingerprint.outputs.ios }}
          native_fingerprint_android: ${{ steps.mobile-native-fingerprint.outputs.android }}
          cache_bucket: ll-nx-cache
          aws_region: ${{ secrets.AWS_CACHE_REGION }}
          r2_access_key: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_endpoint: ${{ secrets.R2_ENDPOINT }}

      - name: Warn when the mobile e2e plan is missing
        if: ${{ steps.mobile-e2e-cache-profile.outcome == 'failure' || steps.mobile-e2e-aws.outcome == 'failure' || steps.mobile-e2e-plan.outcome == 'failure' }}
        run: echo "::warning::Mobile e2e plan failed, the e2e workflow runs its own determine-builds job"

name: "[Study] - Knip from root"

# Study branch only. Compares the per-package `unimported` scripts (one knip run per package and
# platform) with grouped knip runs from the repo root: one run for the packages using the root
# knip.json, and one per (platform, tsConfig) for dual-platform packages, using a merged config.
# Logic lives in .github/knip-study/run.mjs. Dispatch with:
#   gh workflow run study-knip-root.yml --ref ci/knip-root-study [-f compare-fanout=false] [-f fanout-parallel=3] [-f runner=ledger-wallet-4cpu-aws-public-cached]
# The push trigger only registers this workflow for dispatch from a non-default branch; its job is skipped.

on:
  push:
    branches:
      - ci/knip-root-study
    paths:
      - .github/workflows/study-knip-root.yml
  workflow_dispatch:
    inputs:
      compare-fanout:
        description: "Also run every per-package invocation and diff the issues against the grouped runs"
        type: boolean
        default: true
      fanout-parallel:
        description: "Per-package invocations run at once (Nx run-many defaults to 3)"
        type: string
        default: "3"
      runner:
        description: "Runner to measure on"
        type: choice
        options:
          - ledger-wallet-8cpu-aws-public-cached
          - ledger-wallet-4cpu-aws-public-cached
          - ledger-wallet-2cpu-aws-public-cached
        default: ledger-wallet-8cpu-aws-public-cached

permissions:
  id-token: write
  contents: read

concurrency:
  group: study-knip-root-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: true

jobs:
  knip-root:
    name: Knip from root
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      CI_OS: ubuntu-22.04
      FORCE_COLOR: 0
      COMPARE_FANOUT: ${{ inputs.compare-fanout }}
      FANOUT_PARALLEL: ${{ inputs.fanout-parallel }}
      RUNNER: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-nx-cache: "true"

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install all dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Grouped knip runs from root
        run: node .github/knip-study/run.mjs grouped

      - name: Per-package fan-out
        if: env.COMPARE_FANOUT == 'true'
        run: node .github/knip-study/run.mjs fanout "$FANOUT_PARALLEL"

      - name: Compare
        if: env.COMPARE_FANOUT == 'true'
        run: |
          node .github/knip-study/run.mjs compare | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Runner: $RUNNER, fan-out parallelism $FANOUT_PARALLEL." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: knip-study
          path: knip-study-out/
          if-no-files-found: warn

name: "[Mobile] - Code Check - Called"

on:
  workflow_call:
    inputs:
      jest-passes:
        description: "Run the Jest command this many times in the same job (evaluation: pass 2 shows a warm cache)."
        type: string
        required: false
        default: "1"
      jest-worker-idle-memory-limit:
        description: "Jest workerIdleMemoryLimit override: a size such as 4GB, or off to disable worker recycling (empty keeps 1GB)."
        type: string
        required: false
        default: ""
      jest-shard:
        description: "Jest --shard value such as 1/2 (empty runs all tests)."
        type: string
        required: false
        default: ""
      runner:
        description: "Runner label for the unit test job."
        type: string
        required: false
        default: ledger-live-linux-16CPU-64RAM
      jest-max-workers:
        description: "Jest maxWorkers for the unit test job (number or percentage of cores)."
        type: string
        required: false
        default: "95%"
      skip-nx-cache:
        description: "Skip the Nx local and remote task cache so the run measures cold performance. Used for runner benchmarking."
        type: boolean
        required: false
        default: false
      skip-unit-tests:
        description: "Skip the unit test job. Set at the merge gate, where no product code executes."
        type: boolean
        required: false
        default: false

    outputs:
      coverage_generated:
        value: ${{ jobs.unit-tests.outputs.coverage_generated }}

    secrets:
      AWS_ACCOUNT_ID_PROD:
        required: true
      AWS_CACHE_OIDC_ROLE_ARN_BRANCH:
        required: true
      AWS_CACHE_OIDC_ROLE_ARN_DEVELOP:
        required: true
      AWS_CACHE_REGION:
        required: true
      AWS_CACHE_ROLE_NAME:
        required: true
      NX_KEY:
        required: true
  workflow_dispatch:
    inputs:
      jest-passes:
        description: "Run the Jest command this many times in the same job (evaluation: pass 2 shows a warm cache)."
        type: string
        required: false
        default: "1"
      jest-worker-idle-memory-limit:
        description: "Jest workerIdleMemoryLimit override: a size such as 4GB, or off to disable worker recycling (empty keeps 1GB)."
        type: string
        required: false
        default: ""
      jest-shard:
        description: "Jest --shard value such as 1/2 (empty runs all tests)."
        type: string
        required: false
        default: ""
      runner:
        description: "Runner label for the unit test job."
        type: string
        required: false
        default: ledger-live-linux-16CPU-64RAM
      jest-max-workers:
        description: "Jest maxWorkers for the unit test job (number or percentage of cores)."
        type: string
        required: false
        default: "95%"
      skip-nx-cache:
        description: "Skip the Nx local and remote task cache so the run measures cold performance. Used for runner benchmarking."
        type: boolean
        required: false
        default: false
      ref:
        description: |
          If you run this manually, and want to run on a PR, the correct ref should be refs/pull/{PR_NUMBER}/merge to
          have the "normal" scenario involving checking out a merge commit between your branch and the base branch.
          If you want to run only on a branch or specific commit, you can use either the sha or the branch name instead (prefer the first verion for PRs).
        type: string
        required: false
      login:
        description: The GitHub username that triggered the workflow
        type: string
        required: false
      base_ref:
        description: The base branch to merge the head into when checking out the code
        type: string
        required: false

permissions:
  contents: read

jobs:
  codecheck:
    name: "Mobile Code Check"
    permissions:
      id-token: write
      contents: read
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
      FORCE_COLOR: 3
      CI_OS: ubuntu-22.04
    runs-on: ledger-wallet-4cpu-aws-public
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: setup-caches
        with:
          use-mise: true
          skip-nx-cache: ${{ inputs.skip-nx-cache }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        run: pnpm i --filter="live-mobile..." --filter="ledger-live" --frozen-lockfile --unsafe-perm

      - name: Run format check
        if: github.base_ref == 'develop' || github.ref == 'refs/heads/develop' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        run: pnpm exec nx run live-mobile:format:check

      - name: Run linter
        run: pnpm exec nx run live-mobile:lint -- --quiet

      - name: Run lint (i18n)
        run: pnpm exec nx run live-mobile:lint:i18n

      - name: check for dead code
        run: pnpm mobile knip-check
        shell: bash

      - name: Run code checkers
        run: pnpm exec nx run live-mobile:typecheck

  unit-tests:
    name: "Mobile Unit Tests"
    if: ${{ !inputs.skip-unit-tests }}
    permissions:
      id-token: write
      contents: read
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
      FORCE_COLOR: 3
      CI_OS: ledger-live-linux-16CPU-64RAM
      JEST_MAX_WORKERS: ${{ inputs.jest-max-workers }}
      JEST_CACHE_DIRECTORY: /tmp/jest-cache
    runs-on: ${{ inputs.runner }}
    outputs:
      coverage_generated: ${{ contains(steps.generate_coverage.outcome, 'success') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup the caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        id: setup-caches
        with:
          use-mise: true
          skip-nx-cache: ${{ inputs.skip-nx-cache }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        run: pnpm i --frozen-lockfile --filter="live-mobile..." --filter="ledger-live" --unsafe-perm

      - name: Build dependencies
        run: pnpm exec nx run live-mobile:build-lib-deps

      - name: Get Jest cache date
        id: jest-cache-meta
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore Jest cache from S3
        # Only PRs restore. Scheduled develop runs start cold and only save; main, release and hotfix stay uncached.
        # EVALUATION ONLY (never merge): workflow_dispatch also restores so the warm cache can be measured pre-merge.
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          path: ${{ env.JEST_CACHE_DIRECTORY }}
          key: develop/jest-cache-mobile-${{ steps.jest-cache-meta.outputs.date }}
          restore-keys: |
            develop/jest-cache-mobile-
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ll-gha-s3-cache
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false

      - name: Run unit tests
        env:
          JEST_SHARD: ${{ inputs.jest-shard }}
          JEST_WORKER_IDLE_MEMORY_LIMIT: ${{ inputs.jest-worker-idle-memory-limit }}
          JEST_PASSES: ${{ inputs.jest-passes }}
        shell: bash
        run: |
          set -euo pipefail
          CPUS="$(nproc 2>/dev/null || echo "?")"
          echo "::group::Jest CI metrics (mobile coverage)"
          echo "runner_os=${CI_OS:-unknown} cpu_count=${CPUS} JEST_MAX_WORKERS=${JEST_MAX_WORKERS:-}"
          node -e '
            const os = require("os");
            const n = os.cpus().length;
            const w = process.env.JEST_MAX_WORKERS || "50%";
            let m;
            if (String(w).endsWith("%")) {
              m = Math.max(1, Math.floor((n * parseFloat(String(w))) / 100));
            } else if (/^\d+$/.test(String(w))) {
              m = Math.max(1, parseInt(w, 10));
            } else {
              m = w;
            }
            console.log("effective_max_workers_estimate=" + m);
          '
          echo "::endgroup::"
          for PASS in $(seq 1 "${JEST_PASSES:-1}"); do
            echo "::notice::jest_pass_window pass=${PASS} start=$(date -u +%FT%TZ)"
            START_TS=$(date +%s)
            pnpm mobile test:jest:coverage ${JEST_SHARD:+--shard="$JEST_SHARD"}
            END_TS=$(date +%s)
            echo "::notice::jest_pass_window pass=${PASS} end=$(date -u +%FT%TZ)"
            echo "::notice::jest_ci_metrics app=live-mobile pass=${PASS} jest_wall_seconds=$((END_TS - START_TS)) cpu_count=${CPUS} JEST_MAX_WORKERS=${JEST_MAX_WORKERS:-}"
          done

      - name: Save Jest cache to S3
        # EVALUATION ONLY (never merge): also save on workflow_dispatch to warm the cache pre-merge.
        if: ${{ success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.ref_name == 'develop')) }}
        continue-on-error: true
        uses: tespkg/actions-cache/save@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          path: ${{ env.JEST_CACHE_DIRECTORY }}
          key: develop/jest-cache-mobile-${{ steps.jest-cache-meta.outputs.date }}
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ll-gha-s3-cache
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false

      - name: upload coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        id: generate_coverage
        with:
          name: coverage-mobile
          path: ${{ github.workspace }}/apps/ledger-live-mobile/coverage

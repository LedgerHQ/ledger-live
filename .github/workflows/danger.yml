name: "[CI] - Check PR Validity"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {} # Deny all permissions by default at workflow level

jobs:
  danger:
    # Required check on develop (ruleset 1856973) - do not rename.
    name: "Validate PR conventions"
    # Skip on forks — GITHUB_TOKEN on forks has no write access to post comments
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ledger-live-test
    permissions:
      contents: read
      id-token: write # needed for the OIDC login to JFrog
      pull-requests: write # needed for Danger to post PR review comments
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Before the pnpm setup so pnpm itself is fetched through JFrog, not public npm.
      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@ci/test-image
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        run: pnpm i --filter @tools/danger... --frozen-lockfile --ignore-scripts

      - name: Run Danger
        working-directory: tools/danger
        run: pnpm danger ci --dangerfile dangerfile.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: "[CI] - Check PR Validity"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {} # Deny all permissions by default at workflow level

jobs:
  danger:
    # Required check on develop (ruleset 1856973) - do not rename.
    name: "Validate PR conventions"
    # Skip on forks — GITHUB_TOKEN on forks has no write access to post comments
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ledger-wallet-2cpu-aws-public-cached
    permissions:
      contents: read
      id-token: write # needed for the OIDC login to JFrog
      pull-requests: write # needed for Danger to post PR review comments
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # HEAD^1 is the base tip, used to diff pnpm-lock.yaml
          persist-credentials: false

      - name: Setup the toolchain
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          skip-nx-cache: "true"

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies
        run: pnpm i --filter @tools/danger... --frozen-lockfile --ignore-scripts

      - name: Run Danger
        working-directory: tools/danger
        run: pnpm danger ci --dangerfile dangerfile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

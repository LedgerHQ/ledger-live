name: "[Desktop] - E2E Only - Scheduled/Manual"
run-name: >
  @Desktop E2E • triggered on ${{ inputs.ref || github.ref_name }} by ${{ github.actor }}

on:
  schedule:
    # Monday is the desktop broadcast nightly: real on-chain transactions are sent.
    # Mobile broadcasts on other days (Wednesday iOS, Friday Android) so the two apps never
    # broadcast from the shared QAA accounts on the same day.
    # The device rotates per weekday (see WEEKDAY_DEVICE in prepare-devices).
    # The cron expression below is matched verbatim in the E2E_BROADCAST_ENABLED env — keep both in sync.
    - cron: "0 1 * * 1"
    - cron: "0 1 * * 2-5"
  workflow_dispatch:
    inputs:
      ref:
        description: "Specify branch to checkout and test or leave blank to use the workflow branch"
        required: false
      test_filter:
        description: Filter pattern(s) to execute only selected test suites by test name, file path or tag, separated by ',' or '|' (e.g. "Accounts @smoke", "@generic-coin-framework,@solana", "@bitcoin,@family-evm" or "Accounts @smoke|Settings")
        required: false
      team:
        description: "Run only one team's tests. ANDed with test_filter, Smoke and the device."
        required: false
        type: choice
        options: [all, bst, buy-and-sell, coin-integration, earn, engagement, my-ledger-onboarding, swap, wallet-xp]
        default: all
      invert_filter:
        description: Ignore test having name pattern (entered in the previous field)
        type: boolean
        default: false
      slack_notif:
        description: "Send notification to Slack?"
        required: false
        type: boolean
        default: false
      enable_broadcast:
        description: "Enable transaction broadcast"
        required: false
        type: boolean
        default: false
      build_type:
        description: "Firebase env to target (pick js for release testing)"
        required: false
        type: choice
        options:
          - js
          - staging
          - testing
        default: testing
      speculos_device:
        description: "Device to be used"
        required: false
        type: choice
        options:
          - nanoS
          - nanoSP
          - nanoX
          - stax
          - flex
          - nanoGen5
          - nanoSP and stax
        default: nanoSP
      remote_speculos:
        description: "Run on Speculinho instead of Docker"
        required: false
        type: boolean
        default: false
      run_on_macos:
        description: "⚠️ QA and release runs only: also run on macOS (shared Mac runner, Speculinho)"
        required: false
        type: boolean
        default: false
      smoke_tests:
        description: "Run smoke tests"
        required: false
        type: boolean
        default: false
      feature_flags:
        description: "Choose a feature flag set for the run"
        required: false
        type: choice
        options:
          - defaults
          - wallet40-q1
        default: defaults
      feature_flags_json:
        description: "JSON to override feature flags (takes precedence if set)"
        required: false
        type: string
        default: ""
      repeat_each:
        description: "Repeat each test N times (optional)"
        required: false
        type: number

  workflow_call:
    inputs:
      ref:
        description: "Specify branch to checkout and test or leave blank to use the workflow branch"
        required: false
        type: string
      test_filter:
        description: Filter pattern(s) to execute only selected test suites by test name, file path or tag, separated by ',' or '|' (e.g. "Accounts @smoke", "@generic-coin-framework,@solana", "@bitcoin,@family-evm" or "Accounts @smoke|Settings")
        required: false
        type: string
      team:
        description: "Team slug whose specs to run. One of: all, bst, buy-and-sell, coin-integration, earn, engagement, my-ledger-onboarding, swap, wallet-xp."
        required: false
        type: string
        default: all
      invert_filter:
        description: Ignore test having name pattern (entered in the previous field)
        type: boolean
        default: false
      slack_notif:
        description: "Send notification to Slack?"
        required: false
        type: boolean
        default: false
      enable_broadcast:
        description: "Enable transaction broadcast"
        required: false
        type: boolean
        default: false
      build_type:
        description: "Firebase env to target (pick js for release testing)"
        required: false
        type: string
        default: testing
      speculos_device:
        description: "Device to be used"
        required: true
        type: string
      remote_speculos:
        description: "Run on Speculinho instead of Docker"
        required: false
        type: boolean
        default: false
      run_on_macos:
        description: "⚠️ QA and release runs only: also run on macOS (shared Mac runner, Speculinho)"
        required: false
        type: boolean
        default: false
      smoke_tests:
        description: "Run smoke tests"
        required: false
        type: boolean
        default: false
      feature_flags:
        description: "Choose a feature flag set for the run"
        required: false
        type: string
        default: defaults
      feature_flags_json:
        description: "JSON to override feature flags (takes precedence if set)"
        required: false
        type: string
        default: ""
      repeat_each:
        description: "Repeat each test N times (optional)"
        required: false
        type: number

permissions:
  contents: read

env:
  E2E_DESKTOP_FEATURE_FLAGS: ${{ inputs.feature_flags || 'defaults' }}
  E2E_FEATURE_FLAGS_JSON: ${{ inputs.feature_flags_json || '' }}
  # Broadcast on explicit request, or on the Monday nightly (see the schedule above).
  E2E_BROADCAST_ENABLED: ${{ inputs.enable_broadcast || github.event.schedule == '0 1 * * 1' }}

jobs:
  prepare-devices:
    name: "Prepare device matrix"
    runs-on: ubuntu-latest
    outputs:
      device_1: ${{ steps.parse.outputs.device_1 }}
      device_2: ${{ steps.parse.outputs.device_2 }}
      is_dual: ${{ steps.parse.outputs.is_dual }}
      e2e_matrix: ${{ steps.parse.outputs.e2e_matrix }}
    steps:
      - name: Parse speculos device input
        id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          SPECULOS_DEVICE_INPUT: ${{ inputs.speculos_device || 'nanoSP' }}
        run: |
          # Nightly rotation, shared with the mobile one in test-mobile-e2e-reusable.yml: the three
          # platforms use three different devices each weekday, and all six devices run every week.
          # Wednesday alternates flex / nanoGen5 by ISO week parity, the opposite of Android that day.
          # 10# keeps a zero-padded week such as "08" from being read as octal.
          if [ $((10#$(date -u +%V) % 2)) -eq 0 ]; then WEDNESDAY_DEVICE=flex; else WEDNESDAY_DEVICE=nanoGen5; fi
          declare -A WEEKDAY_DEVICE=(
            [1]=nanoSP              # Monday     - LNSP (broadcast)
            [2]=nanoX               # Tuesday    - LNX
            [3]=$WEDNESDAY_DEVICE   # Wednesday  - Flex on even ISO weeks, NG5 on odd ones
            [4]=stax                # Thursday   - Stax
            [5]=nanoS               # Friday     - LNS
          )
          if [ "$EVENT_NAME" = "schedule" ]; then
            DOW=$(date -u +%u)
            DEVICE="${WEEKDAY_DEVICE[$DOW]:-nanoSP}"
            {
              echo "device_1=$DEVICE"
              echo "device_2=skipped"
              echo "is_dual=false"
              printf 'e2e_matrix={"include":[{"device":"%s","is_primary":true,"artifact_suffix":""}]}\n' "$DEVICE"
            } >> "$GITHUB_OUTPUT"
          elif [ "$SPECULOS_DEVICE_INPUT" = "nanoSP and stax" ]; then
            {
              echo "device_1=nanoSP"
              echo "device_2=stax"
              echo "is_dual=true"
              echo 'e2e_matrix={"include":[{"device":"nanoSP","is_primary":true,"artifact_suffix":""},{"device":"stax","is_primary":false,"artifact_suffix":"-stax"}]}'
            } >> "$GITHUB_OUTPUT"
          else
            DEVICE="$SPECULOS_DEVICE_INPUT"
            {
              echo "device_1=$DEVICE"
              echo "device_2=skipped"
              echo "is_dual=false"
              printf 'e2e_matrix={"include":[{"device":"%s","is_primary":true,"artifact_suffix":""}]}\n' "$DEVICE"
            } >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  e2e-tests:
    name: "Desktop E2E (${{ matrix.device }})"
    needs: [prepare-devices]
    runs-on: [ledger-live-linux-e2e-speculos-32CPU-128RAM]
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-devices.outputs.e2e_matrix) }}
    timeout-minutes: 40
    env:
      NODE_OPTIONS: "--max-old-space-size=14336"
      INSTRUMENT_BUILD: true
      FORCE_COLOR: 3
      CI_OS: "ubuntu-latest"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      npm_config_loglevel: warn
      pnpm_config_loglevel: warn
      DO_NOT_TRACK: 1
      SPECULOS_DEVICE: ${{ matrix.device }}
      REMOTE_SPECULOS: ${{ inputs.remote_speculos }}
      SPECULOS_IMAGE_TAG: ghcr.io/ledgerhq/speculos:${{ matrix.device != 'nanoS' && 'latest' || (inputs.remote_speculos && 'speculos-38ccc68068db-coinapps-85c7e5c' || '1be65b91a8e0691866f880fd437ac05fce78af9d') }}
      COINAPPS: ${{ github.workspace }}/coin-apps
      E2E_PRIMARY_DEVICE: ${{ matrix.is_primary }}
      cache-bucket: ll-nx-cache
      USERDATA_CACHE_ENABLED: ${{ inputs.build_type != 'js' }}
      E2E_GENERATED_USERDATA_DIR: ${{ inputs.build_type != 'js' && format('{0}/e2e/userdata/generated', github.workspace) || '' }}
    outputs:
      test_passed: ${{ steps.run-playwright.outputs.passed }}
      test_failed: ${{ steps.run-playwright.outputs.failed }}
      test_total: ${{ steps.run-playwright.outputs.total }}
      test_exit_code: ${{ steps.run-playwright.outputs.exit_code }}
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          repositories: |
            ledger-live
            coin-apps
          permission-contents: read

      - name: Checkout ledger-live monorepo (shallow clone)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          repository: LedgerHQ/ledger-live
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 1

      - name: Checkout coin-apps (device firmware binaries)
        if: ${{ env.REMOTE_SPECULOS != 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: LedgerHQ/coin-apps
          ref: master
          token: ${{ steps.generate-token.outputs.token }}
          path: coin-apps
          fetch-depth: 1
          persist-credentials: false

      - name: Setup caches
        id: caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@test/pnpm-11-smoke
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Build Playwright grep filter from inputs
        id: test-filter
        shell: bash
        env:
          TEST_FILTER_INPUT: ${{ inputs.test_filter }}
          SMOKE_TESTS_INPUT: ${{ inputs.smoke_tests }}
          TEAM_INPUT: ${{ inputs.team || 'all' }}
          INVERT_FILTER_INPUT: ${{ inputs.invert_filter || false }}
        run: |
          node e2e/tooling/filter/resolve.mjs \
            --input "$TEST_FILTER_INPUT" \
            --smoke-tests "$SMOKE_TESTS_INPUT" \
            --team "$TEAM_INPUT" \
            --invert-filter "$INVERT_FILTER_INPUT" \
            --check-dir "e2e/desktop/tests" \
            --runner playwright \
            --github-output >> "$GITHUB_OUTPUT"

      - name: Pull Speculos docker image
        if: ${{ env.REMOTE_SPECULOS != 'true' }}
        run: docker pull "$SPECULOS_IMAGE_TAG"
        shell: bash

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@test/pnpm-11-smoke
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies and build LLD
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-e2e-test-desktop@test/pnpm-11-smoke
        id: setup-test-desktop
        with:
          build_type: ${{ inputs.build_type || 'testing' }}

      - name: Verify Speculos Docker image is ready
        if: ${{ env.REMOTE_SPECULOS != 'true' }}
        run: |
          while ! docker image inspect "$SPECULOS_IMAGE_TAG" > /dev/null 2>&1; do
            echo "Waiting for Speculos image pull to complete..."
            sleep 2
          done
          echo "Speculos image ready: $SPECULOS_IMAGE_TAG"
          docker image inspect "$SPECULOS_IMAGE_TAG" --format '{{.Size}}' | numfmt --to=iec
        shell: bash

      - name: Configure test environment (API endpoints, broadcast settings)
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-e2e-env@test/pnpm-11-smoke
        with:
          enable_broadcast: ${{ env.E2E_BROADCAST_ENABLED }}
          build_type: ${{ inputs.build_type }}

      - name: Write workflow context to GitHub Summary
        env:
          FILTER_PATTERN: ${{ steps.test-filter.outputs.filter }}
          BUILD_TYPE: ${{ inputs.build_type || 'testing' }}
          BROADCAST_ENABLED: ${{ env.E2E_BROADCAST_ENABLED }}
          REPEAT_EACH: ${{ inputs.repeat_each }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          TRIGGERED_BRANCH: ${{ inputs.ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          FEATURE_FLAGS: ${{ env.E2E_DESKTOP_FEATURE_FLAGS }}
          TEAM_INPUT: ${{ inputs.team || 'all' }}
          SPECULOS_MODE: ${{ env.REMOTE_SPECULOS == 'true' && 'Speculinho (remote)' || 'Docker' }}
        run: |
          DEVICE="$SPECULOS_DEVICE"
          EXTRA_FEATURE_FLAGS="$E2E_FEATURE_FLAGS_JSON"

          if [ -z "$EXTRA_FEATURE_FLAGS" ]; then
            EXTRA_FEATURE_FLAGS="(none)"
          fi
          if [ -z "$REPEAT_EACH" ]; then
            REPEAT_EACH="(none)"
          fi

          FILTER_SUMMARY="$(node e2e/tooling/filter/format-summary.mjs "$FILTER_PATTERN")"
          {
            echo "## Workflow Context"
            echo ""
            echo "- **Workflow source branch:** $WORKFLOW_REF"
            echo "- **Triggered branch:** $TRIGGERED_BRANCH"
            echo "- **Commit SHA:** $COMMIT_SHA"
            echo "- **Device selected:** $DEVICE"
            echo "- **Speculos:** $SPECULOS_MODE"
            echo "- **Team:** $TEAM_INPUT"
            echo "$FILTER_SUMMARY"
            echo "- **Firebase env to target:** $BUILD_TYPE"
            echo "- **Broadcast enabled:** $BROADCAST_ENABLED"
            echo "- **Feature Flags:** $FEATURE_FLAGS"
            echo "- **JSON override feature flags:** $EXTRA_FEATURE_FLAGS"
            echo "- **Repeat each:** $REPEAT_EACH"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate feature flags JSON input
        shell: bash
        run: |
          raw="$E2E_FEATURE_FLAGS_JSON"
          if [ -z "$raw" ]; then
            exit 0
          fi
          # shellcheck disable=SC2016  # ${...} below are JS template literals, not shell expansions
          node -e '
            try {
              JSON.parse(process.argv[1]);
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              console.error(`Invalid E2E_FEATURE_FLAGS_JSON: ${message}`);
              process.exit(1);
            }
          ' "$raw"

      - name: Compute userdata cache key date
        if: ${{ env.USERDATA_CACHE_ENABLED == 'true' }}
        id: userdata-meta
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore pre-generated E2E userdata (app.json) from S3 cache
        if: ${{ env.USERDATA_CACHE_ENABLED == 'true' }}
        continue-on-error: true
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          path: e2e/userdata/generated
          key: develop/e2e-userdata-desktop-${{ steps.userdata-meta.outputs.date }}
          restore-keys: |
            develop/e2e-userdata-desktop-
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false

      - name: Run Playwright E2E tests
        id: run-playwright
        uses: LedgerHQ/ledger-live/tools/actions/composites/run-e2e-playwright-tests@test/pnpm-11-smoke
        with:
          speculos_device: ${{ env.SPECULOS_DEVICE }}
          test_filter: ${{ steps.test-filter.outputs.runner_filter }}
          invert_filter: ${{ inputs.invert_filter || false }}
          repeat_each: ${{ inputs.repeat_each }}
          feature_flags: ${{ env.E2E_DESKTOP_FEATURE_FLAGS }}
        env:
          SEED: ${{ secrets.SEED_QAA_B2C }}
          SPECULINHO_URL: ${{ secrets.SPECULINHO_URL }}
          SWAP_API_BASE: ${{ env.SWAP_API_BASE }}
          BAANX_TEST_CLIENT_KEY: ${{ secrets.BAANX_TEST_CLIENT_KEY }}
          BAANX_TEST_USER_EMAIL: ${{ secrets.BAANX_TEST_USER_EMAIL }}
          BAANX_TEST_USER_PASSWORD: ${{ secrets.BAANX_TEST_USER_PASSWORD }}
          BAANX_TEST_USER_TOTP_SECRET: ${{ secrets.BAANX_TEST_USER_TOTP_SECRET }}
          BAANX_TEST_API_URL: ${{ secrets.BAANX_TEST_API_URL }}

      - name: Add workflow inputs to Allure environment
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/add-allure-run-context@test/pnpm-11-smoke
        with:
          path: e2e/desktop/allure-results
          context: |
            ref=${{ inputs.ref || github.ref_name }}
            broadcast=${{ env.E2E_BROADCAST_ENABLED }}
            firebase_env=${{ inputs.build_type || 'testing' }}
            speculos=${{ env.REMOTE_SPECULOS == 'true' && 'Speculinho (remote)' || 'Docker' }}
            team=${{ inputs.team || 'all' }}
            test_filter=${{ inputs.test_filter }}
            invert_filter=${{ inputs.invert_filter || false }}
            smoke_tests=${{ inputs.smoke_tests || false }}
            repeat_each=${{ inputs.repeat_each }}

      - name: Upload Allure test results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: allure-results${{ matrix.artifact_suffix }}
          path: "e2e/desktop/allure-results"

  e2e-tests-macos:
    name: "Desktop E2E (${{ needs.prepare-devices.outputs.device_1 }}, macOS)"
    needs: [prepare-devices]
    if: ${{ inputs.run_on_macos }}
    runs-on: [macOS, ARM64, general-pool]
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 60
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
      INSTRUMENT_BUILD: true
      FORCE_COLOR: 3
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      npm_config_loglevel: warn
      pnpm_config_loglevel: warn
      DO_NOT_TRACK: 1
      SPECULOS_DEVICE: ${{ needs.prepare-devices.outputs.device_1 }}
      REMOTE_SPECULOS: true
      SPECULOS_IMAGE_TAG: ghcr.io/ledgerhq/speculos:${{ needs.prepare-devices.outputs.device_1 != 'nanoS' && 'latest' || 'speculos-38ccc68068db-coinapps-85c7e5c' }}
      E2E_BROADCAST_ENABLED: false
      E2E_PRIMARY_DEVICE: false
      cache-bucket: ll-nx-cache
      USERDATA_CACHE_ENABLED: ${{ inputs.build_type != 'js' }}
      E2E_GENERATED_USERDATA_DIR: ${{ inputs.build_type != 'js' && format('{0}/e2e/userdata/generated', github.workspace) || '' }}
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          repositories: ledger-live
          permission-contents: read

      - name: Checkout ledger-live monorepo (shallow clone)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          repository: LedgerHQ/ledger-live
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 1

      - name: Setup caches
        id: caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@test/pnpm-11-smoke
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Build Playwright grep filter from inputs
        id: test-filter
        shell: bash
        env:
          TEST_FILTER_INPUT: ${{ inputs.test_filter }}
          SMOKE_TESTS_INPUT: ${{ inputs.smoke_tests }}
          TEAM_INPUT: ${{ inputs.team || 'all' }}
          INVERT_FILTER_INPUT: ${{ inputs.invert_filter || false }}
        run: |
          node e2e/tooling/filter/resolve.mjs \
            --input "$TEST_FILTER_INPUT" \
            --smoke-tests "$SMOKE_TESTS_INPUT" \
            --team "$TEAM_INPUT" \
            --invert-filter "$INVERT_FILTER_INPUT" \
            --check-dir "e2e/desktop/tests" \
            --runner playwright \
            --github-output >> "$GITHUB_OUTPUT"

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@test/pnpm-11-smoke
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies and build LLD
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-e2e-test-desktop@test/pnpm-11-smoke
        id: setup-test-desktop
        with:
          build_type: ${{ inputs.build_type || 'testing' }}

      - name: Configure test environment (API endpoints, broadcast settings)
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-e2e-env@test/pnpm-11-smoke
        with:
          enable_broadcast: ${{ env.E2E_BROADCAST_ENABLED }}
          build_type: ${{ inputs.build_type }}

      - name: Write workflow context to GitHub Summary
        env:
          FILTER_PATTERN: ${{ steps.test-filter.outputs.filter }}
          BUILD_TYPE: ${{ inputs.build_type || 'testing' }}
          BROADCAST_ENABLED: ${{ env.E2E_BROADCAST_ENABLED }}
          REPEAT_EACH: ${{ inputs.repeat_each }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          TRIGGERED_BRANCH: ${{ inputs.ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          FEATURE_FLAGS: ${{ env.E2E_DESKTOP_FEATURE_FLAGS }}
          TEAM_INPUT: ${{ inputs.team || 'all' }}
        run: |
          DEVICE="$SPECULOS_DEVICE"
          EXTRA_FEATURE_FLAGS="$E2E_FEATURE_FLAGS_JSON"

          if [ -z "$EXTRA_FEATURE_FLAGS" ]; then
            EXTRA_FEATURE_FLAGS="(none)"
          fi
          if [ -z "$REPEAT_EACH" ]; then
            REPEAT_EACH="(none)"
          fi

          FILTER_SUMMARY="$(node e2e/tooling/filter/format-summary.mjs "$FILTER_PATTERN")"
          {
            echo "## Workflow Context"
            echo ""
            echo "- **Workflow source branch:** $WORKFLOW_REF"
            echo "- **Triggered branch:** $TRIGGERED_BRANCH"
            echo "- **Commit SHA:** $COMMIT_SHA"
            echo "- **OS:** macOS"
            echo "- **Device selected:** $DEVICE"
            echo "- **Speculos:** Speculinho (remote)"
            echo "- **Team:** $TEAM_INPUT"
            echo "$FILTER_SUMMARY"
            echo "- **Firebase env to target:** $BUILD_TYPE"
            echo "- **Broadcast enabled:** $BROADCAST_ENABLED"
            echo "- **Feature Flags:** $FEATURE_FLAGS"
            echo "- **JSON override feature flags:** $EXTRA_FEATURE_FLAGS"
            echo "- **Repeat each:** $REPEAT_EACH"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate feature flags JSON input
        shell: bash
        run: |
          raw="$E2E_FEATURE_FLAGS_JSON"
          if [ -z "$raw" ]; then
            exit 0
          fi
          # shellcheck disable=SC2016  # ${...} below are JS template literals, not shell expansions
          node -e '
            try {
              JSON.parse(process.argv[1]);
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              console.error(`Invalid E2E_FEATURE_FLAGS_JSON: ${message}`);
              process.exit(1);
            }
          ' "$raw"

      - name: Compute userdata cache key date
        if: ${{ env.USERDATA_CACHE_ENABLED == 'true' }}
        id: userdata-meta
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore pre-generated E2E userdata (app.json) from S3 cache
        if: ${{ env.USERDATA_CACHE_ENABLED == 'true' }}
        continue-on-error: true
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          path: e2e/userdata/generated
          key: develop/e2e-userdata-desktop-${{ steps.userdata-meta.outputs.date }}
          restore-keys: |
            develop/e2e-userdata-desktop-
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false

      - name: Run Playwright E2E tests
        id: run-playwright
        uses: LedgerHQ/ledger-live/tools/actions/composites/run-e2e-playwright-tests@test/pnpm-11-smoke
        with:
          speculos_device: ${{ env.SPECULOS_DEVICE }}
          test_filter: ${{ steps.test-filter.outputs.runner_filter }}
          invert_filter: ${{ inputs.invert_filter || false }}
          repeat_each: ${{ inputs.repeat_each }}
          feature_flags: ${{ env.E2E_DESKTOP_FEATURE_FLAGS }}
          workers: "6"
        env:
          SEED: ${{ secrets.SEED_QAA_B2C }}
          SPECULINHO_URL: ${{ secrets.SPECULINHO_URL }}
          SWAP_API_BASE: ${{ env.SWAP_API_BASE }}
          BAANX_TEST_CLIENT_KEY: ${{ secrets.BAANX_TEST_CLIENT_KEY }}
          BAANX_TEST_USER_EMAIL: ${{ secrets.BAANX_TEST_USER_EMAIL }}
          BAANX_TEST_USER_PASSWORD: ${{ secrets.BAANX_TEST_USER_PASSWORD }}
          BAANX_TEST_USER_TOTP_SECRET: ${{ secrets.BAANX_TEST_USER_TOTP_SECRET }}
          BAANX_TEST_API_URL: ${{ secrets.BAANX_TEST_API_URL }}

      - name: Add workflow inputs to Allure environment
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/add-allure-run-context@test/pnpm-11-smoke
        with:
          path: e2e/desktop/allure-results
          context: |
            ref=${{ inputs.ref || github.ref_name }}
            broadcast=${{ env.E2E_BROADCAST_ENABLED }}
            firebase_env=${{ inputs.build_type || 'testing' }}
            speculos=Speculinho (remote)
            team=${{ inputs.team || 'all' }}
            test_filter=${{ inputs.test_filter }}
            invert_filter=${{ inputs.invert_filter || false }}
            smoke_tests=${{ inputs.smoke_tests || false }}
            repeat_each=${{ inputs.repeat_each }}

      - name: Upload Allure test results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: allure-results-macos
          path: "e2e/desktop/allure-results"

  report-to-allure:
    name: "Create Allure Report - ${{ needs.prepare-devices.outputs.device_1 }}"
    runs-on: [ledger-wallet-1cpu-aws-public-cached]
    needs: [prepare-devices, e2e-tests]
    outputs:
      status: ${{ steps.summary.outputs.status }}
      summary_message: ${{ steps.summary.outputs.summary_message }}
      report-url: ${{ steps.allure-server.outputs.report-url }}
    if: ${{ !cancelled() }}
    env:
      ALLURE_RESULTS: "allure-results"
    steps:
      - name: Download Allure results from test job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: allure-results
          path: ${{ env.ALLURE_RESULTS }}

      - name: Extract test summary for Slack notification
        if: ${{ !cancelled() }}
        id: summary
        uses: LedgerHQ/ledger-live/tools/actions/composites/get-allure-summary@test/pnpm-11-smoke
        with:
          allure-results-path: ${{ env.ALLURE_RESULTS }}
          platform: ${{ needs.prepare-devices.outputs.is_dual == 'true' && format('linux-{0}', needs.prepare-devices.outputs.device_1) || 'linux' }}

      - name: Publish report to Allure Server
        id: allure-server
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report@test/pnpm-11-smoke
        with:
          platform: ${{ github.event_name == 'schedule' && 'linux-speculos-nightly' || (inputs.smoke_tests && 'linux-speculos-smoke' || 'linux-speculos') }}
          login: ${{ vars.ALLURE_USERNAME }}
          password: ${{ secrets.ALLURE_LEDGER_LIVE_PASSWORD }}
          path: ${{ env.ALLURE_RESULTS }}
          summary_message: ${{ steps.summary.outputs.summary_message }}

      - name: Write failed tests summary
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/get-failed-tests-summary@test/pnpm-11-smoke
        with:
          results-path: ${{ env.ALLURE_RESULTS }}
          runner: playwright

  report-to-allure-device2:
    name: "Create Allure Report - device 2"
    runs-on: [ledger-wallet-1cpu-aws-public-cached]
    needs: [prepare-devices, e2e-tests]
    if: ${{ !cancelled() && needs.prepare-devices.outputs.is_dual == 'true' }}
    outputs:
      status: ${{ steps.summary.outputs.status }}
      summary_message: ${{ steps.summary.outputs.summary_message }}
      report-url: ${{ steps.allure-server.outputs.report-url }}
    env:
      ALLURE_RESULTS: "allure-results-device2"
    steps:
      - name: Download Allure results from device2 test job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: allure-results-${{ needs.prepare-devices.outputs.device_2 }}
          path: ${{ env.ALLURE_RESULTS }}

      - name: Extract test summary for Slack notification
        if: ${{ !cancelled() }}
        id: summary
        uses: LedgerHQ/ledger-live/tools/actions/composites/get-allure-summary@test/pnpm-11-smoke
        with:
          allure-results-path: ${{ env.ALLURE_RESULTS }}
          platform: linux-${{ needs.prepare-devices.outputs.device_2 }}

      - name: Publish report to Allure Server
        id: allure-server
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report@test/pnpm-11-smoke
        with:
          platform: linux-speculos-${{ needs.prepare-devices.outputs.device_2 }}
          login: ${{ vars.ALLURE_USERNAME }}
          password: ${{ secrets.ALLURE_LEDGER_LIVE_PASSWORD }}
          path: ${{ env.ALLURE_RESULTS }}
          summary_message: ${{ steps.summary.outputs.summary_message }}

      - name: Write failed tests summary
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/get-failed-tests-summary@test/pnpm-11-smoke
        with:
          results-path: ${{ env.ALLURE_RESULTS }}
          runner: playwright

  report-to-allure-macos:
    name: "Create Allure Report - macOS"
    runs-on: [ledger-wallet-1cpu-aws-public-cached]
    needs: [e2e-tests-macos]
    if: ${{ !cancelled() && inputs.run_on_macos }}
    outputs:
      status: ${{ steps.summary.outputs.status }}
      summary_message: ${{ steps.summary.outputs.summary_message }}
      report-url: ${{ steps.allure-server.outputs.report-url }}
    env:
      ALLURE_RESULTS: "allure-results-macos"
    steps:
      - name: Download Allure results from macOS test job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: allure-results-macos
          path: ${{ env.ALLURE_RESULTS }}

      - name: Extract test summary for Slack notification
        if: ${{ !cancelled() }}
        id: summary
        uses: LedgerHQ/ledger-live/tools/actions/composites/get-allure-summary@test/pnpm-11-smoke
        with:
          allure-results-path: ${{ env.ALLURE_RESULTS }}
          platform: macos

      - name: Publish report to Allure Server
        id: allure-server
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report@test/pnpm-11-smoke
        with:
          platform: ${{ inputs.smoke_tests && 'macos-speculos-smoke' || 'macos-speculos' }}
          login: ${{ vars.ALLURE_USERNAME }}
          password: ${{ secrets.ALLURE_LEDGER_LIVE_PASSWORD }}
          path: ${{ env.ALLURE_RESULTS }}
          summary_message: ${{ steps.summary.outputs.summary_message }}

      - name: Write failed tests summary
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/get-failed-tests-summary@test/pnpm-11-smoke
        with:
          results-path: ${{ env.ALLURE_RESULTS }}
          runner: playwright

  qaa-allure-upload:
    name: "QAA Allure Upload - ${{ needs.prepare-devices.outputs.device_1 }} (Experimental)"
    runs-on: [ledger-wallet-1cpu-aws-public-cached]
    needs: [prepare-devices, e2e-tests]
    if: ${{ !cancelled() }}
    continue-on-error: true
    timeout-minutes: 15
    outputs:
      report_url: ${{ steps.qaa-allure-upload.outputs.report_url }}
    env:
      ALLURE_RESULTS: "allure-results"
    steps:
      - name: Download Allure results from test job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: allure-results
          path: ${{ env.ALLURE_RESULTS }}

      - name: Upload to qaa-allure (sandbox)
        id: qaa-allure-upload
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report-qaa@test/pnpm-11-smoke
        with:
          api_key: ${{ secrets.QAA_ALLURE_API_KEY }}
          path: ${{ env.ALLURE_RESULTS }}
          name: "desktop-e2e-${{ needs.prepare-devices.outputs.device_1 }}-${{ github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual') }}"
          tags: ${{ format('["desktop","speculos",{0},{1}]', toJSON(needs.prepare-devices.outputs.device_1), toJSON(github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual'))) }}
          branch: ${{ inputs.ref || github.ref_name }}
          history_key: "desktop-e2e-${{ github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual') }}"

  qaa-allure-upload-device2:
    name: "QAA Allure Upload - device 2 (Experimental)"
    runs-on: [ledger-wallet-1cpu-aws-public-cached]
    needs: [prepare-devices, e2e-tests]
    if: ${{ !cancelled() && needs.prepare-devices.outputs.is_dual == 'true' }}
    continue-on-error: true
    timeout-minutes: 15
    outputs:
      report_url: ${{ steps.qaa-allure-upload.outputs.report_url }}
    env:
      ALLURE_RESULTS: "allure-results-device2"
    steps:
      - name: Download Allure results from device2 test job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: allure-results-${{ needs.prepare-devices.outputs.device_2 }}
          path: ${{ env.ALLURE_RESULTS }}

      - name: Upload to qaa-allure (sandbox)
        id: qaa-allure-upload
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report-qaa@test/pnpm-11-smoke
        with:
          api_key: ${{ secrets.QAA_ALLURE_API_KEY }}
          path: ${{ env.ALLURE_RESULTS }}
          name: "desktop-e2e-${{ needs.prepare-devices.outputs.device_2 }}-${{ github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual') }}"
          tags: ${{ format('["desktop","speculos",{0},{1}]', toJSON(needs.prepare-devices.outputs.device_2), toJSON(github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual'))) }}
          branch: ${{ inputs.ref || github.ref_name }}
          history_key: "desktop-e2e-${{ github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual') }}"

  qaa-allure-upload-macos:
    name: "QAA Allure Upload - macOS (Experimental)"
    runs-on: [ledger-wallet-1cpu-aws-public-cached]
    needs: [prepare-devices, e2e-tests-macos]
    if: ${{ !cancelled() && inputs.run_on_macos }}
    continue-on-error: true
    timeout-minutes: 15
    outputs:
      report_url: ${{ steps.qaa-allure-upload.outputs.report_url }}
    env:
      ALLURE_RESULTS: "allure-results-macos"
    steps:
      - name: Download Allure results from macOS test job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: allure-results-macos
          path: ${{ env.ALLURE_RESULTS }}

      - name: Upload to qaa-allure (sandbox)
        id: qaa-allure-upload
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report-qaa@test/pnpm-11-smoke
        with:
          api_key: ${{ secrets.QAA_ALLURE_API_KEY }}
          path: ${{ env.ALLURE_RESULTS }}
          name: "desktop-e2e-macos-${{ needs.prepare-devices.outputs.device_1 }}-${{ inputs.smoke_tests && 'smoke' || 'manual' }}"
          tags: ${{ format('["desktop","speculos","macos",{0},{1}]', toJSON(needs.prepare-devices.outputs.device_1), toJSON(inputs.smoke_tests && 'smoke' || 'manual')) }}
          branch: ${{ inputs.ref || github.ref_name }}
          history_key: "desktop-e2e-macos-${{ inputs.smoke_tests && 'smoke' || 'manual' }}"

  notify-to-slack:
    name: "Notify to Slack"
    runs-on: [ledger-wallet-1cpu-aws-public-cached]
    needs: [prepare-devices, report-to-allure, report-to-allure-device2, report-to-allure-macos, qaa-allure-upload, qaa-allure-upload-device2, qaa-allure-upload-macos]
    if: ${{ always() && (inputs.slack_notif || github.event_name == 'schedule') }}
    env:
      IS_DUAL: ${{ needs.prepare-devices.outputs.is_dual }}
      DEVICE_1: ${{ needs.prepare-devices.outputs.device_1 || 'nanoSP' }}
      DEVICE_2: ${{ needs.prepare-devices.outputs.device_2 }}
      REF: ${{ inputs.ref || github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report e2e results to Slack
        uses: LedgerHQ/ledger-live/tools/actions/composites/e2e-slack-report@test/pnpm-11-smoke
        with:
          token: ${{ secrets.SLACK_LIVE_CI_BOT_TOKEN }}
          channel: C05FKJ7DFAP
          product: "Ledger Live Desktop E2E"
          ref: ${{ env.REF }}
          smoke_tests: ${{ inputs.smoke_tests }}
          header_devices: ${{ env.IS_DUAL == 'true' && format('{0} + {1}', env.DEVICE_1, env.DEVICE_2) || env.DEVICE_1 }}
          run_url: ${{ env.RUN_URL }}
          row1_emoji: "🐧"
          # Dual runs put the device in the label ("linux (nanoSP)"); single runs use plain "linux".
          row1_label: ${{ env.IS_DUAL == 'true' && format('linux ({0})', env.DEVICE_1) || 'linux' }}
          row1_flags: ${{ env.E2E_DESKTOP_FEATURE_FLAGS }}
          row1_summary: ${{ needs.report-to-allure.outputs.summary_message }}
          row1_report_url: ${{ needs.report-to-allure.outputs.report-url }}
          row1_status: ${{ needs.report-to-allure.outputs.status }}
          row1_qaa_url: ${{ needs.qaa-allure-upload.outputs.report_url }}
          # Row 2 only renders on dual-device runs (empty label = dropped).
          row2_emoji: "🐧"
          row2_label: ${{ env.IS_DUAL == 'true' && format('linux ({0})', env.DEVICE_2) || '' }}
          row2_flags: ${{ env.E2E_DESKTOP_FEATURE_FLAGS }}
          row2_summary: ${{ needs.report-to-allure-device2.outputs.summary_message }}
          row2_report_url: ${{ needs.report-to-allure-device2.outputs.report-url }}
          row2_status: ${{ needs.report-to-allure-device2.outputs.status }}
          row2_qaa_url: ${{ needs.qaa-allure-upload-device2.outputs.report_url }}
          # Row 3 only renders when the run also ran on macOS.
          row3_emoji: "🍎"
          row3_label: ${{ inputs.run_on_macos && 'macos' || '' }}
          row3_flags: ${{ env.E2E_DESKTOP_FEATURE_FLAGS }}
          row3_summary: ${{ needs.report-to-allure-macos.outputs.summary_message }}
          row3_report_url: ${{ needs.report-to-allure-macos.outputs.report-url }}
          row3_status: ${{ needs.report-to-allure-macos.outputs.status }}
          row3_qaa_url: ${{ needs.qaa-allure-upload-macos.outputs.report_url }}

  # Debug details of every test leg, collapsed, after the per-device reports.
  shard-diagnostics:
    name: "Shard diagnostics"
    runs-on: [ledger-wallet-1cpu-aws-public-cached]
    needs: [prepare-devices, report-to-allure, report-to-allure-device2, report-to-allure-macos]
    if: ${{ !cancelled() }}
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Download Allure results of every leg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: allure-results*
          path: diagnostics/allure

      - name: Download Playwright logs of every leg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: playwright-log*
          path: diagnostics/playwright-log

      - name: Download Remote Config capture proxy logs of every leg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: firebase-capture-logs*
          path: diagnostics/proxy

      - name: Write shard diagnostics
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEVICE_1: ${{ needs.prepare-devices.outputs.device_1 }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const ROOT = "diagnostics";
            const DEVICE_1 = process.env.DEVICE_1;

            const listDir = dir => (fs.existsSync(dir) ? fs.readdirSync(dir) : []);
            const readJson = file => JSON.parse(fs.readFileSync(file, "utf8"));
            const escapeHtml = text => String(text).replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const formatDuration = ms => `${Math.floor(ms / 60000)}m ${String(Math.round((ms % 60000) / 1000)).padStart(2, "0")}s`;

            // Every artifact of a leg ends with the same suffix: "-shard-2", "-stax-shard-2" or "-macos".
            const legSuffixes = listDir(path.join(ROOT, "allure"))
              .filter(name => name.startsWith("allure-results"))
              .map(name => name.slice("allure-results".length));

            const describeLeg = suffix => {
              const shard = /^(?:-(.+))?-shard-(\d+)$/.exec(suffix);
              return shard
                ? { device: shard[1] ?? DEVICE_1, shard: Number(shard[2]) }
                : { device: `${DEVICE_1} (${suffix.slice(1)})`, shard: 0 };
            };

            const allureStats = dir => {
              const attempts = listDir(dir)
                .filter(file => file.endsWith("-result.json"))
                .map(file => readJson(path.join(dir, file)));
              const attemptsByTest = new Map();
              for (const attempt of attempts) {
                const id = attempt.historyId ?? attempt.fullName ?? attempt.name;
                attemptsByTest.set(id, [...(attemptsByTest.get(id) ?? []), attempt]);
              }
              // Same rule as get-failed-tests-summary: failed means it never passed, retries included.
              const outcomes = { passed: 0, failed: 0, flaky: 0, skipped: 0 };
              const flakyTests = [];
              for (const tries of attemptsByTest.values()) {
                const passed = tries.some(t => t.status === "passed");
                const failed = tries.some(t => t.status === "failed" || t.status === "broken");
                const outcome = passed && failed ? "flaky" : passed ? "passed" : failed ? "failed" : "skipped";
                outcomes[outcome] += 1;
                if (outcome === "flaky") flakyTests.push(tries[0].name);
              }
              // Speculinho errors read "Timeout: <url>/status/<app>-lw-ci-<id> did not become ready within <ms>ms".
              const notReadyApps = attempts
                .map(t => t.statusDetails?.message ?? "")
                .filter(message => message.includes("did not become ready"))
                .map(message => /\/status\/(.+?)-lw-ci-/.exec(message)?.[1] ?? "unknown");
              const starts = attempts.map(t => t.start).filter(Boolean);
              const stops = attempts.map(t => t.stop).filter(Boolean);
              const testTimeMs = starts.length && stops.length ? Math.max(...stops) - Math.min(...starts) : 0;
              return { tests: attemptsByTest.size, ...outcomes, flakyTests, notReadyApps, testTimeMs };
            };

            // scripts/playwrightWithDeferrals.mjs prints "Pass <n>: <count> test(s) whose exclusive locks were busy".
            const lockDeferrals = file =>
              fs.existsSync(file)
                ? [...fs.readFileSync(file, "utf8").matchAll(/Pass \d+: (\d+) test\(s\) whose exclusive locks were busy/g)]
                    .reduce((sum, match) => sum + Number(match[1]), 0)
                : null;

            const remoteConfigFetches = file => {
              if (!fs.existsSync(file)) return "off";
              const stats = Object.values(readJson(file));
              const sum = key => stats.reduce((total, entry) => total + (entry[key] ?? 0), 0);
              const problems = [["timed out", sum("timedOut")], ["failed", sum("failed")]].filter(([, count]) => count > 0);
              return `${sum("upstream")} / ${sum("replayed")}${problems.map(([label, count]) => `, ${count} ${label}`).join("")}`;
            };

            const legs = legSuffixes
              .map(suffix => ({
                ...describeLeg(suffix),
                ...allureStats(path.join(ROOT, "allure", `allure-results${suffix}`)),
                lockDeferrals: lockDeferrals(path.join(ROOT, "playwright-log", `playwright-log${suffix}`, "playwright-output.log")),
                remoteConfig: remoteConfigFetches(path.join(ROOT, "proxy", `firebase-capture-logs${suffix}`, "firebase-capture-summary.json")),
              }))
              // Device 1, then device 2, then the unsharded macOS leg.
              .sort(
                (a, b) =>
                  (a.shard === 0) - (b.shard === 0) ||
                  (a.device !== DEVICE_1) - (b.device !== DEVICE_1) ||
                  a.shard - b.shard,
              );

            if (legs.length === 0) {
              await core.summary.addRaw("No shard uploaded Allure results.").write();
              return;
            }

            const total = key => legs.reduce((sum, leg) => sum + (leg[key] ?? 0), 0);
            const notReadyApps = legs.flatMap(leg => leg.notReadyApps);
            const notReadyByApp = Object.entries(
              notReadyApps.reduce((counts, app) => ({ ...counts, [app]: (counts[app] ?? 0) + 1 }), {}),
            ).sort(([, a], [, b]) => b - a);
            const headline = [
              `${legs.length} legs`,
              `longest test time ${formatDuration(Math.max(...legs.map(leg => leg.testTimeMs)))}`,
              `${total("flaky")} flaky`,
              `${notReadyApps.length} Speculinho not ready`,
              `${total("lockDeferrals")} lock deferrals`,
            ].join(" · ");

            const rows = legs.map(leg =>
              [
                leg.device,
                leg.shard || "—",
                leg.tests,
                leg.passed,
                leg.failed,
                leg.flaky,
                leg.skipped,
                formatDuration(leg.testTimeMs),
                leg.notReadyApps.length,
                leg.lockDeferrals ?? "—",
                leg.remoteConfig,
              ].join(" | "),
            );
            const flakyList = legs.flatMap(leg =>
              leg.flakyTests.map(name => `- ${leg.device}${leg.shard ? ` · shard ${leg.shard}` : ""}: ${escapeHtml(name)}`),
            );

            await core.summary
              .addRaw(
                [
                  `<details><summary>Shard diagnostics: ${headline}</summary>`,
                  "",
                  "| Device | Shard | Tests | Passed | Failed | Flaky | Skipped | Test time | Speculinho not ready | Lock deferrals | Remote Config upstream / replayed |",
                  "| --- | --: | --: | --: | --: | --: | --: | --: | --: | --: | --- |",
                  ...rows.map(row => `| ${row} |`),
                  "",
                  notReadyByApp.length
                    ? `**Speculinho not ready, by app:** ${notReadyByApp.map(([app, count]) => `${app} ×${count}`).join(", ")}`
                    : "",
                  "",
                  flakyList.length ? `**Flaky, passed on retry (${flakyList.length}):**\n\n${flakyList.join("\n")}` : "",
                  "",
                  "</details>",
                ].join("\n"),
              )
              .write();

  notify-to-slack:
    name: "Notify to Slack"
    runs-on: [ledger-wallet-1cpu-aws-public-cached]
    needs: [prepare-devices, report-to-allure, report-to-allure-device2, report-to-allure-macos]
    if: ${{ always() && (inputs.slack_notif || github.event_name == 'schedule') }}
    env:
      IS_DUAL: ${{ needs.prepare-devices.outputs.is_dual }}
      DEVICE_1: ${{ needs.prepare-devices.outputs.device_1 || 'nanoSP' }}
      DEVICE_2: ${{ needs.prepare-devices.outputs.device_2 }}
      REF: ${{ inputs.ref || github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report e2e results to Slack
        uses: LedgerHQ/ledger-live/tools/actions/composites/e2e-slack-report@develop
        with:
          token: ${{ secrets.SLACK_LIVE_CI_BOT_TOKEN }}
          channel: C05FKJ7DFAP
          product: "Ledger Live Desktop E2E"
          ref: ${{ env.REF }}
          smoke_tests: ${{ inputs.smoke_tests }}
          header_devices: ${{ env.IS_DUAL == 'true' && format('{0} + {1}', env.DEVICE_1, env.DEVICE_2) || env.DEVICE_1 }}
          run_url: ${{ env.RUN_URL }}
          row1_emoji: "🐧"
          # Dual runs put the device in the label ("linux (nanoSP)"); single runs use plain "linux".
          row1_label: ${{ env.IS_DUAL == 'true' && format('linux ({0})', env.DEVICE_1) || 'linux' }}
          row1_flags: ${{ env.E2E_DESKTOP_FEATURE_FLAGS }}
          row1_summary: ${{ needs.report-to-allure.outputs.summary_message }}
          row1_report_url: ${{ needs.report-to-allure.outputs.report-url }}
          row1_status: ${{ needs.report-to-allure.outputs.status }}
          row1_qaa_url: ${{ needs.report-to-allure.outputs.qaa-report-url }}
          # Row 2 only renders on dual-device runs (empty label = dropped).
          row2_emoji: "🐧"
          row2_label: ${{ env.IS_DUAL == 'true' && format('linux ({0})', env.DEVICE_2) || '' }}
          row2_flags: ${{ env.E2E_DESKTOP_FEATURE_FLAGS }}
          row2_summary: ${{ needs.report-to-allure-device2.outputs.summary_message }}
          row2_report_url: ${{ needs.report-to-allure-device2.outputs.report-url }}
          row2_status: ${{ needs.report-to-allure-device2.outputs.status }}
          row2_qaa_url: ${{ needs.report-to-allure-device2.outputs.qaa-report-url }}
          # Row 3 only renders when the run also ran on macOS.
          row3_emoji: "🍎"
          row3_label: ${{ inputs.run_on_macos && 'macos' || '' }}
          row3_flags: ${{ env.E2E_DESKTOP_FEATURE_FLAGS }}
          row3_summary: ${{ needs.report-to-allure-macos.outputs.summary_message }}
          row3_report_url: ${{ needs.report-to-allure-macos.outputs.report-url }}
          row3_status: ${{ needs.report-to-allure-macos.outputs.status }}
          row3_qaa_url: ${{ needs.report-to-allure-macos.outputs.qaa-report-url }}

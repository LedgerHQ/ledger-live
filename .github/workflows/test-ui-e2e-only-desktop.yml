  report-to-allure:
    name: "Create Allure Report - ${{ needs.prepare-devices.outputs.device_1 }}"
    runs-on: [ledger-wallet-1cpu-aws-public-cached]
    needs: [prepare-devices, e2e-tests]
    outputs:
      # Unlike mobile, a shard without results fails the device: part of its suite never ran.
      finalStatus: ${{ steps.aggregate.outputs.missingShards != '' && 'failure' || steps.aggregate.outputs.finalStatus }}
      missingShards: ${{ steps.aggregate.outputs.missingShards }}
      summary_message: ${{ steps.summary.outputs.summary_message }}
      report-url: ${{ steps.allure-server.outputs.report-url }}
      qaa-report-url: ${{ steps.qaa-allure-upload.outputs.report_url }}
    if: ${{ !cancelled() }}
    env:
      ALLURE_RESULTS: "allure-results"
    steps:
      - name: Download Allure results from test job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: allure-results-shard-*
          merge-multiple: true
          path: ${{ env.ALLURE_RESULTS }}

      # The Allure steps below generate a report and recompress screenshots inside the results directory.
      - name: Keep the raw results for qaa-allure
        run: cp -R "$ALLURE_RESULTS" "$ALLURE_RESULTS-qaa"
        shell: bash

      - name: Extract test summary for Slack notification
        if: ${{ !cancelled() }}
        id: summary
        uses: LedgerHQ/ledger-live/tools/actions/composites/get-allure-summary@develop
        with:
          allure-results-path: ${{ env.ALLURE_RESULTS }}
          platform: ${{ needs.prepare-devices.outputs.is_dual == 'true' && format('linux-{0}', needs.prepare-devices.outputs.device_1) || 'linux' }}

      - name: Aggregate shard results
        if: ${{ !cancelled() }}
        id: aggregate
        uses: LedgerHQ/ledger-live/tools/actions/composites/aggregate-shard-results@develop
        with:
          total_shards: ${{ needs.prepare-devices.outputs.shard_total }}
          status_1: ${{ needs.e2e-tests.outputs.status_1 }}
          status_2: ${{ needs.e2e-tests.outputs.status_2 }}
          status_3: ${{ needs.e2e-tests.outputs.status_3 }}
          status_4: ${{ needs.e2e-tests.outputs.status_4 }}

      - name: Publish report to Allure Server
        id: allure-server
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report@develop
        with:
          platform: ${{ github.event_name == 'schedule' && 'linux-speculos-nightly' || (inputs.smoke_tests && 'linux-speculos-smoke' || 'linux-speculos') }}
          login: ${{ vars.ALLURE_USERNAME }}
          password: ${{ secrets.ALLURE_LEDGER_LIVE_PASSWORD }}
          path: ${{ env.ALLURE_RESULTS }}
          step_summary: false

      - name: Upload to qaa-allure (Experimental)
        id: qaa-allure-upload
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report-qaa@develop
        with:
          api_key: ${{ secrets.QAA_ALLURE_API_KEY }}
          path: ${{ env.ALLURE_RESULTS }}-qaa
          name: "desktop-e2e-${{ needs.prepare-devices.outputs.device_1 }}-${{ github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual') }}"
          tags: ${{ format('["desktop","speculos",{0},{1}]', toJSON(needs.prepare-devices.outputs.device_1), toJSON(github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual'))) }}
          branch: ${{ inputs.ref || github.ref_name }}
          history_key: "desktop-e2e-${{ github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual') }}"
          step_summary: false

      - name: Write the totals and report links
        if: ${{ !cancelled() }}
        env:
          SUMMARY_MESSAGE: ${{ steps.summary.outputs.summary_message }}
          MISSING_SHARDS: ${{ steps.aggregate.outputs.missingShards }}
          QAA_REPORT_URL: ${{ steps.qaa-allure-upload.outputs.report_url }}
          LEGACY_REPORT_URL: ${{ steps.allure-server.outputs.report-url }}
        run: |
          {
            if [ -n "$SUMMARY_MESSAGE" ]; then printf '%s\n\n' "$SUMMARY_MESSAGE"; fi
            if [ -n "$MISSING_SHARDS" ]; then printf '⚠️ Missing results for shard(s): %s.\n\n' "$MISSING_SHARDS"; fi
            if [ -n "$QAA_REPORT_URL" ]; then printf '[🆕 New QAA Allure report](%s)\n\n' "$QAA_REPORT_URL"; fi
            if [ -n "$LEGACY_REPORT_URL" ]; then printf '[Legacy Allure](%s)\n' "$LEGACY_REPORT_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Write failed tests summary
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/get-failed-tests-summary@develop
        with:
          results-path: ${{ env.ALLURE_RESULTS }}
          runner: playwright

      - name: Write shard diagnostics
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/e2e-shard-diagnostics@develop
        with:
          legs: "-shard-*"

  report-to-allure-device2:
    name: "Create Allure Report - ${{ needs.prepare-devices.outputs.is_dual == 'true' && needs.prepare-devices.outputs.device_2 || 'device 2' }}"
    runs-on: [ledger-wallet-1cpu-aws-public-cached]
    needs: [prepare-devices, e2e-tests]
    if: ${{ !cancelled() && needs.prepare-devices.outputs.is_dual == 'true' }}
    outputs:
      # Unlike mobile, a shard without results fails the device: part of its suite never ran.
      finalStatus: ${{ steps.aggregate.outputs.missingShards != '' && 'failure' || steps.aggregate.outputs.finalStatus }}
      missingShards: ${{ steps.aggregate.outputs.missingShards }}
      summary_message: ${{ steps.summary.outputs.summary_message }}
      report-url: ${{ steps.allure-server.outputs.report-url }}
      qaa-report-url: ${{ steps.qaa-allure-upload.outputs.report_url }}
    env:
      ALLURE_RESULTS: "allure-results-device2"
    steps:
      - name: Download Allure results from device2 test job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: allure-results-${{ needs.prepare-devices.outputs.device_2 }}-shard-*
          merge-multiple: true
          path: ${{ env.ALLURE_RESULTS }}

      # The Allure steps below generate a report and recompress screenshots inside the results directory.
      - name: Keep the raw results for qaa-allure
        run: cp -R "$ALLURE_RESULTS" "$ALLURE_RESULTS-qaa"
        shell: bash

      - name: Extract test summary for Slack notification
        if: ${{ !cancelled() }}
        id: summary
        uses: LedgerHQ/ledger-live/tools/actions/composites/get-allure-summary@develop
        with:
          allure-results-path: ${{ env.ALLURE_RESULTS }}
          platform: linux-${{ needs.prepare-devices.outputs.device_2 }}

      - name: Aggregate shard results
        if: ${{ !cancelled() }}
        id: aggregate
        uses: LedgerHQ/ledger-live/tools/actions/composites/aggregate-shard-results@develop
        with:
          total_shards: ${{ needs.prepare-devices.outputs.shard_total }}
          status_1: ${{ needs.e2e-tests.outputs.device2_status_1 }}
          status_2: ${{ needs.e2e-tests.outputs.device2_status_2 }}
          status_3: ${{ needs.e2e-tests.outputs.device2_status_3 }}
          status_4: ${{ needs.e2e-tests.outputs.device2_status_4 }}

      - name: Publish report to Allure Server
        id: allure-server
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report@develop
        with:
          platform: linux-speculos-${{ needs.prepare-devices.outputs.device_2 }}
          login: ${{ vars.ALLURE_USERNAME }}
          password: ${{ secrets.ALLURE_LEDGER_LIVE_PASSWORD }}
          path: ${{ env.ALLURE_RESULTS }}
          step_summary: false

      - name: Upload to qaa-allure (Experimental)
        id: qaa-allure-upload
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report-qaa@develop
        with:
          api_key: ${{ secrets.QAA_ALLURE_API_KEY }}
          path: ${{ env.ALLURE_RESULTS }}-qaa
          name: "desktop-e2e-${{ needs.prepare-devices.outputs.device_2 }}-${{ github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual') }}"
          tags: ${{ format('["desktop","speculos",{0},{1}]', toJSON(needs.prepare-devices.outputs.device_2), toJSON(github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual'))) }}
          branch: ${{ inputs.ref || github.ref_name }}
          history_key: "desktop-e2e-${{ github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual') }}"
          step_summary: false

      - name: Write the totals and report links
        if: ${{ !cancelled() }}
        env:
          SUMMARY_MESSAGE: ${{ steps.summary.outputs.summary_message }}
          MISSING_SHARDS: ${{ steps.aggregate.outputs.missingShards }}
          QAA_REPORT_URL: ${{ steps.qaa-allure-upload.outputs.report_url }}
          LEGACY_REPORT_URL: ${{ steps.allure-server.outputs.report-url }}
        run: |
          {
            if [ -n "$SUMMARY_MESSAGE" ]; then printf '%s\n\n' "$SUMMARY_MESSAGE"; fi
            if [ -n "$MISSING_SHARDS" ]; then printf '⚠️ Missing results for shard(s): %s.\n\n' "$MISSING_SHARDS"; fi
            if [ -n "$QAA_REPORT_URL" ]; then printf '[🆕 New QAA Allure report](%s)\n\n' "$QAA_REPORT_URL"; fi
            if [ -n "$LEGACY_REPORT_URL" ]; then printf '[Legacy Allure](%s)\n' "$LEGACY_REPORT_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Write failed tests summary
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/get-failed-tests-summary@develop
        with:
          results-path: ${{ env.ALLURE_RESULTS }}
          runner: playwright

      - name: Write shard diagnostics
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/e2e-shard-diagnostics@develop
        with:
          legs: "-${{ needs.prepare-devices.outputs.device_2 }}-shard-*"

  report-to-allure-macos:

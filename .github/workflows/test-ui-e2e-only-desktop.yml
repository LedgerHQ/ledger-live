name: "[Desktop] - E2E Only - Scheduled/Manual"
run-name: >
  @Desktop E2E • triggered on ${{ inputs.ref || github.ref_name }} by ${{ github.actor }}

# Broadcast runs never overlap: a new one waits for the running one. GitHub keeps one waiting run
# per group, so a newer broadcast run replaces the one already waiting. Other runs never wait.
concurrency:
  group: >-
    ${{ (inputs.enable_broadcast || github.event.schedule == '0 1 * * 1') && 'desktop-e2e-broadcast' || format('desktop-e2e-{0}-{1}', github.run_id, inputs.speculos_device || 'nanoSP') }}
  cancel-in-progress: false

on:
  schedule:
    # Monday is the desktop broadcast nightly: real on-chain transactions are sent.
    # Mobile broadcasts on other days (Wednesday iOS, Friday Android) so the two apps never
    # broadcast from the shared QAA accounts on the same day.
    # The device rotates per weekday (see WEEKDAY_DEVICE in prepare-devices).
    # The cron expression below is matched verbatim in the concurrency group and the
    # E2E_BROADCAST_ENABLED env — keep all three in sync.
    - cron: "0 1 * * 1"
    - cron: "0 1 * * 2-5"
  workflow_dispatch:
    inputs:
      ref:
        description: "Specify branch to checkout and test or leave blank to use the workflow branch"
        required: false
      test_filter:
        description: Filter pattern(s) to execute only selected test suites by test name, file path or tag, separated by ',' or '|' (e.g. "Accounts @smoke", "@generic-coin-framework,@solana", "@bitcoin,@family-evm" or "Accounts @smoke|Settings")
        required: false
      team:
        description: "Run only one team's tests. ANDed with test_filter, Smoke and the device."
        required: false
        type: choice
        options: [all, bst, buy-and-sell, coin-integration, earn, engagement, my-ledger-onboarding, swap, wallet-xp]
        default: all
      invert_filter:
        description: Ignore test having name pattern (entered in the previous field)
        type: boolean
        default: false
      slack_notif:
        description: "Send notification to Slack?"
        required: false
        type: boolean
        default: false
      enable_broadcast:
        description: "Enable transaction broadcast"
        required: false
        type: boolean
        default: false
      build_type:
        description: "Firebase env to target (pick js for release testing)"
        required: false
        type: choice
        options:
          - js
          - staging
          - testing
        default: testing
      speculos_device:
        description: "Device to be used"
        required: false
        type: choice
        options:
          - nanoS
          - nanoSP
          - nanoX
          - stax
          - flex
          - nanoGen5
          - nanoSP and stax
        default: nanoSP
      run_on_macos:
        description: "⚠️ QA and release runs only: also run on macOS (shared Mac runner, Speculinho)"
        required: false
        type: boolean
        default: false
      smoke_tests:
        description: "Run smoke tests"
        required: false
        type: boolean
        default: false
      feature_flags:
        description: "Choose a feature flag set for the run"
        required: false
        type: choice
        options:
          - defaults
          - wallet40-q1
        default: defaults
      feature_flags_json:
        description: "JSON to override feature flags (takes precedence if set)"
        required: false
        type: string
        default: ""
      repeat_each:
        description: "Repeat each test N times (optional)"
        required: false
        type: number
      lock_deferral_passes:
        description: "Passes that move a test whose exclusive lock is busy to the next one (default 2)"
        required: false
        type: string
        default: ""
      exclusive_lock:
        description: "Exclusive lock: remote (R2), or local if R2 is down"
        required: false
        type: choice
        options:
          - remote
          - local
        default: remote

  workflow_call:
    inputs:
      ref:
        description: "Specify branch to checkout and test or leave blank to use the workflow branch"
        required: false
        type: string
      test_filter:
        description: Filter pattern(s) to execute only selected test suites by test name, file path or tag, separated by ',' or '|' (e.g. "Accounts @smoke", "@generic-coin-framework,@solana", "@bitcoin,@family-evm" or "Accounts @smoke|Settings")
        required: false
        type: string
      team:
        description: "Team slug whose specs to run. One of: all, bst, buy-and-sell, coin-integration, earn, engagement, my-ledger-onboarding, swap, wallet-xp."
        required: false
        type: string
        default: all
      invert_filter:
        description: Ignore test having name pattern (entered in the previous field)
        type: boolean
        default: false
      slack_notif:
        description: "Send notification to Slack?"
        required: false
        type: boolean
        default: false
      enable_broadcast:
        description: "Enable transaction broadcast"
        required: false
        type: boolean
        default: false
      build_type:
        description: "Firebase env to target (pick js for release testing)"
        required: false
        type: string
        default: testing
      speculos_device:
        description: "Device to be used"
        required: true
        type: string
      run_on_macos:
        description: "⚠️ QA and release runs only: also run on macOS (shared Mac runner, Speculinho)"
        required: false
        type: boolean
        default: false
      smoke_tests:
        description: "Run smoke tests"
        required: false
        type: boolean
        default: false
      feature_flags:
        description: "Choose a feature flag set for the run"
        required: false
        type: string
        default: defaults
      feature_flags_json:
        description: "JSON to override feature flags (takes precedence if set)"
        required: false
        type: string
        default: ""
      repeat_each:
        description: "Repeat each test N times (optional)"
        required: false
        type: number

permissions:
  contents: read

env:
  E2E_DESKTOP_FEATURE_FLAGS: ${{ inputs.feature_flags || 'defaults' }}
  E2E_FEATURE_FLAGS_JSON: ${{ inputs.feature_flags_json || '' }}
  # Broadcast on explicit request, or on the Monday nightly (see the schedule above).
  E2E_BROADCAST_ENABLED: ${{ inputs.enable_broadcast || github.event.schedule == '0 1 * * 1' }}

jobs:
  prepare-devices:
    name: "Prepare device matrix"
    runs-on: ubuntu-latest
    outputs:
      device_1: ${{ steps.parse.outputs.device_1 }}
      device_2: ${{ steps.parse.outputs.device_2 }}
      is_dual: ${{ steps.parse.outputs.is_dual }}
      e2e_matrix: ${{ steps.parse.outputs.e2e_matrix }}
    steps:
      - name: Parse speculos device input
        id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          SPECULOS_DEVICE_INPUT: ${{ inputs.speculos_device || 'nanoSP' }}
        run: |
          # Nightly rotation, shared with the mobile one in test-mobile-e2e-reusable.yml: the three
          # platforms use three different devices each weekday, and all six devices run every week.
          # Wednesday alternates flex / nanoGen5 by ISO week parity, the opposite of Android that day.
          # 10# keeps a zero-padded week such as "08" from being read as octal.
          if [ $((10#$(date -u +%V) % 2)) -eq 0 ]; then WEDNESDAY_DEVICE=flex; else WEDNESDAY_DEVICE=nanoGen5; fi
          declare -A WEEKDAY_DEVICE=(
            [1]=nanoSP              # Monday     - LNSP (broadcast)
            [2]=nanoX               # Tuesday    - LNX
            [3]=$WEDNESDAY_DEVICE   # Wednesday  - Flex on even ISO weeks, NG5 on odd ones
            [4]=stax                # Thursday   - Stax
            [5]=nanoS               # Friday     - LNS
          )
          SHARD_TOTAL=4
          # Prints e2e_matrix with one entry per shard of each "<device>:<is_primary>:<artifact_suffix>".
          e2e_matrix() {
            local entries=() spec device is_primary artifact_suffix shard
            for spec in "$@"; do
              IFS=: read -r device is_primary artifact_suffix <<< "$spec"
              for shard in $(seq 1 "$SHARD_TOTAL"); do
                entries+=("$(printf '{"device":"%s","is_primary":%s,"artifact_suffix":"%s","shard":%d,"shard_total":%d}' \
                  "$device" "$is_primary" "$artifact_suffix" "$shard" "$SHARD_TOTAL")")
              done
            done
            (IFS=,; echo "e2e_matrix={\"include\":[${entries[*]}]}")
          }
          if [ "$EVENT_NAME" = "schedule" ]; then
            DOW=$(date -u +%u)
            DEVICE="${WEEKDAY_DEVICE[$DOW]:-nanoSP}"
            {
              echo "device_1=$DEVICE"
              echo "device_2=skipped"
              echo "is_dual=false"
              e2e_matrix "$DEVICE:true:"
            } >> "$GITHUB_OUTPUT"
          elif [ "$SPECULOS_DEVICE_INPUT" = "nanoSP and stax" ]; then
            {
              echo "device_1=nanoSP"
              echo "device_2=stax"
              echo "is_dual=true"
              e2e_matrix "nanoSP:true:" "stax:false:-stax"
            } >> "$GITHUB_OUTPUT"
          else
            DEVICE="$SPECULOS_DEVICE_INPUT"
            {
              echo "device_1=$DEVICE"
              echo "device_2=skipped"
              echo "is_dual=false"
              e2e_matrix "$DEVICE:true:"
            } >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  e2e-tests:
    name: "Desktop E2E (${{ matrix.device }}, shard ${{ matrix.shard }}/${{ matrix.shard_total }})"
    needs: [prepare-devices]
    runs-on: [ledger-wallet-8cpu-aws-public-cached]
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-devices.outputs.e2e_matrix) }}
    timeout-minutes: 90
    env:
      NODE_OPTIONS: "--max-old-space-size=14336"
      INSTRUMENT_BUILD: true
      FORCE_COLOR: 3
      CI_OS: "ubuntu-latest"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      npm_config_loglevel: warn
      pnpm_config_loglevel: warn
      DO_NOT_TRACK: 1
      SPECULOS_DEVICE: ${{ matrix.device }}
      # The runner has no Docker daemon, so Speculos runs remotely on Speculinho.
      REMOTE_SPECULOS: "true"
      SPECULOS_IMAGE_TAG: ghcr.io/ledgerhq/speculos:${{ matrix.device != 'nanoS' && 'latest' || 'speculos-38ccc68068db-coinapps-85c7e5c' }}
      # Pods report the host CPU count, so set workers explicitly rather than as a percentage.
      E2E_WORKERS: 8
      COINAPPS: ${{ github.workspace }}/coin-apps
      E2E_PRIMARY_DEVICE: ${{ matrix.is_primary }}
      cache-bucket: ll-nx-cache
      USERDATA_CACHE_ENABLED: ${{ inputs.build_type != 'js' }}
      E2E_GENERATED_USERDATA_DIR: ${{ inputs.build_type != 'js' && format('{0}/e2e/userdata/generated', github.workspace) || '' }}
    outputs:
      test_passed: ${{ steps.run-playwright.outputs.passed }}
      test_failed: ${{ steps.run-playwright.outputs.failed }}
      test_total: ${{ steps.run-playwright.outputs.total }}
      test_exit_code: ${{ steps.run-playwright.outputs.exit_code }}
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          repositories: |
            ledger-live
            coin-apps
          permission-contents: read

      - name: Checkout ledger-live monorepo (shallow clone)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          repository: LedgerHQ/ledger-live
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout coin-apps (device firmware binaries)
        if: ${{ env.REMOTE_SPECULOS != 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: LedgerHQ/coin-apps
          ref: master
          token: ${{ steps.generate-token.outputs.token }}
          path: coin-apps
          fetch-depth: 1
          persist-credentials: false

      - name: Setup caches
        id: caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Build Playwright grep filter from inputs
        id: test-filter
        shell: bash
        env:
          TEST_FILTER_INPUT: ${{ inputs.test_filter }}
          SMOKE_TESTS_INPUT: ${{ inputs.smoke_tests }}
          TEAM_INPUT: ${{ inputs.team || 'all' }}
          INVERT_FILTER_INPUT: ${{ inputs.invert_filter || false }}
        run: |
          node e2e/tooling/filter/resolve.mjs \
            --input "$TEST_FILTER_INPUT" \
            --smoke-tests "$SMOKE_TESTS_INPUT" \
            --team "$TEAM_INPUT" \
            --invert-filter "$INVERT_FILTER_INPUT" \
            --check-dir "e2e/desktop/tests" \
            --runner playwright \
            --github-output >> "$GITHUB_OUTPUT"

      - name: Pull Speculos docker image
        if: ${{ env.REMOTE_SPECULOS != 'true' }}
        run: docker pull "$SPECULOS_IMAGE_TAG"
        shell: bash

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies and build LLD
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-e2e-test-desktop@develop
        id: setup-test-desktop
        with:
          build_type: ${{ inputs.build_type || 'testing' }}
          step_summary: false

      - name: Verify Speculos Docker image is ready
        if: ${{ env.REMOTE_SPECULOS != 'true' }}
        run: |
          while ! docker image inspect "$SPECULOS_IMAGE_TAG" > /dev/null 2>&1; do
            echo "Waiting for Speculos image pull to complete..."
            sleep 2
          done
          echo "Speculos image ready: $SPECULOS_IMAGE_TAG"
          docker image inspect "$SPECULOS_IMAGE_TAG" --format '{{.Size}}' | numfmt --to=iec
        shell: bash

      - name: Configure test environment (API endpoints, broadcast settings)
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-e2e-env@develop
        with:
          enable_broadcast: ${{ env.E2E_BROADCAST_ENABLED }}
          build_type: ${{ inputs.build_type }}

      # Once per run: the first shard of the first device writes the context for every leg.
      - name: Write workflow context to GitHub Summary
        if: ${{ matrix.is_primary && matrix.shard == 1 }}
        env:
          FILTER_PATTERN: ${{ steps.test-filter.outputs.filter }}
          BUILD_TYPE: ${{ inputs.build_type || 'testing' }}
          BROADCAST_ENABLED: ${{ env.E2E_BROADCAST_ENABLED }}
          REPEAT_EACH: ${{ inputs.repeat_each }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          TRIGGERED_BRANCH: ${{ inputs.ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          FEATURE_FLAGS: ${{ env.E2E_DESKTOP_FEATURE_FLAGS }}
          TEAM_INPUT: ${{ inputs.team || 'all' }}
          SPECULOS_MODE: ${{ env.REMOTE_SPECULOS == 'true' && 'Speculinho (remote)' || 'Docker' }}
          EXCLUSIVE_LOCK: ${{ inputs.exclusive_lock || 'remote' }}
          DEVICES: ${{ needs.prepare-devices.outputs.is_dual == 'true' && format('{0} + {1}', needs.prepare-devices.outputs.device_1, needs.prepare-devices.outputs.device_2) || needs.prepare-devices.outputs.device_1 }}
          SHARD_TOTAL: ${{ matrix.shard_total }}
          RUN_ON_MACOS: ${{ inputs.run_on_macos || false }}
        run: |
          EXTRA_FEATURE_FLAGS="$E2E_FEATURE_FLAGS_JSON"

          if [ -z "$EXTRA_FEATURE_FLAGS" ]; then
            EXTRA_FEATURE_FLAGS="(none)"
          fi
          if [ -z "$REPEAT_EACH" ]; then
            REPEAT_EACH="(none)"
          fi

          FILTER_SUMMARY="$(node e2e/tooling/filter/format-summary.mjs "$FILTER_PATTERN")"
          {
            echo "## Workflow Context"
            echo ""
            echo "- **Workflow source branch:** $WORKFLOW_REF"
            echo "- **Triggered branch:** $TRIGGERED_BRANCH"
            echo "- **Commit SHA:** $COMMIT_SHA"
            echo "- **Device selected:** $DEVICES"
            echo "- **Shards per device:** $SHARD_TOTAL"
            echo "- **Also on macOS:** $RUN_ON_MACOS"
            echo "- **Speculos:** $SPECULOS_MODE"
            echo "- **Team:** $TEAM_INPUT"
            echo "$FILTER_SUMMARY"
            echo "- **Firebase env to target:** $BUILD_TYPE"
            echo "- **Broadcast enabled:** $BROADCAST_ENABLED"
            echo "- **Exclusive lock:** $EXCLUSIVE_LOCK"
            echo "- **Feature Flags:** $FEATURE_FLAGS"
            echo "- **JSON override feature flags:** $EXTRA_FEATURE_FLAGS"
            echo "- **Repeat each:** $REPEAT_EACH"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate feature flags JSON input
        shell: bash
        run: |
          raw="$E2E_FEATURE_FLAGS_JSON"
          if [ -z "$raw" ]; then
            exit 0
          fi
          # shellcheck disable=SC2016  # ${...} below are JS template literals, not shell expansions
          node -e '
            try {
              JSON.parse(process.argv[1]);
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              console.error(`Invalid E2E_FEATURE_FLAGS_JSON: ${message}`);
              process.exit(1);
            }
          ' "$raw"

      - name: Compute userdata cache key date
        if: ${{ env.USERDATA_CACHE_ENABLED == 'true' }}
        id: userdata-meta
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore pre-generated E2E userdata (app.json) from S3 cache
        if: ${{ env.USERDATA_CACHE_ENABLED == 'true' }}
        continue-on-error: true
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          path: e2e/userdata/generated
          key: develop/e2e-userdata-desktop-${{ steps.userdata-meta.outputs.date }}
          restore-keys: |
            develop/e2e-userdata-desktop-
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false

      # Every app launch fetches Firebase Remote Config, and overlapping runs share a 60 fetches/min
      # quota per IP. The proxy makes one fetch per run and replays it to every launch.
      # Refs dispatched from develop that predate the addon run without it.
      # The Shard diagnostics job reports its stats from the uploaded logs, so it skips this job's summary.
      - name: Start Remote Config capture proxy
        if: ${{ hashFiles('.mise/tasks/mitmproxy/firebase_capture.py') != '' }}
        continue-on-error: true
        run: GITHUB_STEP_SUMMARY=/dev/null mise run mitmproxy:capture-start
        shell: bash

      - name: Run Playwright E2E tests
        id: run-playwright
        # Every run can also wait up to 30 minutes for a busy exclusive lock: without broadcast, tests
        # still lock the Pay card and the accounts CLI token approvals broadcast from.
        timeout-minutes: 70
        uses: LedgerHQ/ledger-live/tools/actions/composites/run-e2e-playwright-tests@ci/e2e-composite-step-summary
        with:
          speculos_device: ${{ env.SPECULOS_DEVICE }}
          test_filter: ${{ steps.test-filter.outputs.runner_filter }}
          invert_filter: ${{ inputs.invert_filter || false }}
          repeat_each: ${{ inputs.repeat_each }}
          feature_flags: ${{ env.E2E_DESKTOP_FEATURE_FLAGS }}
          shard_index: ${{ matrix.shard }}
          shard_total: ${{ matrix.shard_total }}
          step_summary: false
        env:
          SEED: ${{ secrets.SEED_QAA_B2C }}
          SPECULINHO_URL: ${{ secrets.SPECULINHO_URL }}
          SWAP_API_BASE: ${{ env.SWAP_API_BASE }}
          BAANX_TEST_CLIENT_KEY: ${{ secrets.BAANX_TEST_CLIENT_KEY }}
          BAANX_TEST_USER_EMAIL: ${{ secrets.BAANX_TEST_USER_EMAIL }}
          BAANX_TEST_USER_PASSWORD: ${{ secrets.BAANX_TEST_USER_PASSWORD }}
          BAANX_TEST_USER_TOTP_SECRET: ${{ secrets.BAANX_TEST_USER_TOTP_SECRET }}
          BAANX_TEST_API_URL: ${{ secrets.BAANX_TEST_API_URL }}
          E2E_EXCLUSIVE_LOCK_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          E2E_EXCLUSIVE_LOCK_BUCKET: ${{ secrets.R2_ENDPOINT && 'ledger-live-cache' || '' }}
          E2E_EXCLUSIVE_LOCK_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          E2E_EXCLUSIVE_LOCK_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          E2E_EXCLUSIVE_LOCK_DEFERRAL_PASSES: ${{ inputs.lock_deferral_passes }}
          E2E_EXCLUSIVE_LOCK_MODE: ${{ inputs.exclusive_lock }}
          E2E_EXCLUSIVE_LOCK_PRIORITY: ${{ contains(fromJSON('["release","hotfix"]'), inputs.ref || github.ref_name) && 'high' || 'normal' }}

      - name: Stop Remote Config capture proxy
        id: capture-proxy
        if: ${{ !cancelled() && hashFiles('.mise/tasks/mitmproxy/firebase_capture.py') != '' }}
        continue-on-error: true
        run: GITHUB_STEP_SUMMARY=/dev/null mise run mitmproxy:capture-stop
        shell: bash

      - name: Add workflow inputs to Allure environment
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/add-allure-run-context@develop
        with:
          path: e2e/desktop/allure-results
          context: |
            ref=${{ inputs.ref || github.ref_name }}
            broadcast=${{ env.E2E_BROADCAST_ENABLED }}
            exclusive_lock=${{ inputs.exclusive_lock || 'remote' }}
            firebase_env=${{ inputs.build_type || 'testing' }}
            speculos=${{ env.REMOTE_SPECULOS == 'true' && 'Speculinho (remote)' || 'Docker' }}
            team=${{ inputs.team || 'all' }}
            test_filter=${{ inputs.test_filter }}
            invert_filter=${{ inputs.invert_filter || false }}
            smoke_tests=${{ inputs.smoke_tests || false }}
            repeat_each=${{ inputs.repeat_each }}
            remote_config_proxy=${{ steps.capture-proxy.outputs.status || 'off' }}
            remote_config_templates=${{ steps.capture-proxy.outputs.templates }}

      - name: Upload Allure test results artifact
        if: ${{ !cancelled() || steps.run-playwright.outcome == 'cancelled' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: allure-results${{ matrix.artifact_suffix }}-shard-${{ matrix.shard }}
          path: "e2e/desktop/allure-results"

      - name: Upload Remote Config capture proxy logs
        if: ${{ !cancelled() && steps.capture-proxy.outputs.status == 'on' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: firebase-capture-logs${{ matrix.artifact_suffix }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/firebase-capture*
          retention-days: 7

      - name: Upload Playwright log for the shard diagnostics
        if: ${{ !cancelled() || steps.run-playwright.outcome == 'cancelled' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-log${{ matrix.artifact_suffix }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/playwright-output.log
          if-no-files-found: ignore
          retention-days: 7

  e2e-tests-macos:
    name: "Desktop E2E (${{ needs.prepare-devices.outputs.device_1 }}, macOS)"
    needs: [prepare-devices]
    if: ${{ inputs.run_on_macos }}
    runs-on: [macOS, ARM64, general-pool]
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 90
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
      INSTRUMENT_BUILD: true
      FORCE_COLOR: 3
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      npm_config_loglevel: warn
      pnpm_config_loglevel: warn
      DO_NOT_TRACK: 1
      SPECULOS_DEVICE: ${{ needs.prepare-devices.outputs.device_1 }}
      REMOTE_SPECULOS: true
      SPECULOS_IMAGE_TAG: ghcr.io/ledgerhq/speculos:${{ needs.prepare-devices.outputs.device_1 != 'nanoS' && 'latest' || 'speculos-38ccc68068db-coinapps-85c7e5c' }}
      E2E_BROADCAST_ENABLED: false
      E2E_PRIMARY_DEVICE: false
      cache-bucket: ll-nx-cache
      USERDATA_CACHE_ENABLED: ${{ inputs.build_type != 'js' }}
      E2E_GENERATED_USERDATA_DIR: ${{ inputs.build_type != 'js' && format('{0}/e2e/userdata/generated', github.workspace) || '' }}
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          repositories: ledger-live
          permission-contents: read

      - name: Checkout ledger-live monorepo (shallow clone)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          repository: LedgerHQ/ledger-live
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 1

      - name: Setup caches
        id: caches
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@develop
        with:
          use-mise: true
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-develop-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_DEVELOP }}
          cache-branch-role-arn: ${{ secrets.AWS_CACHE_OIDC_ROLE_ARN_BRANCH }}
          nx-key: ${{ secrets.NX_KEY }}
          accountId: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          roleName: ${{ secrets.AWS_CACHE_ROLE_NAME }}
          region: ${{ secrets.AWS_CACHE_REGION }}

      - name: Build Playwright grep filter from inputs
        id: test-filter
        shell: bash
        env:
          TEST_FILTER_INPUT: ${{ inputs.test_filter }}
          SMOKE_TESTS_INPUT: ${{ inputs.smoke_tests }}
          TEAM_INPUT: ${{ inputs.team || 'all' }}
          INVERT_FILTER_INPUT: ${{ inputs.invert_filter || false }}
        run: |
          node e2e/tooling/filter/resolve.mjs \
            --input "$TEST_FILTER_INPUT" \
            --smoke-tests "$SMOKE_TESTS_INPUT" \
            --team "$TEAM_INPUT" \
            --invert-filter "$INVERT_FILTER_INPUT" \
            --check-dir "e2e/desktop/tests" \
            --runner playwright \
            --github-output >> "$GITHUB_OUTPUT"

      - name: JFrog npm auth
        uses: LedgerHQ/ledger-live/tools/actions/composites/jfrog-npm-auth@develop
        with:
          registry: ${{ vars.ARTIFACTORY_URL }}

      - name: Install dependencies and build LLD
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-e2e-test-desktop@develop
        id: setup-test-desktop
        with:
          build_type: ${{ inputs.build_type || 'testing' }}
          step_summary: false

      - name: Configure test environment (API endpoints, broadcast settings)
        uses: LedgerHQ/ledger-live/tools/actions/composites/setup-e2e-env@develop
        with:
          enable_broadcast: ${{ env.E2E_BROADCAST_ENABLED }}
          build_type: ${{ inputs.build_type }}

      - name: Validate feature flags JSON input
        shell: bash
        run: |
          raw="$E2E_FEATURE_FLAGS_JSON"
          if [ -z "$raw" ]; then
            exit 0
          fi
          # shellcheck disable=SC2016  # ${...} below are JS template literals, not shell expansions
          node -e '
            try {
              JSON.parse(process.argv[1]);
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              console.error(`Invalid E2E_FEATURE_FLAGS_JSON: ${message}`);
              process.exit(1);
            }
          ' "$raw"

      - name: Compute userdata cache key date
        if: ${{ env.USERDATA_CACHE_ENABLED == 'true' }}
        id: userdata-meta
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore pre-generated E2E userdata (app.json) from S3 cache
        if: ${{ env.USERDATA_CACHE_ENABLED == 'true' }}
        continue-on-error: true
        uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
        with:
          path: e2e/userdata/generated
          key: develop/e2e-userdata-desktop-${{ steps.userdata-meta.outputs.date }}
          restore-keys: |
            develop/e2e-userdata-desktop-
          accessKey: ${{ env.AWS_ACCESS_KEY_ID }}
          secretKey: ${{ env.AWS_SECRET_ACCESS_KEY }}
          sessionToken: ${{ env.AWS_SESSION_TOKEN }}
          bucket: ${{ env.cache-bucket }}
          region: ${{ secrets.AWS_CACHE_REGION }}
          use-fallback: false

      - name: Run Playwright E2E tests
        id: run-playwright
        timeout-minutes: 70
        uses: LedgerHQ/ledger-live/tools/actions/composites/run-e2e-playwright-tests@ci/e2e-composite-step-summary
        with:
          speculos_device: ${{ env.SPECULOS_DEVICE }}
          test_filter: ${{ steps.test-filter.outputs.runner_filter }}
          invert_filter: ${{ inputs.invert_filter || false }}
          repeat_each: ${{ inputs.repeat_each }}
          feature_flags: ${{ env.E2E_DESKTOP_FEATURE_FLAGS }}
          workers: "6"
          step_summary: false
        env:
          SEED: ${{ secrets.SEED_QAA_B2C }}
          SPECULINHO_URL: ${{ secrets.SPECULINHO_URL }}
          SWAP_API_BASE: ${{ env.SWAP_API_BASE }}
          BAANX_TEST_CLIENT_KEY: ${{ secrets.BAANX_TEST_CLIENT_KEY }}
          BAANX_TEST_USER_EMAIL: ${{ secrets.BAANX_TEST_USER_EMAIL }}
          BAANX_TEST_USER_PASSWORD: ${{ secrets.BAANX_TEST_USER_PASSWORD }}
          BAANX_TEST_USER_TOTP_SECRET: ${{ secrets.BAANX_TEST_USER_TOTP_SECRET }}
          BAANX_TEST_API_URL: ${{ secrets.BAANX_TEST_API_URL }}
          E2E_EXCLUSIVE_LOCK_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          E2E_EXCLUSIVE_LOCK_BUCKET: ${{ secrets.R2_ENDPOINT && 'ledger-live-cache' || '' }}
          E2E_EXCLUSIVE_LOCK_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          E2E_EXCLUSIVE_LOCK_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          E2E_EXCLUSIVE_LOCK_DEFERRAL_PASSES: ${{ inputs.lock_deferral_passes }}
          E2E_EXCLUSIVE_LOCK_MODE: ${{ inputs.exclusive_lock }}
          E2E_EXCLUSIVE_LOCK_PRIORITY: ${{ contains(fromJSON('["release","hotfix"]'), inputs.ref || github.ref_name) && 'high' || 'normal' }}

      - name: Add workflow inputs to Allure environment
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: LedgerHQ/ledger-live/tools/actions/composites/add-allure-run-context@develop
        with:
          path: e2e/desktop/allure-results
          context: |
            ref=${{ inputs.ref || github.ref_name }}
            broadcast=${{ env.E2E_BROADCAST_ENABLED }}
            exclusive_lock=${{ inputs.exclusive_lock || 'remote' }}
            firebase_env=${{ inputs.build_type || 'testing' }}
            speculos=Speculinho (remote)
            team=${{ inputs.team || 'all' }}
            test_filter=${{ inputs.test_filter }}
            invert_filter=${{ inputs.invert_filter || false }}
            smoke_tests=${{ inputs.smoke_tests || false }}
            repeat_each=${{ inputs.repeat_each }}

      - name: Upload Allure test results artifact
        if: ${{ !cancelled() || steps.run-playwright.outcome == 'cancelled' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: allure-results-macos
          path: "e2e/desktop/allure-results"

      - name: Upload Playwright log for the shard diagnostics
        if: ${{ !cancelled() || steps.run-playwright.outcome == 'cancelled' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-log-macos
          path: ${{ runner.temp }}/playwright-output.log
          if-no-files-found: ignore
          retention-days: 7

  report-to-allure:
    name: "Create Allure Report - ${{ needs.prepare-devices.outputs.device_1 }}"
    runs-on: [ledger-wallet-1cpu-aws-public-cached]
    needs: [prepare-devices, e2e-tests]
    outputs:
      status: ${{ steps.summary.outputs.status }}
      summary_message: ${{ steps.summary.outputs.summary_message }}
      report-url: ${{ steps.allure-server.outputs.report-url }}
      qaa-report-url: ${{ steps.qaa-allure-upload.outputs.report_url }}
    if: ${{ !cancelled() }}
    env:
      ALLURE_RESULTS: "allure-results"
    steps:
      - name: Download Allure results from test job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: allure-results-shard-*
          merge-multiple: true
          path: ${{ env.ALLURE_RESULTS }}

      # The Allure steps below generate a report and recompress screenshots inside the results directory.
      - name: Keep the raw results for qaa-allure
        run: cp -R "$ALLURE_RESULTS" "$ALLURE_RESULTS-qaa"
        shell: bash

      - name: Extract test summary for Slack notification
        if: ${{ !cancelled() }}
        id: summary
        uses: LedgerHQ/ledger-live/tools/actions/composites/get-allure-summary@develop
        with:
          allure-results-path: ${{ env.ALLURE_RESULTS }}
          platform: ${{ needs.prepare-devices.outputs.is_dual == 'true' && format('linux-{0}', needs.prepare-devices.outputs.device_1) || 'linux' }}

      - name: Publish report to Allure Server
        id: allure-server
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report@develop
        with:
          platform: ${{ github.event_name == 'schedule' && 'linux-speculos-nightly' || (inputs.smoke_tests && 'linux-speculos-smoke' || 'linux-speculos') }}
          login: ${{ vars.ALLURE_USERNAME }}
          password: ${{ secrets.ALLURE_LEDGER_LIVE_PASSWORD }}
          path: ${{ env.ALLURE_RESULTS }}
          summary_message: ${{ steps.summary.outputs.summary_message }}

      - name: Upload to qaa-allure (Experimental)
        id: qaa-allure-upload
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        uses: LedgerHQ/ledger-live/tools/actions/composites/upload-allure-report-qaa@ci/e2e-composite-step-summary
        with:
          api_key: ${{ secrets.QAA_ALLURE_API_KEY }}
          path: ${{ env.ALLURE_RESULTS }}-qaa
          name: "desktop-e2e-${{ needs.prepare-devices.outputs.device_1 }}-${{ github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual') }}"
          tags: ${{ format('["desktop","speculos",{0},{1}]', toJSON(needs.prepare-devices.outputs.device_1), toJSON(github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual'))) }}
          branch: ${{ inputs.ref || github.ref_name }}
          history_key: "desktop-e2e-${{ github.event_name == 'schedule' && 'nightly' || (inputs.smoke_tests && 'smoke' || 'manual') }}"
          step_summary: false

      - name: Link the qaa-allure report
        if: ${{ steps.qaa-allure-upload.outputs.report_url != '' }}
        env:
          REPORT_URL: ${{ steps.qaa-allure-upload.outputs.report_url }}
        run: echo "[Open QAA report (experimental)](${REPORT_URL})" >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Write failed tests summary
        if: ${{ !cancelled() }}
        uses: LedgerHQ/ledger-live/tools/actions/composites/get-failed-tests-summary@develop
        with:
          results-path: ${{ env.ALLURE_RESULTS }}
          runner: playwright


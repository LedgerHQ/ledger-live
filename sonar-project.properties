# Duplication is measured only where new code is written: shared/, domain/, features/ and
# devtools/. libs/ is legacy that moves into those layers copy-then-repoint, so each migration step
# duplicates on purpose until the old copy is deleted. apps/ is app composition code, where desktop
# and mobile repeat each other by design. e2e/ is test code, where self-contained cases beat DRY.
# Issues and coverage are still analysed in all three.
# The currency-crypto definitions are declarative data, one `currency({...})` literal per file:
# every EVM currency repeats the same 18-decimal unit ladder (coin, Gwei, Mwei, Kwei, wei) and
# explorer shape, so each new one reads as a near-total copy of its ~55 siblings.
sonar.cpd.exclusions=libs/**,\
apps/**,\
e2e/**,\
domain/entity/currency-crypto/src/currencies/**
# S2187 ("add some tests to this file or delete it") does not fit the mobile e2e layout: Jest's
# testMatch only picks up `specs/**/*.spec.ts`, so a spec file is a one-line wrapper that calls the
# runner holding the describe/it, and 230 of the 253 spec files are shaped that way. The rule stays
# on everywhere else, and the runners themselves are still analysed.
# S9382 ("await inside a loop") does not fit mobile e2e page objects: Detox rejects concurrent
# interactions ("multiple interactions taking place"), so taps and waits on a list of elements must
# run one after another, and `Promise.all` would fail. Scoped to page objects and specs (spec runners
# and `*.spec.ts`), where those loops live.
# S9382 does not fit the mobile e2e setup either (utils/initUtil.ts): every CLI command writes into
# the same userdata file and drives one Speculos device, and its retry loops recreate that device
# between attempts, so the commands and the attempts must run one after another.
# S9382 does not fit the startup tool either (e2e/tooling/startup-perf/src/): the measurement drives
# adb, simctl and Maestro on one device at a time, and launching or reading two at once would skew
# the times it measures; the snapshot adds each coin's accounts on its one device in turn, one
# Speculos at a time.
# S9382 does not fit the borrow helpers either (libs/live-e2e-shared/src/borrow/): each action step
# is signed on the one Speculos device and broadcast from one account in nonce order, positions
# close one after another, and the retry and poll loops must wait between attempts.
# S2699 ("add at least one assertion to this test case") does not fit mobile e2e tests: the
# conventions put every check in a page object `expect*` method, which asserts through its element
# handle, so a test body calls those methods and has no `expect()` of its own.

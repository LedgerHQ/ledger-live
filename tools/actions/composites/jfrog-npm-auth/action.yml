name: JFrog npm auth
description: OIDC login to JFrog and configure npm for the given Artifactory npm registry.
inputs:
  registry:
    description: Artifactory npm registry host and path (same shape as jfrog-npm registry input).
    required: true
runs:
  using: composite
  steps:
    # actions-security is pinned to a commit SHA (not a branch or moving tag) so the
    # action ref is stable and runner caching can be enabled.
    - id: jfrog-login
      if: ${{ inputs.registry != '' }}
      uses: LedgerHQ/actions-security/actions/jfrog-login@b9e0f8af18a3db56e133a46ccf83499c8279508e
    - id: jfrog-npm
      if: ${{ inputs.registry != '' }}
      uses: LedgerHQ/actions-security/actions/jfrog-npm@b9e0f8af18a3db56e133a46ccf83499c8279508e
      with:
        token: ${{ steps.jfrog-login.outputs.oidc-token }}
        registry: ${{ inputs.registry }}
        npmrc-location: "$HOME/.npmrc"
        # Hardlink imports only on self-hosted Linux runners; 'false' leaves the pnpm default.
        package-import-method: ${{ runner.os == 'Linux' && runner.environment == 'self-hosted' && 'hardlink' || 'false' }}
    # pnpm 11 only reads auth and registry from .npmrc, so the import method must also go through env.
    - if: ${{ inputs.registry != '' && runner.os == 'Linux' && runner.environment == 'self-hosted' }}
      shell: bash
      run: echo "pnpm_config_package_import_method=hardlink" >> "$GITHUB_ENV"

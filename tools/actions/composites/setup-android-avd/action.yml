name: "Setup Android AVD"
description: "Create the E2E Android AVD and its quick-boot snapshot, configured by avd.env, and optionally upload it to R2"
# Self-contained: the AVD configuration (avd.env) and the scripts are read relative to
# this action, never from the job's checkout, so jobs testing an older ref still get the
# configuration of the version they call. Also used outside this repo, to bake the AVD
# into the Android E2E runner image.
#
# Leaves the AVD_* variables, AVD_CACHE_KEY included, in the job environment, and the
# key in ~/.android/avd-cache-key so a machine holding the AVD can tell which one it is.
inputs:
  r2_access_key:
    description: "R2 access key for cache upload; the AVD is not uploaded when empty"
    required: false
    default: ""
  r2_secret_key:
    description: "R2 secret key for cache upload"
    required: false
    default: ""
  r2_endpoint:
    description: "R2 endpoint for cache upload"
    required: false
    default: ""
  config_only:
    description: "Only load the AVD configuration into the job environment; create nothing"
    required: false
    default: "false"
outputs:
  cache_key:
    description: "R2 key of this AVD configuration"
    value: ${{ steps.config.outputs.AVD_CACHE_KEY }}

runs:
  using: "composite"
  steps:
    # avd-config.sh only prints avd.env, a file of this action.
    - name: Load AVD configuration
      id: config
      shell: bash
      run: | # zizmor: ignore[github-env]
        "${GITHUB_ACTION_PATH}/avd-config.sh" | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"

    - name: Setup Android Environment
      if: inputs.config_only != 'true'
      uses: LedgerHQ/ledger-live/tools/actions/composites/setup-android-env@develop

    # Don't upload leftovers of an AVD already on the runner.
    - name: Remove any existing AVD and emulator
      if: inputs.config_only != 'true'
      shell: bash
      run: |
        rm -rf /home/runner/.android/avd /home/runner/.android/avd-cache-key \
          /usr/local/lib/android/sdk/emulator \
          "/usr/local/lib/android/sdk/system-images/android-${AVD_API}/${AVD_TARGET}/${AVD_ARCH}"

    - name: Create .android directory
      if: inputs.config_only != 'true'
      shell: bash
      run: mkdir -p /home/runner/.android/

    - name: Create AVD and generate snapshot
      if: inputs.config_only != 'true'
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
      id: create-avd
      with:
        api-level: ${{ env.AVD_API }}
        arch: ${{ env.AVD_ARCH }}
        profile: ${{ env.AVD_PROFILE }}
        target: ${{ env.AVD_TARGET }}
        avd-name: ${{ env.AVD_NAME }}
        force-avd-creation: true
        cores: ${{ env.AVD_CORES }}
        ram-size: ${{ env.AVD_RAM_SIZE }}
        disable-linux-hw-accel: false
        emulator-options: ${{ env.AVD_OPTIONS }}
        heap-size: ${{ env.AVD_HEAP_SIZE }}
        emulator-build: ${{ env.AVD_EMULATOR_BUILD }}
        pre-emulator-launch-script: bash "${{ github.action_path }}/../../../scripts/patch-avd-config.sh" "${{ env.AVD_NAME }}"
        script: bash "${{ github.action_path }}/../../../scripts/wait_emulator_idle.sh"

    - name: Stamp the AVD with its cache key
      if: inputs.config_only != 'true'
      shell: bash
      run: echo "${AVD_CACHE_KEY}" > /home/runner/.android/avd-cache-key

    - name: Report the AVD versions
      if: inputs.config_only != 'true'
      shell: bash
      run: |
        sdk=/usr/local/lib/android/sdk
        {
          echo "### Android AVD"
          echo "- Key: \`${AVD_CACHE_KEY}\`"
          echo "- Emulator: \`$("${sdk}/emulator/emulator" -version 2>/dev/null | head -1)\`"
          echo "- System image revision: \`$(sed -n 's/^Pkg.Revision=//p' "${sdk}/system-images/android-${AVD_API}/${AVD_TARGET}/${AVD_ARCH}/source.properties")\`"
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Cache android emulator
      if: inputs.config_only != 'true' && inputs.r2_access_key != ''
      uses: LedgerHQ/ledger-live/tools/actions/composites/cache/upload@develop
      with:
        path: |
          /home/runner/.android/
          /usr/local/lib/android/sdk/emulator/
          /usr/local/lib/android/sdk/system-images/android-${{ env.AVD_API }}/${{ env.AVD_TARGET }}/${{ env.AVD_ARCH }}/
        key: ${{ env.AVD_CACHE_KEY }}
        accessKey: ${{ inputs.r2_access_key }}
        secretKey: ${{ inputs.r2_secret_key }}
        bucket: ledger-live-cache
        endpoint: ${{ inputs.r2_endpoint }}
        region: auto

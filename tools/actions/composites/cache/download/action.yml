name: "Cache Download"
description: "Download and uncompress cache files to S3"
inputs:
  endpoint:
    description: the S3 endpoint URL, e.g., 's3.amazonaws.com'
    type: string
    required: false
  key:
    type: string
    required: true
  accessKey:
    type: string
    required: true
  secretKey:
    type: string
    required: true
  sessionToken:
    type: string
    required: false
  bucket:
    type: string
    required: true
  region:
    type: string
    required: true
  destination:
    description: "The destination path to extract the cache files to"
    type: string
    required: false
    default: ${{ github.workspace }}
outputs:
  cache-hit:
    description: "Indicates if the cache was successfully downloaded"
    value: ${{ steps.download-cache.outcome == 'success' }}
runs:
  using: "composite"
  steps:
    # The first `aws` call on a fresh macOS runner VM takes ~60s before doing anything, so macOS
    # downloads use s5cmd (a single static binary) instead.
    - name: Install s5cmd (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        [[ -x "$RUNNER_TEMP/s5cmd/s5cmd" ]] && exit 0
        tarball="s5cmd_${S5CMD_VERSION}_macOS-arm64.tar.gz"
        mkdir -p "$RUNNER_TEMP/s5cmd"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/s5cmd/$tarball" "https://github.com/peak/s5cmd/releases/download/v${S5CMD_VERSION}/${tarball}"
        echo "${S5CMD_SHA256}  $RUNNER_TEMP/s5cmd/$tarball" | shasum -a 256 -c -
        tar -xzf "$RUNNER_TEMP/s5cmd/$tarball" -C "$RUNNER_TEMP/s5cmd" s5cmd
      env:
        S5CMD_VERSION: 2.3.0
        S5CMD_SHA256: ae007bc96276f498ae3c1fb017e57630cf93ef260cfe7e97b365522e240c973f

    - name: Downloading files
      id: download-cache
      shell: bash
      run: |
        ENDPOINT_URL="${INPUTS_ENDPOINT:-s3.${INPUTS_REGION}.amazonaws.com}"
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          "$RUNNER_TEMP/s5cmd/s5cmd" --endpoint-url "https://${ENDPOINT_URL}" \
            cp "s3://${INPUTS_BUCKET}/${INPUTS_KEY}/cache.tzst" /tmp/cache.tzst
        else
          aws s3 cp s3://${INPUTS_BUCKET}/${INPUTS_KEY}/cache.tzst /tmp/cache.tzst --endpoint-url "https://${ENDPOINT_URL}" --region ${INPUTS_REGION} --no-progress
        fi
      env:
        AWS_REGION: ${{ inputs.region }}
        AWS_ACCESS_KEY_ID: ${{ inputs.accessKey }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secretKey }}
        AWS_SESSION_TOKEN: ${{ inputs.sessionToken }}
        INPUTS_BUCKET: ${{ inputs.bucket }}
        INPUTS_KEY: ${{ inputs.key }}
        INPUTS_REGION: ${{ inputs.region }}
        INPUTS_ENDPOINT: ${{ inputs.endpoint }}

    - name: Un-Compress files (Linux)
      if: runner.os == 'Linux' && steps.download-cache.outcome == 'success'
      shell: bash
      run: |
        tar -xf /tmp/cache.tzst -C ${INPUTS_DESTINATION} --use-compress-program unzstd
      env:
        INPUTS_DESTINATION: ${{ inputs.destination }}

    - name: Un-Compress files (macOS)
      if: runner.os == 'macOS' && steps.download-cache.outcome == 'success'
      shell: bash
      run: |
        gtar -xf /tmp/cache.tzst -C ${INPUTS_DESTINATION} --use-compress-program unzstd
      env:
        INPUTS_DESTINATION: ${{ inputs.destination }}

    - name: Cleanup
      shell: bash
      if: steps.download-cache.outcome == 'success'
      run: |
        rm -f /tmp/cache.tzst

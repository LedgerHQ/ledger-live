name: "Cache Exists"
description: "Check if a cache key exists in S3/R2 storage"
inputs:
  endpoint:
    description: the S3 endpoint URL, e.g., 's3.amazonaws.com'
    type: string
    required: false
  key:
    type: string
    required: true
  accessKey:
    type: string
    required: true
  secretKey:
    type: string
    required: true
  sessionToken:
    type: string
    required: false
  bucket:
    type: string
    required: true
  region:
    type: string
    required: true
outputs:
  cache-hit:
    description: "Indicates if the cache exists"
    value: ${{ steps.check-cache.outputs.cache-hit }}
runs:
  using: "composite"
  steps:
    - name: Check if cache exists
      id: check-cache
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/../cache.sh" exists
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.accessKey }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secretKey }}
        AWS_SESSION_TOKEN: ${{ inputs.sessionToken }}
        AWS_REGION: ${{ inputs.region }}
        CACHE_KEY: ${{ inputs.key }}
        CACHE_BUCKET: ${{ inputs.bucket }}
        CACHE_REGION: ${{ inputs.region }}
        CACHE_ENDPOINT: ${{ inputs.endpoint }}

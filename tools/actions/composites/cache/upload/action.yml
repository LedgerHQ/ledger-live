name: "Cache upload"
description: "Compress and upload cache files to S3"
inputs:
  endpoint:
    description: the S3 endpoint URL, e.g., 'bucket.s3.amazonaws.com'
    type: string
    required: false
  key:
    type: string
    required: true
  path:
    type: string
    required: true
  accessKey:
    type: string
    required: true
  secretKey:
    type: string
    required: true
  sessionToken:
    type: string
    required: false
  bucket:
    type: string
    required: true
  region:
    type: string
    required: true
  concurrency:
    description: "s5cmd parts transferred in parallel"
    type: string
    required: false
    default: "16"
  part-size:
    description: "s5cmd part size in MiB"
    type: string
    required: false
    default: "64"
runs:
  using: "composite"
  steps:
    - name: Archive and upload
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/../cache.sh" upload
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.accessKey }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secretKey }}
        AWS_SESSION_TOKEN: ${{ inputs.sessionToken }}
        AWS_REGION: ${{ inputs.region }}
        CACHE_KEY: ${{ inputs.key }}
        CACHE_BUCKET: ${{ inputs.bucket }}
        CACHE_REGION: ${{ inputs.region }}
        CACHE_ENDPOINT: ${{ inputs.endpoint }}
        CACHE_PATH: ${{ inputs.path }}
        CACHE_CONCURRENCY: ${{ inputs.concurrency }}
        CACHE_PART_SIZE: ${{ inputs['part-size'] }}

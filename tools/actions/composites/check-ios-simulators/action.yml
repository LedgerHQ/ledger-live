name: "Check iOS simulators"
description: "Wait for boot-ios-simulators-background, reboot any simulator that cannot launch an app, and fail if one still cannot, so Detox never runs on a dead simulator"

runs:
  using: "composite"
  steps:
    - name: Check iOS simulators
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/check-simulators.sh"

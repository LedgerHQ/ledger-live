name: "Check iOS simulators"
description: "Wait for boot-ios-simulators-background, reboot any simulator that cannot launch an app, and fail if one still cannot, so Detox never runs on a dead simulator. Then wait for each simulator's trust store update, which stalls its TLS connections"

runs:
  using: "composite"
  steps:
    - name: Check iOS simulators
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/check-simulators.sh"

    - name: Wait for the iOS trust store update
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/wait-trust-store-update.sh"

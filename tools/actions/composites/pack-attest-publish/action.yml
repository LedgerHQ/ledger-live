name: Pack, attest and publish packages
description: Pack all public packages, attest tarballs, and publish skipping already-published versions.
inputs:
  dist-tag:
    description: npm dist-tag to publish under.
    required: false
    default: latest
  registry-token:
    description: NODE_AUTH_TOKEN for npm.org publishing. Leave empty when JFrog auth configures the registry.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Pack unpublished public packages
      id: pack
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.registry-token }}
      run: |
        set -euo pipefail
        echo "count=0" >> "$GITHUB_OUTPUT"
        DIST_DIR="$RUNNER_TEMP/pack-attest-publish"
        mkdir -p "$DIST_DIR"
        pnpm -r list --json --depth -1 \
          | jq -r '.[] | select(.private != true) | [.name, .version] | @tsv' \
          | while IFS=$'\t' read -r name version; do
              if npm_out=$(npm view "${name}@${version}" version 2>&1); then
                echo "Skipping $name@$version (already published)"
              else
                if echo "$npm_out" | grep -qiE 'E401|E403|ENEEDAUTH'; then
                  echo "::error::Registry auth error checking ${name}@${version}"
                  echo "$npm_out" >&2
                  exit 1
                fi
                echo "Packing $name@$version..."
                # Pipe to dev null - the output is too verbose      
                pnpm --filter "$name" pack --pack-destination "$DIST_DIR" > /dev/null \
                  || { echo "::error::Failed to pack ${name}@${version}"; exit 1; }
              fi
            done
        shopt -s nullglob
        tarballs=("$DIST_DIR"/*.tgz)
        echo "count=${#tarballs[@]}" >> "$GITHUB_OUTPUT"

    - name: Attest tarballs
      if: steps.pack.outputs.count != '0'
      uses: LedgerHQ/actions-security/actions/attest-for-npmsjs-com@attest-npm-dir-support
      with:
        subject-path: '${{ runner.temp }}/pack-attest-publish'

    - name: Publish packages
      if: steps.pack.outputs.count != '0'
      shell: bash
      env:
        DIST_TAG: ${{ inputs.dist-tag }}
        NODE_AUTH_TOKEN: ${{ inputs.registry-token }}
      run: |
        set -euo pipefail
        DIST_DIR="$RUNNER_TEMP/pack-attest-publish"
        shopt -s nullglob
        for tarball in "$DIST_DIR"/*.tgz; do
          pkg_name=$(tar -xOf "$tarball" package/package.json | jq -r '.name')
          pkg_version=$(tar -xOf "$tarball" package/package.json | jq -r '.version')
          echo "Publishing $pkg_name@$pkg_version with tag $DIST_TAG"
          npm publish "$tarball" --tag "$DIST_TAG" --access public
        done

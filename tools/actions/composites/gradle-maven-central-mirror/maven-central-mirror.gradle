// Gradle init script installed on CI by tools/actions/composites/gradle-maven-central-mirror.
// Maven Central rate-limits the shared runner egress IPs (HTTP 429), so every Maven Central
// repository is pointed at Google's mirror of it instead. Other repositories are left alone.

def mirrorUrl = System.getenv('GRADLE_MAVEN_CENTRAL_MIRROR')
if (!mirrorUrl) {
    return
}
if (!mirrorUrl.endsWith('/')) {
    mirrorUrl += '/'
}

def centralHosts = ['repo.maven.apache.org', 'repo1.maven.org'] as Set
def pluginPortalHost = 'plugins.gradle.org'

// The Plugin Portal redirects plugin dependencies (e.g. gson, kotlin-gradle-plugin-idea) to
// Maven Central. Wherever the portal is declared, the mirror goes first so those dependencies
// resolve from it; plugin markers and portal-only artifacts miss it and fall through to the portal.
def mirror = { RepositoryHandler repositories ->
    def portalFronted = false
    repositories.withType(MavenArtifactRepository).all { repo ->
        def host = repo.url?.host
        if (centralHosts.contains(host)) {
            logger.info("maven-central-mirror: ${repo.url} -> ${mirrorUrl}")
            repo.url = mirrorUrl
        } else if (host == pluginPortalHost && !portalFronted) {
            portalFronted = true
            def front = repositories.maven {
                name = 'MavenCentralMirror'
                url = mirrorUrl
            }
            repositories.remove(front)
            repositories.addFirst(front)
        }
    }
}

beforeSettings { settings ->
    logger.lifecycle("maven-central-mirror: resolving Maven Central through ${mirrorUrl} for ${settings.rootDir}")
    mirror(settings.pluginManagement.repositories)
    // With no plugin repositories declared, Gradle uses the portal without going through the
    // handler. Declaring it explicitly lets the rule above put the mirror in front of it.
    settings.pluginManagement.repositories.gradlePluginPortal()
    mirror(settings.buildscript.repositories)
    mirror(settings.dependencyResolutionManagement.repositories)
}

beforeProject { project ->
    mirror(project.buildscript.repositories)
    mirror(project.repositories)
}

name: "Nx package test plan"
description: "Plans the Test Packages matrix: packs the affected libs, features, shared, domain, devtools and support projects onto as few shards as their weight allows. Needs a checkout and pnpm/nx, like nx-affected-packages."

inputs:
  affected:
    description: "Newline-separated affected Nx project names (nx-affected-packages output `packages`)"
    required: true
  max-weight-per-shard:
    description: "Weight one shard takes before another is added. A project weighs its test file count plus 10."
    required: false
    default: "2500"
  max-shards:
    description: "Upper bound on the number of shards"
    required: false
    default: "4"

outputs:
  shards:
    description: "Number of shards, 0 when no project in the package scopes is affected"
    value: ${{ steps.plan.outputs.shards }}
  matrix:
    description: 'Matrix JSON {"include":[{shard, weight, projects, coverage, test, export_rules, roots}]}'
    value: ${{ steps.plan.outputs.matrix }}

runs:
  using: composite
  steps:
    - name: Plan package test shards
      id: plan
      shell: bash
      env:
        AFFECTED: ${{ inputs.affected }}
        MAX_WEIGHT_PER_SHARD: ${{ inputs.max-weight-per-shard }}
        MAX_SHARDS: ${{ inputs.max-shards }}
      run: node "$GITHUB_ACTION_PATH/plan-test-shards.js"

name: Adjust Changeset Level
description: This action adjusts the changeset level from one value to another.
inputs:
  from_level:
    description: 'The changeset level to target'
    required: true
  to_level:
    description: 'The desired changeset level for the target'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Validate input levels
      shell: bash
      run: |
        valid_levels=("patch" "minor" "major")
        if [[ ! " ${valid_levels[@]} " =~ " ${INPUTS_FROM_LEVEL} " ]]; then
          echo "Invalid from_level: ${INPUTS_FROM_LEVEL}. Must be one of ${valid_levels[@]}"
          exit 1
        fi
        if [[ ! " ${valid_levels[@]} " =~ " ${INPUTS_TO_LEVEL} " ]]; then
          echo "Invalid to_level: ${INPUTS_TO_LEVEL}. Must be one of ${valid_levels[@]}"
          exit 1
        fi
      env:
        INPUTS_FROM_LEVEL: ${{ inputs.from_level }}
        INPUTS_TO_LEVEL: ${{ inputs.to_level }}

    - name: Adjust changeset level
      shell: bash
      run: |
        echo "Adjusting changeset level from ${INPUTS_FROM_LEVEL} to ${INPUTS_TO_LEVEL}"
        for file in .changeset/*.md; do
          if grep -q ": ${INPUTS_FROM_LEVEL}" "$file"; then
            # target the lines between the "---" yaml delimiters, replace e.g. ": patch" with ": minor"
            sed -i '/---/,/---/s/: ${INPUTS_FROM_LEVEL}/: ${INPUTS_TO_LEVEL}/' "$file"
            echo "Updated $file to ${INPUTS_TO_LEVEL}"
          fi
        done
      env:
        INPUTS_FROM_LEVEL: ${{ inputs.from_level }}
        INPUTS_TO_LEVEL: ${{ inputs.to_level }}

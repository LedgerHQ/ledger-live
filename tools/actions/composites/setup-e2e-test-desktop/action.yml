name: "Setup Ledger Live Desktop e2e Tests"
description: "Composite job to setup the CI for Ledger Live Desktop e2e tests"
inputs:
  skip_builds:
    description: "skip the step to build the desktop app"
    required: false
  build_type:
    description: "whether to use the ':testing' suffix for the build command"
    required: false
    default: "testing"
  install_node_gyp:
    description: "install node-gyp"
    required: false
  step_summary:
    description: "Let Nx write its run report to the job summary ('false' writes it to $RUNNER_TEMP/nx-run-report.md instead)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install node-gyp globally
      if: ${{ inputs.install_node_gyp }}
      run: |
        pnpm add -g node-gyp@3.8.0
      shell: bash
    - name: Install App dependencies
      env:
        LANG: en_US.UTF-8
      run: pnpm i --filter="ledger-live-desktop..." --filter="ledger-live" --filter="ledger-live-desktop-e2e-tests..." --unsafe-perm
      shell: bash
    - name: Install playwright dependencies
      run: pnpm e2e:desktop test:playwright:setup
      shell: bash
    - name: Build dependencies
      env:
        INPUTS_STEP_SUMMARY: ${{ inputs.step_summary }}
      run: |
        # Nx appends an "Nx Run Report" to GITHUB_STEP_SUMMARY, with no setting to turn it off.
        if [ "${INPUTS_STEP_SUMMARY}" = "false" ]; then
          GITHUB_STEP_SUMMARY="${RUNNER_TEMP}/nx-run-report.md"
        fi
        pnpm exec nx run ledger-live-desktop:build-lib-deps
      shell: bash
    - name: Build LLD app for testing
      env:
        GOMEMLIMIT: 5GiB
        INPUTS_BUILD_TYPE: ${{ inputs.build_type }}
      if: ${{ !inputs.skip_builds }}
      run: |
        pnpm desktop build:${INPUTS_BUILD_TYPE:-testing}
      shell: bash

name: "Setup Android Environment"
description: "Setup common Android development environment (JDK, SDK, hardware acceleration)"
inputs:
  jdk_version:
    description: "JDK version to install"
    required: false
    default: "17"
  jdk_distribution:
    description: "JDK distribution"
    required: false
    default: "zulu"
  android_packages:
    description: "Android SDK packages to install"
    required: false
    default: "platform-tools"
  install_sdk:
    description: "Install the pinned cmdline-tools and android_packages. Only needed to run sdkmanager or avdmanager (creating an AVD); the runner image's SDK already has adb and build-tools"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup JDK ${{ inputs.jdk_version }}
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: ${{ inputs.jdk_distribution }}
        java-version: ${{ inputs.jdk_version }}

    # Keeps only the pinned version, which setup-android installs to (and reuses from)
    # cmdline-tools/<version>; runner images that bake it in skip the download.
    - name: Remove preinstalled cmdline-tools (force pinned install)
      if: inputs.install_sdk == 'true'
      shell: bash
      run: |
        SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
        PINNED="15859902"
        if [ -d "$SDK/cmdline-tools" ]; then
          for dir in "$SDK/cmdline-tools"/*; do
            [ "$(basename "$dir")" = "$PINNED" ] && [ -x "$dir/bin/sdkmanager" ] && continue
            echo "Removing $dir so pinned cmdline-tools are not skipped."
            rm -rf "$dir" 2>/dev/null || sudo rm -rf "$dir"
          done
        fi

    - name: Setup Android SDK
      if: inputs.install_sdk == 'true'
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      with:
        packages: ${{ inputs.android_packages }}
        cmdline-tools-version: 15859902

    # setup-android puts these on PATH, but jobs that skip it still call adb by name.
    # The path comes from the runner's own SDK variables, not from workflow input.
    - name: Put platform-tools on PATH
      if: inputs.install_sdk != 'true'
      shell: bash
      run: | # zizmor: ignore[github-env]
        SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
        echo "$SDK/platform-tools" >> "$GITHUB_PATH"

    - name: Enable Hardware Acceleration
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Fix emulator directory permissions
      shell: bash
      run: |
        SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
        if [ -d "$SDK/emulator" ]; then
          sudo chown -R $(whoami):$(id -ng) "$SDK/emulator"
        fi

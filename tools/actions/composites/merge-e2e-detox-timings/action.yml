name: Merge Timing Files

description: Merge and cache E2E timing files for a given platform

inputs:
  artifacts_dir:
    description: "Directory containing timing artifacts"
    required: false
    default: "e2e/mobile/artifacts"
  aws_access_key_id:
    description: "AWS access key ID"
    required: true
  aws_secret_access_key:
    description: "AWS secret access key"
    required: true
  aws_session_token:
    description: "AWS session token"
    required: true
  aws_region:
    description: "AWS region"
    required: true
  cache_bucket:
    description: "S3 cache bucket name"
    required: true
  github_ref:
    description: "GitHub ref for cache key"
    required: true
  github_run_id:
    description: "GitHub run ID for cache key"
    required: true
  roleName:
    description: "AWS IAM role name for cache access"
    required: false
  accountId:
    description: "AWS account ID for cache access"
    required: false
  key:
    description: "Cache key prefix for timing files"
    required: true
  test_results_prefix:
    description: "Name of the E2E test results artifact"
    required: true
  cache-develop-role-arn:
    description: "Full IAM OIDC role ARN for refs/heads/develop (optional; use with cache-branch-role-arn instead of accountId/roleName)"
    required: false
    default: ""
  cache-branch-role-arn:
    description: "Full IAM OIDC role ARN for non-develop refs (optional; use with cache-develop-role-arn)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: LedgerHQ/ledger-live
        sparse-checkout: |
          apps/ledger-live-mobile/scripts
          tools/nx

    - name: Setup the caches
      uses: LedgerHQ/ledger-live/tools/actions/composites/setup-caches@ci-test/deps-gha-sonar-github
      id: setup-caches
      with:
        skip-pod-cache: "true"
        skip-nx-cache: "true"
        cache-develop-role-arn: ${{ inputs.cache-develop-role-arn }}
        cache-branch-role-arn: ${{ inputs.cache-branch-role-arn }}
        accountId: ${{ inputs.accountId }}
        roleName: ${{ inputs.roleName }}
        region: ${{ inputs.aws_region }}

    - name: Download timing files
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: "${{ inputs.test_results_prefix }}-*"
        merge-multiple: true

    - name: Restore cached timing file
      uses: tespkg/actions-cache/restore@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
      with:
        path: ${{ inputs.artifacts_dir }}/${{ inputs.test_results_prefix }}.json
        key: "${{ inputs.key }}"
        accessKey: ${{ inputs.aws_access_key_id }}
        secretKey: ${{ inputs.aws_secret_access_key }}
        sessionToken: ${{ inputs.aws_session_token }}
        bucket: ${{ inputs.cache_bucket }}
        region: ${{ inputs.aws_region }}
        use-fallback: false

    - name: Merge timing files
      shell: bash
      run: |
        apps/ledger-live-mobile/scripts/merge-timing-files.sh \
          --file-prefix "${INPUTS_TEST_RESULTS_PREFIX}" \
          --artifacts-dir "${INPUTS_ARTIFACTS_DIR}" \
          --verbose
      env:
        INPUTS_TEST_RESULTS_PREFIX: ${{ inputs.test_results_prefix }}
        INPUTS_ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}

    - name: Upload merged timing file to artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: "${{ inputs.test_results_prefix }}"
        path: ./${{ inputs.test_results_prefix }}.json

    - name: Copy merged timing file to artifacts dir
      shell: bash
      run: |
        mkdir -p ${INPUTS_ARTIFACTS_DIR}
        cp ./${INPUTS_TEST_RESULTS_PREFIX}.json ${INPUTS_ARTIFACTS_DIR}/${INPUTS_TEST_RESULTS_PREFIX}.json
      env:
        INPUTS_ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}
        INPUTS_TEST_RESULTS_PREFIX: ${{ inputs.test_results_prefix }}

    - name: Save merged timing file to cache
      uses: tespkg/actions-cache/save@570a8ae32f67c95bcaca3f8cc88702cd318291e9 # v1.10.0
      with:
        path: ${{ inputs.artifacts_dir }}/${{ inputs.test_results_prefix }}.json
        key: "${{ inputs.key }}"
        accessKey: ${{ inputs.aws_access_key_id }}
        secretKey: ${{ inputs.aws_secret_access_key }}
        sessionToken: ${{ inputs.aws_session_token }}
        bucket: ${{ inputs.cache_bucket }}
        region: ${{ inputs.aws_region }}
        use-fallback: false

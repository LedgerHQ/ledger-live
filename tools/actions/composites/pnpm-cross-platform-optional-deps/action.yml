name: pnpm cross-platform optional deps
description: Make the next pnpm install fetch the optional packages of every platform (wallet-cli multi-target compile). Run it before the first install. No-op if pnpm-workspace.yaml already declares supportedArchitectures.
runs:
  using: composite
  steps:
    - name: Declare supportedArchitectures
      shell: bash
      run: |
        if grep -q '^supportedArchitectures:' pnpm-workspace.yaml; then
          echo "pnpm-workspace.yaml already declares supportedArchitectures, nothing to do"
        else
          cat >> pnpm-workspace.yaml <<'YAML'

        supportedArchitectures:
          os: [current, darwin, linux, win32]
          cpu: [current, x64, arm64]
        YAML
          echo "appended supportedArchitectures to pnpm-workspace.yaml"
        fi

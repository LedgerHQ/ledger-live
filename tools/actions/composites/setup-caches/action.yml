name: "Setup Caches"
description: "Setup caches for faster running time"
inputs:
  use-mise:
    description: "install Node, pnpm, and other tools from mise.toml via mise-action"
    default: "false"
    required: false
  gh-token:
    description: "use the GITHUB_TOKEN to download binaries and avoid GitHub limits"
    required: false
  skip-pnpm-cache:
    description: "true to skip pnpm caching, true by default"
    required: false
    default: "true"
  skip-pod-cache:
    description: "false to get cache, true by default"
    required: false
    default: "true"
  skip-nx-cache:
    description: "Skip Nx local and remote task cache for the remainder of the job"
    required: false
    default: "false"
  accountId:
    description: "aws cache account id"
    required: false
  roleName:
    description: "aws cache role name"
    required: false
  region:
    description: "aws cache region"
    required: false
    default: "eu-west-1"
  cache-develop-role-arn:
    description: "Full IAM OIDC role ARN for refs/heads/develop (optional; use with cache-branch-role-arn instead of accountId/roleName)"
    required: false
    default: ""
  cache-branch-role-arn:
    description: "Full IAM OIDC role ARN for non-develop refs (optional; use with cache-develop-role-arn)"
    required: false
    default: ""
  nx-key:
    description: "Nx self-hosted cache activation key (sets NX_KEY in the job environment)"
    required: false
    default: ""

outputs:
  nx-cache-key-prefix:
    description: "Nx S3 cacheKeyPrefix for this job when AWS cache profile ran (develop or branch)"
    value: ${{ steps.nx-remote-cache.outputs.nx-cache-key-prefix }}

runs:
  using: "composite"
  steps:
    # zizmor: ignore[github-env]
    - name: Skip Nx cache for job
      if: inputs.skip-nx-cache == 'true'
      shell: bash
      run: echo "NX_SKIP_NX_CACHE=true" >> "$GITHUB_ENV"

    - name: Install mise and tools
      if: inputs.use-mise == 'true'
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        # pinned: following latest mise once broke plugin installs (TSDINT-1644)
        version: "2026.9.1"
        install: true
        cache: true
        reshim: true
        experimental: true
        github_token: ${{ inputs['gh-token'] }}

    - name: Force reshim
      if: inputs.use-mise == 'true'
      shell: bash
      run: |
        mise reshim

    - name: Install Linux native build dependencies
      if: runner.os == 'Linux'
      uses: LedgerHQ/ledger-live/tools/actions/composites/apt-install@develop
      with:
        packages: build-essential pkg-config

    - name: Pin pnpm store directory
      if: runner.os == 'Linux' && runner.environment == 'self-hosted'
      shell: bash
      env:
        STORE_PARENT: ${{ github.workspace }}/../..
      run: echo "npm_config_store_dir=$(cd "$STORE_PARENT" && pwd)/.pnpm-store" >> "$GITHUB_ENV" # zizmor: ignore[github-env]

    - name: Get pnpm store directory
      id: get-store-path
      shell: bash
      run: |
        echo "store-path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - name: Resolve Nx remote cache profile and apply S3 prefix
      id: nx-remote-cache
      if: ${{ (inputs.cache-develop-role-arn != '' && inputs.cache-branch-role-arn != '') }}
      uses: LedgerHQ/ledger-live/tools/actions/composites/configure-nx-remote-cache-profile@develop
      with:
        develop-role-arn: ${{ inputs.cache-develop-role-arn }}
        branch-role-arn: ${{ inputs.cache-branch-role-arn }}
        legacy-account-id: ${{ inputs.accountId }}
        legacy-role-name: ${{ inputs.roleName }}

    - name: Fallback nx config
      if: steps.nx-remote-cache.conclusion != 'success'
      shell: bash
      run: cp nx.workspace.json nx.cache-config.json

    - name: Export NX_KEY for Nx self-hosted cache
      if: inputs.nx-key != ''
      shell: bash
      run: echo "NX_KEY=${INPUTS_NX_KEY}" >> "$GITHUB_ENV" # zizmor: ignore[github-env]
      env:
        INPUTS_NX_KEY: ${{ inputs.nx-key }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
      if: steps.nx-remote-cache.conclusion == 'success'
      id: aws
      with:
        role-to-assume: ${{ steps.nx-remote-cache.outputs.role-arn }}
        aws-region: ${{ inputs.region }}

    - name: Install s5cmd
      if: steps.aws.conclusion == 'success' && inputs.skip-pnpm-cache != 'true' && runner.os == 'Linux'
      shell: bash
      env:
        S5CMD_VERSION: "2.3.0"
        S5CMD_SHA256: "de0fdbfa3aceae55e069ba81a0fc17b2026567637603734a387b2fca06c299b4"
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/s5cmd-bin"
        cd "$RUNNER_TEMP/s5cmd-bin"
        curl -sSfL -o s5cmd.tar.gz \
          "https://github.com/peak/s5cmd/releases/download/v${S5CMD_VERSION}/s5cmd_${S5CMD_VERSION}_Linux-64bit.tar.gz"
        echo "${S5CMD_SHA256}  s5cmd.tar.gz" | sha256sum -c -
        tar -xzf s5cmd.tar.gz s5cmd
        chmod +x s5cmd
        ./s5cmd version

    - name: Restore pnpm store (s5cmd experiment)
      if: steps.aws.conclusion == 'success' && inputs.skip-pnpm-cache != 'true' && runner.os == 'Linux'
      shell: bash
      env:
        BUCKET: ll-gha-s3-cache
        CACHE_KEY: ${{ runner.os }}-pnpm-store-v2-${{ hashFiles('pnpm-lock.yaml') }}
        RESTORE_PREFIX: ${{ runner.os }}-pnpm-store-v2-
        CONCURRENCY: "16"
        PART_SIZE: "64"
      run: |
        set -euo pipefail
        s5cmd="$RUNNER_TEMP/s5cmd-bin/s5cmd"

        # tespkg/actions-cache stores each cache at <key>/cache.tzst (or cache.tgz under gzip)
        object=""
        for fn in cache.tzst cache.tgz; do
          if "$s5cmd" ls "s3://${BUCKET}/${CACHE_KEY}/${fn}" >/dev/null 2>&1; then
            object="${CACHE_KEY}/${fn}"
            break
          fi
        done
        if [ -z "$object" ]; then
          object=$("$s5cmd" ls "s3://${BUCKET}/${RESTORE_PREFIX}*" 2>/dev/null \
            | grep -E 'cache\.(tzst|tgz)$' | sort -k1,2 | tail -n1 | awk '{print $NF}' || true)
        fi
        if [ -z "$object" ]; then
          echo "::warning::pnpm store cache miss for ${CACHE_KEY}"
          exit 0
        fi
        echo "Restoring s3://${BUCKET}/${object}"

        archive="$RUNNER_TEMP/$(basename "$object")"
        start=$SECONDS
        "$s5cmd" cp --concurrency "$CONCURRENCY" --part-size "$PART_SIZE" \
          "s3://${BUCKET}/${object}" "$archive"
        download=$((SECONDS - start))
        bytes=$(stat -c %s "$archive")

        case "$archive" in
          *.tzst) decomp=(--use-compress-program "unzstd --long=30") ;;
          *)      decomp=(-z) ;;
        esac
        # archive holds paths relative to GITHUB_WORKSPACE, and the store lives outside it,
        # so -P -C is what puts ../../.pnpm-store back where pnpm actually looks
        start=$SECONDS
        tar -xf "$archive" -P -C "$GITHUB_WORKSPACE" "${decomp[@]}"
        extract=$((SECONDS - start))

        printf '| s5cmd restore | %s |\n| --- | --- |\n| size | %s |\n| download | %ss |\n| extract | %ss |\n' \
          "$object" "$(numfmt --to=iec "$bytes")" "$download" "$extract" >> "$GITHUB_STEP_SUMMARY"
        echo "download ${download}s, extract ${extract}s, $(numfmt --to=iec "$bytes")"

    - name: pzstd codec trial
      if: steps.aws.conclusion == 'success' && inputs.skip-pnpm-cache != 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -uo pipefail
        archive="$RUNNER_TEMP/cache.tzst"
        tar_path="$RUNNER_TEMP/trial.tar"
        pzst_path="$RUNNER_TEMP/trial.tar.pzst"
        trap 'rm -f "$tar_path" "$pzst_path"' EXIT

        [ -f "$archive" ] || { echo "no cache.tzst from restore, skipping trial"; exit 0; }
        command -v pzstd >/dev/null || { echo "::warning::pzstd not on PATH, skipping trial"; exit 0; }

        avail=$(df -k --output=avail "$RUNNER_TEMP" | tail -1)
        if [ "$avail" -lt 10485760 ]; then
          echo "::warning::only $((avail/1024))MB free, skipping trial"; exit 0
        fi

        cores=$(nproc)
        pzstd --version 2>&1 | head -1

        # both decodes write to /dev/null so the comparison is codec-only, no filesystem cost
        s=$SECONDS; unzstd --long=30 -c "$archive" > /dev/null; zstd_decode=$((SECONDS-s))

        unzstd --long=30 -c "$archive" > "$tar_path"
        raw=$(stat -c %s "$tar_path")

        s=$SECONDS; pzstd -p "$cores" -f -o "$pzst_path" "$tar_path"; pzstd_compress=$((SECONDS-s))
        s=$SECONDS; pzstd -d -p "$cores" -c "$pzst_path" > /dev/null; pzstd_decode=$((SECONDS-s))

        zstd_size=$(stat -c %s "$archive")
        pzstd_size=$(stat -c %s "$pzst_path")

        {
          echo "| pzstd trial (${cores} cores) | value |"
          echo "| --- | --- |"
          echo "| uncompressed tar | $(numfmt --to=iec "$raw") |"
          echo "| zstdmt --long=30 size | $(numfmt --to=iec "$zstd_size") |"
          echo "| pzstd size | $(numfmt --to=iec "$pzstd_size") |"
          echo "| **zstd decode (1 thread)** | **${zstd_decode}s** |"
          echo "| **pzstd decode (${cores} threads)** | **${pzstd_decode}s** |"
          echo "| pzstd compress | ${pzstd_compress}s |"
        } >> "$GITHUB_STEP_SUMMARY"

        echo "raw=$(numfmt --to=iec "$raw") zstd=$(numfmt --to=iec "$zstd_size") pzstd=$(numfmt --to=iec "$pzstd_size")"
        echo "zstd_decode=${zstd_decode}s pzstd_decode=${pzstd_decode}s pzstd_compress=${pzstd_compress}s"

    - name: Cache LLM pods
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.skip-pod-cache != 'true'
      with:
        path: |
          apps/ledger-live-mobile/ios/Pods
          ~/Library/Caches/CocoaPods
          ~/.cocoapods
        key: ${{ runner.os }}-pods-${{ hashFiles('apps/ledger-live-mobile/ios/Podfile.lock') }}

    - name: Clear LLM pods
      if: inputs.skip-pod-cache == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        rm -rf ~/.cocoapods/
        rm -rf ~/Library/Caches/CocoaPods
        rm -rf apps/ledger-live-mobile/ios/Pods

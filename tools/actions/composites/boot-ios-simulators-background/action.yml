name: "Boot iOS simulators (background)"
description: "Boot N named iOS simulators in the background (iOS Simulator, iOS Simulator 2, …) for Detox CI, rebooting any that cannot launch an app. Pair with check-ios-simulators before Detox runs."

inputs:
  worker_count:
    description: "Number of simulator workers; names are iOS Simulator and iOS Simulator 2 … N"
    required: true
  artifacts_root:
    description: "Directory for simulator-boot.log (created if missing)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Boot iOS simulators in background
      shell: bash
      run: |
        set -euo pipefail
        N="${INPUTS_WORKER_COUNT}"
        if ! [[ "$N" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::worker_count must be a positive integer, got: $N"
          exit 1
        fi
        ROOT="${INPUTS_ARTIFACTS_ROOT}"
        mkdir -p "$ROOT"
        LOG_FILE="$ROOT/simulator-boot.log"
        rm -f "$STATUS_FILE"
        nohup bash "${GITHUB_ACTION_PATH}/boot-simulators.sh" "$N" "$STATUS_FILE" > "$LOG_FILE" 2>&1 &
        echo "ℹ️ Simulator boot started in background (log: $LOG_FILE)."
        # check-ios-simulators reads these, so it needs no inputs.
        {
          echo "IOS_SIMULATOR_COUNT=$N"
          echo "IOS_SIMULATOR_BOOT_STATUS=$STATUS_FILE"
          echo "IOS_SIMULATOR_BOOT_LOG=$LOG_FILE"
        } >> "$GITHUB_ENV"

      env:
        INPUTS_WORKER_COUNT: ${{ inputs.worker_count }}
        INPUTS_ARTIFACTS_ROOT: ${{ inputs.artifacts_root }}
        # Written when the background boot exits.
        STATUS_FILE: ${{ runner.temp }}/ios-simulators-boot.status

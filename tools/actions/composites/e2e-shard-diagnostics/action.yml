name: "E2E Shard Diagnostics"
description: >-
  Append a collapsed per-shard debug section (outcomes, Nx build, test time, Speculinho not
  ready, lock deferrals, Remote Config proxy) of one desktop E2E device to the job summary.
inputs:
  legs:
    description: "Artifact suffix glob of the device's test legs: '-shard-*', '-stax-shard-*' or '-macos'"
    required: true
runs:
  using: composite
  steps:
    - name: Download Allure results per shard
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: allure-results${{ inputs.legs }}
        path: ${{ runner.temp }}/shard-diagnostics/allure

    - name: Download Playwright and Nx logs per shard
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: e2e-logs${{ inputs.legs }}
        path: ${{ runner.temp }}/shard-diagnostics/logs

    - name: Download Remote Config capture proxy logs per shard
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: firebase-capture-logs${{ inputs.legs }}
        path: ${{ runner.temp }}/shard-diagnostics/proxy

    - name: Write shard diagnostics
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        DIAGNOSTICS_DIR: ${{ runner.temp }}/shard-diagnostics
      with:
        script: |
          const path = require("path");
          const { renderShardDiagnostics } = require(
            path.join(process.env.ACTION_PATH, "shard-diagnostics.js"),
          );
          const markdown = renderShardDiagnostics(process.env.DIAGNOSTICS_DIR);
          if (markdown) await core.summary.addRaw(markdown).write();

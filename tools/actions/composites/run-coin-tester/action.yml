name: "Run Coin Tester"
description: "Runs Coin Tester for a given chain"
inputs:
  chain:
    required: true
    description: "The chain to test (evm, polkadot, solana, etc.)"
runs:
  using: "composite"
  steps:
    - run: pnpm coin:tester:${INPUTS_CHAIN} start
      shell: bash
      env:
        INPUTS_CHAIN: ${{ inputs.chain }}

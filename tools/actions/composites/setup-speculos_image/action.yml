name: "Setup Speculos Image and Coin Apps"
description: "Uploading allure report to Allure Server"
inputs:
  coinapps_path:
    required: true
    description: "Path to the coin apps folder"
  speculos_tag:
    required: false
    description: "Speculos docker image tag"
  bot_id:
    description: "GitHub Bot ID"
  bot_key:
    description: "GitHub Bot private key"
outputs:
  token:
    description: "GitHub Bot Token"
    value: ${{ steps.generate-token.outputs.token }}

runs:
  using: composite

  steps:
    - name: generate token
      id: generate-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.bot_id }}
        private-key: ${{ inputs.bot_key }}
        repositories: |
          coin-apps
          ledger-live

    # coin-apps is a large, slow-to-clone binary repo re-fetched on every shard. Cache the
    # working tree keyed by its master commit so only the first shard on a new revision
    # checks out; the rest restore from cache.
    - name: Resolve coin-apps master commit
      id: coinapps-rev
      shell: bash
      run: |
        sha=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/LedgerHQ/coin-apps.git" master | cut -f1)
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
      env:
        TOKEN: ${{ steps.generate-token.outputs.token }}

    - name: Restore coin-apps cache
      id: coinapps-cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.coinapps_path }}
        key: coin-apps-${{ steps.coinapps-rev.outputs.sha }}

    - name: Retrieving coin apps
      if: steps.coinapps-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v6
      with:
        ref: ${{ steps.coinapps-rev.outputs.sha }}
        repository: LedgerHQ/coin-apps
        token: ${{ steps.generate-token.outputs.token }}
        path: ${{ inputs.coinapps_path }}

    - name: Pull docker image
      if: ${{ inputs.speculos_tag }}
      run: docker pull ${{ inputs.speculos_tag }}
      shell: bash

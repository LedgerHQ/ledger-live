name: "Sync Android emulator clocks"
description: "Wait for the E2E emulators to boot and set any clock more than 60 s off to the runner's UTC time"

runs:
  using: "composite"
  steps:
    - name: Sync Android emulator clocks
      shell: bash
      run: |
        for serial in emulator-5554 emulator-5556 emulator-5558; do
          timeout 300 adb -s "$serial" wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != 1 ]; do sleep 1; done' \
            || { echo "::error::${serial} did not boot within 300 s"; exit 1; }
          guest=$(adb -s "$serial" shell date -u +%s)
          offset=$((guest - $(date -u +%s)))
          if ((${offset#-} > 60)); then
            adb -s "$serial" shell su 0 date -u "$(date -u +%m%d%H%M%Y.%S)" > /dev/null \
              || { echo "::error::Could not set the clock of ${serial}"; exit 1; }
            echo "::warning title=Emulator clock corrected::${serial} clock was $(date -u -d "@${guest}" +%FT%TZ) (${offset} s off), set to the runner's time"
          fi
        done

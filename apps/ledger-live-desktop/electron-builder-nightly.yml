appId: com.ledger.live.nightly

protocols:
  name: Ledger Wallet
  schemes:
    - ledgerlive
    - ledgerwallet

afterSign: scripts/notarize.js
afterPack: scripts/afterPack.js

directories:
  buildResources: "build-nightly"

dmg:
  window:
    width: 540
    height: 460

mac:
  artifactName: ${name}-${version}-${os}.${ext}
  category: public.app-category.wallet
  # zcash-utils ships one package per arch, identical in both universal slices
  x64ArchFiles: "**/node_modules/@ledgerhq/zcash-utils-darwin-*/*.node"
  files:
    - from: "node_modules/@ledgerhq/zcash-utils-darwin-arm64"
      to: "node_modules/@ledgerhq/zcash-utils-darwin-arm64"
      filter: ["package.json", "*.node"]
    - from: "node_modules/@ledgerhq/zcash-utils-darwin-x64"
      to: "node_modules/@ledgerhq/zcash-utils-darwin-x64"
      filter: ["package.json", "*.node"]
  hardenedRuntime: true
  entitlements: build-nightly/mac/entitlements.plist
  entitlementsInherit: build-nightly/mac/entitlements.plist
  icon: build-nightly/icon.icns
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal

linux:
  files:
    - from: "node_modules/@ledgerhq/zcash-utils-linux-x64-gnu"
      to: "node_modules/@ledgerhq/zcash-utils-linux-x64-gnu"
      filter: ["package.json", "*.node"]
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
  category: Finance
  icon: icons
  target:
    - target: AppImage
      arch:
        - x64

win:
  files:
    - from: "node_modules/@ledgerhq/zcash-utils-win32-x64-msvc"
      to: "node_modules/@ledgerhq/zcash-utils-win32-x64-msvc"
      filter: ["package.json", "*.node"]
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
  icon: build-nightly/windows/app.ico
  signtoolOptions:
    sign: scripts/sign-windows.js
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  installerIcon: build-nightly/windows/installer.ico
  installerSidebar: build-nightly/windows/installerSidebar.bmp
  uninstallerIcon: build-nightly/windows/uninstaller.ico
  uninstallerSidebar: build-nightly/windows/uninstallerSidebar.bmp

files:
  # Include files
  - .webpack/**/*
  # Explicit mapping: beforeBuild disables electron-builder's node_modules collection
  - from: "node_modules/@ledgerhq/zcash-utils"
    to: "node_modules/@ledgerhq/zcash-utils"
    filter: ["package.json", "index.js"]
  - from: "dist/node_modules"
    to: "node_modules"
    filter:
      - "**/*"
      # We are excluding files because in order to produce universal apps (merge the asar),
      # each flavour of the app need to have the same exact files as the others.
      #
      # Sometimes packages provide prebuilt binaries for only selected archs.
      # It results in compilation artifacts beeing unique between the archs and this causes bundle errors.
      #
      # See: https://github.com/electron/universal/issues/41
      #
      # Default exclusion list
      - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
      - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
      - "!**/node_modules/*.d.ts"
      - "!**/node_modules/.bin"
      - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
      - "!.editorconfig"
      - "!**/._*"
      - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
      - "!**/{__pycache__,thumbs.db,.idea,.vs,.nyc_output}"
      - "!**/{appveyor.yml,.travis.yml,circle.yml}"
      - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"
      # Custom exclusion list
      - "!**/Makefile"
      - "!**/*.{gyp,gypi,mk,Makefile}"
      - "!**/build/**/*"
      - "**/build/**/*.{js,cjs,mjs}"
      - "**/*.node"
  # Exclude files
  - "!node_modules"

# node_modules are bundled by rspack: beforeBuild skips electron-builder's rebuild and collection
buildDependenciesFromSource: false
beforeBuild: scripts/beforeBuild.js

publish:
  - provider: generic
    url: https://download.live.ledger.com

asarUnpack:
  - "node_modules/@ledgerhq/zcash-utils*/**/*"

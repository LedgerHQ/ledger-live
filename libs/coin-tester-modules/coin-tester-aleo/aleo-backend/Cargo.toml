[package]
name = "aleo-backend"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.94.1"

[profile.release]
strip = "debuginfo"
lto = "fat"

[dependencies]
anyhow = "1.0.102"
thiserror = "2.0.18"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
datadog-formatting-layer = "7"
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["tonic", "grpc-tonic"] }
tracing-opentelemetry = "0.32"
salvo = { version = "0.89.3", features = ["anyhow", "oapi", "cors", "matched-path"] }
opentelemetry-http = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.22", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.15"
clap = "4.6.0"
snarkvm = "4.5.4"
zeroize = "1.8.2"
indexmap = "2.12.0"
rand = "0.10"
async-trait = "0.1.89"
hex = "0.4"
crypto_box = { version = "0.9.1", features = ["seal"] }
base64 = "0.22"
reqwest = { version = "0.13.2", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"
salvo = { version = "0.89.3", features = ["test"] }

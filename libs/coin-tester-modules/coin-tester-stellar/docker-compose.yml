services:
  stellar:
    image: stellar/quickstart:latest@sha256:cdc51da353be3296b4ddf456878bb02356ec2b6f0ff45ddd7a5d9c6ec01e7270
    container_name: stellar-quickstart
    platform: linux/amd64
    # `--local` is the modern replacement for `--standalone`. The quickstart
    # /start script (see lines 250-254) reads NETWORK_PASSPHRASE from the
    # environment when in local mode and otherwise falls back to the
    # "Standalone Network ; February 2017" default. We force it to match
    # the value the coin module hardcodes (`Networks.PUBLIC`), so we do not
    # have to touch coin-stellar to swap the passphrase for tests.
    environment:
      NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
    command: ["--local"]
    # Gate readiness on Horizon having ingested a ledger, not just being
    # reachable: the /friendbot probe greenlights the moment nginx is up, well
    # before Core produces a ledger, so the first stellar-sdk history read
    # races a 503/404. Horizon's root exposes `history_latest_ledger`, which
    # flips from 0 to >= 1 once ingestion is live (friendbot is already up by
    # then). The `.` matches the field's closing quote without also matching
    # `history_latest_ledger_closed_at`.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/ | grep -qE 'history_latest_ledger.: [1-9]'"]
      interval: 5s
      timeout: 10s
      retries: 60
    ports:
      - "8000:8000"
